<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steampunk Voxel City</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Georgia', serif; }
canvas { display: block; }
#ui {
position: fixed; top: 20px; left: 20px; z-index: 100;
display: flex; flex-direction: column; gap: 10px;
}
.btn {
background: linear-gradient(135deg, #8B6914, #D4A017);
border: 2px solid #FFD700; color: #FFF8DC;

<body>
<div id="title">⚙ AETHERIA ⚙</div>
<div id="ui">
<button class="btn" id="dayNightBtn">🌙 Night Mode</button>
<button class="btn" id="resetBtn">🔄 Reset View</button>
</div>
<div id="info">🖱 Orbit: Left Click | Zoom: Scroll | Pan: Right Click</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==================== ORBIT CONTROLS (INLINE) ====================
// Minimal OrbitControls implementation
THREE.OrbitControls = function(object, domElement) {
this.object = object;
this.domElement = domElement;
this.enabled = true;
this.target = new THREE.Vector3();
this.minDistance = 20;
this.maxDistance = 500;
this.enableDamping = true;
this.dampingFactor = 0.08;
this.rotateSpeed = 0.5;
this.zoomSpeed = 1.2;
this.panSpeed = 0.8;

let scope = this;
let spherical = new THREE.Spherical();
let sphericalDelta = new THREE.Spherical();
let scale = 1;
let panOffset = new THREE.Vector3();
let rotateStart = new THREE.Vector2();
let rotateEnd = new THREE.Vector2();
let rotateDelta = new THREE.Vector2();
let panStart = new THREE.Vector2();
let panEnd = new THREE.Vector2();
let panDelta = new THREE.Vector2();
let state = -1; // -1: none, 0: rotate, 1: zoom, 2: pan

this.update = function() {
let offset = new THREE.Vector3();
let position = scope.object.position;
offset.copy(position).sub(scope.target);
spherical.setFromVector3(offset);
spherical.theta += sphericalDelta.theta * scope.dampingFactor;
spherical.phi += sphericalDelta.phi * scope.dampingFactor;
spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
spherical.radius *= scale;
spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius));
scope.target.add(panOffset.multiplyScalar(scope.dampingFactor));
offset.setFromSpherical(spherical);
position.copy(scope.target).add(offset);
scope.object.lookAt(scope.target);
sphericalDelta.theta *= (1 - scope.dampingFactor);
sphericalDelta.phi *= (1 - scope.dampingFactor);
scale = 1;
panOffset.multiplyScalar(1 - scope.dampingFactor);
};

function onMouseDown(event) {
if (!scope.enabled) return;
event.preventDefault();
if (event.button === 0) {
state = 0;
rotateStart.set(event.clientX, event.clientY);
} else if (event.button === 2) {
state = 2;
panStart.set(event.clientX, event.clientY);
}
document.addEventListener('mousemove', onMouseMove, false);
document.addEventListener('mouseup', onMouseUp, false);
}

function onMouseMove(event) {
if (!scope.enabled) return;
if (state === 0) {
rotateEnd.set(event.clientX, event.clientY);
rotateDelta.subVectors(rotateEnd, rotateStart);
sphericalDelta.theta -= 2 * Math.PI * rotateDelta.x / domElement.clientWidth * scope.rotateSpeed;
sphericalDelta.phi -= 2 * Math.PI * rotateDelta.y / domElement.clientHeight * scope.rotateSpeed;
rotateStart.copy(rotateEnd);
} else if (state === 2) {
panEnd.set(event.clientX, event.clientY);
panDelta.subVectors(panEnd, panStart);
let offset = new THREE.Vector3();
offset.copy(scope.object.position).sub(scope.target);
let targetDistance = offset.length() * Math.tan((scope.object.fov / 2) * Math.PI / 180.0);
let v = new THREE.Vector3();
v.setFromMatrixColumn(scope.object.matrix, 0);
v.multiplyScalar(-2 * panDelta.x * targetDistance / domElement.clientHeight * scope.panSpeed);
panOffset.add(v);
v.setFromMatrixColumn(scope.object.matrix, 1);
v.multiplyScalar(2 * panDelta.y * targetDistance / domElement.clientHeight * scope.panSpeed);
panOffset.add(v);
panStart.copy(panEnd);
}
}

function onMouseUp() {
state = -1;
document.removeEventListener('mousemove', onMouseMove, false);
document.removeEventListener('mouseup', onMouseUp, false);
}

function onWheel(event) {
if (!scope.enabled) return;
event.preventDefault();
if (event.deltaY < 0) scale /= Math.pow(0.95, scope.zoomSpeed);
else scale *= Math.pow(0.95, scope.zoomSpeed);
}

domElement.addEventListener('mousedown', onMouseDown, false);
domElement.addEventListener('wheel', onWheel, { passive: false });
domElement.addEventListener('contextmenu', e => e.preventDefault(), false);
};

// ==================== MAIN APPLICATION ====================
let scene, camera, renderer, controls;
let isNight = false;
let sunLight, ambientLight, moonLight;
let clock = new THREE.Clock();
let airships = [];
let turbines = [];
let characters = [];
let clouds = [];
let waterfallParticles = [];
let windowLights = [];
let steamParticles = [];

// Color palettes
const COLORS = {
copper: 0xB87333,
darkCopper: 0x8B5A2B,
brass: 0xD4A017,
gold: 0xFFD700,
steel: 0x71797E,
darkSteel: 0x4A4A4A,
rust: 0xA0522D,
wood: 0x8B6914,
darkWood: 0x5C4033,
stone: 0x808080,
darkStone: 0x505050,
brick: 0xB22222,
green: 0x2E8B57,
darkGreen: 0x1B5E20,
cloud: 0xF0F0F0,
water: 0x4682B4,
glow: 0xFFA500,
nightGlow: 0xFFD700,
purple: 0x8B00FF,
teal: 0x00CED1,
};

// ==================== VOXEL SYSTEM ====================
const voxelGeo = new THREE.BoxGeometry(1, 1, 1);

function createVoxelMaterial(color, emissive = 0x000000, emissiveIntensity = 0) {
return new THREE.MeshPhongMaterial({
color: color,
emissive: emissive,
emissiveIntensity: emissiveIntensity,
flatShading: true,
shininess: 30,
specular: 0x444444
});
}

// Instanced voxel builder for performance
function buildVoxelStructure(voxels, material) {
const group = new THREE.Group();
const instancedMesh = new THREE.InstancedMesh(voxelGeo, material, voxels.length);
const dummy = new THREE.Object3D();

voxels.forEach((v, i) => {
dummy.position.set(v.x, v.y, v.z);
dummy.updateMatrix();
instancedMesh.setMatrixAt(i, dummy.matrix);
});

instancedMesh.instanceMatrix.needsUpdate = true;
group.add(instancedMesh);
return group;
}

// ==================== SCENE SETUP ====================
function init() {
scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x87CEEB, 0.0015);

camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(120, 80, 120);

renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 30, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 30;
controls.maxDistance = 400;

setupLighting();
createSkybox();
createClouds();
createCentralIsland();
createSatelliteIslands();
createBridges();
createClockTower();
createBuildings();
createAirships();
createWindTurbines();
createWaterfalls();
createCharacters();
createSteamParticles();
createCloudParticles();

window.addEventListener('resize', onResize, false);
animate();
}

// ==================== LIGHTING ====================
function setupLighting() {
ambientLight = new THREE.AmbientLight(0x6688AA, 0.6);
scene.add(ambientLight);

sunLight = new THREE.DirectionalLight(0xFFF5E0, 1.2);
sunLight.position.set(100, 150, 80);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 500;
sunLight.shadow.camera.left = -150;
sunLight.shadow.camera.right = 150;
sunLight.shadow.camera.top = 150;
sunLight.shadow.camera.bottom = -150;
scene.add(sunLight);

moonLight = new THREE.DirectionalLight(0x4466AA, 0);
moonLight.position.set(-80, 120, -60);
scene.add(moonLight);

// Hemisphere light for sky/ground color
let hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x362907, 0.4);
scene.add(hemiLight);
}

// ==================== SKYBOX ====================
function createSkybox() {
const skyGeo = new THREE.SphereGeometry(800, 32, 32);
const skyMat = new THREE.ShaderMaterial({
uniforms: {
topColor: { value: new THREE.Color(0x0077FF) },
bottomColor: { value: new THREE.Color(0x87CEEB) },
offset: { value: 20 },
exponent: { value: 0.4 }
},
vertexShader: `
varying vec3 vWorldPosition;
void main() {
vec4 worldPosition = modelMatrix * vec4(position, 1.0);
vWorldPosition = worldPosition.xyz;
gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`,
fragmentShader: `
uniform vec3 topColor;
uniform vec3 bottomColor;
uniform float offset;
uniform float exponent;
varying vec3 vWorldPosition;
void main() {
float h = normalize(vWorldPosition + offset).y;
gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
}
`,
side: THREE.BackSide
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);
}

// ==================== CLOUDS ====================
function createClouds() {
for (let i = 0; i < 40; i++) {
let cloud = createCloud();
cloud.position.set(
(Math.random() - 0.5) * 500,
-10 + Math.random() * 20,
(Math.random() - 0.5) * 500
);
cloud.userData = {
speed: 0.02 + Math.random() * 0.05,
baseX: cloud.position.x,
baseZ: cloud.position.z
};
clouds.push(cloud);
scene.add(cloud);
}
}

function createCloud() {
const group = new THREE.Group();
const cloudMat = createVoxelMaterial(COLORS.cloud);
const voxels = [];
let size = 3 + Math.floor(Math.random() * 5);

for (let i = 0; i < size * size; i++) {
let x = Math.floor(Math.random() * size * 2) - size;
let y = Math.floor(Math.random() * 2);
let z = Math.floor(Math.random() * size) - Math.floor(size / 2);
voxels.push({ x, y, z });
}

let cloudMesh = buildVoxelStructure(voxels, cloudMat);
group.add(cloudMesh);
group.traverse(child => {
if (child.isInstancedMesh) {
child.material.transparent = true;
child.material.opacity = 0.85;
}
});
return group;
}

function createCloudParticles() {
const cloudGeo = new THREE.BoxGeometry(1, 1, 1);
const cloudMat = new THREE.MeshPhongMaterial({
color: 0xFFFFFF, transparent: true, opacity: 0.6, flatShading: true
});

for (let i = 0; i < 200; i++) {
let cloud = new THREE.Mesh(cloudGeo, cloudMat.clone());
cloud.position.set(
(Math.random() - 0.5) * 600,
-5 + Math.random() * 15,
(Math.random() - 0.5) * 600
);
cloud.scale.set(
2 + Math.random() * 4,
1 + Math.random() * 2,
2 + Math.random() * 4
);
cloud.userData = {
speed: 0.01 + Math.random() * 0.03,
baseX: cloud.position.x,
baseZ: cloud.position.z
};
clouds.push(cloud);
scene.add(cloud);
}
}

// ==================== CENTRAL ISLAND ====================
function createCentralIsland() {
// Main island base - rocky bottom
const rockMat = createVoxelMaterial(COLORS.darkStone);
const rockVoxels = [];

// Create a large dome-shaped island
for (let x = -25; x <= 25; x++) {
for (let z = -25; z <= 25; z++) {
let dist = Math.sqrt(x * x + z * z);
if (dist < 25) {
let height = Math.floor(Math.sqrt(1 - (dist / 25) * (dist / 25)) * 12);
for (let y = -height; y < 0; y++) {
rockVoxels.push({ x, y, z });
}
// Top layer with grass
if (height > 0) {
rockVoxels.push({ x, y: 0, z });
}
}
}
}

let island = buildVoxelStructure(rockVoxels, rockMat);
scene.add(island);

// Grass top
const grassMat = createVoxelMaterial(COLORS.green);
const grassVoxels = [];
for (let x = -24; x <= 24; x++) {
for (let z = -24; z <= 24; z++) {
let dist = Math.sqrt(x * x + z * z);
if (dist < 24) {
grassVoxels.push({ x, y: 1, z });
}
}
}
let grass = buildVoxelStructure(grassVoxels, grassMat);
scene.add(grass);

// Decorative rocks on surface
for (let i = 0; i < 30; i++) {
let rx = (Math.random() - 0.5) * 40;
let rz = (Math.random() - 0.5) * 40;
let dist = Math.sqrt(rx * rx + rz * rz);
if (dist < 22) {
let rockGroup = new THREE.Group();
let size = 1 + Math.floor(Math.random() * 2);
for (let dx = 0; dx < size; dx++) {
for (let dy = 0; dy < size; dy++) {
for (let dz = 0; dz < size; dz++) {
if (Math.random() > 0.3) {
let v = new THREE.Mesh(voxelGeo, createVoxelMaterial(
Math.random() > 0.5 ? COLORS.stone : COLORS.darkStone
));
v.position.set(dx - size / 2, dy, dz - size / 2);
rockGroup.add(v);
}
}
}
}
rockGroup.position.set(rx, 2, rz);
scene.add(rockGroup);
}
}

// Small trees
for (let i = 0; i < 15; i++) {
let tx = (Math.random() - 0.5) * 36;
let tz = (Math.random() - 0.5) * 36;
let dist = Math.sqrt(tx * tx + tz * tz);
if (dist < 20) {
createTree(tx, 2, tz);
}
}
}

function createTree(x, y, z) {
const group = new THREE.Group();

// Trunk
const trunkMat = createVoxelMaterial(COLORS.darkWood);
for (let i = 0; i < 4; i++) {
let v = new THREE.Mesh(voxelGeo, trunkMat);
v.position.set(0, i, 0);
group.add(v);
}

// Leaves
const leafMat = createVoxelMaterial(COLORS.darkGreen);
for (let lx = -2; lx <= 2; lx++) {
for (let ly = 0; ly <= 3; ly++) {
for (let lz = -2; lz <= 2; lz++) {
if (Math.abs(lx) + Math.abs(ly - 1) + Math.abs(lz) <= 4) {
if (Math.random() > 0.2) {
let v = new THREE.Mesh(voxelGeo, leafMat);
v.position.set(lx, ly + 3, lz);
group.add(v);
}
}
}
}
}

group.position.set(x, y, z);
scene.add(group);
}

// ==================== SATELLITE ISLANDS ====================
function createSatelliteIslands() {
const islandData = [
{ pos: [60, 15, 40], size: 12, name: 'East' },
{ pos: [-55, 25, -35], size: 10, name: 'West' },
{ pos: [35, 35, -60], size: 8, name: 'North' },
{ pos: [-40, 10, 55], size: 9, name: 'South' },
{ pos: [70, 5, -20], size: 7, name: 'FarEast' },
{ pos: [-65, 20, 20], size: 8, name: 'FarWest' },
];

islandData.forEach(data => {
createFloatingIsland(data.pos[0], data.pos[1], data.pos[2], data.size);
});
}

function createFloatingIsland(cx, cy, cz, size) {
const rockMat = createVoxelMaterial(COLORS.darkStone);
const rockVoxels = [];

for (let x = -size; x <= size; x++) {
for (let z = -size; z <= size; z++) {
let dist = Math.sqrt(x * x + z * z);
if (dist < size) {
let height = Math.floor(Math.sqrt(1 - (dist / size) * (dist / size)) * (size * 0.6));
for (let y = -height; y < 0; y++) {
rockVoxels.push({ x: cx + x, y: cy + y, z: cz + z });
}
}
}
}

let island = buildVoxelStructure(rockVoxels, rockMat);
scene.add(island);

// Grass top
const grassMat = createVoxelMaterial(COLORS.green);
const grassVoxels = [];
for (let x = -size + 1; x <= size - 1; x++) {
for (let z = -size + 1; z <= size - 1; z++) {
let dist = Math.sqrt(x * x + z * z);
if (dist < size - 1) {
grassVoxels.push({ x: cx + x, y: cy + 1, z: cz + z });
}
}
}
let grass = buildVoxelStructure(grassVoxels, grassMat);
scene.add(grass);

// Add some buildings on smaller islands
if (size > 8) {
createSmallBuilding(cx, cy + 2, cz, size);
}

// Trees
for (let i = 0; i < 3; i++) {
let tx = cx + (Math.random() - 0.5) * (size * 1.5);
let tz = cz + (Math.random() - 0.5) * (size * 1.5);
createTree(tx, cy + 2, tz);
}
}

function createSmallBuilding(cx, cy, cz, size) {
const brickMat = createVoxelMaterial(COLORS.brick);
const copperMat = createVoxelMaterial(COLORS.copper);

let bx = Math.floor((Math.random() - 0.5) * (size - 4));
let bz = Math.floor((Math.random() - 0.5) * (size - 4));
let bWidth = 2 + Math.floor(Math.random() * 3);
let bHeight = 3 + Math.floor(Math.random() * 4);
let bDepth = 2 + Math.floor(Math.random() * 3);

// Walls
for (let x = 0; x < bWidth; x++) {
for (let y = 0; y < bHeight; y++) {
for (let z = 0; z < bDepth; z++) {
if (x === 0 || x === bWidth - 1 || z === 0 || z === bDepth - 1 || y === 0) {
let v = new THREE.Mesh(voxelGeo, brickMat);
v.position.set(cx + bx + x - bWidth / 2, cy + y, cz + bz + z - bDepth / 2);
scene.add(v);
}
}
}
}

// Roof
for (let x = -1; x <= bWidth; x++) {
for (let z = -1; z <= bDepth; z++) {
let v = new THREE.Mesh(voxelGeo, copperMat);
v.position.set(cx + bx + x - bWidth / 2, cy + bHeight, cz + bz + z - bDepth / 2);
scene.add(v);
}
}

// Windows with glow
const windowMat = createVoxelMaterial(COLORS.brass, COLORS.glow, 0.5);
for (let x = 1; x < bWidth - 1; x++) {
for (let y = 1; y < bHeight; y += 2) {
if (Math.random() > 0.3) {
let w = new THREE.Mesh(voxelGeo, windowMat.clone());
w.position.set(cx + bx + x - bWidth / 2, cy + y, cz + bz - bDepth / 2);
windowLights.push(w);
scene.add(w);

let w2 = new THREE.Mesh(voxelGeo, windowMat.clone());
w2.position.set(cx + bx + x - bWidth / 2, cy + y, cz + bz + bDepth / 2);
windowLights.push(w2);
scene.add(w2);
}
}
}
}

// ==================== BRIDGES ====================
function createBridges() {
const bridgeConnections = [
{ from: [0, 3, 0], to: [60, 15, 40] },
{ from: [0, 3, 0], to: [-55, 25, -35] },
{ from: [0, 3, 0], to: [35, 35, -60] },
{ from: [0, 3, 0], to: [-40, 10, 55] },
{ from: [60, 15, 40], to: [70, 5, -20] },
{ from: [-55, 25, -35], to: [-65, 20, 20] },
];

bridgeConnections.forEach(conn => {
createBridge(conn.from, conn.to);
});
}

function createBridge(from, to) {
const dx = to[0] - from[0];
const dy = to[1] - from[1];
const dz = to[2] - from[2];
let dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
let steps = Math.floor(dist);

const woodMat = createVoxelMaterial(COLORS.wood);
const railMat = createVoxelMaterial(COLORS.darkCopper);

for (let i = 0; i < steps; i++) {
let t = i / steps;
let x = from[0] + dx * t;
let y = from[1] + dy * t + Math.sin(t * Math.PI) * 5; // Arch
let z = from[2] + dz * t;

// Bridge floor
let floor = new THREE.Mesh(voxelGeo, woodMat);
floor.position.set(x, y, z);
scene.add(floor);

// Rails
if (i % 2 === 0) {
let rail1 = new THREE.Mesh(voxelGeo, railMat);
rail1.position.set(x, y + 1.5, z);
scene.add(rail1);

let rail2 = new THREE.Mesh(voxelGeo, railMat);
rail2.position.set(x, y + 3, z);
scene.add(rail2);
}

// Chain links (vertical supports)
if (i % 4 === 0) {
let chain = new THREE.Mesh(voxelGeo, railMat);
chain.position.set(x, y + 1.5, z);
chain.scale.set(0.3, 1.5, 0.3);
scene.add(chain);
}
}
}

// ==================== CLOCK TOWER ====================
function createClockTower() {
const towerGroup = new THREE.Group();
const brickMat = createVoxelMaterial(COLORS.brick);
const copperMat = createVoxelMaterial(COLORS.copper);
const brassMat = createVoxelMaterial(COLORS.brass, COLORS.glow, 0.3);
const darkMat = createVoxelMaterial(COLORS.darkSteel);

// Tower base - wider
let baseSize = 6;
let baseHeight = 15;
for (let x = -baseSize; x <= baseSize; x++) {
for (let y = 0; y < baseHeight; y++) {
for (let z = -baseSize; z <= baseSize; z++) {
if (Math.abs(x) === baseSize || Math.abs(z) === baseSize || y === 0) {
let v = new THREE.Mesh(voxelGeo, brickMat);
v.position.set(x, y, z);
towerGroup.add(v);
}
}
}
}

// Tower middle - narrower
let midSize = 4;
let midHeight = 20;
for (let x = -midSize; x <= midSize; x++) {
for (let y = baseHeight; y < baseHeight + midHeight; y++) {
for (let z = -midSize; z <= midSize; z++) {
if (Math.abs(x) === midSize || Math.abs(z) === midSize) {
let v = new THREE.Mesh(voxelGeo, brickMat);
v.position.set(x, y, z);
towerGroup.add(v);
}
}
}
}

// Clock faces
let clockY = baseHeight + midHeight - 5;
// Front face
for (let x = -3; x <= 3; x++) {
for (let z = -3; z <= 3; z++) {
let v = new THREE.Mesh(voxelGeo, brassMat);
v.position.set(x, clockY, midSize + 0.5);
towerGroup.add(v);
}
}

// ==================== ANIMATION ====================
function animate() {
requestAnimationFrame(animate);

let time = clock.getElapsedTime();
let delta = clock.getDelta() || 0.016;

// Update controls
controls.update();

// Animate clouds
clouds.forEach(cloud => {
if (cloud.userData && cloud.userData.baseX !== undefined) {
cloud.position.x = cloud.userData.baseX + Math.sin(time * cloud.userData.speed) * 20;
cloud.position.z = cloud.userData.baseZ + Math.cos(time * cloud.userData.speed * 0.7) * 10;
}
});

// Animate airships
airships.forEach(ship => {
let path = ship.userData.path;
let t = ship.userData.pathT;
let idx = ship.userData.pathIndex;

t += ship.userData.speed;
if (t >= 1) {
t = 0;
idx = (idx + 1) % (path.length - 1);
ship.userData.pathIndex = idx;
}
ship.userData.pathT = t;

let from = path[idx];
let to = path[(idx + 1) % path.length];
let mid = new THREE.Vector3().lerpVectors(from, to, t);

// Add arc to path
let arcHeight = 5 + Math.sin(t * Math.PI) * 10;
mid.y += arcHeight;

ship.position.copy(mid);

// Face direction of travel
let nextT = Math.min(t + 0.01, 1);
let nextPos = new THREE.Vector3().lerpVectors(from, to, nextT);
nextPos.y += 5 + Math.sin(nextT * Math.PI) * 10;
ship.lookAt(nextPos);

// Rotate propellers
ship.traverse(child => {
if (child.userData && child.userData.type === 'propeller') {
child.rotation.x += 0.3;
}
});
});

// Animate wind turbines
turbines.forEach(turbine => {
turbine.traverse(child => {
if (child.userData && child.userData.type === 'turbineBlades') {
child.rotation.x += 0.05;
}
});
});

// Animate characters
characters.forEach(char => {
let patrol = char.userData.patrol;
let idx = char.userData.patrolIndex;
let target = patrol[idx];

let dx = target.x - char.position.x;
let dz = target.z - char.position.z;
let dist = Math.sqrt(dx * dx + dz * dz);

if (dist < 0.5) {
idx = (idx + 1) % patrol.length;
char.userData.patrolIndex = idx;
} else {
char.position.x += (dx / dist) * char.userData.speed;
char.position.z += (dz / dist) * char.userData.speed;
char.lookAt(target.x, char.position.y, target.z);

// Bob animation
char.position.y = 2 + Math.sin(time * 5 + char.userData.bobPhase) * 0.1;
}
});

// Animate waterfall
waterfallParticles.forEach(p => {
if (p.userData && p.userData.type === 'waterfall') {
let phase = (time * p.userData.speed + p.userData.baseY * 0.1) % 1;
p.material.opacity = 0.3 + Math.sin(time * 3 + p.userData.baseY) * 0.2;
p.position.y = p.userData.baseY - (phase * 0.5);
}
});

// Animate steam
steamParticles.forEach(steam => {
if (steam.userData) {
steam.position.y += steam.userData.speed;
steam.position.x += Math.sin(time + steam.userData.phase) * 0.01;
steam.material.opacity = 0.15 + Math.sin(time * 2 + steam.userData.phase) * 0.1;

if (steam.position.y > 50) {
steam.position.y = 5;
steam.position.x = (Math.random() - 0.5) * 60;
steam.position.z = (Math.random() - 0.5) * 60;
}
}
});

// Animate clock tower gears
scene.traverse(child => {
if (child.userData && child.userData.type === 'gear') {
child.rotation.y = time * child.userData.speed;
child.rotation.z = Math.sin(time * child.userData.speed) * 0.3;
}
if (child.userData && child.userData.type === 'flag') {
child.rotation.y = Math.sin(time * 2) * 0.3;
}
});

// Subtle floating animation for the whole city

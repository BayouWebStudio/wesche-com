<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aetheria — City Above the Clouds</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brass:#c89656;
    --brass-d:#7a5a2e;
    --parchment:#e8d4a0;
    --ink:#1a1208;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0a12;font-family:'Cormorant Garamond',serif;color:var(--parchment)}
  #canvas{display:block;position:fixed;inset:0}

  /* Vignette */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(10,5,20,.55) 100%);
    mix-blend-mode:multiply;transition:opacity .8s}

  /* Title plate */
  #plate{position:fixed;top:24px;left:28px;z-index:10;pointer-events:none;
    padding:18px 26px 16px;border:1px solid rgba(200,150,86,.35);
    background:linear-gradient(135deg,rgba(28,18,10,.55),rgba(10,6,3,.35));
    backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.4),inset 0 0 0 1px rgba(200,150,86,.15)}
  #plate::before,#plate::after{content:"";position:absolute;width:8px;height:8px;border:1px solid var(--brass)}
  #plate::before{top:4px;left:4px;border-right:none;border-bottom:none}
  #plate::after{bottom:4px;right:4px;border-left:none;border-top:none}
  #plate h1{font-family:'Cinzel',serif;font-weight:900;font-size:34px;letter-spacing:.18em;
    color:var(--brass);text-shadow:0 0 18px rgba(200,150,86,.35),0 2px 0 rgba(0,0,0,.6)}
  #plate .sub{font-style:italic;font-size:15px;letter-spacing:.08em;opacity:.78;margin-top:2px;color:#d8c08a}
  #plate .meta{font-size:12px;letter-spacing:.25em;text-transform:uppercase;opacity:.55;margin-top:8px;color:#b8966a}

  /* Controls */
  #controls{position:fixed;top:24px;right:28px;z-index:10;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
  .btn{font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:.18em;
    padding:12px 20px;color:var(--parchment);cursor:pointer;
    background:linear-gradient(180deg,rgba(60,40,20,.7),rgba(20,12,6,.7));
    border:1px solid rgba(200,150,86,.5);position:relative;transition:all .25s;
    box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,220,160,.12)}
  .btn:hover{border-color:var(--brass);color:#fff;box-shadow:0 4px 22px rgba(200,150,86,.35),inset 0 1px 0 rgba(255,220,160,.2)}
  .btn .ico{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:8px;
    background:radial-gradient(circle at 35% 35%,#fff6c0,#f5b840 60%,#a85f10);box-shadow:0 0 10px #f5b840}
  .btn.night .ico{background:radial-gradient(circle at 35% 35%,#e8e8ff,#a8b0e0 55%,#3a4080);box-shadow:0 0 10px #8090ff}

  #legend{position:fixed;bottom:22px;left:28px;z-index:10;font-size:13px;letter-spacing:.05em;
    color:#c8b890;line-height:1.7;background:rgba(10,6,3,.4);padding:10px 16px;
    border:1px solid rgba(200,150,86,.25);backdrop-filter:blur(4px)}
  #legend b{color:var(--brass);font-family:'Cinzel',serif;font-weight:700;letter-spacing:.15em;font-size:11px;text-transform:uppercase}
  #legend kbd{font-family:'Cinzel',serif;background:rgba(200,150,86,.18);border:1px solid rgba(200,150,86,.4);
    padding:1px 7px;font-size:11px;letter-spacing:.1em;color:#e8d4a0}

  #stats{position:fixed;bottom:22px;right:28px;z-index:10;font-size:12px;letter-spacing:.15em;
    color:#9a8a6a;font-family:'Cinzel',serif;text-align:right}
  #stats span{color:var(--brass)}

  #loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#0a0a12;transition:opacity 1s;font-family:'Cinzel',serif;letter-spacing:.3em;color:var(--brass)}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="vignette"></div>

<div id="plate">
  <h1>AETHERIA</h1>
  <div class="sub">— A City Suspended Above the Clouds —</div>
  <div class="meta">Voxel Cartographer's Survey · MMXXIV</div>
</div>

<div id="controls">
  <button class="btn" id="timeBtn"><span class="ico"></span>DESCEND INTO NIGHT</button>
  <button class="btn" id="cinematicBtn">CINEMATIC ORBIT</button>
</div>

<div id="legend">
  <b>Inspect the City</b><br>
  <kbd>DRAG</kbd> orbit · <kbd>SCROLL</kbd> zoom · <kbd>RIGHT-DRAG</kbd> pan
</div>

<div id="stats">
  Altitude <span id="alt">∞</span> fathoms<br>
  Citizens <span id="pop">0</span>
</div>

<div id="loader"><div class="pulse">CHARTING THE FLOATING ISLES…</div></div>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   AETHERIA — Floating Steampunk Voxel City
   ============================================================ */

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xe8c8a0, 0.0035);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 800);
camera.position.set(70, 38, 70);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 25;
controls.maxDistance = 180;
controls.maxPolarAngle = Math.PI*0.52;
controls.target.set(0, 6, 0);
controls.autoRotate = false;
controls.autoRotateSpeed = 0.45;

/* ---------- Sky dome (gradient shader) ---------- */
const skyUniforms = {
  topColor:{value:new THREE.Color(0x2a5a8a)},
  bottomColor:{value:new THREE.Color(0xf5c89a)},
  offset:{value:30},
  exponent:{value:0.7},
  sunDir:{value:new THREE.Vector3(0.4,0.6,0.3)},
  sunColor:{value:new THREE.Color(0xfff0c0)},
  night:{value:0.0}
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(400,32,16),
  new THREE.ShaderMaterial({
    uniforms:skyUniforms,
    side:THREE.BackSide,
    depthWrite:false,
    vertexShader:`
      varying vec3 vPos;
      void main(){ vPos = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }
    `,
    fragmentShader:`
      uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent;
      uniform vec3 sunDir; uniform vec3 sunColor; uniform float night;
      varying vec3 vPos;
      void main(){
        float h = normalize(vPos).y;
        vec3 col = mix(bottomColor, topColor, pow(max(h,0.0), exponent));
        // sun glow
        vec3 dir = normalize(vPos);
        float d = max(dot(dir, normalize(sunDir)), 0.0);
        col += sunColor * pow(d, 18.0) * (1.0 - night*0.7);
        col += sunColor * pow(d, 3.0) * 0.15 * (1.0 - night*0.8);
        // stars at night
        if(night > 0.02){
          float s = step(0.998, fract(sin(dot(floor(dir*420.0), vec3(12.9898,78.233,37.719))) * 43758.5453));
          col += vec3(s) * night * 0.9 * smoothstep(0.0, 0.4, h);
        }
        gl_FragColor = vec4(col,1.0);
      }
    `
  })
);
scene.add(sky);

/* ---------- Lights ---------- */
const sun = new THREE.DirectionalLight(0xfff0d0, 1.4);
sun.position.set(60, 80, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-90; sun.shadow.camera.right=90;
sun.shadow.camera.top=90; sun.shadow.camera.bottom=-90;
sun.shadow.camera.near=1; sun.shadow.camera.far=250;
sun.shadow.bias = -0.0005;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0xbfe0ff, 0x8a6a4a, 0.8);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xb0d0e8, 0.35);
scene.add(ambient);

// Warm point light at clock tower (always on, stronger at night)
const towerLight = new THREE.PointLight(0xffaa44, 1.2, 60, 2);
towerLight.position.set(0, 26, 0);
scene.add(towerLight);

/* ---------- Day / Night palettes ---------- */
const DAY = {
  skyTop:new THREE.Color(0x2a6aa0), skyBot:new THREE.Color(0xf6cc94),
  fog:new THREE.Color(0xe8c8a0), fogDensity:0.0030,
  sun:new THREE.Color(0xfff0d0), sunInt:1.5, sunPos:new THREE.Vector3(60,80,40),
  hemiSky:new THREE.Color(0xbfe0ff), hemiGround:new THREE.Color(0x8a6a4a), hemiInt:0.85,
  amb:new THREE.Color(0xb0d0e8), ambInt:0.35,
  towerInt:0.6, windowInt:0.0, exposure:1.05
};
const NIGHT = {
  skyTop:new THREE.Color(0x070a22), skyBot:new THREE.Color(0x3a2050),
  fog:new THREE.Color(0x141028), fogDensity:0.0045,
  sun:new THREE.Color(0x8090ff), sunInt:0.35, sunPos:new THREE.Vector3(-40,60,-30),
  hemiSky:new THREE.Color(0x20224a), hemiGround:new THREE.Color(0x100518), hemiInt:0.35,
  amb:new THREE.Color(0x202840), ambInt:0.18,
  towerInt:2.4, windowInt:2.2, exposure:1.15
};

const state = { t:0, target:0, cinematic:false };

function applyTime(t){
  // t: 0 = day, 1 = night
  skyUniforms.topColor.value.copy(DAY.skyTop).lerp(NIGHT.skyTop, t);
  skyUniforms.bottomColor.value.copy(DAY.skyBot).lerp(NIGHT.skyBot, t);
  skyUniforms.night.value = t;
  skyUniforms.sunColor.value.copy(DAY.sun).lerp(NIGHT.sun, t);
  skyUniforms.sunDir.value.copy(DAY.sunPos).lerp(NIGHT.sunPos, t).normalize();
  scene.fog.color.copy(DAY.fog).lerp(NIGHT.fog, t);
  scene.fog.density = DAY.fogDensity + (NIGHT.fogDensity-DAY.fogDensity)*t;
  sun.color.copy(DAY.sun).lerp(NIGHT.sun, t);
  sun.intensity = DAY.sunInt + (NIGHT.sunInt-DAY.sunInt)*t;
  sun.position.copy(DAY.sunPos).lerp(NIGHT.sunPos, t);
  hemi.color.copy(DAY.hemiSky).lerp(NIGHT.hemiSky, t);
  hemi.groundColor.copy(DAY.hemiGround).lerp(NIGHT.hemiGround, t);
  hemi.intensity = DAY.hemiInt + (NIGHT.hemiInt-DAY.hemiInt)*t;
  ambient.color.copy(DAY.amb).lerp(NIGHT.amb, t);
  ambient.intensity = DAY.ambInt + (NIGHT.ambInt-DAY.ambInt)*t;
  towerLight.intensity = DAY.towerInt + (NIGHT.towerInt-DAY.towerInt)*t;
  windowMat.emissiveIntensity = DAY.windowInt + (NIGHT.windowInt-DAY.windowInt)*t;
  renderer.toneMappingExposure = DAY.exposure + (NIGHT.exposure-DAY.exposure)*t;
  // vignette stronger at night
  document.getElementById('vignette').style.opacity = 0.5 + t*0.4;
}

/* ---------- Voxel helpers ---------- */
const boxGeo = new THREE.BoxGeometry(1,1,1);
const tmpColor = new THREE.Color();

function voxelGeo(x,y,z, color, size=1){
  const g = boxGeo.clone();
  g.scale(size,size,size);
  g.translate(x,y,z);
  const c = new THREE.Color(color);
  const arr = new Float32Array(24*3);
  for(let i=0;i<24;i++){ arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr,3));
  return g;
}

function jitter(v, amt){ return v + (Math.random()-0.5)*amt; }

const rockPalette = [0x6b5a48, 0x5a4a3c, 0x7a6850, 0x4a4038, 0x5d4d3e];
const grassPalette = [0x4a7a3a, 0x5a8a42, 0x3e6a32, 0x6a9a4a];

function buildIsland(data){
  const {x:cx, z:cz, r, h, top=0} = data;
  const rockGeos = [], grassGeos = [], detailGeos = [];
  for(let dx=-r; dx<=r; dx++){
    for(let dz=-r; dz<=r; dz++){
      const dist = Math.sqrt(dx*dx+dz*dz);
      const edge = (Math.sin(dx*0.8+1.3)+Math.cos(dz*0.7+0.4))*0.6 + Math.sin((dx+dz)*0.5)*0.4;
      const effR = r + edge;
      if(dist > effR) continue;
      const colH = Math.max(1, Math.floor(h * (1 - dist/r*0.6) + Math.random()*1.8));
      for(let dy=0; dy<colH; dy++){
        const y = top - dy;
        if(dy===0){
          const g = voxelGeo(cx+dx, y, cz+dz, grassPalette[Math.floor(Math.random()*grassPalette.length)]*1);
          // slight color variation
          const sh = 0.85+Math.random()*0.25;
          const col = new THREE.Color(grassPalette[Math.floor(Math.random()*grassPalette.length)]).multiplyScalar(sh);
          const arr = new Float32Array(24*3);
          for(let i=0;i<24;i++){arr[i*3]=col.r;arr[i*3+1]=col.g;arr[i*3+2]=col.b;}
          g.setAttribute('color', new THREE.BufferAttribute(arr,3));
          grassGeos.push(g);
        } else {
          const base = rockPalette[Math.floor(Math.random()*rockPalette.length)];
          const sh = 0.6+Math.random()*0.4;
          const col = new THREE.Color(base).multiplyScalar(sh);
          const arr = new Float32Array(24*3);
          for(let i=0;i<24;i++){arr[i*3]=col.r;arr[i*3+1]=col.g;arr[i*3+2]=col.b;}
          const g = voxelGeo(cx+dx, y, cz+dz, 0xffffff);
          g.setAttribute('color', new THREE.BufferAttribute(arr,3));
          rockGeos.push(g);
        }
      }
    }
  }
  const rockMesh = new THREE.Mesh(mergeGeometries(rockGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0.0}));
  rockMesh.castShadow = true; rockMesh.receiveShadow = true;
  const grassMesh = new THREE.Mesh(mergeGeometries(grassGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9,metalness:0.0}));
  grassMesh.castShadow = true; grassMesh.receiveShadow = true;
  scene.add(rockMesh, grassMesh);
  return {rockMesh, grassMesh, data};
}

/* ---------- Buildings ---------- */
const windowMat = new THREE.MeshStandardMaterial({
  color:0x3a2a18, emissive:0xffb84a, emissiveIntensity:0, roughness:0.4, metalness:0.2
});

const buildingWallColors = [0xb8956a, 0xa67a52, 0x8a6240, 0xc4a578, 0x9a7a55, 0x7a5a3a];
const roofColors = [0x8a3a2a, 0x6a2820, 0xa04030, 0x5a2a1a, 0x7a4a30, 0x4a3a3a];
const metalColors = [0xc89656, 0xb8762e, 0x8a5a2a, 0xd8a868];

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function buildBuilding(cx, cz, baseY, w, d, h, opts={}){
  const wallCol = opts.wall || rand(buildingWallColors);
  const roofCol = opts.roof || rand(roofColors);
  const wallGeos = [], roofGeos = [], metalGeos = [], windowGeos = [];
  const floors = Math.max(2, h);
  const floorH = 1.2;
  for(let f=0; f<floors; f++){
    const y = baseY + f*floorH;
    // walls (ring of voxels)
    for(let x=0;x<w;x++){
      for(let z=0;z<d;z++){
        if(x===0||x===w-1||z===0||z===d-1){
          const sh = 0.85+Math.random()*0.2;
          const c = new THREE.Color(wallCol).multiplyScalar(sh);
          const arr = new Float32Array(24*3);
          for(let i=0;i<24;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
          const g = voxelGeo(cx + x - (w-1)/2, y, cz + z - (d-1)/2, 0xffffff);
          g.setAttribute('color', new THREE.BufferAttribute(arr,3));
          wallGeos.push(g);
        }
      }
    }
    // windows on each side
    if(f>0 || opts.groundWindows){
      const wy = y;
      const halfW = (w-1)/2, halfD = (d-1)/2;
      // along X faces
      for(let x=1;x<w-1;x+=2){
        const wx = cx + x - halfW;
        windowGeos.push(makeWindowGeo(wx, wy, cz - halfD - 0.55, 'z'));
        windowGeos.push(makeWindowGeo(wx, wy, cz + halfD + 0.55, 'z'));
      }
      for(let z=1;z<d-1;z+=2){
        const wz = cz + z - halfD;
        windowGeos.push(makeWindowGeo(cx - halfW - 0.55, wy, wz, 'x'));
        windowGeos.push(makeWindowGeo(cx + halfW + 0.55, wy, wz, 'x'));
      }
    }
  }
  // roof
  const roofY = baseY + floors*floorH;
  for(let x=0;x<w;x++){
    for(let z=0;z<d;z++){
      const sh = 0.8+Math.random()*0.3;
      const c = new THREE.Color(roofCol).multiplyScalar(sh);
      const arr = new Float32Array(24*3);
      for(let i=0;i<24;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
      const g = voxelGeo(cx + x - (w-1)/2, roofY, cz + z - (d-1)/2, 0xffffff);
      g.setAttribute('color', new THREE.BufferAttribute(arr,3));
      roofGeos.push(g);
    }
  }
  // pitched roof top
  if(opts.pitched!==false){
    const pw = Math.max(1,w-2), pd = Math.max(1,d-2);
    const pY = roofY + 1;
    for(let x=0;x<pw;x++){
      for(let z=0;z<pd;z++){
        const sh = 0.8+Math.random()*0.3;
        const c = new THREE.Color(roofCol).multiplyScalar(sh*0.9);
        const arr = new Float32Array(24*3);
        for(let i=0;i<24;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
        const g = voxelGeo(cx + x - (pw-1)/2, pY, cz + z - (pd-1)/2, 0xffffff);
        g.setAttribute('color', new THREE.BufferAttribute(arr,3));
        roofGeos.push(g);
      }
    }
  }
  // chimney
  if(opts.chimney!==false && Math.random()<0.7){
    const chx = cx + (w-1)/2 - 1;
    const chz = cz + (d-1)/2 - 1;
    const chH = 2 + Math.floor(Math.random()*2);
    for(let i=0;i<chH;i++){
      const c = new THREE.Color(rand(metalColors)).multiplyScalar(0.7+Math.random()*0.3);
      const arr = new Float32Array(24*3);
      for(let j=0;j<24;j++){arr[j*3]=c.r;arr[j*3+1]=c.g;arr[j*3+2]=c.b;}
      const g = voxelGeo(chx, roofY+1+i, chz, 0xffffff);
      g.setAttribute('color', new THREE.BufferAttribute(arr,3));
      metalGeos.push(g);
    }
  }
  const group = new THREE.Group();
  if(wallGeos.length){
    const m = new THREE.Mesh(mergeGeometries(wallGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,metalness:0.05}));
    m.castShadow=true;m.receiveShadow=true;group.add(m);
  }
  if(roofGeos.length){
    const m = new THREE.Mesh(mergeGeometries(roofGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.8,metalness:0.1}));
    m.castShadow=true;m.receiveShadow=true;group.add(m);
  }
  if(metalGeos.length){
    const m = new THREE.Mesh(mergeGeometries(metalGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.5,metalness:0.7}));
    m.castShadow=true;group.add(m);
  }
  if(windowGeos.length){
    const m = new THREE.Mesh(mergeGeometries(windowGeos), windowMat);
    group.add(m);
  }
  scene.add(group);
  return group;
}

function makeWindowGeo(x,y,z,axis){
  const g = new THREE.BoxGeometry(0.7, 0.9, 0.12);
  if(axis==='x') g.rotateY(Math.PI/2);
  g.translate(x, y, z);
  return g;
}

/* ---------- Central Clock Tower ---------- */
const clockParts = {hands:[], group:new THREE.Group()};
scene.add(clockParts.group);

function buildClockTower(){
  const cx=0, cz=0, baseY=0;
  // Wide stone base
  const baseGeos = [];
  const baseW = 6, baseH = 3;
  for(let y=0;y<baseH;y++){
    for(let x=-baseW;x<=baseW;x++){
      for(let z=-baseW;z<=baseW;z++){
        if(Math.abs(x)===baseW||Math.abs(z)===baseW||y===0||y===baseH-1){
          const sh = 0.6+Math.random()*0.3;
          const c = new THREE.Color(0x6a5a48).multiplyScalar(sh);
          const arr = new Float32Array(24*3);
          for(let i=0;i<24;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
          const g = voxelGeo(cx+x, baseY+y, cz+z, 0xffffff);
          g.setAttribute('color', new THREE.BufferAttribute(arr,3));
          baseGeos.push(g);
        }
      }
    }
  }
  const baseMesh = new THREE.Mesh(mergeGeometries(baseGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9,metalness:0.05}));
  baseMesh.castShadow=true; baseMesh.receiveShadow=true;
  clockParts.group.add(baseMesh);

  // Tower shaft
  const shaftGeos = [];
  const tW = 3, tH = 16;
  for(let y=0;y<tH;y++){
    for(let x=-tW;x<=tW;x++){
      for(let z=-tW;z<=tW;z++){
        if(Math.abs(x)===tW||Math.abs(z)===tW){
          const sh = 0.7+Math.random()*0.25;
          const c = new THREE.Color(y%4===2 ? 0xb8956a : 0x9a7a55).multiplyScalar(sh);
          const arr = new Float32Array(24*3);
          for(let i=0;i<24;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
          const g = voxelGeo(cx+x, baseY+baseH+y, cz+z, 0xffffff);
          g.setAttribute('color', new THREE.BufferAttribute(arr,3));
          shaftGeos.push(g);
        }
      }
    }
  }
  const shaftMesh = new THREE.Mesh(mergeGeometries(shaftGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,metalness:0.1}));
  shaftMesh.castShadow=true; shaftMesh.receiveShadow=true;
  clockParts.group.add(shaftMesh);

  // Clock face room (wider)
  const faceY = baseY + baseH + tH - 2;
  const faceGeos = [], frameGeos = [];
  const fW = 4;
  for(let y=0;y<4;y++){
    for(let x=-fW;x<=fW;x++){
      for(let z=-fW;z<=fW;z++){
        const edge = Math.abs(x)===fW||Math.abs(z)===fW;
        if(edge || y===0 || y===3){
          const sh = 0.7+Math.random()*0.25;
          const c = new THREE.Color(0x8a5a2a).multiplyScalar(sh);
          const arr = new Float32Array(24*3);
          for(let i=0;i<24;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
          const g = voxelGeo(cx+x, faceY+y, cz+z, 0xffffff);
          g.setAttribute('color', new THREE.BufferAttribute(arr,3));
          frameGeos.push(g);
        }
      }
    }
  }
  const frameMesh = new THREE.Mesh(mergeGeometries(frameGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.6,metalness:0.4}));
  frameMesh.castShadow=true;
  clockParts.group.add(frameMesh);

  // Clock faces (4 sides) - dark with glowing rim
  const clockFaceMat = new THREE.MeshStandardMaterial({color:0x1a1208, emissive:0xffaa44, emissiveIntensity:0.4, roughness:0.4, metalness:0.3});
  const facePositions = [
    {x:0, z:-(fW+0.6), ry:0},
    {x:0, z:(fW+0.6), ry:Math.PI},
    {x:-(fW+0.6), z:0, ry:-Math.PI/2},
    {x:(fW+0.6), z:0, ry:Math.PI/2},
  ];
  const handPivots = [];
  facePositions.forEach(fp=>{
    const face = new THREE.Mesh(new THREE.CircleGeometry(2.4, 24), clockFaceMat);
    face.position.set(fp.x, faceY+2, fp.z);
    face.rotation.y = fp.ry;
    clockParts.group.add(face);
    // rim (torus)
    const rim = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.18, 8, 24),
      new THREE.MeshStandardMaterial({color:0xc89656, emissive:0xff8a30, emissiveIntensity:0.3, roughness:0.4, metalness:0.8}));
    rim.position.copy(face.position); rim.rotation.y = fp.ry; rim.rotation.x = Math.PI/2;
    clockParts.group.add(rim);
    // tick marks
    for(let i=0;i<12;i++){
      const a = i/12 * Math.PI*2;
      const tx = Math.cos(a)*2.0, ty = Math.sin(a)*2.0;
      const tick = new THREE.Mesh(new THREE.BoxGeometry(0.12,0.4,0.1),
        new THREE.MeshStandardMaterial({color:0xe8c890, emissive:0xffaa44, emissiveIntensity:0.5, metalness:0.6, roughness:0.4}));
      tick.position.set(fp.x + tx*Math.cos(fp.ry), faceY+2 + ty, fp.z - tx*Math.sin(fp.ry));
      tick.rotation.y = fp.ry;
      clockParts.group.add(tick);
    }
    // hands (pivot)
    const pivot = new THREE.Group();
    pivot.position.set(fp.x + Math.cos(fp.ry)*0.1, faceY+2, fp.z - Math.sin(fp.ry)*0.1);
    pivot.rotation.y = fp.ry;
    const hourHand = new THREE.Mesh(new THREE.BoxGeometry(0.18,1.4,0.1),
      new THREE.MeshStandardMaterial({color:0xe8c890, emissive:0xffaa44, emissiveIntensity:0.6, metalness:0.7, roughness:0.3}));
    hourHand.position.y = 0.6;
    pivot.add(hourHand);
    const minHand = new THREE.Mesh(new THREE.BoxGeometry(0.14,2.0,0.1),
      new THREE.MeshStandardMaterial({color:0xfff0c0, emissive:0xffcc66, emissiveIntensity:0.7, metalness:0.7, roughness:0.3}));
    minHand.position.y = 0.9;
    pivot.add(minHand);
    clockParts.group.add(pivot);
    handPivots.push({pivot, hourHand, minHand});
  });
  clockParts.hands = handPivots;

  // Roof / spire
  const spireY = faceY + 4;
  const spireGeos = [];
  for(let lvl=0; lvl<5; lvl++){
    const w = 4 - lvl;
    for(let x=-w;x<=w;x++){
      for(let z=-w;z<=w;z++){
        if(Math.abs(x)===w||Math.abs(z)===w){
          const sh = 0.7+Math.random()*0.3;
          const c = new THREE.Color(0x6a2820).multiplyScalar(sh);
          const arr = new Float32Array(24*3);
          for(let i=0;i<24;i++){arr[i*3]=c.r;arr[i*3+1]=c.g;arr[i*3+2]=c.b;}
          const g = voxelGeo(cx+x, spireY+lvl, cz+z, 0xffffff);
          g.setAttribute('color', new THREE.BufferAttribute(arr,3));
          spireGeos.push(g);
        }
      }
    }
  }
  const spireMesh = new THREE.Mesh(mergeGeometries(spireGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.7,metalness:0.2}));
  spireMesh.castShadow=true;
  clockParts.group.add(spireMesh);

  // Brass tip + glowing orb
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.6, 2, 8),
    new THREE.MeshStandardMaterial({color:0xd8a868, emissive:0xff8a30, emissiveIntensity:0.5, metalness:0.9, roughness:0.3}));
  tip.position.set(cx, spireY+5+1, cz);
  clockParts.group.add(tip);
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12),
    new THREE.MeshStandardMaterial({color:0xffe0a0, emissive:0xffaa44, emissiveIntensity:1.5, metalness:0.5, roughness:0.2}));
  orb.position.set(cx, spireY+5+2.4, cz);
  clockParts.group.add(orb);
  clockParts.orb = orb;

  // Steam pipes coming off the tower
  for(let i=0;i<4;i++){
    const a = i/4*Math.PI*2 + Math.PI/4;
    const px = Math.cos(a)*4, pz = Math.sin(a)*4;
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,3,8),
      new THREE.MeshStandardMaterial({color:0x8a5a2a, metalness:0.8, roughness:0.4}));
    pipe.position.set(px, baseY+baseH+8, pz);
    pipe.rotation.z = Math.cos(a)*0.5;
    pipe.rotation.x = -Math.sin(a)*0.5;
    clockParts.group.add(pipe);
  }
}

/* ---------- Bridges ---------- */
function buildBridge(p1, p2){
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const segs = Math.max(4, Math.floor(len/2));
  const geos = [], railGeos = [];
  for(let i=0;i<=segs;i++){
    const t = i/segs;
    const x = p1.x + dir.x*t;
    const z = p1.z + dir.z*t;
    // sag
    const sag = Math.sin(t*Math.PI)*-0.8;
    const y = p1.y + dir.y*t + sag;
    // deck
    const g = voxelGeo(x, y, z, 0x8a6a44);
    const arr = new Float32Array(24*3);
    const c = new THREE.Color(0x8a6a44).multiplyScalar(0.8+Math.random()*0.3);
    for(let j=0;j<24;j++){arr[j*3]=c.r;arr[j*3+1]=c.g;arr[j*3+2]=c.b;}
    g.setAttribute('color', new THREE.BufferAttribute(arr,3));
    geos.push(g);
    // side planks
    for(const off of [-0.6, 0.6]){
      const rg = voxelGeo(x, y+0.5, z+off, 0x6a4a2a);
      const ra = new Float32Array(24*3);
      const rc = new THREE.Color(0x6a4a2a).multiplyScalar(0.8+Math.random()*0.3);
      for(let j=0;j<24;j++){ra[j*3]=rc.r;ra[j*3+1]=rc.g;ra[j*3+2]=rc.b;}
      rg.setAttribute('color', new THREE.BufferAttribute(ra,3));
      railGeos.push(rg);
    }
    // support pillar down (cable)
    if(i%2===0 && t>0.1 && t<0.9){
      const cab = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,3,6),
        new THREE.MeshStandardMaterial({color:0x4a3a2a, metalness:0.6, roughness:0.5}));
      cab.position.set(x, y-1.8, z);
      scene.add(cab);
    }
  }
  // rail lamps (glow at night)
  const lampMat = new THREE.MeshStandardMaterial({color:0x3a2a18, emissive:0xffb050, emissiveIntensity:0.0, roughness:0.4, metalness:0.3});
  nightMaterials.push(lampMat);
  const lampGeos = [];
  for(let i=2;i<=segs-2;i+=3){
    const t = i/segs;
    const x = p1.x + dir.x*t;
    const z = p1.z + dir.z*t;
    const sag = Math.sin(t*Math.PI)*-0.8;
    const y = p1.y + dir.y*t + sag;
    const lg = new THREE.BoxGeometry(0.25,0.25,0.25);
    lg.translate(x, y+1.2, z);
    lampGeos.push(lg);
  }
  if(lampGeos.length){
    const lamps = new THREE.Mesh(mergeGeometries(lampGeos), lampMat);
    scene.add(lamps);
  }
  const deckMesh = new THREE.Mesh(mergeGeometries(geos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9,metalness:0.05}));
  deckMesh.castShadow=true; deckMesh.receiveShadow=true;
  const railMesh = new THREE.Mesh(mergeGeometries(railGeos), new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,metalness:0.1}));
  scene.add(deckMesh, railMesh);
}

/* ---------- Wind Turbines ---------- */
const turbines = [];
function buildTurbine(x, y, z, scale=1){
  const g = new THREE.Group();
  // pole
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25*scale, 0.4*scale, 6*scale, 8),
    new THREE.MeshStandardMaterial({color:0x8a5a2a, metalness:0.7, roughness:0.4}));
  pole.position.y = 3*scale;
  pole.castShadow = true;
  g.add(pole);
  // hub
  const hub = new THREE.Mesh(new THREE.SphereGeometry(0.5*scale, 12, 8),
    new THREE.MeshStandardMaterial({color:0xc89656, metalness:0.9, roughness:0.3, emissive:0x331a08, emissiveIntensity:0.2}));
  hub.position.y = 6*scale;
  g.add(hub);
  // blades pivot
  const pivot = new THREE.Group();
  pivot.position.y = 6*scale;
  for(let i=0;i<4;i++){
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.2*scale, 3*scale, 0.6*scale),
      new THREE.MeshStandardMaterial({color:0xe8d4a0, metalness:0.3, roughness:0.6}));
    blade.position.y = 1.6*scale;
    blade.castShadow = true;
    const arm = new THREE.Group();
    arm.add(blade);
    arm.rotation.z = i/4*Math.PI*2;
    pivot.add(arm);
  }
  g.add(pivot);
  g.position.set(x, y, z);
  g.userData = {pivot, speed: 0.6+Math.random()*0.5};
  scene.add(g);
  turbines.push(g);
}

/* ---------- Waterfalls ---------- */
const waterfalls = [];
function buildWaterfall(x, y, z, height=18, width=1){
  const count = 40 * width;
  const positions = new Float32Array(count*3);
  const velocities = new Float32Array(count);
  const offsets = new Float32Array(count);
  for(let i=0;i<count;i++){
    positions[i*3] = x + (Math.random()-0.5)*width*1.2;
    positions[i*3+1] = y - Math.random()*height;
    positions[i*3+2] = z + (Math.random()-0.5)*width*1.2;
    velocities[i] = 0.15 + Math.random()*0.1;
    offsets[i] = Math.random()*height;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color:0xa8d8e8, size:0.5, transparent:true, opacity:0.85,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  // top lip (stone)
  const lip = new THREE.Mesh(new THREE.BoxGeometry(width*2, 0.6, width*2),
    new THREE.MeshStandardMaterial({color:0x5a4a3a, roughness:0.9}));
  lip.position.set(x, y+0.3, z);
  lip.castShadow = true;
  scene.add(lip);
  // mist at bottom
  const mistMat = new THREE.SpriteMaterial({color:0xffffff, transparent:true, opacity:0.3, depthWrite:false});
  const mist = new THREE.Sprite(mistMat);
  mist.scale.set(6,3,1);
  mist.position.set(x, y-height, z);
  scene.add(mist);
  waterfalls.push({pts, positions, velocities, offsets, height, baseY:y, x, z, mist});
}

/* ---------- Airships ---------- */
const airships = [];
function buildAirship(opts){
  const g = new THREE.Group();
  const bodyColor = opts.body || 0x8a3a2a;
  // balloon (elongated sphere)
  const balloon = new THREE.Mesh(
    new THREE.SphereGeometry(2.2, 20, 14),
    new THREE.MeshStandardMaterial({color:bodyColor, roughness:0.55, metalness:0.15})
  );
  balloon.scale.set(1, 1, 2.4);
  balloon.castShadow = true;
  g.add(balloon);
  // balloon ribs (rings)
  for(let i=-2;i<=2;i++){
    const ring = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.08, 6, 18),
      new THREE.MeshStandardMaterial({color:0xc89656, metalness:0.8, roughness:0.4}));
    ring.position.z = i*1.0;
    ring.scale.set(1, 1, 1);
    g.add(ring);
  }
  // gondola
  const gondola = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, 2.4),
    new THREE.MeshStandardMaterial({color:0x5a3a1a, roughness:0.8, metalness:0.2}));
  gondola.position.y = -2.2;
  gondola.castShadow = true;
  g.add(gondola);
  // gondola windows (glow)
  const winMat = new THREE.MeshStandardMaterial({color:0x3a2a18, emissive:0xffb050, emissiveIntensity:0.0, roughness:0.4, metalness:0.3});
  nightMaterials.push(winMat);
  for(let i=-1;i<=1;i++){
    const w = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.05), winMat);
    w.position.set(0.81, -2.2, i*0.7);
    w.rotation.y = Math.PI/2;
    g.add(w);
    const w2 = w.clone();
    w2.position.x = -0.81;
    w2.rotation.y = -Math.PI/2;
    g.add(w2);
  }
  // fins
  for(const sy of [1,-1]){
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.4, 1.2),
      new THREE.MeshStandardMaterial({color:bodyColor, roughness:0.6}));
    fin.position.set(0, sy*1.5, -4.5);
    g.add(fin);
  }
  const tail = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.2, 1.0),
    new THREE.MeshStandardMaterial({color:bodyColor, roughness:0.6}));
  tail.position.set(0, 0.5, -4.5);
  g.add(tail);
  // propeller at back
  const propPivot = new THREE.Group();
  propPivot.position.set(0, 0, -5.4);
  for(let i=0;i<3;i++){
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 0.2),
      new THREE.MeshStandardMaterial({color:0xc89656, metalness:0.8, roughness:0.3}));
    blade.position.y = 0.7;
    const arm = new THREE.Group();
    arm.add(blade);
    arm.rotation.z = i/3*Math.PI*2;
    propPivot.add(arm);
  }
  g.add(propPivot);
  // side propellers
  const sideProps = [];
  for(const sx of [-1, 1]){
    const sp = new THREE.Group();
    sp.position.set(sx*2.4, -1.5, 0);
    const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.3,8),
      new THREE.MeshStandardMaterial({color:0x8a5a2a, metalness:0.7, roughness:0.4}));
    housing.rotation.z = Math.PI/2;
    sp.add(housing);
    const pp = new THREE.Group();
    for(let i=0;i<3;i++){
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.9, 0.18),
        new THREE.MeshStandardMaterial({color:0xc89656, metalness:0.8, roughness:0.3}));
      blade.position.y = 0.5;
      const arm = new THREE.Group();
      arm.add(blade);
      arm.rotation.z = i/3*Math.PI*2;
      pp.add(arm);
    }
    pp.position.x = sx*0.2;
    sp.add(pp);
    g.add(sp);
    sideProps.push(pp);
  }
  g.userData = {propPivot, sideProps, ...opts};
  scene.add(g);
  airships.push(g);
  return g;
}

/* ---------- Steam particles (chimneys) ---------- */
const steamPuffs = [];
function addSteamSource(x,y,z){
  steamPuffs.push({x,y,z, puffs:[]});
}
function emitSteam(){
  steamPuffs.forEach(s=>{
    if(Math.random()<0.25){
      const mat = new THREE.SpriteMaterial({color:0xffffff, transparent:true, opacity:0.5, depthWrite:false});
      const sp = new THREE.Sprite(mat);
      sp.position.set(s.x + (Math.random()-0.5)*0.3, s.y, s.z + (Math.random()-0.5)*0.3);
      sp.scale.set(0.6,0.6,1);
      scene.add(sp);
      s.puffs.push({sp, life:0, vy:0.04+Math.random()*0.03, vx:(Math.random()-0.5)*0.02});
    }
    s.puffs.forEach(p=>{
      p.life += 0.016;
      p.sp.position.y += p.vy;
      p.sp.position.x += p.vx;
      p.sp.scale.multiplyScalar(1.012);
      p.sp.material.opacity = Math.max(0, 0.5 - p.life*0.12);
    });
    s.puffs = s.puffs.filter(p=>p.life<4);
    s.puffs.forEach(p=>{ if(p.sp.material.opacity<=0){ scene.remove(p.sp); p.sp.material.dispose(); }});
  });
}

// Satellite island buildings
function populateIsland(def, count, palette){
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2;
    const r = def.r * (0.2 + Math.random()*0.55);
    const x = def.x + Math.cos(a)*r;
    const z = def.z + Math.sin(a)*r;
    const w = 2 + Math.floor(Math.random()*3);
    const d = 2 + Math.floor(Math.random()*3);
    const h = 2 + Math.floor(Math.random()*4);
    buildBuilding(x, z, def.top+1, w, d, h, {wall:palette.wall, roof:palette.roof});
    if(Math.random()<0.4) addSteamSource(x, def.top+1+h*1.2+1, z);
  }
}

// Characters walking on islands (circular paths)
function addCharactersForIsland(def, count){
  for(let i=0;i<count;i++){
    const r = def.r * (0.3 + Math.random()*0.4);
    const cx = def.x, cz = def.z;
    const path = (t)=>{
      const a = t*Math.PI*2;
      return new THREE.Vector3(cx + Math.cos(a)*r, def.top+1.05, cz + Math.sin(a)*r);
    };
    buildCharacter(path, {speed:0.04+Math.random()*0.05});
  }
}

// Trees on islands (voxel)
function addTree(x, y, z){
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, 0.3),

// Lamp posts on central island (glow at night)
const lampPostMat = new THREE.MeshStandardMaterial({color:0x2a1a10, roughness:0.6, metalness:0.5});

/* ---------- UI handlers ---------- */
const timeBtn = document.getElementById('timeBtn');
timeBtn.addEventListener('click', ()=>{
  state.target = state.target > 0.5 ? 0 : 1;
  timeBtn.classList.toggle('night', state.target>0.5);
  timeBtn.innerHTML = state.target>0.5
    ? '<span class="ico"></span>RETURN TO DAYLIGHT'
    : '<span class="ico"></span>DESCEND INTO NIGHT';
});
const cinematicBtn = document.getElementById('cinematicBtn');
cinematicBtn.addEventListener('click', ()=>{
  state.cinematic = !state.cinematic;

  cinematicBtn.textContent = state.cinematic ? 'EXIT CINEMATIC' : 'CINEMATIC ORBIT';
});

// Population stat
document.getElementById('pop').textContent = characters.length * 47 + 1284;

/* ---------- Resize ---------- */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- Animation loop ---------- */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  // smooth day/night
  state.t += (state.target - state.t) * Math.min(1, dt*1.5);
  applyTime(state.t);

  // night materials (lamps, bridge lamps, etc.) ramp with state.t
  const nightFactor = state.t;
  nightMaterials.forEach(m=>{
    m.emissiveIntensity = 0.05 + nightFactor * 2.2;
  });
  // clock face emissive ramps too
  clockParts.group.traverse(o=>{
    if(o.material && o.material.emissive && o.material !== windowMat){
      // skip
    }
  });

  // Clock hands rotation
  clockParts.hands.forEach(h=>{
    h.pivot.rotation.z = -elapsed * 0.05;
    h.minHand.parent.rotation.z = -elapsed * 0.3;
  });
  // orb pulse
  if(clockParts.orb){
    clockParts.orb.material.emissiveIntensity = 1.2 + Math.sin(elapsed*2)*0.4 + nightFactor*0.8;
  }

  // Turbines
  turbines.forEach(t=>{
    t.userData.pivot.rotation.z += dt * t.userData.speed;
  });

  // Waterfalls
  waterfalls.forEach(w=>{
    const pos = w.positions;
    for(let i=0;i<pos.length/3;i++){
      pos[i*3+1] -= w.velocities[i] * 60 * dt;
      if(pos[i*3+1] < w.baseY - w.height){
        pos[i*3+1] = w.baseY - 0.2;
        pos[i*3] = w.x + (Math.random()-0.5)*1.2;
        pos[i*3+2] = w.z + (Math.random()-0.5)*1.2;
      }
    }
    w.pts.geometry.attributes.position.needsUpdate = true;
    // mist pulse
    w.mist.material.opacity = 0.25 + Math.sin(elapsed*2 + w.x)*0.08;
  });

  // Airships
  airships.forEach((ship, idx)=>{
    const u = ship.userData;
    if(u.axis==='y'){
      const a = elapsed * u.speed + u.phase;
      ship.position.set(Math.cos(a)*u.radius, u.height + Math.sin(elapsed*0.4+idx)*2, Math.sin(a)*u.radius);
      // face direction of travel
      const next = a + 0.05;
      const nx = Math.cos(next)*u.radius, nz = Math.sin(next)*u.radius;
      ship.lookAt(nx, ship.position.y, nz);
    } else {
      const a = elapsed * u.speed + u.phase;
      ship.position.set(Math.sin(a)*u.radius, u.height + Math.sin(elapsed*0.5+idx)*1.5, Math.cos(a)*u.radius);
      const next = a + 0.05;
      const nx = Math.sin(next)*u.radius, nz = Math.cos(next)*u.radius;
      ship.lookAt(nx, ship.position.y, nz);
    }
    u.propPivot.rotation.z += dt * 8;
    u.sideProps.forEach(p=> p.rotation.x += dt * 10);
  });

  // Characters
  characters.forEach(c=>{
    c.t = (c.t + dt * c.speed) % 1;
    const p = c.path(c.t);
    const pNext = c.path((c.t + 0.001)%1);
    c.g.position.copy(p);
    c.g.lookAt(pNext.x, c.g.position.y, pNext.z);
    // walking bob
    const bob = Math.sin(elapsed*8 + c.t*20)*0.06;
    c.g.position.y += bob;
    c.legL.rotation.x = Math.sin(elapsed*8 + c.t*20)*0.5;
    c.legR.rotation.x = -Math.sin(elapsed*8 + c.t*20)*0.5;
  });

  // Clouds drift
  clouds.forEach(c=>{
    c.position.x += Math.cos(c.userData.driftDir) * c.userData.driftSpeed * dt * 10;
    c.position.z += Math.sin(c.userData.driftDir) * c.userData.driftSpeed * dt * 10;
    // wrap
    if(c.position.x > 130) c.position.x = -130;
    if(c.position.x < -130) c.position.x = 130;
    if(c.position.z > 130) c.position.z = -130;
    if(c.position.z < -130) c.position.z = 130;
  });

  // Steam
  emitSteam();

  // Tower light flicker at night
  towerLight.intensity = (DAY.towerInt + (NIGHT.towerInt-DAY.towerInt)*state.t) + Math.sin(elapsed*5)*0.15;

  // Altitude display
  const altEl = document.getElementById('alt');
  if(altEl) altEl.textContent = (2400 + Math.floor(Math.sin(elapsed*0.3)*12)).toString();

  controls.update();
  renderer.render(scene, camera);
}

// Initial state
applyTime(0);
animate();

// Hide loader
setTimeout(()=>document.getElementById('loader').classList.add('hide'), 400);

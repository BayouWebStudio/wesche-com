<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voxel Pagoda Garden</title>
<style>
  body { margin:0; overflow:hidden; background:#87CEEB; }
  canvas { display:block; }
  #info {
    position:absolute; top:10px; left:10px; color:#fff;
    font-family:system-ui, sans-serif; background:rgba(0,0,0,0.4);
    padding:8px 12px; border-radius:8px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">Voxel Pagoda Garden — drag to orbit, scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 60, 180);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(38, 32, 38);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dir = new THREE.DirectionalLight(0xffffff, 0.9);
dir.position.set(20,40,10);
scene.add(dir);

const voxelData = {};
const addVoxel = (x,y,z,color) => {
  if(!voxelData[color]) voxelData[color]=[];
  voxelData[color].push({x,y,z});
};

// Ground
const grass = 0x4CAF50;
for(let x=-25;x<=24;x++){
  for(let z=-25;z<=24;z++){
    addVoxel(x,0,z,grass);
    if(Math.random()<0.015) addVoxel(x,0,z,0x795548);
  }
}
// Stone path
for(let z=-25;z<=-5;z++){
  for(let x=-2;x<=2;x++){
    addVoxel(x,0,z,0xD2B48C);
  }
}
// Pond
for(let x=-12;x<=-8;x++){
  for(let z=-12;z<=-8;z++){
    addVoxel(x,0,z,0x1E90FF);
  }
}

// Trees
function makeTree(cx,cz,h,isCherry){
  const trunk = 0x8B5A2B;
  for(let y=1;y<=h;y++) addVoxel(cx,y,cz,trunk);
  const leaf = isCherry ? 0xFFB6C1 : 0x228B22;
  const petal = isCherry ? 0xFF69B4 : 0x32CD32;
  for(let dy=0;dy<4;dy++){
    for(let dx=-3;dx<=3;dx++){
      for(let dz=-3;dz<=3;dz++){
        if(dx*dx+dz*dz <= 9 && Math.random()>0.3){
          const y = h+1+dy;
          addVoxel(cx+dx,y,cz+dz, Math.random()<0.15 && isCherry ? petal : leaf);
        }
      }
    }
  }
}
makeTree(12,-12,6,true);
makeTree(-18,-10,7,true);
makeTree(8,18,6,true);
makeTree(10,10,7,false);
makeTree(-10,12,8,false);
makeTree(18,-8,6,false);
makeTree(-20,5,7,false);
makeTree(15,-18,5,false);

// Pagoda
const cx=0, cz=0;
const stone = 0xA9A9A9;
for(let x=-7;x<=7;x++) for(let z=-7;z<=7;z++){
  for(let y=1;y<=2;y++) addVoxel(cx+x,y,cz+z,stone);
}
let cumY = 3;
const tiers = [
  {size:9, h:4, col:0xB22222},
  {size:7, h:4, col:0xB22222},
  {size:5, h:4, col:0xB22222},
  {size:3, h:4, col:0xB22222},
  {size:1, h:4, col:0xB22222}
];
tiers.forEach(t=>{
  const half = Math.floor(t.size/2);
  const base = cumY;
  for(let dx=-half;dx<=half;dx++){
    for(let dz=-half;dz<=half;dz++){
      for(let dy=0;dy<t.h;dy++){
        if(Math.abs(dx)===half || Math.abs(dz)===half || t.size===1){
          addVoxel(cx+dx, base+dy, cz+dz, t.col);
        }
      }
    }
  }
  // Roof
  const roofY = base + t.h;
  const over = 2;
  const rSize = t.size + over*2;
  const rHalf = Math.floor(rSize/2);
  for(let dx=-rHalf;dx<=rHalf;dx++){
    for(let dz=-rHalf;dz<=rHalf;dz++){
      if(Math.abs(dx)===rHalf || Math.abs(dz)===rHalf){
        addVoxel(cx+dx, roofY, cz+dz, 0xDAA520);
        addVoxel(cx+dx, roofY+1, cz+dz, 0xDAA520);
      }
    }
  }
  // Gold eaves
  for(let dx=-rHalf+1;dx<=rHalf-1;dx++){
    for(let dz=-rHalf+1;dz<=rHalf-1;dz++){
      if(Math.abs(dx)===rHalf-1 || Math.abs(dz)===rHalf-1){
        addVoxel(cx+dx, roofY+2, cz+dz, 0xFFD700);
      }
    }
  }
  cumY += t.h + 2;
});

// Flowers around pagoda
for(let i=0;i<120;i++){
  const a = Math.random()*Math.PI*2;
  const r = 8 + Math.random()*10;
  const x = Math.round(Math.cos(a)*r);
  const z = Math.round(Math.sin(a)*r);
  addVoxel(cx+x,1,cz+z, 0xFF69B4);
}

// Build instanced meshes
const geo = new THREE.BoxGeometry(0.98,0.98,0.98);
const dummy = new THREE.Object3D();
for(const col in voxelData){
  const arr = voxelData[col];
  const mat = new THREE.MeshLambertMaterial({color: parseInt(col)});
  const mesh = new THREE.InstancedMesh(geo, mat, arr.length);
  arr.forEach((p,i)=>{
    dummy.position.set(p.x,p.y,p.z);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  });
  scene.add(mesh);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>

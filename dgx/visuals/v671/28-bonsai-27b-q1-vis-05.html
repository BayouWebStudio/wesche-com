<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Treadmill Animation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  canvas { display: block; }
  #info {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="info">Treadmill Animation — 10s cycle looping</div>
<script type="module">
import * as THREE from './three.module.js';

// ── Scene Setup ──────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.Fog(0x0a0a14, 50, 120);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 22);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ── Lighting ─────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x333344, 0.5);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(8, 14, 8);
dirLight.castShadow = true;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x666688, 0.25);
fillLight.position.set(-6, 10, -4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x8888cc, 0.15);
rimLight.position.set(-6, 18, 10);
scene.add(rimLight);

// ── Treadmill Ground ─────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(120, 120, 64, 64);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x2a2a2e,
  roughness: 0.9,
  metalness: 0.1,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

// Grid lines on treadmill
const gridGeo = new THREE.PlaneGeometry(120, 120, 64, 64);
const gridMat = new THREE.MeshBasicMaterial({
  color: 0x111118,
  transparent: true,
  opacity: 0.5,
});
const grid = new THREE.Mesh(gridGeo, gridMat);
grid.rotation.x = -Math.PI / 2;
grid.position.y = 0;
scene.add(grid);

// Treadmill belt lines (moving)
const beltGeo = new THREE.PlaneGeometry(24, 10, 2, 64);
const beltMat = new THREE.MeshBasicMaterial({
  color: 0x3a3a4a,
});
const belt = new THREE.Mesh(beltGeo, beltMat);
belt.rotation.x = -Math.PI / 2;
belt.position.y = 0;
scene.add(belt);

// Belt edge rails
const railGeo = new THREE.BoxGeometry(0.12, 0.12, 24);
const railMat = new THREE.MeshStandardMaterial({ color: 0x444455, metalness: 0.7 });
const railL = new THREE.Mesh(railGeo, railMat);
railL.position.set(-12, 0, 0);
scene.add(railL);
const railR = new THREE.Mesh(railGeo, railMat);
railR.position.set(12, 0, 0);
scene.add(railR);

// Belt moving indicator lines
const lineGeo = new THREE.PlaneGeometry(24, 0.04, 2, 16);
const lineMat = new THREE.MeshBasicMaterial({ color: 0x555566 });
for (let i = 0; i < 6; i++) {
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.position.set(-12 + i * 4, 0, 0);
  scene.add(line);
}

// ── Humanoid Figure ──────────────────────────────────────────────
const humanoid = new THREE.Group();
scene.add(humanoid);

// Color palette
const skinColor = 0xd4b896;
const skinLight = 0xe8d4b0;
const skinDark = 0xb89a78;
const skinMid = 0xc4a888;
const skinPalm = 0xe4c8a8;
const skinNail = 0x8a7a6a;
const skinEyes = 0x1a1a2e;
const skinPupil = 0x0a0a1a;
const skinLip = 0x8a5a5a;
const skinNostril = 0x5a4a3a;
const skinBrows = 0x6a5a4a;
const skinEyelid = 0xd4b896;
const skinEyelidInner = 0xc4a888;

const skinMaterial = {
  color: skinColor,
  roughness: 0.5,
  metalness: 0.0,
  side: THREE.DoubleSide,
  transparent: false,
};
const skinMaterialHead = { ...skinMaterial, roughness: 0.4, metalness: 0.05 };
const skinMaterialInner = { ...skinMaterial, roughness: 0.6, metalness: 0.0 };

const skinMaterialPalm = { color: skinPalm, roughness: 0.5, metalness: 0.0 };
const skinMaterialNail = { color: skinNail, roughness: 0.8, metalness: 0.0 };
const skinMaterialKnuckle = { color: skinDark, roughness: 0.6, metalness: 0.0 };
const skinMaterialElbow = { color: skinDark, roughness: 0.6, metalness: 0.0 };
const skinMaterialShoulder = { color: skinMid, roughness: 0.5, metalness: 0.0 };
const skinMaterialNeck = { color: skinMid, roughness: 0.5, metalness: 0.0 };
const skinMaterialTorso = { color: skinMid, roughness: 0.5, metalness: 0.0 };
const skinMaterialAbdomen = { color: skinMid, roughness: 0.5, metalness: 0.0 };
const skinMaterialLeg = { color: skinMid, roughness: 0.5, metalness: 0.0 };
const skinMaterialCalf = { color: skinMid, roughness: 0.5, metalness: 0.0 };
const skinMaterialFoot = { color: skinDark, roughness: 0.6, metalness: 0.0 };
const skinMaterialToe = { color: skinNail, roughness: 0.8, metalness: 0.0 };

// ── Helper: create cylinder ────────────────────────────────────────
function createCylinder(radius, height, material, x, y, z, rotationX = 0, rotationY = 0) {
  const geo = new THREE.CylinderGeometry(radius, radius * 0.9, height, 8, 1);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.rotation.x = rotationX;
  mesh.rotation.y = rotationY;
  return mesh;
}

// ── Helper: create capsule (rounded cylinder) ─────────────────────
function createCapsule(length, radius, material, x, y, z, rotationX = 0, rotationY = 0, rotationZ = 0) {
  const geo = new THREE.CylinderGeometry(radius, radius, length, 8, 1);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.rotation.x = rotationX;
  mesh.rotation.y = rotationY;
  mesh.rotation.z = rotationZ;
  return mesh;
}

// ── Helper: create box ─────────────────────────────────────────────
function createBox(w, h, d, material, x, y, z, rotationX = 0, rotationY = 0, rotationZ = 0) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.rotation.x = rotationX;
  mesh.rotation.y = rotationY;
  mesh.rotation.z = rotationZ;
  return mesh;
}

// ── Helper: create sphere ──────────────────────────────────────────
function createSphere(radius, material, x, y, z, rotationX = 0, rotationY = 0, rotationZ = 0) {
  const geo = new THREE.SphereGeometry(radius, 8, 8);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.rotation.x = rotationX;
  mesh.rotation.y = rotationY;
  mesh.rotation.z = rotationZ;
  return mesh;
}

// ── Helper: create plane ───────────────────────────────────────────
function createPlane(width, depth, material, x, y, z, rotationX = 0, rotationY = 0, rotationZ = 0) {
  const geo = new THREE.PlaneGeometry(width, depth, 4, 4);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.rotation.x = rotationX;
  mesh.rotation.y = rotationY;
  mesh.rotation.z = rotationZ;
  return mesh;
}

// ── Helper: create box with custom geometry ────────────────────────
function createBoxCustom(w, h, d, material, x, y, z, rotationX = 0, rotationY = 0, rotationZ = 0) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.rotation.x = rotationX;
  mesh.rotation.y = rotationY;
  mesh.rotation.z = rotationZ;
  return mesh;
}

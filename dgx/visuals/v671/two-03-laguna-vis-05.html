<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Humanoid Animation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from './three.module.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);
        camera.lookAt(0, 1, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Ground (treadmill style)
        const groundGeometry = new THREE.BoxGeometry(10, 0.2, 4);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.position.y = -0.1;
        scene.add(ground);

        // Humanoid figure (low-poly)
        const humanoid = new THREE.Group();

        // Head
        const headGeometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
        const headMaterial = new THREE.MeshLambertMaterial({ color: 0xffd700 });
        const head = new THREE.Mesh(headGeometry, headMaterial);
        head.position.y = 1.7;
        humanoid.add(head);

        // Torso
        const torsoGeometry = new THREE.BoxGeometry(0.5, 1, 0.3);
        const torsoMaterial = new THREE.MeshLambertMaterial({ color: 0x0000ff });
        const torso = new THREE.Mesh(torsoGeometry, torsoMaterial);
        torso.position.y = 1.2;
        humanoid.add(torso);

        // Arms
        const armGeometry = new THREE.BoxGeometry(0.2, 0.7, 0.2);
        const armMaterial = new THREE.MeshLambertMaterial({ color: 0x0000ff });

        const leftArm = new THREE.Mesh(armGeometry, armMaterial);
        leftArm.position.set(-0.45, 1.2, 0);
        humanoid.add(leftArm);

        const rightArm = new THREE.Mesh(armGeometry, armMaterial);
        rightArm.position.set(0.45, 1.2, 0);
        humanoid.add(rightArm);

        // Legs
        const legGeometry = new THREE.BoxGeometry(0.25, 0.9, 0.25);
        const legMaterial = new THREE.MeshLambertMaterial({ color: 0x00ff00 });

        const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
        leftLeg.position.set(-0.175, 0.45, 0);
        humanoid.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
        rightLeg.position.set(0.175, 0.45, 0);
        humanoid.add(rightLeg);

        scene.add(humanoid);

        // Animation parameters
        let startTime = Date.now();

        function getAnimationState(time) {
            const cycleTime = time % 10; // 10-second cycle

            if (cycleTime < 2) {
                // Standing still
                return { state: 'standing', progress: 0 };
            } else if (cycleTime < 5) {
                // Walking
                return { state: 'walking', progress: (cycleTime - 2) / 3 };
            } else if (cycleTime < 8) {
                // Running
                return { state: 'running', progress: (cycleTime - 5) / 3 };
            } else {
                // Standing still
                return { state: 'standing', progress: 0 };
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = (Date.now() - startTime) / 1000;
            const anim = getAnimationState(elapsed);

            // Reset all rotations
            leftArm.rotation.x = 0;
            rightArm.rotation.x = 0;
            leftLeg.rotation.x = 0;
            rightLeg.rotation.x = 0;
            torso.rotation.x = 0;

            if (anim.state === 'walking') {
                // Walking animation - moderate swings
                const swingAmount = Math.sin(anim.progress * Math.PI * 2) * 0.3;

                leftArm.rotation.x = swingAmount;
                rightArm.rotation.x = -swingAmount;
                leftLeg.rotation.x = -swingAmount * 0.8;
                rightLeg.rotation.x = swingAmount * 0.8;
            } else if (anim.state === 'running') {
                // Running animation - faster, larger swings with forward lean
                const swingAmount = Math.sin(anim.progress * Math.PI * 2) * 0.6;

                leftArm.rotation.x = swingAmount;
                rightArm.rotation.x = -swingAmount;
                leftLeg.rotation.x = -swingAmount * 1.2;
                rightLeg.rotation.x = swingAmount * 1.2;

                // Forward lean
                torso.rotation.x = 0.2;
            }

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

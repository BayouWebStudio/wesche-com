<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Race</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Red vs Blue - Infinite Race</div>
    <script type="importmap">
    {
        "imports": {
            "three": "./three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 20);
        camera.lookAt(0, 0, -30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        scene.add(dirLight);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(200, 400);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.z = -100;
        ground.receiveShadow = true;
        scene.add(ground);

        // Track markings
        const markingGeo = new THREE.PlaneGeometry(0.5, 2);
        const markingMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        for (let i = 0; i < 100; i++) {
            const marking = new THREE.Mesh(markingGeo, markingMat);
            marking.rotation.x = -Math.PI / 2;
            marking.position.set(0, 0.01, -i * 4 + 50);
            scene.add(marking);
        }

        // Sky
        const skyGeo = new THREE.SphereGeometry(200, 32, 32);
        const skyMat = new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide });
        const sky = new THREE.Mesh(skyGeo, skyMat);
        scene.add(sky);

        // Finish line
        const finishGeo = new THREE.PlaneGeometry(20, 4);
        const finishMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const finishLine = new THREE.Mesh(finishGeo, finishMat);
        finishLine.rotation.x = -Math.PI / 2;
        finishLine.position.set(0, 0.02, -60);
        scene.add(finishLine);

        // Checkered pattern for finish line
        const checkSize = 0.5;
        const checkGeo = new THREE.PlaneGeometry(checkSize, checkSize);
        for (let x = -19; x <= 19; x += checkSize * 2) {
            for (let y = 0; y < 4; y += checkSize * 2) {
                const checkMat = new THREE.MeshStandardMaterial({
                    color: ((x / checkSize + y / checkSize) % 2 === 0) ? 0xffffff : 0x000000
                });
                const check = new THREE.Mesh(checkGeo, checkMat);
                check.rotation.x = -Math.PI / 2;
                check.position.set(x + checkSize / 2, 0.03, -60 + y - 2);
                scene.add(check);
            }
        }

        // Car creation function
        function createCar(color, xPos) {
            const carGroup = new THREE.Group();

            // Car body
            const bodyGeo = new THREE.BoxGeometry(1.5, 0.6, 3);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.3, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            carGroup.add(body);

            // Car top
            const topGeo = new THREE.BoxGeometry(1.2, 0.5, 1.5);
            const topMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.3, roughness: 0.4 });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.y = 1.1;
            top.position.z = -0.3;
            top.castShadow = true;
            carGroup.add(top);

            // Windows
            const windowGeo = new THREE.BoxGeometry(1.1, 0.4, 1.4);
            const windowMat = new THREE.MeshStandardMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.7 });
            const windowMesh = new THREE.Mesh(windowGeo, windowMat);
            windowMesh.position.y = 1.1;
            windowMesh.position.z = -0.3;
            carGroup.add(windowMesh);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const wheelPositions = [
                { x: 0.8, y: 0.3, z: 1 },
                { x: -0.8, y: 0.3, z: 1 },
                { x: 0.8, y: 0.3, z: -1 },
                { x: -0.8, y: 0.3, z: -1 }
            ];
            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos.x, pos.y, pos.z);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            // Headlights
            const headlightGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0xffffaa, emissiveIntensity: 0.5 });
            const headlight1 = new THREE.Mesh(headlightGeo, headlightMat);
            headlight1.position.set(0.4, 0.5, 1.5);
            carGroup.add(headlight1);
            const headlight2 = new THREE.Mesh(headlightGeo, headlightMat);
            headlight2.position.set(-0.4, 0.5, 1.5);
            carGroup.add(headlight2);

            // Tail lights
            const tailMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.3 });
            const tail1 = new THREE.Mesh(headlightGeo, tailMat);
            tail1.position.set(0.4, 0.5, -1.5);
            carGroup.add(tail1);
            const tail2 = new THREE.Mesh(headlightGeo, tailMat);
            tail2.position.set(-0.4, 0.5, -1.5);
            carGroup.add(tail2);

            carGroup.position.x = xPos;
            return carGroup;
        }

        // Create cars
        const redCar = createCar(0xff0000, -5);
        const blueCar = createCar(0x0000ff, 5);
        scene.add(redCar);
        scene.add(blueCar);

        // Race parameters
        const finishLineZ = -60;
        const startZ = 50;
        let raceTime = 0;
        let raceFinished = false;
        let resetTimer = 0;
        const raceDuration = 8; // seconds for full race cycle

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            raceTime += 0.016; // ~60fps

            // Reset race if finished
            if (raceFinished) {
                resetTimer += 0.016;
                if (resetTimer > 2) { // 2 second pause before reset
                    raceTime = 0;
                    raceFinished = false;
                    resetTimer = 0;
                    redCar.position.z = startZ;
                    blueCar.position.z = startZ;
                    redCar.rotation.y = 0;
                    blueCar.rotation.y = 0;
                }
            }

            if (!raceFinished) {
                // Blue car: starts fast, then maintains speed
                let blueSpeed = 12 + Math.sin(raceTime * 0.5) * 2;
                if (raceTime > 2) blueSpeed = 10;

                // Red car: starts slow, accelerates
                let redSpeed = 8 + raceTime * 1.5;
                if (raceTime > 4) redSpeed = 14;

                // Update positions
                blueCar.position.z -= blueSpeed * 0.016;
                redCar.position.z -= redSpeed * 0.016;

                // Add slight steering wobble
                blueCar.rotation.y = Math.sin(raceTime * 2) * 0.05;
                redCar.rotation.y = Math.cos(raceTime * 2.2) * 0.05;

                // Check if red car wins (crosses finish line first)
                if (redCar.position.z <= finishLineZ && !raceFinished) {
                    raceFinished = true;
                }

                // Keep cars from going too far
                if (blueCar.position.z < finishLineZ - 20) blueCar.position.z = startZ;
                if (redCar.position.z < finishLineZ - 20) redCar.position.z = startZ;
            }

            // Camera follows the action
            const targetZ = (redCar.position.z + blueCar.position.z) / 2;
            camera.position.z = targetZ + 20;
            camera.lookAt(0, 0, targetZ);

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Race Animation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from './three.module.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue

        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ground
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x228B22 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Track
        const trackGeometry = new THREE.PlaneGeometry(16, 0.5);
        const trackMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
        const track = new THREE.Mesh(trackGeometry, trackMaterial);
        track.position.y = 0.01;
        track.rotation.x = -Math.PI / 2;
        scene.add(track);

        // Finish line
        const finishGeometry = new THREE.PlaneGeometry(0.1, 1);
        const finishMaterial = new THREE.MeshPhongMaterial({
            color: 0xffffff,
            map: new THREE.CanvasTexture(createCheckerTexture())
        });
        const finishLine = new THREE.Mesh(finishGeometry, finishMaterial);
        finishLine.position.set(7.5, 0.02, 0);
        finishLine.rotation.x = -Math.PI / 2;
        scene.add(finishLine);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Cars
        const carGeometry = new THREE.BoxGeometry(0.5, 0.3, 1);
        const redCarMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
        const blueCarMaterial = new THREE.MeshPhongMaterial({ color: 0x0000ff });

        const redCar = new THREE.Mesh(carGeometry, redCarMaterial);
        const blueCar = new THREE.Mesh(carGeometry, blueCarMaterial);

        redCar.position.set(-8, 0.15, 0);
        blueCar.position.set(-8, 0.15, 0.6);

        scene.add(redCar);
        scene.add(blueCar);

        // Animation variables
        let raceProgress = 0;
        const raceDuration = 8; // seconds
        const resetPosition = -8;
        const finishPosition = 8;

        function createCheckerTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 32, 64);
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(32, 0, 32, 64);

            return canvas;
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = (performance.now() % (raceDuration * 1000)) / 1000;
            const t = elapsed / raceDuration;

            // Blue car leads early (constant speed)
            const blueZ = THREE.MathUtils.lerp(resetPosition, finishPosition, t * 0.8);

            // Red car accelerates, overtakes mid-race
            let redProgress;
            if (t < 0.5) {
                redProgress = t * 0.6; // Slower start
            } else {
                redProgress = 0.3 + (t - 0.5) * 1.4; // Faster acceleration
            }
            const redZ = THREE.MathUtils.lerp(resetPosition, finishPosition, Math.min(redProgress, 1));

            blueCar.position.z = blueZ;
            redCar.position.z = redZ;

            // Reset when red car finishes
            if (redZ >= finishPosition - 0.1) {
                blueCar.position.z = resetPosition;
                redCar.position.z = resetPosition;
            }

            // Camera follows both cars
            const centerZ = (blueZ + redZ) / 2;
            camera.position.z = centerZ + 5;
            camera.lookAt(0, 0, centerZ);

            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

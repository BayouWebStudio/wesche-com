<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="space"></canvas>
<script>
(() => {
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, cx = 0, cy = 0, scale = 1, dpr = 1;
  let stars = [];

  // Planet definitions — radii are relative; speeds are angular (rad/frame at 60fps baseline)
  const planets = [
    { name: 'Mercury', color: '#b8a48a', light: '#e8d8b8', radius: 4,  orbit: 0.10, speed: 0.0240, tilt: 0.05 },
    { name: 'Venus',   color: '#e6b06a', light: '#f7d49a', radius: 7,  orbit: 0.16, speed: 0.0175, tilt: 0.08 },
    { name: 'Earth',   color: '#3a78c2', light: '#7fb4e8', radius: 8,  orbit: 0.23, speed: 0.0130, tilt: 0.12, hasMoon: true },
    { name: 'Mars',    color: '#c1502c', light: '#e8835a', radius: 6,  orbit: 0.30, speed: 0.0098, tilt: 0.10 },
    { name: 'Jupiter', color: '#c9a06a', light: '#e8c896', radius: 18, orbit: 0.43, speed: 0.0052, tilt: 0.06, bands: true },
    { name: 'Saturn',  color: '#d8c089', light: '#f0d8a8', radius: 15, orbit: 0.56, speed: 0.0036, tilt: 0.20, hasRings: true },
    { name: 'Uranus',  color: '#8fd6e0', light: '#b8e8f0', radius: 11, orbit: 0.70, speed: 0.0024, tilt: 0.15 },
    { name: 'Neptune', color: '#3a5fb8', light: '#6f8fd8', radius: 11, orbit: 0.84, speed: 0.0018, tilt: 0.18 }
  ];

  // Pre-assign starting angles so planets don't line up
  planets.forEach((p, i) => { p.angle = (i * 1.37) % (Math.PI * 2); });

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
    // Scale so Neptune's orbit fits within ~42% of the smaller viewport dimension
    scale = Math.min(W, H) * 0.42;
    buildStars();
  }

  function buildStars() {
    stars = [];
    const count = Math.floor((W * H) / 2200);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.2,
        a: Math.random() * 0.7 + 0.2,
        twinkle: Math.random() * 0.04 + 0.005,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  window.addEventListener('resize', resize);
  resize();

  let frame = 0;

  function drawStars() {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const a = s.a + Math.sin(frame * s.twinkle + s.phase) * 0.25;
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSun() {
    const t = frame * 0.015;
    const pulse = 1 + Math.sin(t) * 0.04;
    const r = Math.max(1, 30 * pulse);

    // Outer corona — layered radial gradients
    for (let i = 4; i >= 1; i--) {
      const rr = Math.max(1, r * (i * 2.2));
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
      g.addColorStop(0, `rgba(255, 180, 70, ${0.10 / i})`);
      g.addColorStop(0.5, `rgba(255, 120, 40, ${0.05 / i})`);
      g.addColorStop(1, 'rgba(255, 80, 20, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Sun body
    const core = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, 0, cx, cy, r);
    core.addColorStop(0, '#fff8d8');
    core.addColorStop(0.35, '#ffd860');
    core.addColorStop(0.75, '#ff8a20');
    core.addColorStop(1, '#d84010');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    // Surface flicker spots
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const ang = t * 0.5 + i * 1.25;
      const sx = cx + Math.cos(ang) * r * 0.5;
      const sy = cy + Math.sin(ang) * r * 0.5;
      const sr = Math.max(1, r * 0.35);
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      g.addColorStop(0, 'rgba(255, 240, 180, 0.5)');
      g.addColorStop(1, 'rgba(255, 240, 180, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawOrbit(radius) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();
  }

  function drawPlanet(p) {
    const orbitR = Math.max(1, p.orbit * scale);
    // Tilted orbit: compress y by cos(tilt)
    const yScale = Math.cos(p.tilt);
    const px = cx + Math.cos(p.angle) * orbitR;
    const py = cy + Math.sin(p.angle) * orbitR * yScale;

    // Soft glow
    const glowR = Math.max(1, p.radius * 2.4);
    const glow = ctx.createRadialGradient(px, py, 0, px, py, glowR);
    glow.addColorStop(0, hexToRgba(p.light, 0.35));
    glow.addColorStop(1, hexToRgba(p.light, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(px, py, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Saturn rings (behind planet body for the back half)
    if (p.hasRings) {
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(-0.4);
      ctx.scale(1, 0.32);
      ctx.strokeStyle = 'rgba(220, 200, 150, 0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, p.radius * 1.8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(200, 180, 130, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(0, 0, p.radius * 2.2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Planet body with light-from-sun shading
    const dirX = cx - px;
    const dirY = cy - py;
    const dist = Math.max(0.001, Math.sqrt(dirX * dirX + dirY * dirY));
    const lx = px + (dirX / dist) * p.radius * 0.4;
    const ly = py + (dirY / dist) * p.radius * 0.4;

    const body = ctx.createRadialGradient(lx, ly, 0, px, py, Math.max(1, p.radius));
    body.addColorStop(0, p.light);
    body.addColorStop(0.6, p.color);
    body.addColorStop(1, darken(p.color, 0.45));
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(px, py, p.radius, 0, Math.PI * 2);
    ctx.fill();

    // Jupiter bands
    if (p.bands) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(px, py, p.radius, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = 'rgba(120, 80, 40, 0.35)';
      ctx.lineWidth = 1.5;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(px - p.radius, py + i * p.radius * 0.35);
        ctx.lineTo(px + p.radius, py + i * p.radius * 0.35);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Earth's Moon
    if (p.hasMoon) {
      const moonAngle = frame * 0.05;
      const moonOrbit = p.radius + 8;
      const mx = px + Math.cos(moonAngle) * moonOrbit;
      const my = py + Math.sin(moonAngle) * moonOrbit * 0.6;
      ctx.fillStyle = '#cfcfcf';
      ctx.beginPath();
      ctx.arc(mx, my, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Color helpers
  function hexToRgba(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function darken(hex, factor) {
    const h = hex.replace('#', '');
    const r = Math.floor(parseInt(h.substring(0, 2), 16) * (1 - factor));
    const g = Math.floor(parseInt(h.substring(2, 4), 16) * (1 - factor));
    const b = Math.floor(parseInt(h.substring(4, 6), 16) * (1 - factor));
    return `rgb(${r},${g},${b})`;
  }

  function loop() {
    frame++;

    // Background — slight trail for subtle motion blur on stars
    ctx.fillStyle = '#04060d';
    ctx.fillRect(0, 0, W, H);

    drawStars();

    // Orbits
    for (let i = 0; i < planets.length; i++) {
      drawOrbit(planets[i].orbit * scale);
    }

    drawSun();

    // Update + draw planets (sorted by orbit so outer planets draw on top is unnecessary — they don't overlap)
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      p.angle += p.speed;
      drawPlanet(p);
    }

    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>

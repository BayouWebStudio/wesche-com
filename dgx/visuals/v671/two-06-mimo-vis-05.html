<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Humanoid Treadmill Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">Animation Cycle: Stand (2s) -> Walk (3s) -> Run (3s) -> Stand (2s)</div>

    <script type="module">
        import * as THREE from './three.module.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 8);
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.5);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // --- Materials ---
        const skinMaterial = new THREE.MeshLambertMaterial({ color: 0xfca07a });
        const shirtMaterial = new THREE.MeshLambertMaterial({ color: 0x3498db });
        const pantsMaterial = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
        const shoeMaterial = new THREE.MeshLambertMaterial({ color: 0xe74c3c });

        // --- Helper Function: Low Poly Box ---
        function createBox(w, h, d, material) {
            const geo = new THREE.BoxGeometry(w, h, d);
            return new THREE.Mesh(geo, material);
        }

        // --- Build Humanoid Figure ---
        const figureGroup = new THREE.Group();
        scene.add(figureGroup);

        // Torso
        const torso = createBox(0.5, 0.6, 0.3, shirtMaterial);
        torso.position.y = 1.4;
        figureGroup.add(torso);

        // Head
        const head = createBox(0.3, 0.3, 0.3, skinMaterial);
        head.position.y = 1.85;
        figureGroup.add(head);

        // Neck
        const neck = createBox(0.1, 0.1, 0.1, skinMaterial);
        neck.position.y = 1.65;
        figureGroup.add(neck);

        // Arms
        const armGeo = new THREE.BoxGeometry(0.12, 0.5, 0.12);

        const leftArmPivot = new THREE.Group();
        leftArmPivot.position.set(-0.35, 1.5, 0);
        const leftArm = new THREE.Mesh(armGeo, skinMaterial);
        leftArm.position.y = -0.25;
        leftArmPivot.add(leftArm);
        figureGroup.add(leftArmPivot);

        const rightArmPivot = new THREE.Group();
        rightArmPivot.position.set(0.35, 1.5, 0);
        const rightArm = new THREE.Mesh(armGeo, skinMaterial);
        rightArm.position.y = -0.25;
        rightArmPivot.add(rightArm);
        figureGroup.add(rightArmPivot);

        // Legs
        const legGeo = new THREE.BoxGeometry(0.15, 0.5, 0.15);
        const shoeGeo = new THREE.BoxGeometry(0.15, 0.1, 0.25);

        const leftLegPivot = new THREE.Group();
        leftLegPivot.position.set(-0.12, 1.1, 0);
        const leftLeg = new THREE.Mesh(legGeo, pantsMaterial);
        leftLeg.position.y = -0.25;
        leftLegPivot.add(leftLeg);
        const leftShoe = new THREE.Mesh(shoeGeo, shoeMaterial);
        leftShoe.position.set(0, -0.5, 0.05);
        leftLegPivot.add(leftShoe);
        figureGroup.add(leftLegPivot);

        const rightLegPivot = new THREE.Group();
        rightLegPivot.position.set(0.12, 1.1, 0);
        const rightLeg = new THREE.Mesh(legGeo, pantsMaterial);
        rightLeg.position.y = -0.25;
        rightLegPivot.add(rightLeg);
        const rightShoe = new THREE.Mesh(shoeGeo, shoeMaterial);
        rightShoe.position.set(0, -0.5, 0.05);
        rightLegPivot.add(rightShoe);
        figureGroup.add(rightLegPivot);

        // --- Ground (Treadmill Style) ---
        const groundGeo = new THREE.PlaneGeometry(20, 10);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x333333,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Treadmill belt lines
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
        for(let i = -5; i <= 5; i++) {
            const line = createBox(0.02, 0.01, 10, lineMat);
            line.position.set(i * 2, 0.005, 0);
            scene.add(line);
        }

        // Side rails
        const railMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
        const leftRail = createBox(0.1, 0.1, 10, railMat);
        leftRail.position.set(-1.5, 0.5, 0);
        scene.add(leftRail);
        const rightRail = createBox(0.1, 0.1, 10, railMat);
        rightRail.position.set(1.5, 0.5, 0);
        scene.add(rightRail);

        // --- Animation State Machine ---
        // Cycle: Stand(2s) -> Walk(3s) -> Run(3s) -> Stand(2s)
        const CYCLE_DURATION = 10;
        const STATES = {
            STAND_1: { start: 0, end: 2 },
            WALK: { start: 2, end: 5 },
            RUN: { start: 5, end: 8 },
            STAND_2: { start: 8, end: 10 }
        };

        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const deltaTime = (now - prevTime) / 1000;
            prevTime = now;

            const time = (now / 1000) % CYCLE_DURATION;

            // Determine current state
            let state = 'STAND_1';
            let stateProgress = 0;

            if (time >= STATES.STAND_1.start && time < STATES.STAND_1.end) {
                state = 'STAND_1';
                stateProgress = (time - STATES.STAND_1.start) / (STATES.STAND_1.end - STATES.STAND_1.start);
            } else if (time >= STATES.WALK.start && time < STATES.WALK.end) {
                state = 'WALK';
                stateProgress = (time - STATES.WALK.start) / (STATES.WALK.end - STATES.WALK.start);
            } else if (time >= STATES.RUN.start && time < STATES.RUN.end) {
                state = 'RUN';
                stateProgress = (time - STATES.RUN.start) / (STATES.RUN.end - STATES.RUN.start);
            } else if (time >= STATES.STAND_2.start && time < STATES.STAND_2.end) {
                state = 'STAND_2';
                stateProgress = (time - STATES.STAND_2.start) / (STATES.STAND_2.end - STATES.STAND_2.start);
            }

            // Smooth transitions
            let walkAmount = 0;
            let runAmount = 0;
            let standAmount = 1;

            const transitionDuration = 0.3; // seconds

            if (state === 'STAND_1') {
                if (stateProgress > (1 - transitionDuration/2)) {
                    // Transitioning to walk
                    const t = (stateProgress - (1 - transitionDuration/2)) / (transitionDuration/2);
                    walkAmount = smoothStep(t);
                    standAmount = 1 - walkAmount;
                } else {
                    walkAmount = 0;
                    standAmount = 1;
                }
            } else if (state === 'WALK') {
                if (stateProgress < transitionDuration/2) {
                    // Coming from stand
                    const t = stateProgress / (transitionDuration/2);
                    walkAmount = smoothStep(t);
                    standAmount = 1 - walkAmount;
                } else if (stateProgress > (1 - transitionDuration/2)) {
                    // Transitioning to run
                    const t = (stateProgress - (1 - transitionDuration/2)) / (transitionDuration/2);
                    runAmount = smoothStep(t);
                    walkAmount = 1 - runAmount;
                } else {
                    walkAmount = 1;
                    standAmount = 0;
                    runAmount = 0;
                }
            } else if (state === 'RUN') {
                if (stateProgress < transitionDuration/2) {
                    // Coming from walk
                    const t = stateProgress / (transitionDuration/2);
                    runAmount = smoothStep(t);
                    walkAmount = 1 - runAmount;
                } else if (stateProgress > (1 - transitionDuration/2)) {
                    // Transitioning to stand
                    const t = (stateProgress - (1 - transitionDuration/2)) / (transitionDuration/2);
                    standAmount = smoothStep(t);
                    runAmount = 1 - standAmount;
                } else {
                    runAmount = 1;
                    walkAmount = 0;
                    standAmount = 0;
                }
            } else if (state === 'STAND_2') {
                if (stateProgress < transitionDuration/2) {
                    // Coming from run
                    const t = stateProgress / (transitionDuration/2);
                    standAmount = smoothStep(t);
                    runAmount = 1 - standAmount;
                } else {
                    standAmount = 1;
                    walkAmount = 0;
                    runAmount = 0;
                }
            }

            // Calculate animations
            const walkSpeed = 3; // cycles per second
            const runSpeed = 6; // cycles per second

            const walkAngle = Math.sin(now * 0.001 * walkSpeed * Math.PI * 2) * 0.5;
            const runAngle = Math.sin(now * 0.001 * runSpeed * Math.PI * 2) * 0.8;

            const walkBounce = Math.abs(Math.sin(now * 0.001 * walkSpeed * Math.PI * 2)) * 0.05;
            const runBounce = Math.abs(Math.sin(now * 0.001 * runSpeed * Math.PI * 2)) * 0.15;

            // Apply animations with blending
            const totalBounce = walkBounce * walkAmount + runBounce * runAmount;
            figureGroup.position.y = totalBounce;

            // Forward lean for running
            const leanAmount = runAmount * 0.15;
            figureGroup.rotation.x = leanAmount;

            // Arm swing
            leftArmPivot.rotation.x = (walkAngle * walkAmount + runAngle * runAmount);
            rightArmPivot.rotation.x = -(walkAngle * walkAmount + runAngle * runAmount);

            // Leg swing
            leftLegPivot.rotation.x = -(walkAngle * walkAmount + runAngle * runAmount);
            rightLegPivot.rotation.x = (walkAngle * walkAmount + runAngle * runAmount);

            // Subtle torso rotation
            torso.rotation.y = (walkAngle * walkAmount + runAngle * runAmount) * 0.1;

            // Update treadmill ground texture offset
            const speed = walkAmount * 2 + runAmount * 4;
            ground.material.map && (ground.material.map.offset.y += speed * deltaTime);

            // Render
            renderer.render(scene, camera);
        }

        // Smooth step function for transitions
        function smoothStep(t) {
            return t * t * (3 - 2 * t);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>

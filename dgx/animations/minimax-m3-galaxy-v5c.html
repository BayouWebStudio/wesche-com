<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spiral Galaxy</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="galaxy"></canvas>
<script>
(function () {
  const canvas = document.getElementById('galaxy');
  const ctx = canvas.getContext('2d');

  let width, height, cx, cy;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = width / 2;
    cy = height / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  // Galaxy parameters
  const NUM_ARMS = 4;
  const STARS_PER_ARM = 150;
  const CORE_STARS = 200;
  const TOTAL_STARS = NUM_ARMS * STARS_PER_ARM + CORE_STARS;

  // Color palettes for stars (subtle variation)
  // Warm yellows, oranges, blues, whites
  const starColors = [
    { r: 255, g: 240, b: 200 }, // warm white
    { r: 255, g: 220, b: 160 }, // pale yellow
    { r: 255, g: 200, b: 130 }, // golden
    { r: 255, g: 170, b: 120 }, // orange
    { r: 220, g: 200, b: 255 }, // bluish white
    { r: 180, g: 200, b: 255 }, // light blue
    { r: 230, g: 230, b: 255 }, // white
  ];

  function pickColor() {
    return starColors[(Math.random() * starColors.length) | 0];
  }

  // Star class
  class Star {
    constructor(radius, angle, armOffset, isCore) {
      this.baseRadius = radius;
      this.radius = radius;
      this.angle = angle;
      this.armOffset = armOffset;
      this.isCore = isCore;

      // Orbital speed: inner stars move faster (Keplerian-ish)
      this.speed = isCore ? (Math.random() * 0.002 + 0.001) : (0.015 / Math.sqrt(radius * 0.05 + 1));

      // Vertical thickness (galaxy is thin disk)
      this.thickness = isCore ? radius * 0.15 : radius * 0.08;
      this.z = (Math.random() - 0.5) * this.thickness;

      // Size
      this.size = isCore
        ? Math.random() * 1.2 + 0.5
        : Math.random() * 1.8 + 0.4;

      // Color
      const c = pickColor();
      this.r = c.r;
      this.g = c.g;
      this.b = c.b;

      // Twinkle
      this.twinkleSpeed = Math.random() * 0.02 + 0.005;
      this.twinklePhase = Math.random() * Math.PI * 2;
      this.baseAlpha = isCore
        ? Math.random() * 0.4 + 0.6
        : Math.random() * 0.5 + 0.5;

      // Slight radial drift for organic feel
      this.drift = (Math.random() - 0.5) * 0.002;
    }

    update(time) {
      this.angle += this.speed;
      this.radius += this.drift;

      // Keep stars within bounds
      if (this.radius < 5) this.radius = 5;
      if (this.radius > Math.min(width, height) * 0.6) {
        this.radius = Math.min(width, height) * 0.6;
      }

      // Twinkle
      this.twinkle = Math.sin(time * this.twinkleSpeed + this.twinklePhase) * 0.3 + 0.7;
    }

    draw(ctx, time) {
      const x = cx + Math.cos(this.angle + this.armOffset) * this.radius;
      const y = cy + Math.sin(this.angle + this.armOffset) * this.radius * 0.6 + this.z; // squashed for perspective

      const alpha = this.baseAlpha * this.twinkle;
      const size = this.size * (0.7 + this.twinkle * 0.3);

      // Glow
      const glowSize = size * 3;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, glowSize);
      grad.addColorStop(0, `rgba(${this.r}, ${this.g}, ${this.b}, ${alpha})`);
      grad.addColorStop(0.4, `rgba(${this.r}, ${this.g}, ${this.b}, ${alpha * 0.3})`);
      grad.addColorStop(1, `rgba(${this.r}, ${this.g}, ${this.b}, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, glowSize, 0, Math.PI * 2);
      ctx.fill();

      // Core pixel
      ctx.fillStyle = `rgba(${Math.min(255, this.r + 30)}, ${Math.min(255, this.g + 30)}, ${Math.min(255, this.b + 30)}, ${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Create stars
  const stars = [];
  const maxRadius = Math.min(width, height) * 0.5;

  // Core stars
  for (let i = 0; i < CORE_STARS; i++) {
    const r = Math.random() * 25;
    const a = Math.random() * Math.PI * 2;
    stars.push(new Star(r, a, 0, true));
  }

  // Spiral arm stars
  for (let arm = 0; arm < NUM_ARMS; arm++) {
    const armOffset = (arm / NUM_ARMS) * Math.PI * 2;
    for (let i = 0; i < STARS_PER_ARM; i++) {
      // Distance along arm (logarithmic-ish spiral)
      const t = i / STARS_PER_ARM;
      const radius = 20 + Math.pow(t, 1.5) * (maxRadius - 20);
      // Spread angle around arm
      const spread = (Math.random() - 0.5) * 0.6;
      // Spiral winding: angle increases with radius
      const spiralAngle = (radius / maxRadius) * Math.PI * 2.5;
      const angle = spiralAngle + spread + (Math.random() - 0.5) * 0.3;
      stars.push(new Star(radius, angle, armOffset, false));
    }
  }

  // Background nebula dust
  const dustParticles = [];
  const NUM_DUST = 120;
  for (let i = 0; i < NUM_DUST; i++) {
    dustParticles.push({
      angle: Math.random() * Math.PI * 2,
      radius: Math.random() * maxRadius * 0.8 + 20,
      speed: 0.003 / Math.sqrt(Math.random() * maxRadius * 0.05 + 1),
      size: Math.random() * 40 + 20,
      hue: Math.random() > 0.5 ? 30 : 220, // orange or blue nebula
      alpha: Math.random() * 0.04 + 0.02,
      armOffset: (Math.floor(Math.random() * NUM_ARMS) / NUM_ARMS) * Math.PI * 2,
    });
  }

  function drawCore(time) {
    // Bright glowing core
    const pulse = Math.sin(time * 0.001) * 0.1 + 0.9;
    const coreSize = 40 * pulse;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreSize * 3);
    grad.addColorStop(0, 'rgba(255, 245, 220, 1)');
    grad.addColorStop(0.2, 'rgba(255, 220, 170, 0.8)');
    grad.addColorStop(0.5, 'rgba(255, 180, 120, 0.3)');
    grad.addColorStop(1, 'rgba(255, 150, 100, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, coreSize * 3, 0, Math.PI * 2);
    ctx.fill();

    // Inner bright dot
    ctx.fillStyle = 'rgba(255, 255, 240, 1)';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDust(time) {
    for (const d of dustParticles) {
      d.angle += d.speed;
      const x = cx + Math.cos(d.angle + d.armOffset) * d.radius;
      const y = cy + Math.sin(d.angle + d.armOffset) * d.radius * 0.6;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, d.size);
      grad.addColorStop(0, `hsla(${d.hue}, 60%, 60%, ${d.alpha})`);
      grad.addColorStop(1, `hsla(${d.hue}, 60%, 60%, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, d.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function animate(time) {
    // Fade slightly for trails effect (subtle)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, width, height);

    // Draw nebula dust
    drawDust(time);

    // Update and draw stars
    for (const star of stars) {
      star.update(time);
      star.draw(ctx, time);
    }

    // Draw core on top
    drawCore(time);

    requestAnimationFrame(animate);
  }

  // Initial clear
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, width, height);

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Starfield
        const stars = [];
        const numStars = 500;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5,
                alpha: Math.random()
            });
        }

        // Planets
        const planets = [
            { name: 'Mercury', radius: 4, orbitRadius: 60, speed: 0.02, color: '#AAAAAA', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', radius: 7, orbitRadius: 90, speed: 0.015, color: '#FFD700', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', radius: 8, orbitRadius: 130, speed: 0.01, color: '#4169E1', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', radius: 6, orbitRadius: 170, speed: 0.008, color: '#CD5C5C', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', radius: 18, orbitRadius: 240, speed: 0.005, color: '#DAA520', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', radius: 15, orbitRadius: 310, speed: 0.003, color: '#F4A460', angle: Math.random() * Math.PI * 2, hasRings: true }
        ];

        function drawStars() {
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();
            });
        }

        function drawSun() {
            // Glow effect
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
            gradient.addColorStop(0, '#FFFF00');
            gradient.addColorStop(0.5, '#FF8C00');
            gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Core
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fillStyle = '#FFFF00';
            ctx.fill();
        }

        function drawPlanet(planet) {
            const x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
            const y = centerY + Math.sin(planet.angle) * planet.orbitRadius;

            // Orbit path
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.orbitRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.stroke();

            // Saturn's rings
            if (planet.hasRings) {
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 2, planet.radius * 0.5, planet.angle, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(200, 180, 140, 0.6)';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.lineWidth = 1;
            }

            // Planet
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = planet.color;
            ctx.fill();

            // Planet label
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(planet.name, x, y + planet.radius + 15);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Background gradient
            const bgGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) / 2);
            bgGradient.addColorStop(0, '#0a0a1a');
            bgGradient.addColorStop(1, '#000000');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            drawStars();
            drawSun();

            planets.forEach(planet => {
                planet.angle += planet.speed;
                drawPlanet(planet);
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

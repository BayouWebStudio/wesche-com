<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating DNA Double Helix</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>
    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const config = {
            numNodes: 60,
            radius: 150,
            verticalSpacing: 25,
            rotationSpeed: 0.03,
            nodeSize: 5,
            rungWidth: 2,
            perspective: 800
        };

        let rotationOffset = 0;

        function get3DPosition(index, rotation) {
            const y = (index - config.numNodes / 2) * config.verticalSpacing;
            const angle1 = index * 0.2 + rotation;
            const angle2 = index * 0.2 + rotation + Math.PI;
            return [
                { x: Math.cos(angle1) * config.radius, y: y, z: Math.sin(angle1) * config.radius },
                { x: Math.cos(angle2) * config.radius, y: y, z: Math.sin(angle2) * config.radius }
            ];
        }

        function projectTo2D(point3D) {
            const scale = config.perspective / (config.perspective + point3D.z);
            return {
                x: width / 2 + point3D.x * scale,
                y: height / 2 + point3D.y * scale,
                scale: scale
            };
        }

        function drawNode(projected, color) {
            const size = config.nodeSize * projected.scale;
            const glow = ctx.createRadialGradient(projected.x, projected.y, 0, projected.x, projected.y, size * 2);
            glow.addColorStop(0, color);
            glow.addColorStop(1, 'transparent');
            
            ctx.beginPath();
            ctx.arc(projected.x, projected.y, size, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(projected.x, projected.y, size * 2, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();
        }

        function drawStrand(projectedPoints, color) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            
            for (let i = 0; i < projectedPoints.length - 1; i++) {
                const p1 = projectedPoints[i];
                const p2 = projectedPoints[i + 1];
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
            }
            ctx.stroke();
        }

        function drawRung(projected1, projected2, alpha) {
            const gradient = ctx.createLinearGradient(projected1.x, projected1.y, projected2.x, projected2.y);
            gradient.addColorStop(0, `rgba(100, 200, 255, ${alpha})`);
            gradient.addColorStop(0.5, `rgba(200, 255, 200, ${alpha})`);
            gradient.addColorStop(1, `rgba(255, 150, 200, ${alpha})`);
            
            ctx.beginPath();
            ctx.strokeStyle = gradient;
            ctx.lineWidth = config.rungWidth * ((projected1.scale + projected2.scale) / 2);
            ctx.moveTo(projected1.x, projected1.y);
            ctx.lineTo(projected2.x, projected2.y);
            ctx.stroke();
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.3)';
            ctx.fillRect(0, 0, width, height);

            const strand1Points = [];
            const strand2Points = [];
            const rungData = [];

            for (let i = 0; i < config.numNodes; i += 2) {
                const [p1, p2] = get3DPosition(i, rotationOffset);
                const proj1 = projectTo2D(p1);
                const proj2 = projectTo2D(p2);
                
                strand1Points.push(proj1);
                strand2Points.push(proj2);
                
                const avgScale = (proj1.scale + proj2.scale) / 2;
                const alpha = 0.3 + avgScale * 0.7;
                rungData.push({ proj1, proj2, alpha });
            }

            rungData.sort((a, b) => (a.proj1.scale - a.proj2.scale) - (b.proj1.scale - b.proj2.scale));

            for (const rung of rungData) {
                drawRung(rung.proj1, rung.proj2, rung.alpha);
            }

            drawStrand(strand1Points, 'rgba(100, 200, 255, 0.8)');
            drawStrand(strand2Points, 'rgba(255, 150, 200, 0.8)');

            for (const proj of strand1Points) {
                drawNode(proj, 'rgba(150, 230, 255, 0.9)');
            }
            for (const proj of strand2Points) {
                drawNode(proj, 'rgba(255, 180, 220, 0.9)');
            }

            rotationOffset += config.rotationSpeed;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

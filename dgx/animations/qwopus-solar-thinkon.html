<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', () => { resize(); initStars(); });

// Stars
let stars = [];
function initStars() {
  stars = [];
  const count = Math.floor((W * H) / 800);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      brightness: Math.random(),
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinkleOffset: Math.random() * Math.PI * 2
    });
  }
}
initStars();

// Planets
const planets = [
  { name: 'Mercury', radius: 4, orbit: 58, speed: 0.04, color: '#b0b0b0', glow: '#888', angle: Math.random() * Math.PI * 2 },
  { name: 'Venus',   radius: 7, orbit: 90, speed: 0.028, color: '#e8c86a', glow: '#d4a830', angle: Math.random() * Math.PI * 2 },
  { name: 'Earth',   radius: 8, orbit: 130, speed: 0.022, color: '#4a9de5', glow: '#2a6db5', angle: Math.random() * Math.PI * 2 },
  { name: 'Mars',    radius: 5, orbit: 175, speed: 0.018, color: '#d4543a', glow: '#a03020', angle: Math.random() * Math.PI * 2 },
  { name: 'Jupiter', radius: 18, orbit: 250, speed: 0.008, color: '#d4a06a', glow: '#b07840', angle: Math.random() * Math.PI * 2 },
  { name: 'Saturn',  radius: 15, orbit: 330, speed: 0.006, color: '#e0c878', glow: '#c0a050', angle: Math.random() * Math.PI * 2, ring: true },
  { name: 'Uranus',  radius: 11, orbit: 400, speed: 0.004, color: '#7ec8d8', glow: '#50a0b0', angle: Math.random() * Math.PI * 2 },
  { name: 'Neptune', radius: 10, orbit: 460, speed: 0.003, color: '#4060e0', glow: '#2840b0', angle: Math.random() * Math.PI * 2 }
];

// Trail particles
const trails = planets.map(() => []);
const MAX_TRAIL = 60;

function drawStars(time) {
  for (const s of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset);
    const alpha = 0.3 + twinkle * 0.7;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }
}

function drawSun(time) {
  // Outer corona
  const coronaR = 80 + Math.sin(time * 0.001) * 5;
  const corona = ctx.createRadialGradient(cx, cy, 25, cx, cy, coronaR);
  corona.addColorStop(0, 'rgba(255,200,50,0.3)');
  corona.addColorStop(0.5, 'rgba(255,150,20,0.08)');
  corona.addColorStop(1, 'rgba(255,100,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, coronaR, 0, Math.PI * 2);
  ctx.fillStyle = corona;
  ctx.fill();

  // Sun body
  const sunGrad = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, 32);
  sunGrad.addColorStop(0, '#fff8e0');
  sunGrad.addColorStop(0.3, '#ffe44d');
  sunGrad.addColorStop(0.7, '#ff9900');
  sunGrad.addColorStop(1, '#cc5500');
  ctx.beginPath();
  ctx.arc(cx, cy, 32, 0, Math.PI * 2);
  ctx.fillStyle = sunGrad;
  ctx.fill();

  // Sun glow
  const glow = ctx.createRadialGradient(cx, cy, 20, cx, cy, 70);
  glow.addColorStop(0, 'rgba(255,220,100,0.4)');
  glow.addColorStop(0.5, 'rgba(255,160,40,0.1)');
  glow.addColorStop(1, 'rgba(255,100,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, 70, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();
}

function drawOrbit(orbitRadius) {
  ctx.beginPath();
  ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawPlanet(planet, index, time) {
  const px = cx + Math.cos(planet.angle) * planet.orbit;
  const py = cy + Math.sin(planet.angle) * planet.orbit;

  // Trail
  trails[index].push({ x: px, y: py });
  if (trails[index].length > MAX_TRAIL) trails[index].shift();

  if (trails[index].length > 1) {
    for (let i = 1; i < trails[index].length; i++) {
      const alpha = (i / trails[index].length) * 0.3;
      ctx.beginPath();
      ctx.moveTo(trails[index][i - 1].x, trails[index][i - 1].y);
      ctx.lineTo(trails[index][i].x, trails[index][i].y);
      ctx.strokeStyle = planet.color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
      // Simpler approach for hex colors
      const r = parseInt(planet.color.slice(1, 3), 16);
      const g = parseInt(planet.color.slice(3, 5), 16);
      const b = parseInt(planet.color.slice(5, 7), 16);
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = planet.radius * 0.5;
      ctx.stroke();
    }
  }

  // Planet glow
  const glowGrad = ctx.createRadialGradient(px, py, planet.radius * 0.5, px, py, planet.radius * 3);
  glowGrad.addColorStop(0, planet.glow + '40');
  glowGrad.addColorStop(1, planet.glow + '00');
  ctx.beginPath();
  ctx.arc(px, py, planet.radius * 3, 0, Math.PI * 2);
  ctx.fillStyle = glowGrad;
  ctx.fill();

  // Planet body
  const bodyGrad = ctx.createRadialGradient(px - planet.radius * 0.3, py - planet.radius * 0.3, planet.radius * 0.1, px, py, planet.radius);
  bodyGrad.addColorStop(0, '#ffffff');
  bodyGrad.addColorStop(0.3, planet.color);
  bodyGrad.addColorStop(1, planet.glow);
  ctx.beginPath();
  ctx.arc(px, py, planet.radius, 0, Math.PI * 2);
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // Saturn's ring
  if (planet.ring) {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(0.4);
    ctx.scale(1, 0.35);
    ctx.beginPath();
    ctx.arc(0, 0, planet.radius * 2.2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(210,190,140,0.5)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, planet.radius * 1.7, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(180,160,110,0.3)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  // Label
  ctx.font = '10px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.textAlign = 'center';
  ctx.fillText(planet.name, px, py + planet.radius + 14);
}

let lastTime = 0;
function animate(time) {
  const dt = time - lastTime;
  lastTime = time;

  // Clear with slight fade for subtle motion blur
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, W, H);

  // Deep space gradient
  const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  bgGrad.addColorStop(0, 'rgba(15,10,30,0.3)');
  bgGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  drawStars(time);

  // Draw orbits
  for (const p of planets) drawOrbit(p.orbit);

  drawSun(time);

  // Update and draw planets
  for (let i = 0; i < planets.length; i++) {
    planets[i].angle += planets[i].speed * (dt / 16);
    drawPlanet(planets[i], i, time);
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Configuration for the planets
        // Distances and speeds are relative, not realistic scales
        const planets = [
            { name: 'Mercury', radius: 4, distance: 60, speed: 0.02, color: '#A5A5A5' },
            { name: 'Venus',   radius: 7, distance: 90, speed: 0.015, color: '#E3BB76' },
            { name: 'Earth',   radius: 7, distance: 130, speed: 0.01, color: '#22A6F2' },
            { name: 'Mars',    radius: 5, distance: 170, speed: 0.008, color: '#DA4E3C' },
            { name: 'Jupiter', radius: 18, distance: 240, speed: 0.004, color: '#D6A566' },
            { name: 'Saturn',  radius: 15, distance: 310, speed: 0.002, color: '#F4D03F', hasRings: true },
            { name: 'Uranus',  radius: 10, distance: 380, speed: 0.001, color: '#73C6B6' },
            { name: 'Neptune', radius: 10, distance: 440, speed: 0.0008, color: '#3498DB' }
        ];

        // Starfield generation
        const stars = [];
        const starCount = 400;

        function init() {
            resize();
            generateStars();
            animate();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        function generateStars() {
            stars.length = 0;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = '#FFF';
            stars.forEach(star => {
                ctx.globalAlpha = star.alpha;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            // Sun Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
            gradient.addColorStop(0, 'rgba(255, 223, 0, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 165, 0, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 69, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();

            // Sun Core
            ctx.fillStyle = '#FFF';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawOrbit(distance) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanet(planet) {
            const angle = planet.angle;
            const x = centerX + Math.cos(angle) * planet.distance;
            const y = centerY + Math.sin(angle) * planet.distance;

            // Draw Orbit Path
            drawOrbit(planet.distance);

            // Draw Planet Shadow (simple lighting effect)
            // Calculate direction to sun
            const sunAngle = Math.atan2(centerY - y, centerX - x);
            
            ctx.save();
            ctx.translate(x, y);

            // Planet Body
            ctx.beginPath();
            ctx.arc(0, 0, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = planet.color;
            ctx.fill();

            // Shadow overlay to make it look 3D
            const shadowGrad = ctx.createRadialGradient(
                Math.cos(sunAngle) * planet.radius * 0.5, 
                Math.sin(sunAngle) * planet.radius * 0.5, 
                planet.radius * 0.2, 
                0, 0, planet.radius
            );
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0.6)');

            ctx.fillStyle = shadowGrad;
            ctx.beginPath();
            ctx.arc(0, 0, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Saturn Rings
            if (planet.hasRings) {
                ctx.beginPath();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.6)';
                ctx.ellipse(0, 0, planet.radius * 2.2, planet.radius * 0.8, Math.PI / 4, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function animate() {
            // Clear canvas
            ctx.fillStyle = '#050505'; // Very dark background
            ctx.fillRect(0, 0, width, height);

            // Draw Starfield
            drawStars();

            // Draw Sun
            drawSun();

            // Update and Draw Planets
            planets.forEach(planet => {
                planet.angle += planet.speed;
                drawPlanet(planet);
            });

            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            resize();
            // Regenerate stars so they cover the new screen size nicely
            generateStars();
        });

        // Initialize
        init();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="galaxyCanvas"></canvas>

<script>
    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    let stars = [];
    
    // Configuration
    const STAR_COUNT = 1200;
    const ARM_COUNT = 3;
    const ARM_SPREAD = 0.6; // How wide the arms are
    const GALAXY_SIZE_RATIO = 0.4; // Galaxy radius relative to min screen dimension
    const CORE_COLOR = { r: 255, g: 220, b: 180 }; // Warm core
    const ARM_COLOR = { r: 100, g: 150, b: 255 }; // Blue-ish arms
    const BACKGROUND_COLOR = 'rgba(0, 0, 0, 0.2)'; // Trail effect

    // Resize handling
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
    }

    // Star Class
    class Star {
        constructor() {
            this.reset();
        }

        reset() {
            // Distance from center (logarithmic distribution for density)
            this.distance = Math.random() * Math.random() * Math.random() * Math.min(width, height) * GALAXY_SIZE_RATIO;
            
            // Base angle + spiral offset
            // The further out, the more the angle twists
            const twistFactor = 2 + (this.distance / 100); 
            this.angle = Math.random() * Math.PI * 2;
            
            // Add spiral arm structure
            // Calculate which arm this star belongs to
            const armOffset = (Math.PI * 2 / ARM_COUNT) * Math.floor(Math.random() * ARM_COUNT);
            // Calculate spiral curve angle based on distance
            const spiralAngle = (this.distance / 100) * 1.5; 
            
            this.angle += armOffset + spiralAngle;
            
            // Add some randomness to spread stars out of perfect lines
            this.angle += (Math.random() - 0.5) * ARM_SPREAD;

            // Size: Core stars are smaller/denser, outer stars can be larger/brighter
            this.size = Math.random() * 1.5 + 0.5;
            
            // Color mixing
            // Closer to core = warmer (Core Color), further = cooler (Arm Color)
            const maxDist = Math.min(width, height) * GALAXY_SIZE_RATIO;
            const ratio = this.distance / maxDist;
            
            this.r = CORE_COLOR.r + (ARM_COLOR.r - CORE_COLOR.r) * ratio;
            this.g = CORE_COLOR.g + (ARM_COLOR.g - CORE_COLOR.g) * ratio;
            this.b = CORE_COLOR.b + (ARM_COLOR.b - CORE_COLOR.b) * ratio;
            
            // Randomize color slightly for variation
            this.r += (Math.random() - 0.5) * 50;
            this.g += (Math.random() - 0.5) * 50;
            this.b += (Math.random() - 0.5) * 50;
            
            // Clamp colors
            this.r = Math.max(0, Math.min(255, this.r));
            this.g = Math.max(0, Math.min(255, this.g));
            this.b = Math.max(0, Math.min(255, this.b));

            // Rotation speed (Keplerian-ish: closer moves faster)
            // We add a slight randomness so it doesn't look like a solid disk
            this.speed = (0.002 / (this.distance + 10)) * 50; 
            
            // Twinkle properties
            this.twinkleSpeed = Math.random() * 0.05 + 0.01;
            this.twinklePhase = Math.random() * Math.PI * 2;
            this.alpha = Math.random() * 0.5 + 0.5;
        }

        update() {
            // Rotate
            this.angle += this.speed;
            
            // Twinkle effect
            this.twinklePhase += this.twinkleSpeed;
            this.currentAlpha = this.alpha + Math.sin(this.twinklePhase) * 0.3;
            if(this.currentAlpha < 0) this.currentAlpha = 0;
            if(this.currentAlpha > 1) this.currentAlpha = 1;
        }

        draw() {
            const x = centerX + Math.cos(this.angle) * this.distance;
            const y = centerY + Math.sin(this.angle) * this.distance;

            ctx.beginPath();
            ctx.arc(x, y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${Math.floor(this.r)}, ${Math.floor(this.g)}, ${Math.floor(this.b)}, ${this.currentAlpha})`;
            ctx.fill();
        }
    }

    // Initialize
    function init() {
        resize();
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }
    }

    // Animation Loop
    function animate() {
        // Create trails by drawing a semi-transparent black rectangle over the previous frame
        ctx.fillStyle = BACKGROUND_COLOR;
        ctx.fillRect(0, 0, width, height);

        // Draw Core Glow
        const maxDist = Math.min(width, height) * GALAXY_SIZE_RATIO;
        const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxDist * 0.8);
        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.1)');
        gradient.addColorStop(0.1, 'rgba(255, 200, 150, 0.05)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, maxDist, 0, Math.PI * 2);
        ctx.fill();

        // Update and draw stars
        for (let star of stars) {
            star.update();
            star.draw();
        }

        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', () => {
        // Just resize canvas, don't reset stars to keep animation smooth
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
    });

    // Start
    init();
    animate();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            background: #000;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let W, H, cx, cy, scale;

            // ─── Starfield ───────────────────────────────────────────────
            let stars = [];

            function generateStars(count) {
                stars = [];
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random(),
                        y: Math.random(),
                        r: Math.random() * 1.8 + 0.3,
                        a: Math.random() * 0.7 + 0.3,
                        twinkleSpeed: Math.random() * 0.02 + 0.005,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }
            generateStars(400);

            // ─── Planet Data ─────────────────────────────────────────────
            const planetData = [{
                name: 'Mercury',
                orbitRadius: 0.14,
                size: 0.018,
                color: '#b5b5b5',
                speed: 4.15,
                angle: 0
            }, {
                name: 'Venus',
                orbitRadius: 0.20,
                size: 0.026,
                color: '#e8cda0',
                speed: 2.62,
                angle: 1.2
            }, {
                name: 'Earth',
                orbitRadius: 0.27,
                size: 0.028,
                color: '#4b8bcf',
                speed: 2.00,
                angle: 2.8
            }, {
                name: 'Mars',
                orbitRadius: 0.34,
                size: 0.022,
                color: '#c1440e',
                speed: 1.53,
                angle: 4.1
            }, {
                name: 'Jupiter',
                orbitRadius: 0.44,
                size: 0.050,
                color: '#d4a574',
                speed: 0.83,
                angle: 0.5
            }, {
                name: 'Saturn',
                orbitRadius: 0.55,
                size: 0.042,
                color: '#ead6b8',
                speed: 0.62,
                angle: 3.3
            }, {
                name: 'Uranus',
                orbitRadius: 0.66,
                size: 0.034,
                color: '#7ec8e3',
                speed: 0.44,
                angle: 1.8
            }, {
                name: 'Neptune',
                orbitRadius: 0.77,
                size: 0.032,
                color: '#3b5c9c',
                speed: 0.34,
                angle: 5.0
            }];

            // ─── Resize ──────────────────────────────────────────────────
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                cx = W / 2;
                cy = H / 2;
                scale = Math.min(W, H) * 0.55;
            }
            resize();
            window.addEventListener('resize', resize);

            // ─── Draw Starfield ──────────────────────────────────────────
            function drawStars(time) {
                for (const s of stars) {
                    const twinkle = 0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinklePhase);
                    const alpha = s.a * (0.6 + 0.4 * twinkle);
                    ctx.beginPath();
                    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fill();
                }
            }

            // ─── Draw Sun ────────────────────────────────────────────────
            function drawSun(time) {
                const sunRadius = 0.055 * scale;
                const pulse = 1 + 0.015 * Math.sin(time * 0.003);

                // Outer glow – large soft halo
                const grad1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunRadius * 8 * pulse);
                grad1.addColorStop(0, 'rgba(255,200,100,0.12)');
                grad1.addColorStop(0.3, 'rgba(255,160,60,0.06)');
                grad1.addColorStop(1, 'rgba(255,100,20,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, sunRadius * 8 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = grad1;
                ctx.fill();

                // Mid glow
                const grad2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunRadius * 4 * pulse);
                grad2.addColorStop(0, 'rgba(255,220,150,0.25)');
                grad2.addColorStop(0.4, 'rgba(255,180,80,0.15)');
                grad2.addColorStop(1, 'rgba(255,120,40,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, sunRadius * 4 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = grad2;
                ctx.fill();

                // Inner glow
                const grad3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunRadius * 2 * pulse);
                grad3.addColorStop(0, 'rgba(255,240,200,0.6)');
                grad3.addColorStop(0.5, 'rgba(255,200,100,0.3)');
                grad3.addColorStop(1, 'rgba(255,150,50,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, sunRadius * 2 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = grad3;
                ctx.fill();

                // Sun body – bright core
                const grad4 = ctx.createRadialGradient(
                    cx - sunRadius * 0.2, cy - sunRadius * 0.2, 0,
                    cx, cy, sunRadius * pulse
                );
                grad4.addColorStop(0, '#fffbe6');
                grad4.addColorStop(0.3, '#ffe066');
                grad4.addColorStop(0.7, '#ffaa33');
                grad4.addColorStop(1, '#e8781a');
                ctx.beginPath();
                ctx.arc(cx, cy, sunRadius * pulse, 0, Math.PI * 2);
                ctx.fillStyle = grad4;
                ctx.fill();

                // Bright center highlight
                const grad5 = ctx.createRadialGradient(
                    cx - sunRadius * 0.25, cy - sunRadius * 0.25, 0,
                    cx - sunRadius * 0.25, cy - sunRadius * 0.25, sunRadius * 0.5 * pulse
                );
                grad5.addColorStop(0, 'rgba(255,255,255,0.9)');
                grad5.addColorStop(0.5, 'rgba(255,255,200,0.3)');
                grad5.addColorStop(1, 'rgba(255,255,200,0)');
                ctx.beginPath();
                ctx.arc(cx - sunRadius * 0.25, cy - sunRadius * 0.25, sunRadius * 0.5 * pulse, 0, Math.PI * 2);
                ctx.fillStyle = grad5;
                ctx.fill();

                // Subtle corona rays
                ctx.save();
                ctx.translate(cx, cy);
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2 + time * 0.0002;
                    const len = sunRadius * (1.5 + 0.4 * Math.sin(time * 0.001 + i * 1.2));
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    const x2 = Math.cos(angle) * len * pulse;
                    const y2 = Math.sin(angle) * len * pulse;
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = `rgba(255,200,100,${0.04 + 0.03 * Math.sin(time * 0.002 + i * 0.8)})`;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // ─── Draw Orbit Paths ────────────────────────────────────────
            function drawOrbits() {
                for (const p of planetData) {
                    const r = p.orbitRadius * scale;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                    ctx.lineWidth = 0.8;
                    ctx.setLineDash([3, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // ─── Draw Planets ────────────────────────────────────────────
            function drawPlanets(time) {
                for (const p of planetData) {
                    const r = p.orbitRadius * scale;
                    const size = p.size * scale;
                    const angle = p.angle + time * p.speed * 0.0004;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;

                    // Planet glow
                    const glowSize = size * 3;
                    const gradG = ctx.createRadialGradient(x, y, 0, x, y, glowSize);
                    gradG.addColorStop(0, p.color + '40');
                    gradG.addColorStop(1, p.color + '00');
                    ctx.beginPath();
                    ctx.arc(x, y, glowSize, 0, Math.PI * 2);
                    ctx.fillStyle = gradG;
                    ctx.fill();

                    // Planet body with 3D shading
                    const gradP = ctx.createRadialGradient(
                        x - size * 0.3, y - size * 0.3, 0,
                        x, y, size
                    );
                    gradP.addColorStop(0, lightenColor(p.color, 40));
                    gradP.addColorStop(0.6, p.color);
                    gradP.addColorStop(1, darkenColor(p.color, 30));
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fillStyle = gradP;
                    ctx.fill();

                    // Specular highlight
                    const gradH = ctx.createRadialGradient(
                        x - size * 0.3, y - size * 0.35, 0,
                        x - size * 0.3, y - size * 0.35, size * 0.4
                    );
                    gradH.addColorStop(0, 'rgba(255,255,255,0.35)');
                    gradH.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.beginPath();
                    ctx.arc(x - size * 0.3, y - size * 0.35, size * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = gradH;
                    ctx.fill();

                    // Saturn ring
                    if (p.name === 'Saturn') {
                        ctx.save();
                        ctx.translate(x, y);
                        const ringAngle = angle + 0.3;
                        ctx.transform(1, 0, 0, 0.35, 0, 0);
                        const ringOuter = size * 1.8;
                        const ringInner = size * 1.2;
                        const gradR = ctx.createRadialGradient(0, 0, ringInner, 0, 0, ringOuter);
                        gradR.addColorStop(0, 'rgba(210,190,170,0)');
                        gradR.addColorStop(0.3, 'rgba(210,190,170,0.5)');
                        gradR.addColorStop(0.5, 'rgba(230,210,190,0.7)');
                        gradR.addColorStop(0.7, 'rgba(200,180,160,0.4)');
                        gradR.addColorStop(1, 'rgba(200,180,160,0)');
                        ctx.beginPath();
                        ctx.arc(0, 0, ringOuter, 0, Math.PI * 2);
                        ctx.fillStyle = gradR;
                        ctx.fill();
                        ctx.restore();
                    }
                }
            }

            // ─── Color Helpers ───────────────────────────────────────────
            function hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 200, g: 200, b: 200 };
            }

            function lightenColor(hex, amt) {
                const c = hexToRgb(hex);
                const r = Math.min(255, c.r + amt);
                const g = Math.min(255, c.g + amt);
                const b = Math.min(255, c.b + amt);
                return `rgb(${r},${g},${b})`;
            }

            function darkenColor(hex, amt) {
                const c = hexToRgb(hex);
                const r = Math.max(0, c.r - amt);
                const g = Math.max(0, c.g - amt);
                const b = Math.max(0, c.b - amt);
                return `rgb(${r},${g},${b})`;
            }

            // ─── Animation Loop ──────────────────────────────────────────
            let startTime = null;

            function animate(timestamp) {
                if (startTime === null) startTime = timestamp;
                const elapsed = timestamp - startTime;

                // Clear
                ctx.clearRect(0, 0, W, H);

                // 1. Starfield
                drawStars(elapsed);

                // 2. Orbit paths
                drawOrbits();

                // 3. Sun (behind planets)
                drawSun(elapsed);

                // 4. Planets
                drawPlanets(elapsed);

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);

            // ─── Handle resize ───────────────────────────────────────────
            window.addEventListener('resize', () => {
                resize();
                generateStars(400);
            });

        })();
    </script>
</body>
</html>

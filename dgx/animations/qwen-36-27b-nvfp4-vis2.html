<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Spiral Galaxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        const STAR_COUNT = 1500;
        const ARM_COUNT = 4;
        const ARM_SPREAD = 1.5; // How wide the arms are
        const ARM_LENGTH = 600;  // Max radius of galaxy
        const CORE_RADIUS = 15;
        
        // Configuration for colors
        const CORE_COLOR = { r: 255, g: 240, b: 230 };
        const ARM_COLOR = { r: 100, g: 150, b: 255 }; // Blueish
        const ARM_COLOR_ALT = { r: 255, g: 100, b: 120 }; // Pinkish/Reddish

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        // Helper: Linear Interpolation
        function lerp(start, end, t) {
            return start * (1 - t) + end * t;
        }

        // Helper: Color Interpolation
        function lerpColor(c1, c2, t) {
            return {
                r: lerp(c1.r, c2.r, t),
                g: lerp(c1.g, c2.g, t),
                b: lerp(c1.b, c2.b, t)
            };
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random distance from center (Gaussian-ish distribution for density)
                // Using Math.random() * Math.random() to cluster more near center
                this.radius = Math.random() * Math.random() * ARM_LENGTH;
                
                // Determine which arm this star belongs to
                const armIndex = Math.floor(Math.random() * ARM_COUNT);
                const angleStep = (Math.PI * 2) / ARM_COUNT;
                
                // Base angle for the arm at this radius (logarithmic spiral)
                // The further out, the more rotated the arm is
                const spiralAngle = this.radius * 0.005; 
                const baseAngle = (armIndex * angleStep) + spiralAngle;

                // Add randomness to spread the arm out
                this.angle = baseAngle + (Math.random() - 0.5) * ARM_SPREAD;
                
                // Star properties
                this.size = Math.random() * 1.5 + 0.5;
                
                // Rotation speed (Kepler-ish: closer stars move faster)
                // We use a logarithmic falloff so it doesn't get too crazy at center
                this.speed = 0.002 + (0.005 / (this.radius + 10));

                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.baseAlpha = Math.random() * 0.5 + 0.5;

                // Color calculation based on distance
                // 0 = Core Color, 1 = Arm Color
                const distRatio = this.radius / ARM_LENGTH;
                
                // Alternate colors for different arms for visual interest
                const targetColor = (armIndex % 2 === 0) ? ARM_COLOR : ARM_COLOR_ALT;
                
                this.color = lerpColor(CORE_COLOR, targetColor, distRatio);
            }

            update(time) {
                // Rotate the star
                this.angle += this.speed;

                // Twinkle effect
                const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                this.alpha = this.baseAlpha + (twinkle * 0.3);
                
                // Clamp alpha
                if (this.alpha < 0.1) this.alpha = 0.1;
                if (this.alpha > 1.0) this.alpha = 1.0;
            }

            draw() {
                const x = centerX + Math.cos(this.angle) * this.radius;
                const y = centerY + Math.sin(this.angle) * this.radius;

                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${Math.floor(this.color.r)}, ${Math.floor(this.color.g)}, ${Math.floor(this.color.b)}, ${this.alpha})`;
                ctx.fill();
            }
        }

        // Initialize
        function init() {
            resize();
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        // Animation Loop
        let time = 0;
        function animate() {
            // Clear canvas with a slight trail effect? No, let's keep it clean for stars.
            // But we want a black background.
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            time++;

            // Draw Core Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CORE_RADIUS * 4);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.1, 'rgba(255, 200, 150, 0.8)');
            gradient.addColorStop(0.4, 'rgba(100, 150, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, CORE_RADIUS * 4, 0, Math.PI * 2);
            ctx.fill();

            // Update and Draw Stars
            // Use 'lighter' composite operation to make overlapping stars brighter (additive blending)
            ctx.globalCompositeOperation = 'lighter';
            
            for (let star of stars) {
                star.update(time);
                star.draw();
            }

            // Reset composite operation for next frame background clear
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        // Event Listeners
        window.addEventListener('resize', resize);

        // Start
        init();
        animate();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];

        // Configuration
        const PLANET_COUNT = 6;
        // Distance from sun (scaled)
        const ORBITS = [60, 90, 130, 180, 240, 310]; 
        // Speed (radians per frame)
        const SPEEDS = [0.025, 0.020, 0.015, 0.010, 0.007, 0.005];
        // Planet colors
        const COLORS = [
            '#FF5733', // Mercury-ish
            '#FFC300', // Venus-ish
            '#33C1FF', // Earth-ish
            '#FF3333', // Mars-ish
            '#D9A066', // Jupiter-ish
            '#82E0AA'  // Saturn-ish
        ];
        // Planet sizes
        const SIZES = [4, 6, 6.5, 5, 10, 9];

        // State
        let time = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            createStars();
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        function drawStars() {
            ctx.fillStyle = '#FFFFFF';
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            // Glow effect
            const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
            gradient.addColorStop(0, '#FFF'); // Core
            gradient.addColorStop(0.2, '#FFD700'); // Inner glow
            gradient.addColorStop(0.5, '#FF8C00'); // Outer glow
            gradient.addColorStop(1, 'rgba(255, 140, 0, 0)'); // Fade out

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();

            // Solid core
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawOrbit(radius) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanet(orbitRadius, speed, color, size, angle) {
            const x = centerX + Math.cos(angle) * orbitRadius;
            const y = centerY + Math.sin(angle) * orbitRadius;

            // Draw Orbit Path
            drawOrbit(orbitRadius);

            // Draw Planet
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();

            // Simple shadow effect to give 3D feel
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.arc(x, y, size * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            // Clear screen
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            drawStars();
            drawSun();

            time += 1;

            for (let i = 0; i < PLANET_COUNT; i++) {
                const angle = time * SPEEDS[i];
                drawPlanet(ORBITS[i], SPEEDS[i], COLORS[i], SIZES[i], angle);
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);

        // Initialize
        resize();
        animate();

    </script>
</body>
</html>

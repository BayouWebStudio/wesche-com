<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const STAR_COUNT = 1200;
        const CORE_COLOR = 'rgba(255, 255, 255, 0.8)';

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.init();
            }

            init() {
                // Spiral math parameters
                // Distance from center (r) and angle (theta)
                // Spiral formula: r = a * e^(b * theta)
                this.distance = Math.random() * Math.max(width, height) * 0.4;
                this.angle = Math.random() * Math.PI * 2;
                
                // Orbital speed: closer stars move faster
                this.speed = (1 / (this.distance + 50)) * 2;
                
                // Visual properties
                this.size = Math.random() * 1.5 + 0.5;
                
                // Color variations (blues, whites, yellows)
                const colors = ['#ffffff', '#fff4e6', '#e6f2ff', '#fff9e6'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.twinkle = Math.random();
            }

            update() {
                // Rotate the star
                this.angle += this.speed * 0.5;

                // Apply spiral offset: r = a * theta
                // This creates the "arms"
                const spiralFactor = 0.15;
                const spiralOffset = (this.angle * spiralFactor);
                
                // Add some "thickness" to the arms using a random jitter
                const jitter = (Math.random() - 0.5) * 20;
                
                // Calculate x and y based on polar coordinates
                // We use a modified radius to create the spiral shape
                const r = this.distance + (Math.sin(this.angle * 3) * 10);
                
                this.x = width / 2 + Math.cos(this.angle) * r;
                this.y = height / 2 + Math.sin(this.angle) * r;

                // Update twinkle
                this.twinkle += this.twinkleSpeed;
                this.opacity = 0.4 + Math.abs(Math.sin(this.twinkle)) * 0.6;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
            }
        }

        // Initialize stars
        function initGalaxy() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Create a glowing core
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, 50
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            gradient.addColorStop(0.2, 'rgba(255, 200, 100, 0.4)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.globalAlpha = 1;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(width / 2, height / 2, 50, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            // Slight trail effect by not fully clearing
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);

            drawCore();

            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        initGalaxy();
        animate();
    </script>
</body>
</html>

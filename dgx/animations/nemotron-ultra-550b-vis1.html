<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: #000; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas { display: block; }
    .info {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
    .planet-label {
      position: absolute;
      color: white;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 0 3px rgba(0,0,0,0.8);
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 5;
    }
    .planet-label.visible { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="solarSystem"></canvas>
  <div class="info">Hover a planet to see its name • Click to pause/resume</div>
  <script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');
    
    let width, height, centerX, centerY;
    let animationId = null;
    let paused = false;
    let time = 0;
    let stars = [];
    let hoveredPlanet = null;
    let labels = {};
    
    // Planet data: name, distance (AU scaled), orbital period (Earth years), radius (px), color, glow color
    const planetsData = [
      { name: 'Mercury', distance: 0.39, period: 0.24, radius: 4, color: '#b5b5b5', glow: '#888888' },
      { name: 'Venus', distance: 0.72, period: 0.62, radius: 7, color: '#e6c87a', glow: '#d4a84a' },
      { name: 'Earth', distance: 1.0, period: 1.0, radius: 7, color: '#4a90d9', glow: '#2a70b9' },
      { name: 'Mars', distance: 1.52, period: 1.88, radius: 5, color: '#e27b58', glow: '#c05a3a' },
      { name: 'Jupiter', distance: 5.2, period: 11.86, radius: 22, color: '#d4a574', glow: '#b88a5a' },
      { name: 'Saturn', distance: 9.58, period: 29.46, radius: 18, color: '#f4e4bc', glow: '#dcc89c', hasRing: true },
      { name: 'Uranus', distance: 19.2, period: 84.01, radius: 12, color: '#7de3f4', glow: '#5acbd1' },
      { name: 'Neptune', distance: 30.05, period: 164.8, radius: 11, color: '#4b70dd', glow: '#3a5abc' }
    ];
    
    const planets = planetsData.map((p, i) => ({
      ...p,
      angle: Math.random() * Math.PI * 2,
      orbitalRadius: 0, // calculated on resize
      angularSpeed: (2 * Math.PI) / (p.period * 365.25), // radians per "day"
      labelEl: null
    }));
    
    const sun = {
      radius: 0, // calculated on resize
      baseRadius: 30,
      pulsePhase: 0
    };
    
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2;
      
      // Scale factor based on viewport - fit Neptune's orbit with padding
      const maxDim = Math.min(width, height);
      const scale = maxDim * 0.42 / 30.05; // Neptune at 30 AU
      
      sun.radius = Math.max(25, Math.min(50, sun.baseRadius * scale / 30));
      
      planets.forEach(p => {
        p.orbitalRadius = p.distance * scale;
        p.renderRadius = Math.max(3, Math.min(p.radius * scale / 8, p.radius * 1.5));
      });
      
      // Regenerate stars
      generateStars();
      
      // Create/update label elements
      createLabels();
    }
    
    function generateStars() {
      stars = [];
      const starCount = Math.floor((width * height) / 3000);
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.3,
          brightness: Math.random(),
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          twinklePhase: Math.random() * Math.PI * 2
        });
      }
    }
    
    function createLabels() {
      // Remove old labels
      Object.values(labels).forEach(el => el.remove());
      labels = {};
      
      planets.forEach(p => {
        const label = document.createElement('div');
        label.className = 'planet-label';
        label.textContent = p.name;
        document.body.appendChild(label);
        labels[p.name] = label;
        p.labelEl = label;
      });
    }
    
    function drawStarfield() {
      // Draw subtle nebula-like background
      const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) * 0.7);
      gradient.addColorStop(0, 'rgba(20, 10, 30, 1)');
      gradient.addColorStop(0.5, 'rgba(5, 5, 15, 1)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 1)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      
      // Draw stars
      stars.forEach(star => {
        const brightness = star.brightness + Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.3;
        const alpha = Math.max(0.1, Math.min(1, brightness));
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fill();
        
        // Occasional bright stars with cross
        if (star.radius > 1.2 && alpha > 0.8) {
          ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(star.x - star.radius * 3, star.y);
          ctx.lineTo(star.x + star.radius * 3, star.y);
          ctx.moveTo(star.x, star.y - star.radius * 3);
          ctx.lineTo(star.x, star.y + star.radius * 3);
          ctx.stroke();
        }
      });
    }
    
    function drawOrbits() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.lineWidth = 1;
      planets.forEach(p => {
        ctx.beginPath();
        ctx.ellipse(centerX, centerY, p.orbitalRadius, p.orbitalRadius * 0.95, 0, 0, Math.PI * 2);
        ctx.stroke();
      });
    }
    
    function drawSun() {
      sun.pulsePhase += 0.02;
      const pulse = Math.sin(sun.pulsePhase) * 0.05 + 1;
      const currentRadius = sun.radius * pulse;
      
      // Outer glow layers
      for (let i = 5; i >= 0; i--) {
        const glowRadius = currentRadius + i * 8;
        const alpha = (0.15 - i * 0.02) * (1 - i * 0.1);
        const gradient = ctx.createRadialGradient(centerX, centerY, currentRadius, centerX, centerY, glowRadius);
        gradient.addColorStop(0, `rgba(255, 220, 100, ${alpha})`);
        gradient.addColorStop(0.5, `rgba(255, 150, 50, ${alpha * 0.5})`);
        gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, glowRadius, 0, Math.PI * 2);
        ctx.fill();
      }
      
      // Corona spikes
      ctx.strokeStyle = 'rgba(255, 200, 50, 0.3)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 30; i++) {
        const angle = (i / 30) * Math.PI * 2 + time * 0.1;
        const spikeLength = currentRadius * (0.8 + Math.sin(time * 2 + i) * 0.2);
        ctx.beginPath();
        ctx.moveTo(
          centerX + Math.cos(angle) * currentRadius,
          centerY + Math.sin(angle) * currentRadius
        );
        ctx.lineTo(
          centerX + Math.cos(angle) * (currentRadius + spikeLength),
          centerY + Math.sin(angle) * (currentRadius + spikeLength)
        );
        ctx.stroke();
      }
      
      // Sun surface
      const sunGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, currentRadius);
      sunGradient.addColorStop(0, '#fff8e7');
      sunGradient.addColorStop(0.3, '#ffeb3b');
      sunGradient.addColorStop(0.6, '#ffc107');
      sunGradient.addColorStop(0.85, '#ff9800');
      sunGradient.addColorStop(1, '#e65100');
      
      ctx.fillStyle = sunGradient;
      ctx.beginPath();
      ctx.arc(centerX, centerY, currentRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Surface detail - granules
      ctx.fillStyle = 'rgba(255, 255, 200, 0.15)';
      for (let i = 0; i < 40; i++) {
        const angle = (i / 40) * Math.PI * 2 + time * 0.05;
        const r = currentRadius * (0.2 + Math.random() * 0.6);
        const x = centerX + Math.cos(angle) * r;
        const y = centerY + Math.sin(angle) * r;
        const size = currentRadius * (0.05 + Math.random() * 0.08);
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    function drawPlanet(p) {
      const x = centerX + Math.cos(p.angle) * p.orbitalRadius;
      const y = centerY + Math.sin(p.angle) * p.orbitalRadius * 0.95; // slight elliptical
      
      // Planet shadow (cast on orbit plane)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(x, y + p.renderRadius * 0.3, p.renderRadius * 0.9, p.renderRadius * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Ring for Saturn
      if (p.hasRing) {
        const ringInner = p.renderRadius * 1.3;
        const ringOuter = p.renderRadius * 2.1;
        const ringGradient = ctx.createRadialGradient(x, y, ringInner, x, y, ringOuter);
        ringGradient.addColorStop(0, 'rgba(200, 180, 140, 0)');
        ringGradient.addColorStop(0.2, 'rgba(200, 180, 140, 0.6)');
        ringGradient.addColorStop(0.5, 'rgba(180, 160, 120, 0.8)');
        ringGradient.addColorStop(0.8, 'rgba(160, 140, 100, 0.5)');
        ringGradient.addColorStop(1, 'rgba(140, 120, 80, 0)');
        
        ctx.fillStyle = ringGradient;
        ctx.beginPath();
        ctx.ellipse(x, y, ringOuter, ringOuter * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x, y, ringInner, ringInner * 0.4, 0, 0, Math.PI * 2);
        ctx.clearRect(0, 0, width, height); // This would clear everything - bad approach
        // Instead, draw ring as donut
        ctx.globalCompositeOperation = 'source-over';
      }
      
      // Planet glow
      const glowRadius = p.renderRadius + 8;
      const glowGradient = ctx.createRadialGradient(x, y, p.renderRadius, x, y, glowRadius);
      glowGradient.addColorStop(0, p.glow + '80');
      glowGradient.addColorStop(1, p.glow + '00');
      ctx.fillStyle = glowGradient;
      ctx.beginPath();
      ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Planet body with 3D shading
      const planetGradient = ctx.createRadialGradient(
        x - p.renderRadius * 0.3, y - p.renderRadius * 0.3, 0,
        x, y, p.renderRadius
      );
      planetGradient.addColorStop(0, lightenColor(p.color, 40));
      planetGradient.addColorStop(0.5, p.color);
      planetGradient.addColorStop(1, darkenColor(p.color, 40));
      
      ctx.fillStyle = planetGradient;
      ctx.beginPath();
      ctx.arc(x, y, p.renderRadius, 0, Math.PI * 2);
      ctx.fill();
      
      // Atmosphere rim for Earth-like planets
      if (p.name === 'Earth' || p.name === 'Venus' || p.name === 'Mars') {
        ctx.strokeStyle = lightenColor(p.color, 60) + '80';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, y, p.renderRadius + 1, 0, Math.PI * 2);
        ctx.stroke();
      }
      
      // Saturn ring (drawn after planet body for proper layering)
      if (p.hasRing) {
        const ringInner = p.renderRadius * 1.25;
        const ringOuter = p.renderRadius * 2.0;
        
        // Draw ring with perspective
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(1, 0.35);
        ctx.rotate(-0.3);
        
        const ringGrad = ctx.createRadialGradient(0, 0, ringInner, 0, 0, ringOuter);
        ringGrad.addColorStop(0, 'rgba(200, 180, 140, 0)');
        ringGrad.addColorStop(0.15, 'rgba(210, 190, 150, 0.7)');
        ringGrad.addColorStop(0.4, 'rgba(190, 170, 130, 0.9)');
        ringGrad.addColorStop(0.7, 'rgba(170, 150, 110, 0.6)');
        ringGrad.addColorStop(1, 'rgba(150, 130, 90, 0)');
        
        ctx.fillStyle = ringGrad;
        ctx.beginPath();
        ctx.arc(0, 0, ringOuter, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, ringInner, 0, Math.PI * 2);
        ctx.clip();
        ctx.clearRect(-ringOuter, -ringOuter, ringOuter * 2, ringOuter * 2);
        ctx.restore();
      }
      
      // Update label position
      if (p.labelEl) {
        const labelX = x + p.renderRadius + 8;
        const labelY = y - 8;
        p.labelEl.style.left = labelX + 'px';
        p.labelEl.style.top = labelY + 'px';
      }
      
      return { x, y, radius: p.renderRadius };
    }
    
    function lightenColor(hex, percent) {
      const num = parseInt(hex.replace('#', ''), 16);
      const amt = Math.round(2.55 * percent);
      const R = Math.min(255, (num >> 16) + amt);
      const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
      const B = Math.min(255, (num & 0x0000FF) + amt);
      return '#' + (0x1000000 + (R << 16) + (G << 8) + B).toString(16).slice(1);
    }
    
    function darkenColor(hex, percent) {
      const num = parseInt(hex.replace('#', ''), 16);
      const amt = Math.round(2.55 * percent);
      const R = Math.max(0, (num >> 16) - amt);
      const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
      const B = Math.max(0, (num & 0x0000FF) - amt);
      return '#' + (0x1000000 + (R << 16) + (G << 8) + B).toString(16).slice(1);
    }
    
    function checkHover(mx, my) {
      hoveredPlanet = null;
      planets.forEach(p => {
        const x = centerX + Math.cos(p.angle) * p.orbitalRadius;
        const y = centerY + Math.sin(p.angle) * p.orbitalRadius * 0.95;
        const dx = mx - x;
        const dy = my - y;
        if (dx * dx + dy * dy < p.renderRadius * p.renderRadius * 1.5) {
          hoveredPlanet = p;
        }
      });
      
      // Update label visibility
      planets.forEach(p => {
        if (p.labelEl) {
          p.labelEl.classList.toggle('visible', p === hoveredPlanet);
        }
      });
    }
    
    function animate() {
      if (!paused) {
        time += 0.01; // Each frame = ~1 day
        
        // Update planet positions
        planets.forEach(p => {
          p.angle += p.angularSpeed * 2; // Speed up for visibility
          if (p.angle > Math.PI * 2) p.angle -= Math.PI * 2;
        });
      }
      
      // Clear canvas
      ctx.clearRect(0, 0, width, height);
      
      // Draw layers
      drawStarfield();
      drawOrbits();
      drawSun();
      
      // Draw planets back to front (furthest first)
      const sortedPlanets = [...planets].sort((a, b) => b.orbitalRadius - a.orbitalRadius);
      sortedPlanets.forEach(p => drawPlanet(p));
      
      animationId = requestAnimationFrame(animate);
    }
    
    // Event listeners
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      checkHover(e.clientX - rect.left, e.clientY - rect.top);
    });
    
    canvas.addEventListener('mouseleave', () => {
      hoveredPlanet = null;
      planets.forEach(p => {
        if (p.labelEl) p.labelEl.classList.remove('visible');
      });
    });
    
    canvas.addEventListener('click', () => {
      paused = !paused;
    });
    
    window.addEventListener('resize', () => {
      resize();
      if (paused) {
        ctx.clearRect(0, 0, width, height);
        drawStarfield();
        drawOrbits();
        drawSun();
        const sortedPlanets = [...planets].sort((a, b) => b.orbitalRadius - a.orbitalRadius);
        sortedPlanets.forEach(p => drawPlanet(p));
      }
    });
    
    // Initialize
    resize();
    animate();
  </script>
</body>
</html>

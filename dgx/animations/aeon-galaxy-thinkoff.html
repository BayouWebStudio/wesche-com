<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Canvas Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="galaxy"></canvas>

<script>
    const canvas = document.getElementById('galaxy');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    let stars = [];
    const STAR_COUNT = 800;
    const ARMS = 3;

    // Resize canvas to fill screen
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
    }

    // Star class
    class Star {
        constructor() {
            this.reset();
        }

        reset() {
            // Random distance from center
            this.distance = Math.random() * Math.min(width, height) * 0.45;
            
            // Random angle for spiral arm placement
            this.angle = Math.random() * Math.PI * 2;
            
            // Random size
            this.size = Math.random() * 2.5 + 0.5;
            
            // Random rotation speed (closer stars move faster)
            this.speed = (Math.random() * 0.002 + 0.001) * (1 / (this.distance + 1));
            
            // Color variation based on distance (Blue near core, Red at edges)
            const distFactor = this.distance / (Math.min(width, height) * 0.45);
            
            // Base color logic
            const r = 255;
            const g = 200 - (distFactor * 100);
            const b = 150 + (distFactor * 100);
            
            // Add some randomness to color
            this.color = `rgb(${r}, ${g}, ${b})`;
            
            // Twinkle effect
            this.twinkleSpeed = Math.random() * 0.05 + 0.02;
            this.twinklePhase = Math.random() * Math.PI * 2;
            this.twinkleAmount = Math.random() * 0.5 + 0.5;
        }

        update(time) {
            // Update angle for rotation
            this.angle += this.speed;
            
            // Calculate position
            // Add spiral effect: angle shifts based on distance
            const spiralOffset = this.distance * 0.005 * Math.sin(this.angle);
            const currentAngle = this.angle + spiralOffset;
            
            this.x = centerX + Math.cos(currentAngle) * this.distance;
            this.y = centerY + Math.sin(currentAngle) * this.distance;
            
            // Twinkle effect
            this.opacity = 0.5 + 0.5 * Math.sin(time * this.twinkleSpeed + this.twinklePhase);
        }

        draw() {
            ctx.globalAlpha = this.opacity * this.twinkleAmount;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        }

    // Initialize stars
    function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }
    }

    // Draw the bright core
    function drawCore(time) {
        const coreRadius = 30;
        const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreRadius * 2);
        gradient.addColorStop(0, 'rgba(255, 240, 220, 0.9)');
        gradient.addColorStop(0.4, 'rgba(200, 180, 255, 0.5)');
        gradient.addColorStop(1, 'rgba(100, 150, 255, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, coreRadius * 2, 0, Math.PI * 2);
        ctx.fill();
        
        // Add a subtle pulsing effect
        const pulse = 1 + 0.1 * Math.sin(time * 0.002);
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = 'rgba(255, 200, 150, 0.8)';
        ctx.beginPath();
        ctx.arc(centerX, centerY, coreRadius * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // Animation loop
    let lastTime = 0;
    function animate(time) {
        // Clear canvas with slight transparency for trail effect
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(0, 0, width, height);
        
        // Draw core
        drawCore(time);
        
        // Update and draw stars
        stars.forEach(star => {
            star.update(time);
            star.draw();
        });
        
        // Reset global alpha
        ctx.globalAlpha = 1;
        
        requestAnimationFrame(animate);
    }

    // Initialize
    resize();
    initStars();
    window.addEventListener('resize', () => {
        resize();
        initStars();
    });
    
    // Start animation
    requestAnimationFrame(animate);
</script>
</body>
</html>

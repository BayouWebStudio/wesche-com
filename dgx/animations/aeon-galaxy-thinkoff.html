<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>

    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        const STAR_COUNT = 800;
        const SPIRAL_ARMS = 3;
        const ARM_SPREAD = 0.5; // Randomness factor

        // Resize canvas to fill screen
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        // Star Class
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Distance from center
                this.radius = Math.random() * (Math.min(width, height) / 2) * 0.9;
                
                // Angle based on spiral arm structure
                const armIndex = Math.floor(Math.random() * SPIRAL_ARMS);
                const armAngle = (armIndex * 360) / SPIRAL_ARMS;
                
                // Add spiral curve: angle increases as radius increases
                // The further out, the more the arm twists
                const spiralTwist = (this.radius / (Math.min(width, height) / 2)) * 90;
                
                // Random spread to make the arm look like a band
                const spread = (Math.random() - 0.5) * 60;
                
                this.angle = (armAngle + spiralTwist + spread) * Math.PI / 180;
                
                // Speed: Keplerian-ish (inner stars move faster)
                // Inverse square root of radius roughly
                const minSpeed = 0.002;
                const maxSpeed = 0.015;
                const speedFactor = Math.max(0, 1 - (this.radius / (Math.min(width, height) / 2)));
                this.speed = minSpeed + (maxSpeed - minSpeed) * speedFactor;
                
                // Visual properties
                this.size = Math.random() * 1.5 + 0.5;
                
                // Color: Core is warmer (yellow/white), outer is cooler (blue/purple)
                const colorMix = this.radius / (Math.min(width, height) / 2);
                if (colorMix < 0.2) {
                    // Core: White/Yellow
                    this.r = 255;
                    this.g = 255;
                    this.b = 200 + Math.random() * 55;
                } else if (colorMix < 0.6) {
                    // Mid: Orange/Pink
                    this.r = 255;
                    this.g = 180 + Math.random() * 50;
                    this.b = 100 + Math.random() * 100;
                } else {
                    // Outer: Blue/Purple
                    this.r = 150 + Math.random() * 50;
                    this.g = 150 + Math.random() * 50;
                    this.b = 255;
                }
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.baseAlpha = Math.random() * 0.5 + 0.5;
            }

            update(time) {
                // Rotate
                this.angle += this.speed;
                
                // Twinkle effect
                const twinkle = Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                this.alpha = this.baseAlpha * (0.5 + 0.5 * (twinkle + 1));
            }

            draw() {
                const x = width / 2 + Math.cos(this.angle) * this.radius;
                const y = height / 2 + Math.sin(this.angle) * this.radius;
                
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.r}, ${this.g}, ${this.b}, ${this.alpha})`;
                ctx.fill();
            }
        }

        // Initialize stars
        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        // Draw the bright core
        function drawCore() {
            const cx = width / 2;
            const cy = height / 2;
            const coreSize = Math.min(width, height) * 0.05;
            
            const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreSize);
            gradient.addColorStop(0, 'rgba(255, 255, 230, 0.9)');
            gradient.addColorStop(0.2, 'rgba(255, 200, 150, 0.5)');
            gradient.addColorStop(0.5, 'rgba(200, 150, 100, 0.2)');
            gradient.addColorStop(1, 'rgba(100, 80, 50, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(cx, cy, coreSize, 0, Math.PI * 2);
            ctx.fill();
        }

        // Animation loop
        let time = 0;
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw core
            drawCore();
            
            // Update and draw stars
            time++;
            for (const star of stars) {
                star.update(time);
                star.draw();
            }
            
            requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener('resize', () => {
            resize();
            initStars();
        });

        // Start
        resize();
        initStars();
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size to fill the screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Galaxy parameters
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const totalStars = 1500;
        const coreRadius = 20;
        const spiralArms = 3;
        const armGap = 0.85; // Gap between arms
        const starSizeBase = 1.5;
        const rotationSpeed = 0.002; // Radians per frame

        // Star array
        const stars = [];

        // Generate stars
        function generateStars() {
            for (let i = 0; i < totalStars; i++) {
                const angle = (i / totalStars) * Math.PI * 2;
                const radius = Math.random() * (Math.min(canvas.width, canvas.height) / 2 - coreRadius);
                
                stars.push({
                    angle: angle,
                    radius: radius,
                    size: starSizeBase + Math.random() * 2,
                    brightness: 0.5 + Math.random() * 0.5,
                    phase: Math.random() * Math.PI * 2, // For twinkling
                    hue: Math.random() * 60 + 200, // Blue to purple range
                    speed: (0.001 + Math.random() * 0.002) * (1 + radius / (Math.min(canvas.width, canvas.height) / 2))
                });
            }
        }

        generateStars();

        // Twinkle effect
        function twinkle(star) {
            star.phase += star.speed;
            if (star.phase > Math.PI * 2) {
                star.phase = 0;
            }
            star.brightness = 0.4 + 0.6 * Math.sin(star.phase);
        }

        // Draw function
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw core
            const coreGradient = ctx.createRadialGradient(centerX, centerY, coreRadius * 0.2, centerX, centerY, coreRadius);
            coreGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            coreGradient.addColorStop(0.3, 'rgba(255, 200, 150, 0.8)');
            coreGradient.addColorStop(0.6, 'rgba(200, 150, 100, 0.4)');
            coreGradient.addColorStop(1, 'rgba(150, 100, 50, 0)');
            ctx.fillStyle = coreGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreRadius, 0, Math.PI * 2);
            ctx.fill();

            // Draw spiral arms
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(Date.now() * rotationSpeed);

            for (let arm = 0; arm < spiralArms; arm++) {
                ctx.rotate(Math.PI * 2 / spiralArms);
                
                for (let i = 0; i < stars.length; i++) {
                    const star = stars[i];
                    twinkle(star);
                    
                    const x = Math.cos(star.angle) * star.radius;
                    const y = Math.sin(star.angle) * star.radius;
                    
                    ctx.fillStyle = `hsla(${star.hue}, 80%, ${star.brightness * 60}%, 0.8)`;
                    ctx.beginPath();
                    ctx.arc(x, y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.restore();

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>

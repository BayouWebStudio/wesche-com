<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
<canvas id="galaxy"></canvas>

<script>
    (function() {
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let time = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function createStar() {
            const angle = randomRange(0, Math.PI * 2);
            const radius = randomRange(0, Math.min(width, height) * 0.45);
            const size = randomRange(0.3, 2.5);
            const brightness = randomRange(0.4, 1.2);
            const colorVar = randomRange(0, 1);
            const twinkleSpeed = randomRange(0.001, 0.008);
            const twinkleOffset = randomRange(0, Math.PI * 2);

            // Colors: White, cyan, magenta, violet, gold
            const colors = [
                '255,255,255',
                colorVar > 0.6 ? '200,240,255' : '240,240,255',
                colorVar > 0.4 ? '255,200,240' : '255,240,200',
                colorVar > 0.2 ? '240,200,255' : '200,200,255',
                colorVar > 0.8 ? '255,240,180' : '255,210,240'
            ];
            const rgb = colors[Math.floor(Math.random() * colors.length)];

            return {
                angle,
                radius,
                size,
                brightness,
                twinkleSpeed,
                twinkleOffset,
                rgb
            };
        }

        function initStars() {
            stars = [];
            const count = 600;
            for (let i = 0; i < count; i++) {
                stars.push(createStar());
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Draw bright core
            const coreSize = Math.min(width, height) * 0.08;
            const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreSize);
            coreGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            coreGradient.addColorStop(0.2, 'rgba(255, 220, 180, 0.8)');
            coreGradient.addColorStop(0.5, 'rgba(255, 150, 100, 0.4)');
            coreGradient.addColorStop(1, 'rgba(255, 100, 50, 0)');
            ctx.fillStyle = coreGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, coreSize, 0, Math.PI * 2);
            ctx.fill();

            // Draw stars
            for (const star of stars) {
                // Update twinkle
                star.brightness += star.twinkleSpeed;
                if (star.brightness > 1.4 || star.brightness < 0.2) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }

                // Rotate around center
                star.angle += 0.001 * (0.3 + star.radius / Math.min(width, height));
                const x = centerX + Math.cos(star.angle) * star.radius;
                const y = centerY + Math.sin(star.angle) * star.radius;

                // Color with slight variation
                const r = Math.floor(star.rgb[0] * star.brightness);
                const g = Math.floor(star.rgb[1] * star.brightness);
                const b = Math.floor(star.rgb[2] * star.brightness);
                ctx.fillStyle = `rgb(${r},${g},${b})`;

                // Draw star (using a small circle for performance and simplicity)
                ctx.beginPath();
                ctx.arc(x, y, star.size, 0, Math.PI * 2);
                ctx.fill();

                // Optional: draw a tiny cross for extra "star" look
                /*
                ctx.strokeStyle = `rgba(${r},${g},${b},0.5)`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(x - star.size * 1.5, y);
                ctx.lineTo(x - star.size * 0.5, y);
                ctx.moveTo(x + star.size * 0.5, y);
                ctx.lineTo(x + star.size * 1.5, y);
                ctx.moveTo(x, y - star.size * 1.5);
                ctx.lineTo(x, y - star.size * 0.5);
                ctx.moveTo(x, y + star.size * 0.5);
                ctx.lineTo(x, y + star.size * 1.5);
                ctx.stroke();
                */
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        initStars();
        draw();
    })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Deep space black */
            overflow: hidden; /* Prevent scrollbars */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Configuration for the solar system
    const planets = [
        { name: "Mercury", radius: 4, distance: 60, speed: 0.04, color: "#A5A5A5", angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   radius: 7, distance: 90, speed: 0.03, color: "#E3BB76", angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   radius: 7, distance: 130, speed: 0.02, color: "#22A6B3", angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    radius: 5, distance: 170, speed: 0.016, color: "#EB4D4B", angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", radius: 18, distance: 230, speed: 0.008, color: "#F0932B", angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  radius: 15, distance: 290, speed: 0.006, color: "#F6E58D", angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus",  radius: 10, distance: 340, speed: 0.004, color: "#7ED6DF", angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", radius: 10, distance: 390, speed: 0.002, color: "#4834D4", angle: Math.random() * Math.PI * 2 }
    ];

    let stars = [];

    // Resize handling
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
        generateStars();
    }

    // Generate random stars for the background
    function generateStars() {
        stars = [];
        const starCount = 400;
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    // Draw the starfield
    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0; // Reset opacity
    }

    // Draw the Sun
    function drawSun() {
        // Outer glow
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
        gradient.addColorStop(0, "rgba(255, 200, 0, 1)");
        gradient.addColorStop(0.2, "rgba(255, 165, 0, 0.8)");
        gradient.addColorStop(0.5, "rgba(255, 69, 0, 0.2)");
        gradient.addColorStop(1, "rgba(255, 69, 0, 0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
        ctx.fill();

        // Solid core
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
        ctx.fill();
    }

    // Draw orbit paths
    function drawOrbits() {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        planets.forEach(planet => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();
        });
    }

    // Main Animation Loop
    function animate() {
        // Clear canvas
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, width, height);

        drawStars();
        drawOrbits();
        drawSun();

        // Update and draw planets
        planets.forEach(planet => {
            // Update angle
            planet.angle += planet.speed;

            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Planet
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Shadow (simple shading to simulate light source at center)
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, planet.angle + Math.PI / 2, planet.angle - Math.PI / 2);
            ctx.fill();

            // Draw Saturn's Ring
            if (planet.hasRing) {
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Draw an ellipse (ring) around the planet
                ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, planet.angle + Math.PI / 4, 0, Math.PI * 2);
                ctx.stroke();
            }
        });

        requestAnimationFrame(animate);
    }

    // Initialize
    window.addEventListener('resize', resize);
    resize();
    animate();

</script>
</body>
</html>

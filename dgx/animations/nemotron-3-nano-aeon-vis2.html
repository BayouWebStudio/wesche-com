<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin:0; background:#000; }
        canvas { display:block; }
    </style>
</head>
<body>
<canvas id="galaxy"></canvas>
<script>
(function(){
    const canvas = document.getElementById('galaxy');
    const ctx = canvas.getContext('2d');
    const W = canvas.width = window.innerWidth;
    const H = canvas.height = window.innerHeight;
    const center = {x:W/2, y:H/2};
    const starCount = 300;
    const coreRadius = 30;
    const stars = [];

    // create stars
    for(let i=0;i<starCount;i++){
        const angle = Math.random()*Math.PI*2;
        const radius = Math.random()*(W/2 - coreRadius) + coreRadius;
        const x = center.x + Math.cos(angle)*radius;
        const y = center.y + Math.sin(angle)*radius;
        const size = Math.random()*4 + 2;
        const speed = Math.random()*0.2 + 0.5;
        const colorStart = [Math.random()*255, Math.random()*255, Math.random()*255];
        const colorInc = [Math.random()*20-10, Math.random()*20-10, Math.random()*20-10];
        stars.push({x,y,size,speed,colorStart,colorInc});
    }

    function draw(){
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle = 'black';
        ctx.fillRect(0,0,W,H);
        stars.forEach(s=>{
            // move star
            s.x += Math.cos(s.angle)*s.speed*0.016; // approx 60fps
            s.y += Math.sin(s.angle)*s.speed*0.016;
            // wrap around
            if(s.x<0||s.x>W||s.y<0||s.y>H){
                s.x = (s.x+W)%W;
                s.y = (s.y+H)%H;
            }
            // twinkle
            const twinkle = Math.random();
            if(twinkle<0.02){
                s.size = Math.random()*4+2;
                s.speed = Math.random()*0.2+0.5;
            }
            // draw star
            ctx.beginPath();
            ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
            ctx.fillStyle = `rgb(${s.colorStart[0]+0, s.colorStart[1]+0, s.colorStart[2]+0})`;
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
})();
</script>
</body>
</html>

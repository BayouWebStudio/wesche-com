<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');
        let sunX, sunY;
        let stars = [];
        const sunRadius = 30;

        // Planet data: orbit radius, size, speed, color, initial angle
        const planets = [
            { name: 'Mercury', orbitRadius: 60, radius: 4, speed: 0.04, color: '#b5b5b5', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', orbitRadius: 90, radius: 7, speed: 0.03, color: '#e6c87a', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', orbitRadius: 120, radius: 8, speed: 0.02, color: '#4a90e2', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', orbitRadius: 150, radius: 5, speed: 0.016, color: '#e05d44', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', orbitRadius: 190, radius: 15, speed: 0.008, color: '#d4a373', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', orbitRadius: 240, radius: 12, speed: 0.006, color: '#f4d03f', angle: Math.random() * Math.PI * 2, hasRings: true }
        ];

        // Generate random twinkling stars
        function generateStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    twinkle: Math.random() * Math.PI * 2,
                    twinkleSpeed: Math.random() * 0.05 + 0.01
                });
            }
        }

        // Handle canvas resizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            sunX = canvas.width / 2;
            sunY = canvas.height / 2;
            generateStars();
        }

        // Animation loop
        function animate() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw twinkling stars
            stars.forEach(star => {
                const alpha = 0.5 + 0.5 * Math.sin(star.twinkle);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
                star.twinkle += star.twinkleSpeed;
            });

            // Draw orbit paths
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(sunX, sunY, planet.orbitRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // Draw glowing Sun
            const sunGradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunRadius);
            sunGradient.addColorStop(0, '#fff9e6');
            sunGradient.addColorStop(0.5, '#ffcc00');
            sunGradient.addColorStop(1, '#ff6600');
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 30;
            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw planets
            planets.forEach(planet => {
                // Update orbital position
                planet.angle += planet.speed;
                const x = sunX + planet.orbitRadius * Math.cos(planet.angle);
                const y = sunY + planet.orbitRadius * Math.sin(planet.angle);

                // Draw Saturn's rings first
                if (planet.hasRings) {
                    ctx.beginPath();
                    ctx.ellipse(x, y, planet.radius * 1.8, planet.radius * 0.6, Math.PI / 4, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(210, 180, 140, 0.7)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // Draw planet with subtle glow
                ctx.fillStyle = planet.color;
                ctx.shadowColor = planet.color;
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(animate);
        }

        // Initialize and start animation
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        animate();
    </script>
</body>
</html>

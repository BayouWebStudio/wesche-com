<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');
        
        let width, height, centerX, centerY;
        let stars = [];
        let animationTime = 0;
        
        // Planet data: orbital radius, speed, size, color, start angle, optional moons/rings
        const planets = [
            { // Mercury
                orbitalRadius: 80,
                speed: 0.04,
                size: 4,
                color: '#b5b5b5',
                angle: Math.random() * Math.PI * 2,
                moons: []
            },
            { // Venus
                orbitalRadius: 120,
                speed: 0.03,
                size: 7,
                color: '#e6cd89',
                angle: Math.random() * Math.PI * 2,
                moons: []
            },
            { // Earth
                orbitalRadius: 170,
                speed: 0.02,
                size: 8,
                color: '#4a90e2',
                angle: Math.random() * Math.PI * 2,
                moons: [
                    { orbitRadius: 15, speed: 0.1, size: 2, color: '#aaaaaa', angle: Math.random() * Math.PI * 2 }
                ]
            },
            { // Mars
                orbitalRadius: 220,
                speed: 0.015,
                size: 5,
                color: '#e05d44',
                angle: Math.random() * Math.PI * 2,
                moons: []
            },
            { // Jupiter
                orbitalRadius: 290,
                speed: 0.008,
                size: 18,
                color: '#d4a96a',
                angle: Math.random() * Math.PI * 2,
                moons: []
            },
            { // Saturn
                orbitalRadius: 370,
                speed: 0.005,
                size: 15,
                color: '#e0c080',
                angle: Math.random() * Math.PI * 2,
                rings: { radiusX: 1.8, radiusY: 0.5, color: 'rgba(210, 180, 140, 0.6)' },
                moons: []
            }
        ];
        
        // Generate random starfield data
        function generateStars() {
            stars = [];
            const numStars = 200;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    baseBrightness: Math.random() * 0.5 + 0.5,
                    twinkleSpeed: Math.random() * 0.02 + 0.01,
                    twinkleOffset: Math.random() * Math.PI * 2
                });
            }
        }
        
        // Handle window resize
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }
        
        window.addEventListener('resize', resize);
        resize(); // Initial size setup
        
        // Main animation loop
        function animate() {
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Draw twinkling starfield
            stars.forEach(star => {
                const currentBrightness = star.baseBrightness + Math.sin(animationTime * star.twinkleSpeed + star.twinkleOffset) * 0.2;
                const clampedBrightness = Math.max(0, Math.min(1, currentBrightness));
                ctx.fillStyle = `rgba(255, 255, 255, ${clampedBrightness})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw glowing Sun with subtle pulse
            const sunPulse = Math.sin(animationTime * 0.02) * 5;
            const sunGlowSize = 50 + sunPulse;
            const sunGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, sunGlowSize);
            sunGradient.addColorStop(0, '#ffffff');
            sunGradient.addColorStop(0.2, '#ffdd00');
            sunGradient.addColorStop(0.5, '#ff8800');
            sunGradient.addColorStop(1, 'rgba(255, 136, 0, 0)');
            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunGlowSize, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw Sun core
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw faint orbital paths
            planets.forEach(planet => {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.orbitalRadius, 0, Math.PI * 2);
                ctx.stroke();
            });
            
            // Draw planets and their features
            planets.forEach(planet => {
                // Update planet position
                planet.angle += planet.speed;
                const x = centerX + planet.orbitalRadius * Math.cos(planet.angle);
                const y = centerY + planet.orbitalRadius * Math.sin(planet.angle);
                
                // Draw planet
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, planet.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw Saturn's rings
                if (planet.rings) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(0.3); // Tilt rings for realistic look
                    ctx.strokeStyle = planet.rings.color;
                    ctx.lineWidth = planet.size * 0.3;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, planet.size * planet.rings.radiusX, planet.size * planet.rings.radiusY, 0, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
                
                // Draw moons
                planet.moons.forEach(moon => {
                    moon.angle += moon.speed;
                    const moonX = x + moon.orbitRadius * Math.cos(moon.angle);
                    const moonY = y + moon.orbitRadius * Math.sin(moon.angle);
                    ctx.fillStyle = moon.color;
                    ctx.beginPath();
                    ctx.arc(moonX, moonY, moon.size, 0, Math.PI * 2);
                    ctx.fill();
                });
            });
            
            animationTime++;
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>

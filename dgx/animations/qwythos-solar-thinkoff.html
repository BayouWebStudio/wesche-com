<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="solarSystem"></canvas>

<script>
    (function() {
        // Setup canvas and context
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill window
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // Center of the canvas
        const centerX = width / 2;
        const centerY = height / 2;

        // Starfield (static background)
        const stars = [];
        const numStars = 400;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }

        // Planet data
        // distance: from center, size: radius, speed: angular velocity, color
        const planets = [
            { name: 'Mercury', distance: 60, size: 4, speed: 0.04, color: '#A5A5A5' },
            { name: 'Venus', distance: 90, size: 7, speed: 0.028, color: '#E6C288' },
            { name: 'Earth', distance: 130, size: 7, speed: 0.017, color: '#4F9FEC' },
            { name: 'Mars', distance: 170, size: 5, speed: 0.012, color: '#FF6B6B' },
            { name: 'Jupiter', distance: 240, size: 16, speed: 0.006, color: '#D4A574' },
            { name: 'Saturn', distance: 310, size: 14, speed: 0.004, color: '#F4D08C' }
        ];

        // Animation state
        let time = 0;

        function drawStars() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'; // trail effect
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            // Glow effect
            const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 80);
            gradient.addColorStop(0, '#FFFF00');
            gradient.addColorStop(0.4, '#FFD700');
            gradient.addColorStop(1, 'rgba(255, 200, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
            ctx.fill();

            // Solid core
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPlanets() {
            planets.forEach(p => {
                const angle = time * p.speed;
                const x = centerX + Math.cos(angle) * p.distance;
                const y = centerY + Math.sin(angle) * p.distance;

                // Orbit line
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(centerX, centerY, p.distance, 0, Math.PI * 2);
                ctx.stroke();

                // Planet
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fill();

                // Optional: subtle shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(x - 1.5, y + 1.5, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function animate() {
            time += 0.005; // Control speed of animation
            drawStars();
            drawSun();
            drawPlanets();
            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            // Regenerate stars to fill new area
            stars.length = 0;
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        });

        // Start
        animate();
    })();
</script>
</body>
</html>

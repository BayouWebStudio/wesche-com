<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(function() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let W, H, cx, cy;

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        cx = W / 2;
        cy = H / 2;
    }
    resize();
    window.addEventListener('resize', resize);

    // Generate starfield
    const stars = [];
    for (let i = 0; i < 600; i++) {
        stars.push({
            x: Math.random() * 2 - 1,
            y: Math.random() * 2 - 1,
            r: Math.random() * 1.5 + 0.3,
            brightness: Math.random(),
            twinkleSpeed: Math.random() * 0.003 + 0.001,
            phase: Math.random() * Math.PI * 2
        });
    }

    // Planet definitions
    const planets = [
        { name: 'Mercury', orbitRadius: 50,  size: 4,  speed: 0.04,  color: '#b0b0b0', tilt: Math.PI * 0.1 },
        { name: 'Venus',   orbitRadius: 80,  size: 7,  speed: 0.03,  color: '#e8c56a', tilt: Math.PI * 0.3 },
        { name: 'Earth',   orbitRadius: 115, size: 8,  speed: 0.025, color: '#4a9de0', tilt: Math.PI * 0.4 },
        { name: 'Mars',    orbitRadius: 155, size: 5.5,speed: 0.02,  color: '#c16545', tilt: Math.PI * 0.6 },
        { name: 'Jupiter', orbitRadius: 210, size: 18, speed: 0.01,  color: '#d4a56a', tilt: Math.PI * 0.8 },
        { name: 'Saturn',  orbitRadius: 275, size: 15, speed: 0.007, color: '#e8d5a0', tilt: Math.PI * 1.1, hasRing: true },
        { name: 'Uranus',  orbitRadius: 330, size: 11, speed: 0.005, color: '#7ec8c8', tilt: Math.PI * 1.3 },
        { name: 'Neptune', orbitRadius: 380, size: 10, speed: 0.003, color: '#4a6ae0', tilt: Math.PI * 1.5 }
    ];

    // Asteroid belt particles
    const asteroids = [];
    for (let i = 0; i < 300; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 180 + Math.random() * 30;
        asteroids.push({
            angle: angle,
            radius: radius,
            speed: 0.008 + Math.random() * 0.004,
            size: Math.random() * 1.5 + 0.5,
            brightness: Math.random() * 0.5 + 0.2
        });
    }

    function drawStars(time) {
        for (const star of stars) {
            const sx = star.x * W;
            const sy = star.y * H;
            const twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed + star.phase);
            const alpha = star.brightness * twinkle;
            ctx.beginPath();
            ctx.arc(sx, sy, star.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.fill();
        }
    }

    function drawSun(time) {
        const sunRadius = 30;

        // Outer glow layers
        for (let i = 5; i >= 0; i--) {
            const glowRadius = sunRadius + i * 20;
            const alpha = 0.04 * (5 - i) / 5;
            const gradient = ctx.createRadialGradient(cx, cy, sunRadius * 0.5, cx, cy, glowRadius);
            gradient.addColorStop(0, `rgba(255, 200, 50, ${alpha})`);
            gradient.addColorStop(0.5, `rgba(255, 150, 20, ${alpha * 0.5})`);
            gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
            ctx.beginPath();
            ctx.arc(cx, cy, glowRadius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // Corona rays
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(time * 0.0001);
        const rayCount = 12;
        for (let i = 0; i < rayCount; i++) {
            const angle = (i / rayCount) * Math.PI * 2;
            const pulse = 0.8 + 0.2 * Math.sin(time * 0.002 + i);
            const rayLength = sunRadius * (2.5 + 0.5 * pulse);
            const gradient = ctx.createLinearGradient(0, 0, Math.cos(angle) * rayLength, Math.sin(angle) * rayLength);
            gradient.addColorStop(0, 'rgba(255, 220, 100, 0.15)');
            gradient.addColorStop(1, 'rgba(255, 150, 50, 0)');
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(angle - 0.03) * rayLength, Math.sin(angle - 0.03) * rayLength);
            ctx.lineTo(Math.cos(angle + 0.03) * rayLength, Math.sin(angle + 0.03) * rayLength);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
        }
        ctx.restore();

        // Sun body
        const sunGradient = ctx.createRadialGradient(cx - sunRadius * 0.2, cy - sunRadius * 0.2, sunRadius * 0.1, cx, cy, sunRadius);
        sunGradient.addColorStop(0, '#fff8e0');
        sunGradient.addColorStop(0.3, '#ffdd44');
        sunGradient.addColorStop(0.7, '#ff9900');
        sunGradient.addColorStop(1, '#ff5500');
        ctx.beginPath();
        ctx.arc(cx, cy, sunRadius, 0, Math.PI * 2);
        ctx.fillStyle = sunGradient;
        ctx.fill();

        // Surface detail - subtle animated spots
        ctx.save();
        ctx.globalCompositeOperation = 'multiply';
        for (let i = 0; i < 5; i++) {
            const spotAngle = time * 0.0005 + i * 1.3;
            const spotDist = sunRadius * 0.4;
            const spotX = cx + Math.cos(spotAngle) * spotDist;
            const spotY = cy + Math.sin(spotAngle) * spotDist;
            const spotGrad = ctx.createRadialGradient(spotX, spotY, 0, spotX, spotY, sunRadius * 0.3);
            spotGrad.addColorStop(0, 'rgba(200, 100, 0, 0.3)');
            spotGrad.addColorStop(1, 'rgba(200, 100, 0, 0)');
            ctx.beginPath();
            ctx.arc(spotX, spotY, sunRadius * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = spotGrad;
            ctx.fill();
        }
        ctx.restore();
    }

    function drawOrbit(orbitRadius) {
        ctx.beginPath();
        ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
    }

    function drawPlanet(planet, time) {
        const angle = planet.tilt + time * planet.speed;
        const px = cx + Math.cos(angle) * planet.orbitRadius;
        const py = cy + Math.sin(angle) * planet.orbitRadius;

        // Planet shadow (3D effect)
        const planetGrad = ctx.createRadialGradient(
            px - planet.size * 0.3, py - planet.size * 0.3, planet.size * 0.1,
            px, py, planet.size
        );

        // Parse color for shading
        const baseColor = planet.color;
        planetGrad.addColorStop(0, lightenColor(baseColor, 60));
        planetGrad.addColorStop(0.5, baseColor);
        planetGrad.addColorStop(1, darkenColor(baseColor, 80));

        ctx.beginPath();
        ctx.arc(px, py, planet.size, 0, Math.PI * 2);
        ctx.fillStyle = planetGrad;
        ctx.fill();

        // Atmosphere glow for Earth
        if (planet.name === 'Earth') {
            const atmoGrad = ctx.createRadialGradient(px, py, planet.size, px, py, planet.size * 1.8);
            atmoGrad.addColorStop(0, 'rgba(100, 180, 255, 0.2)');
            atmoGrad.addColorStop(1, 'rgba(100, 180, 255, 0)');
            ctx.beginPath();
            ctx.arc(px, py, planet.size * 1.8, 0, Math.PI * 2);
            ctx.fillStyle = atmoGrad;
            ctx.fill();
        }

        // Saturn's rings
        if (planet.hasRing) {
            ctx.save();
            ctx.translate(px, py);

            // Back ring
            ctx.beginPath();
            ctx.ellipse(0, 0, planet.size * 2.2, planet.size * 0.6, 0.3, 0, Math.PI);
            ctx.strokeStyle = 'rgba(210, 190, 140, 0.4)';
            ctx.lineWidth = planet.size * 0.25;
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 0, planet.size * 1.9, planet.size * 0.5, 0.3, 0, Math.PI);
            ctx.strokeStyle = 'rgba(210, 190, 140, 0.2)';
            ctx.lineWidth = planet.size * 0.15;
            ctx.stroke();

            ctx.restore();
        }

        // Small glow around planet
        const glowGrad = ctx.createRadialGradient(px, py, planet.size * 0.5, px, py, planet.size * 2);
        glowGrad.addColorStop(0, baseColor + '30');
        glowGrad.addColorStop(1, baseColor + '00');
        ctx.beginPath();
        ctx.arc(px, py, planet.size * 2, 0, Math.PI * 2);
        ctx.fillStyle = glowGrad;
        ctx.fill();
    }

    function drawAsteroids(time) {
        for (const ast of asteroids) {
            const angle = ast.angle + time * ast.speed;
            const ax = cx + Math.cos(angle) * ast.radius;
            const ay = cy + Math.sin(angle) * ast.radius;

            ctx.beginPath();
            ctx.arc(ax, ay, ast.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(180, 170, 150, ${ast.brightness})`;
            ctx.fill();
        }
    }

    function lightenColor(hex, amount) {
        const r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amount);
        const g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amount);
        const b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amount);
        return `rgb(${r},${g},${b})`;
    }

    function darkenColor(hex, amount) {
        const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
        const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
        const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
        return `rgb(${r},${g},${b})`;
    }

    function drawPlanetLabels(time) {
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        for (const planet of planets) {
            const angle = planet.tilt + time * planet.speed;
            const px = cx + Math.cos(angle) * planet.orbitRadius;
            const py = cy + Math.sin(angle) * planet.orbitRadius;
            ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + 0.1 * Math.sin(time * 0.002)})`;
            ctx.fillText(planet.name, px, py - planet.size - 8);
        }
    }

    function animate(time) {
        // Clear with slight trail for motion blur effect
        ctx.fillStyle = 'rgba(0, 0, 0, 1)';
        ctx.fillRect(0, 0, W, H);

        // Draw starfield
        drawStars(time);

        // Draw orbits
        for (const planet of planets) {
            drawOrbit(planet.orbitRadius);
        }

        // Draw asteroid belt
        drawAsteroids(time);

        // Draw sun
        drawSun(time);

        // Draw planets
        for (const planet of planets) {
            drawPlanet(planet, time);
        }

        // Draw labels
        drawPlanetLabels(time);

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
})();
</script>
</body>
</html>

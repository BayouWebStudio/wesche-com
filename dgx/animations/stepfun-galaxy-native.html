<!DOCTYPE html>
<html>
<head>
    <title>Spiral Galaxy</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>
    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');
        
        let width, height, centerX, centerY, maxDistance;
        const stars = [];
        
        // Configuration
        const NUM_STARS = 800;
        const NUM_ARMS = 5;
        const SPIRAL_FACTOR = 0.006;
        const BASE_ROTATION_SPEED = 0.0003;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            maxDistance = Math.min(width, height) * 0.4;
            generateStars();
        }
        
        function generateStars() {
            stars.length = 0;
            for (let i = 0; i < NUM_STARS; i++) {
                const inArm = Math.random() > 0.1;
                let distance, angle;
                
                if (inArm) {
                    const arm = Math.floor(Math.random() * NUM_ARMS);
                    const armAngle = (arm / NUM_ARMS) * 2 * Math.PI;
                    distance = Math.pow(Math.random(), 2) * maxDistance;
                    const spiralOffset = distance * SPIRAL_FACTOR;
                    const angleOffset = (Math.random() - 0.5) * 0.8;
                    const distanceOffset = (Math.random() - 0.5) * 30;
                    distance += distanceOffset;
                    distance = Math.max(20, distance);
                    angle = armAngle + spiralOffset + angleOffset;
                } else {
                    distance = Math.random() * maxDistance;
                    angle = Math.random() * 2 * Math.PI;
                }
                
                const angularSpeed = BASE_ROTATION_SPEED * (1 - (distance / maxDistance) * 0.7);
                const hue = 30 + (distance / maxDistance) * 180 + (Math.random() - 0.5) * 20;
                const saturation = 70 + Math.random() * 20;
                const lightness = 60 + Math.random() * 20;
                const size = Math.random() < 0.1 ? 2 + Math.random() * 2 : 1 + Math.random();
                const twinklePhase = Math.random() * 2 * Math.PI;
                const twinkleSpeed = 0.5 + Math.random() * 1.5;
                
                stars.push({
                    distance, angle, angularSpeed, hue, saturation, lightness,
                    size, twinklePhase, twinkleSpeed
                });
            }
        }
        
        function animate(time) {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            // Draw bright core
            const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 80);
            coreGradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            coreGradient.addColorStop(0.1, 'rgba(255, 240, 200, 0.8)');
            coreGradient.addColorStop(0.5, 'rgba(255, 200, 100, 0.2)');
            coreGradient.addColorStop(1, 'rgba(255, 100, 50, 0)');
            ctx.fillStyle = coreGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 80, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw stars
            stars.forEach(star => {
                star.angle += star.angularSpeed;
                const x = centerX + Math.cos(star.angle) * star.distance;
                const y = centerY + Math.sin(star.angle) * star.distance;
                
                const twinkle = Math.sin(time * 0.001 * star.twinkleSpeed + star.twinklePhase);
                const currentSize = Math.max(0.5, star.size + twinkle * 0.5);
                const alpha = 0.7 + twinkle * 0.3;
                
                ctx.fillStyle = `hsla(${star.hue}, ${star.saturation}%, ${star.lightness}%, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, currentSize, 0, 2 * Math.PI);
                ctx.fill();
            });
            
            requestAnimationFrame(animate);
        }
        
        // Initialize
        resize();
        window.addEventListener('resize', resize);
        requestAnimationFrame(animate);
    </script>
</body>
</html>

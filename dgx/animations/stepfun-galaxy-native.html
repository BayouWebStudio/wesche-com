<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, centerX, centerY;
        const stars = [];
        const STAR_COUNT = 800;
        const SPIRAL_ARMS = 4;
        const SPIRAL_TIGHTNESS = 0.04;
        const MAX_RADIUS_RATIO = 0.4;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            initStars();
        }

        class Star {
            constructor() {
                const maxRadius = Math.min(width, height) * MAX_RADIUS_RATIO;
                // Denser star distribution near core
                this.radius = Math.random() * Math.random() * maxRadius;
                
                // Spiral arm placement (70% of stars) or random scatter (30%)
                const inArm = Math.random() < 0.7;
                let baseAngle;
                if (inArm) {
                    const arm = Math.floor(Math.random() * SPIRAL_ARMS);
                    baseAngle = arm * (2 * Math.PI / SPIRAL_ARMS);
                    baseAngle += this.radius * SPIRAL_TIGHTNESS;
                    baseAngle += (Math.random() - 0.5) * 0.4; // Fuzzy arm edges
                } else {
                    baseAngle = Math.random() * 2 * Math.PI;
                }
                this.initialAngle = baseAngle;
                
                // Size: larger near core
                this.size = 0.5 + Math.random() * 2.5 * (1 - this.radius / maxRadius);
                
                // Color: warm core (yellow/orange), cool outer (blue/purple)
                let hue;
                if (this.radius < 50) {
                    hue = 30 + Math.random() * 30;
                } else {
                    hue = 180 + Math.random() * 60;
                }
                const saturation = 70 + Math.random() * 30;
                const lightness = 70 + Math.random() * 20;
                this.color = `hsla(${hue}, ${saturation}%, ${lightness}%,`;
                
                // Twinkle properties
                this.twinkleSpeed = 0.02 + Math.random() * 0.08;
                this.twinkleOffset = Math.random() * 2 * Math.PI;
                
                // Rotation speed: faster near core (realistic orbital mechanics)
                this.rotationSpeed = 0.001 / (this.radius * 0.01 + 1);
            }

            draw(time) {
                const currentAngle = this.initialAngle + (time * this.rotationSpeed);
                const x = centerX + this.radius * Math.cos(currentAngle);
                const y = centerY + this.radius * Math.sin(currentAngle);
                
                // Smooth twinkle effect
                const opacity = 0.5 + 0.5 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset);
                
                ctx.fillStyle = this.color + opacity + ')';
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function animate(time) {
            // Clear to black background
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            // Draw bright core glow
            const coreRadius = Math.min(width, height) * 0.1;
            const coreGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, coreRadius);
            coreGradient.addColorStop(0, 'rgba(255, 240, 200, 0.8)');
            coreGradient.addColorStop(0.2, 'rgba(255, 220, 180, 0.4)');
            coreGradient.addColorStop(0.5, 'rgba(255, 200, 150, 0.1)');
            coreGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = coreGradient;
            ctx.fillRect(0, 0, width, height);
            
            // Draw all stars
            stars.forEach(star => star.draw(time));
            
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(animate);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Starfield
        const stars = [];
        for (let i = 0; i < 300; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                brightness: Math.random()
            });
        }

        // Planet data
        const planets = [
            { name: 'Mercury', radius: 4, orbitRadius: 60, speed: 0.02, color: '#b5b5b5', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', radius: 7, orbitRadius: 90, speed: 0.015, color: '#f5c542', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', radius: 8, orbitRadius: 130, speed: 0.01, color: '#4da6ff', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', radius: 6, orbitRadius: 170, speed: 0.008, color: '#ff6b6b', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', radius: 15, orbitRadius: 230, speed: 0.005, color: '#ff9e6b', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', radius: 13, orbitRadius: 290, speed: 0.003, color: '#f5d68a', angle: Math.random() * Math.PI * 2, hasRings: true }
        ];

        function drawStars() {
            stars.forEach(star => {
                const flicker = 0.7 + Math.sin(Date.now() * 0.001 * star.brightness) * 0.3;
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness * flicker})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawSun() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // Sun glow effect
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 40);
            gradient.addColorStop(0, '#fff700');
            gradient.addColorStop(0.3, '#ff9500');
            gradient.addColorStop(0.7, '#ff4500');
            gradient.addColorStop(1, 'rgba(255, 69, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 40, 0, Math.PI * 2);
            ctx.fill();

            // Sun core
            ctx.fillStyle = '#fff700';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawOrbits() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            planets.forEach(planet => {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.orbitRadius, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function drawPlanets() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            planets.forEach(planet => {
                // Update angle
                planet.angle += planet.speed;
                
                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
                const y = centerY + Math.sin(planet.angle) * planet.orbitRadius;

                // Draw Saturn's rings
                if (planet.hasRings) {
                    ctx.strokeStyle = 'rgba(245, 214, 138, 0.6)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(x, y, planet.radius * 2, planet.radius * 0.5, planet.angle, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Draw planet
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();

                // Planet glow
                const glow = ctx.createRadialGradient(x, y, planet.radius * 0.5, x, y, planet.radius * 2);
                glow.addColorStop(0, planet.color);
                glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius * 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function animate() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw everything
            drawStars();
            drawOrbits();
            drawSun();
            drawPlanets();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            background: #000;
            cursor: default;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById('solarSystem');
            const ctx = canvas.getContext('2d');

            // ─── State ───────────────────────────────────────────────
            let W, H, cx, cy, scale;

            // ─── Stars ───────────────────────────────────────────────
            const STAR_COUNT = 400;
            let stars = [];

            function initStars() {
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random(),
                        y: Math.random(),
                        size: Math.random() * 2.2 + 0.3,
                        baseAlpha: Math.random() * 0.6 + 0.4,
                        twinkleSpeed: Math.random() * 0.025 + 0.005,
                        twinklePhase: Math.random() * Math.PI * 2
                    });
                }
            }
            initStars();

            // ─── Planets ─────────────────────────────────────────────
            // Each planet: orbitRadius (relative to scale), size (relative to scale),
            // color, speed (rad/frame), initial angle, name, hasRings
            const PLANET_DEFS = [{
                name: 'Mercury',
                orbit: 0.14,
                size: 0.012,
                color: '#b5b5b5',
                speed: 0.045,
                angle: 0
            }, {
                name: 'Venus',
                orbit: 0.21,
                size: 0.018,
                color: '#e8cda0',
                speed: 0.028,
                angle: 1.8
            }, {
                name: 'Earth',
                orbit: 0.30,
                size: 0.020,
                color: '#4b8bbe',
                speed: 0.022,
                angle: 3.5
            }, {
                name: 'Mars',
                orbit: 0.39,
                size: 0.016,
                color: '#c1440e',
                speed: 0.017,
                angle: 5.2
            }, {
                name: 'Jupiter',
                orbit: 0.52,
                size: 0.040,
                color: '#d4a574',
                speed: 0.009,
                angle: 0.9
            }, {
                name: 'Saturn',
                orbit: 0.66,
                size: 0.034,
                color: '#ead6b8',
                speed: 0.006,
                angle: 2.4,
                hasRings: true
            }, {
                name: 'Uranus',
                orbit: 0.80,
                size: 0.024,
                color: '#73c2d4',
                speed: 0.004,
                angle: 4.7
            }, {
                name: 'Neptune',
                orbit: 0.94,
                size: 0.022,
                color: '#3b5c9c',
                speed: 0.0025,
                angle: 1.1
            }];

            // Planet instances (will be updated on resize)
            let planets = [];

            function initPlanets() {
                planets = PLANET_DEFS.map(def => ({
                    ...def,
                    orbitRadius: def.orbit * scale,
                    size: def.size * scale,
                    angle: def.angle
                }));
            }

            // ─── Resize ──────────────────────────────────────────────
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                cx = W / 2;
                cy = H / 2;
                // Scale factor: base on the smaller dimension, with some padding
                const base = Math.min(W, H) * 0.48;
                scale = Math.max(base, 120); // minimum scale to keep things visible
                // Recalculate planet dimensions
                planets = PLANET_DEFS.map(def => ({
                    ...def,
                    orbitRadius: def.orbit * scale,
                    size: Math.max(def.size * scale, 2.5),
                    angle: def.angle
                }));
            }

            window.addEventListener('resize', resize);
            resize();

            // ─── Drawing helpers ─────────────────────────────────────
            function drawStarfield(time) {
                for (const star of stars) {
                    const twinkle = Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.35 + 0.65;
                    const alpha = star.baseAlpha * twinkle;
                    const x = star.x * W;
                    const y = star.y * H;
                    ctx.beginPath();
                    ctx.arc(x, y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                    ctx.fill();
                }
            }

            function drawSun(time) {
                const r = scale * 0.075;
                const glowR = r * 3.2;

                // --- Outer glow (large, soft) ---
                const grad1 = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, glowR);
                grad1.addColorStop(0, 'rgba(255,220,100,0.35)');
                grad1.addColorStop(0.3, 'rgba(255,160,40,0.20)');
                grad1.addColorStop(0.6, 'rgba(255,100,20,0.08)');
                grad1.addColorStop(1, 'rgba(255,60,0,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
                ctx.fillStyle = grad1;
                ctx.fill();

                // --- Mid glow ---
                const grad2 = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, glowR * 0.65);
                grad2.addColorStop(0, 'rgba(255,230,150,0.50)');
                grad2.addColorStop(0.5, 'rgba(255,180,60,0.25)');
                grad2.addColorStop(1, 'rgba(255,120,20,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, glowR * 0.65, 0, Math.PI * 2);
                ctx.fillStyle = grad2;
                ctx.fill();

                // --- Core ---
                const grad3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                grad3.addColorStop(0, '#fffbe6');
                grad3.addColorStop(0.25, '#ffe566');
                grad3.addColorStop(0.55, '#ffaa00');
                grad3.addColorStop(0.85, '#ff7700');
                grad3.addColorStop(1, '#cc4400');
                ctx.shadowColor = '#ffaa33';
                ctx.shadowBlur = r * 1.2;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = grad3;
                ctx.fill();
                ctx.shadowBlur = 0;

                // --- Hot inner speckle (pulsing) ---
                const pulse = Math.sin(time * 0.03) * 0.06 + 0.94;
                const grad4 = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.5);
                grad4.addColorStop(0, `rgba(255,255,255,${0.7 * pulse})`);
                grad4.addColorStop(0.5, `rgba(255,240,180,${0.3 * pulse})`);
                grad4.addColorStop(1, 'rgba(255,200,100,0)');
                ctx.beginPath();
                ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = grad4;
                ctx.fill();
            }

            function drawOrbits() {
                for (const p of planets) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, p.orbitRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                }
            }

            function drawPlanet(p, time) {
                const x = cx + Math.cos(p.angle) * p.orbitRadius;
                const y = cy + Math.sin(p.angle) * p.orbitRadius;

                // --- Glow / halo for the planet ---
                const haloR = p.size * 2.5;
                const grad = ctx.createRadialGradient(x, y, p.size * 0.2, x, y, haloR);
                const color = p.color;
                grad.addColorStop(0, color + '55');
                grad.addColorStop(0.4, color + '22');
                grad.addColorStop(1, color + '00');
                ctx.beginPath();
                ctx.arc(x, y, haloR, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // --- Saturn rings ---
                if (p.hasRings) {
                    ctx.save();
                    ctx.translate(x, y);
                    // Tilt the rings
                    const tilt = 0.35;
                    const ringAngle = p.angle + 0.5;
                    ctx.rotate(ringAngle);
                    const rx = p.size * 2.0;
                    const ry = p.size * 0.55;
                    // Outer ring
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(210,190,165,0.50)';
                    ctx.lineWidth = p.size * 0.35;
                    ctx.stroke();
                    // Inner ring gap
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx * 0.72, ry * 0.72, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(210,190,165,0.25)';
                    ctx.lineWidth = p.size * 0.20;
                    ctx.stroke();
                    // Inner ring
                    ctx.beginPath();
                    ctx.ellipse(0, 0, rx * 0.55, ry * 0.55, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(210,190,165,0.35)';
                    ctx.lineWidth = p.size * 0.25;
                    ctx.stroke();
                    ctx.restore();
                }

                // --- Planet body ---
                ctx.shadowColor = p.color;
                ctx.shadowBlur = p.size * 0.8;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.shadowBlur = 0;

                // --- Specular highlight ---
                const specGrad = ctx.createRadialGradient(
                    x - p.size * 0.3, y - p.size * 0.3, 0,
                    x, y, p.size
                );
                specGrad.addColorStop(0, 'rgba(255,255,255,0.35)');
                specGrad.addColorStop(0.3, 'rgba(255,255,255,0.10)');
                specGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = specGrad;
                ctx.fill();
            }

            // ─── Animation ───────────────────────────────────────────
            let time = 0;

            function animate(timestamp) {
                // Use timestamp for smooth, time-based animation
                // but also keep a frame counter for twinkling
                const dt = timestamp !== undefined ? 1 : 1;
                time += dt * 0.6;

                // Update planet angles
                for (const p of planets) {
                    p.angle += p.speed * dt * 0.6;
                }

                // --- Clear & draw ---
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, W, H);

                // 1. Starfield
                drawStarfield(time);

                // 2. Orbits (behind planets and sun)
                drawOrbits();

                // 3. Sun (behind planets but in front of orbits)
                drawSun(time);

                // 4. Planets
                for (const p of planets) {
                    drawPlanet(p, time);
                }

                requestAnimationFrame(animate);
            }

            // ─── Start ───────────────────────────────────────────────
            // Handle edge case where canvas might have zero size briefly
            if (W > 0 && H > 0) {
                animate(0);
            } else {
                // Wait for resize to give us a valid size
                const check = setInterval(() => {
                    if (canvas.width > 0 && canvas.height > 0) {
                        clearInterval(check);
                        animate(0);
                    }
                }, 50);
            }

            // Re-initialize stars on resize to keep distribution fresh
            // but we only do it once; stars are fine with relative coords.
            // However, if the window changes drastically, we might want
            // to keep the same stars but they're relative, so it's fine.

            // Expose a way to re-seed stars if needed (not required)

            console.log('🌌 Solar System animated — enjoy!');
        })();
    </script>
</body>
</html>

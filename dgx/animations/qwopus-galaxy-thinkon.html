<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spiral Galaxy</title>
<style>
*{margin:0;padding:0}body{background:#000;overflow:hidden}canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener('resize',()=>{resize();init()});

const coreCol=['#FFFFFF','#FFF8DC','#FFE4B5','#FFD700','#FFA500','#FFEFD5'];
const armCol=['#FFD700','#FFA500','#FF8C00','#87CEEB','#B0C4DE','#E6E6FA','#FF6347','#FF4500','#FFFFFF','#FFF8DC','#FFDAB9','#D8BFD8'];

let stars=[];

function init(){
  const cx=canvas.width/2,cy=canvas.height/2;
  stars=[];

  // Core — dense bright cluster
  for(let i=0;i<350;i++){
    const a=Math.random()*Math.PI*2,r=Math.random()*30;
    stars.push({r,a,spd:0.018+Math.random()*0.008,radius:Math.random()*2.5+0.8,color:coreCol[~~(Math.random()*coreCol.length)],twk:Math.random()*Math.PI*2,tws:Math.random()*3+1,bri:0.75+Math.random()*0.25});
  }

  // Spiral arms — logarithmic spiral with spread
  const arms=3,a=12,b=0.18;
  for(let arm=0;arm<arms;arm++){
    for(let i=0;i<280;i++){
      const t=Math.random()*5+0.3;
      const r=a*Math.exp(b*t);
      const spread=(Math.random()-0.5)*22*(1+t*0.25);
      const baseA=(arm/arms)*Math.PI*2;
      const ang=baseA+t+Math.atan(spread/r);
      const dist=Math.sqrt(r*r+spread*spread);
      const spd=0.007/(1+dist/90);
      stars.push({r:dist,a:ang,spd,radius:Math.random()*1.5+0.3,color:armCol[~~(Math.random()*armCol.length)],twk:Math.random()*Math.PI*2,tws:Math.random()*2+0.5,bri:0.4+Math.random()*0.6});
    }
  }

  // Halo — scattered sparse stars
  for(let i=0;i<180;i++){
    const a=Math.random()*Math.PI*2,r=60+Math.random()*220;
    stars.push({r,a,spd:0.003/(1+r/120),radius:Math.random()*0.9+0.2,color:armCol[~~(Math.random()*armCol.length)],twk:Math.random()*Math.PI*2,tws:Math.random()*1.5+0.3,bri:0.2+Math.random()*0.4});
  }

  // A few supergiants with diffraction spikes
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2,r=20+Math.random()*180;
    stars.push({r,a,spd:0.006/(1+r/100),radius:2+Math.random()*1.5,color:'#FFFFFF',twk:Math.random()*Math.PI*2,tws:Math.random()*2+0.5,bri:0.8+Math.random()*0.2,spike:true});
  }
}

init();

function animate(time){
  const cx=canvas.width/2,cy=canvas.height/2;

  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Core glow — multi-layered
  const g3=ctx.createRadialGradient(cx,cy,0,cx,cy,80);
  g3.addColorStop(0,'rgba(255,252,240,0.45)');
  g3.addColorStop(0.2,'rgba(255,230,170,0.15)');
  g3.addColorStop(0.6,'rgba(255,200,120,0.04)');
  g3.addColorStop(1,'rgba(255,180,100,0)');
  ctx.fillStyle=g3;
  ctx.beginPath();ctx.arc(cx,cy,80,0,Math.PI*2);ctx.fill();

  const g2=ctx.createRadialGradient(cx,cy,0,cx,cy,140);
  g2.addColorStop(0,'rgba(255,240,200,0.12)');
  g2.addColorStop(0.5,'rgba(255,200,140,0.03)');
  g2.addColorStop(1,'rgba(255,180,100,0)');
  ctx.fillStyle=g2;
  ctx.beginPath();ctx.arc(cx,cy,140,0,Math.PI*2);ctx.fill();

  // Draw stars
  for(const s of stars){
    s.a+=s.spd;
    const x=cx+Math.cos(s.a)*s.r;
    const y=cy+Math.sin(s.a)*s.r;
    const twk=0.5+0.5*Math.sin(time*0.001*s.tws+s.twk);
    const alpha=s.bri*(0.35+0.65*twk);

    // Diffraction spikes for supergiants
    if(s.spike){
      ctx.strokeStyle=s.color;
      ctx.lineWidth=0.5;
      ctx.globalAlpha=alpha*0.4;
      const len=s.radius*8;
      ctx.beginPath();ctx.moveTo(x-len,y);ctx.lineTo(x+len,y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,y-len);ctx.lineTo(x,y+len);ctx.stroke();
      ctx.globalAlpha=1;
    }

    // Outer glow for larger stars
    if(s.radius>1.2){
      ctx.beginPath();ctx.arc(x,y,s.radius*3.5,0,Math.PI*2);
      ctx.fillStyle=s.color;ctx.globalAlpha=alpha*0.12;ctx.fill();
    }

    // Star body
    ctx.beginPath();ctx.arc(x,y,s.radius,0,Math.PI*2);
    ctx.fillStyle=s.color;ctx.globalAlpha=alpha;ctx.fill();
  }

  ctx.globalAlpha=1;
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>

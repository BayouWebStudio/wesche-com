<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>
    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        let time = 0;

        // Galaxy configuration
        const CONFIG = {
            numArms: 3,
            armStars: 600,
            coreStars: 800,
            backgroundStars: 300,
            coreRadius: 80,
            armSpread: 120,
            spiralTightness: 0.008,
            scatter: 30,
            rotationSpeed: 0.0004,
            twinkleSpeed: 0.005
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        function createStar(type) {
            const star = {};
            const maxDist = Math.max(width, height) * 0.6;
            
            if (type === 'arm') {
                const armIndex = Math.floor(Math.random() * CONFIG.numArms);
                const armAngle = (Math.PI * 2 / CONFIG.numArms) * armIndex;
                const dist = CONFIG.coreRadius + Math.random() * (maxDist - CONFIG.coreRadius);
                const angle = armAngle + dist * CONFIG.spiralTightness + (Math.random() - 0.5) * 0.5;
                
                // Add scatter to give the arms volume
                const scatterX = (Math.random() - 0.5) * CONFIG.scatter;
                const scatterY = (Math.random() - 0.5) * CONFIG.scatter;

                star.x = centerX + Math.cos(angle) * dist + scatterX;
                star.y = centerY + Math.sin(angle) * dist + scatterY;
                star.dist = dist;
                star.angle = angle;
                star.speed = CONFIG.rotationSpeed / Math.sqrt(dist * 0.01 + 1);
                
                // Color variation: core is warm, outer arms are cooler
                const hueBase = 40 - (dist / maxDist) * 100; 
                star.hue = hueBase + (Math.random() - 0.5) * 30;
                star.sat = 60 + Math.random() * 40;
                star.light = 70 + Math.random() * 30;
                star.radius = 0.5 + Math.random() * 1.5;
            } 
            else if (type === 'core') {
                const dist = Math.random() * CONFIG.coreRadius;
                const angle = Math.random() * Math.PI * 2;
                
                star.x = centerX + Math.cos(angle) * dist;
                star.y = centerY + Math.sin(angle) * dist;
                star.dist = dist;
                star.angle = angle;
                star.speed = CONFIG.rotationSpeed * 1.5 / Math.sqrt(dist * 0.01 + 1);
                
                // Core is very warm and bright
                star.hue = 30 + Math.random() * 30;
                star.sat = 80 + Math.random() * 20;
                star.light = 80 + Math.random() * 20;
                star.radius = 0.8 + Math.random() * 2.0;
            } 
            else { // background
                const dist = maxDist + Math.random() * 200;
                const angle = Math.random() * Math.PI * 2;
                
                star.x = centerX + Math.cos(angle) * dist;
                star.y = centerY + Math.sin(angle) * dist;
                star.dist = dist;
                star.angle = angle;
                star.speed = 0; // Background stars barely rotate
                
                star.hue = 200 + Math.random() * 60; // Cool background stars
                star.sat = 20 + Math.random() * 30;
                star.light = 40 + Math.random() * 40;
                star.radius = 0.2 + Math.random() * 0.8;
            }

            // Twinkle properties
            star.baseAlpha = 0.4 + Math.random() * 0.6;
            star.twinklePhase = Math.random() * Math.PI * 2;
            star.twinkleSpeed = CONFIG.twinkleSpeed + Math.random() * 0.005;

            return star;
        }

        function init() {
            resize();
            stars = [];

            // Generate arm stars
            for (let i = 0; i < CONFIG.armStars * CONFIG.numArms; i++) {
                stars.push(createStar('arm'));
            }

            // Generate core stars
            for (let i = 0; i < CONFIG.coreStars; i++) {
                stars.push(createStar('core'));
            }

            // Generate background stars
            for (let i = 0; i < CONFIG.backgroundStars; i++) {
                stars.push(createStar('background'));
            }
        }

        function drawCoreGlow() {
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CONFIG.coreRadius * 1.5);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.2, 'rgba(255, 230, 180, 0.4)');
            gradient.addColorStop(0.5, 'rgba(255, 180, 100, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, CONFIG.coreRadius * 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            // Clear canvas with black
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Draw core glow
            drawCoreGlow();

            // Use 'lighter' composite operation for a glowing effect
            ctx.globalCompositeOperation = 'lighter';

            time += 1;

            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];

                // Update angle
                star.angle += star.speed;

                // Calculate new position based on angle and distance
                star.x = centerX + Math.cos(star.angle) * star.dist;
                star.y = centerY + Math.sin(star.angle) * star.dist;

                // Calculate twinkle
                const twinkle = Math.sin(time * star.twinkleSpeed + star.twinklePhase);
                const alpha = Math.max(0.1, Math.min(1, star.baseAlpha + twinkle * 0.3));

                // Draw star
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${star.hue}, ${star.sat}%, ${star.light}%, ${alpha})`;
                ctx.fill();
            }

            // Reset composite operation
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            // Re-center existing stars on resize
            const oldCenterX = width / 2;
            const oldCenterY = height / 2;
            // Recalculating positions on resize is complex, so we just re-init for simplicity
            init();
        });

        init();
        animate();
    </script>
</body>
</html>

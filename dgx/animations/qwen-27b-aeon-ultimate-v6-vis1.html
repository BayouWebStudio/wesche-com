<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" context="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];

        // Planet Configuration
        // distance: distance from sun
        // radius: size of planet
        // speed: orbital speed (radians per frame)
        // color: fill color
        const planets = [
            { name: "Mercury", distance: 60, radius: 4, speed: 0.02, color: "#A5A5A5", angle: Math.random() * Math.PI * 2 },
            { name: "Venus", distance: 90, radius: 7, speed: 0.015, color: "#E5C987", angle: Math.random() * Math.PI * 2 },
            { name: "Earth", distance: 130, radius: 8, speed: 0.01, color: "#4B9064", angle: Math.random() * Math.PI * 2 },
            { name: "Mars", distance: 170, radius: 5, speed: 0.008, color: "#C15E38", angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", distance: 240, radius: 20, speed: 0.004, color: "#D9A074", angle: Math.random() * Math.PI * 2 },
            { name: "Saturn", distance: 320, radius: 17, speed: 0.003, color: "#E0CDB0", angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: "Uranus", distance: 390, radius: 12, speed: 0.002, color: "#B8E8F0", angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", distance: 450, radius: 11, speed: 0.0015, color: "#4B60A5", angle: Math.random() * Math.PI * 2 }
        ];

        // Initialize Canvas Size
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }

        // Generate Random Starfield
        function generateStars() {
            stars = [];
            const starCount = 400;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        // Draw the Starfield
        function drawStars() {
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Draw the Sun
        function drawSun() {
            // Outer glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 60);
            gradient.addColorStop(0, '#FDB813'); // Core
            gradient.addColorStop(0.2, '#F28C1B'); // Inner
            gradient.addColorStop(0.5, 'rgba(242, 140, 27, 0.4)'); // Outer Glow
            gradient.addColorStop(1, 'rgba(242, 140, 27, 0)'); // Fade out

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();

            // Solid Core
            ctx.fillStyle = '#FDB813';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fill();
        }

        // Draw Orbits (Faint lines)
        function drawOrbits() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        // Draw Planets
        function drawPlanets() {
            planets.forEach(planet => {
                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Draw Planet Body
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw Saturn's Ring (Simple visual)
                if (planet.hasRing) {
                    ctx.strokeStyle = 'rgba(200, 180, 150, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    // Draw an ellipse-like ring
                    ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.6, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Update Angle for next frame
                planet.angle += planet.speed;
            });
        }

        // Main Animation Loop
        function animate() {
            // Clear Canvas
            ctx.clearRect(0, 0, width, height);

            // Draw Layers
            drawStars();
            drawOrbits();
            drawSun();
            drawPlanets();

            // Request Next Frame
            requestAnimationFrame(animate);
        }

        // Event Listeners
        window.addEventListener('resize', resize);

        // Start
        resize();
        animate();

    </script>
</body>
</html>

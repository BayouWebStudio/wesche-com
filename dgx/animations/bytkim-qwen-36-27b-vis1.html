<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000005;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            createStars();
        }

        // Generate random star positions
        const stars = [];
        function createStars() {
            stars.length = 0;
            const starCount = 300;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    opacity: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.005
                });
            }
        }

        // Planet definitions
        const planets = [
            { name: 'Mercury', radius: 4, orbitRadius: 60, speed: 0.02, color: '#A5A5A5', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', radius: 7, orbitRadius: 90, speed: 0.015, color: '#E3BB76', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', radius: 8, orbitRadius: 130, speed: 0.012, color: '#2E8BC0', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', radius: 6, orbitRadius: 170, speed: 0.01, color: '#E05C35', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', radius: 18, orbitRadius: 240, speed: 0.006, color: '#D4A574', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', radius: 15, orbitRadius: 310, speed: 0.004, color: '#F4D03F', angle: Math.random() * Math.PI * 2, hasRings: true },
            { name: 'Uranus', radius: 12, orbitRadius: 370, speed: 0.003, color: '#73C2D0', angle: Math.random() * Math.PI * 2 },
            { name: 'Neptune', radius: 11, orbitRadius: 420, speed: 0.0025, color: '#3B5998', angle: Math.random() * Math.PI * 2 }
        ];

        function drawStars() {
            const time = Date.now() * 0.001;
            stars.forEach(star => {
                const opacity = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed * 10);
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity * star.opacity})`;
                ctx.fill();
            });
        }

        function drawSun() {
            // Outer glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
            gradient.addColorStop(0, 'rgba(255, 255, 200, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 200, 50, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 150, 0, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Inner sun
            const sunGradient = ctx.createRadialGradient(centerX - 5, centerY - 5, 0, centerX, centerY, 25);
            sunGradient.addColorStop(0, '#FFFFFF');
            sunGradient.addColorStop(0.3, '#FFFACD');
            sunGradient.addColorStop(0.7, '#FFD700');
            sunGradient.addColorStop(1, '#FFA500');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            ctx.fillStyle = sunGradient;
            ctx.fill();
        }

        function drawOrbit(orbitRadius) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, orbitRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawPlanet(planet) {
            const x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
            const y = centerY + Math.sin(planet.angle) * planet.orbitRadius;

            // Draw rings for Saturn
            if (planet.hasRings) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(planet.angle + Math.PI / 2);
                
                const ringGradient = ctx.createRadialGradient(0, 0, planet.radius * 1.2, 0, 0, planet.radius * 2);
                ringGradient.addColorStop(0, 'rgba(210, 180, 140, 0.6)');
                ringGradient.addColorStop(0.5, 'rgba(210, 180, 140, 0.3)');
                ringGradient.addColorStop(1, 'rgba(210, 180, 140, 0)');
                
                ctx.beginPath();
                ctx.ellipse(0, 0, planet.radius * 2, planet.radius * 0.6, 0, 0, Math.PI * 2);
                ctx.fillStyle = ringGradient;
                ctx.fill();
                ctx.restore();
            }

            // Planet shadow/glow
            const glowGradient = ctx.createRadialGradient(x, y, planet.radius * 0.8, x, y, planet.radius * 1.5);
            glowGradient.addColorStop(0, planet.color);
            glowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.beginPath();
            ctx.arc(x, y, planet.radius * 1.5, 0, Math.PI * 2);
            ctx.fillStyle = glowGradient;
            ctx.fill();

            // Planet body
            const planetGradient = ctx.createRadialGradient(x - planet.radius / 3, y - planet.radius / 3, 0, x, y, planet.radius);
            planetGradient.addColorStop(0, lightenColor(planet.color, 30));
            planetGradient.addColorStop(1, planet.color);
            
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = planetGradient;
            ctx.fill();

            // Planet name label
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(planet.name, x, y + planet.radius + 15);
        }

        function lightenColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, (num >> 8 & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return `rgb(${R},${G},${B})`;
        }

        function update() {
            planets.forEach(planet => {
                planet.angle += planet.speed;
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Draw background
            drawStars();

            // Draw orbits
            planets.forEach(planet => {
                drawOrbit(planet.orbitRadius);
            });

            // Draw sun
            drawSun();

            // Draw planets
            planets.forEach(planet => {
                drawPlanet(planet);
            });

            update();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>

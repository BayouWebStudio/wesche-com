<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Prevent scrollbars */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    let stars = [];

    // Configuration for planets
    // Distances and sizes are not to scale (for visual clarity)
    const planets = [
        { name: 'Mercury', color: '#A5A5A5', size: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
        { name: 'Venus',   color: '#E3BB76', size: 8, distance: 90, speed: 0.03, angle: Math.random() * Math.PI * 2 },
        { name: 'Earth',   color: '#22A6F2', size: 9, distance: 130, speed: 0.025, angle: Math.random() * Math.PI * 2 },
        { name: 'Mars',    color: '#D14A38', size: 6, distance: 170, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: 'Jupiter', color: '#D6A566', size: 20, distance: 240, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: 'Saturn',  color: '#F2D385', size: 17, distance: 320, speed: 0.007, angle: Math.random() * Math.PI * 2, ring: true },
        { name: 'Uranus',  color: '#93B8BE', size: 12, distance: 390, speed: 0.005, angle: Math.random() * Math.PI * 2 },
        { name: 'Neptune', color: '#5B72B7', size: 11, distance: 450, speed: 0.003, angle: Math.random() * Math.PI * 2 }
    ];

    // Resize canvas to fill screen
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
        generateStars();
    }

    // Generate random stars
    function generateStars() {
        stars = [];
        const starCount = 400;
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    // Draw the starfield background
    function drawStars() {
        ctx.fillStyle = '#FFF';
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    // Draw the Sun
    function drawSun() {
        // Outer Glow
        ctx.shadowBlur = 50;
        ctx.shadowColor = '#FFD700';
        
        ctx.beginPath();
        ctx.arc(centerX, centerY, 35, 0, Math.PI * 2);
        ctx.fillStyle = '#FFD700'; // Gold
        ctx.fill();
        
        // Inner Core (White hot)
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
        ctx.fillStyle = '#FFF';
        ctx.fill();
    }

    // Draw Orbits and Planets
    function drawPlanets() {
        planets.forEach(planet => {
            // Update angle
            planet.angle += planet.speed;

            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Orbit Path (faint line)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();

            // Draw Planet
            ctx.beginPath();
            ctx.fillStyle = planet.color;
            
            // Add a subtle shadow to the planet for depth
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            
            ctx.arc(x, y, planet.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Special case for Saturn's Ring
            if (planet.ring) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.6)';
                ctx.lineWidth = 2;
                // Draw an ellipse-ish ring around the planet
                ctx.ellipse(x, y, planet.size + 8, planet.size / 2, planet.angle + Math.PI/4, 0, Math.PI * 2);
                ctx.stroke();
            }
        });
    }

    // Main Animation Loop
    function animate() {
        // Clear screen with a very slight fade effect for trails (optional, currently full clear)
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, width, height);

        drawStars();
        drawSun();
        drawPlanets();

        requestAnimationFrame(animate);
    }

    // Initialization
    window.addEventListener('resize', resize);
    resize(); // Initial setup
    animate(); // Start loop

</script>

</body>
</html>

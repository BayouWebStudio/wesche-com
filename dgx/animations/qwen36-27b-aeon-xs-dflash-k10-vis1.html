<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" context="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Fallback */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarSystem"></canvas>

<script>
    const canvas = document.getElementById('solarSystem');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    let stars = [];

    // Configuration
    const PLANETS = [
        { name: "Mercury", color: "#A5B1BF", radius: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
        { name: "Venus", color: "#E5C25A", radius: 7, distance: 90, speed: 0.03, angle: Math.random() * Math.PI * 2 },
        { name: "Earth", color: "#4B9075", radius: 8, distance: 130, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Mars", color: "#C14E34", radius: 6, distance: 170, speed: 0.016, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#D2A67F", radius: 18, distance: 240, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn", color: "#E0C89E", radius: 15, distance: 310, speed: 0.006, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus", color: "#8C9EBF", radius: 10, distance: 370, speed: 0.004, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#4B6EBF", radius: 10, distance: 420, speed: 0.003, angle: Math.random() * Math.PI * 2 }
    ];

    // Resize handling
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
        generateStars();
    }

    // Generate random starfield
    function generateStars() {
        stars = [];
        const numStars = 200;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                alpha: Math.random()
            });
        }
    }

    // Draw the Starfield
    function drawStars() {
        ctx.fillStyle = "#FFFFFF";
        stars.forEach(star => {
            ctx.globalAlpha = star.alpha;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    // Draw the Sun
    function drawSun() {
        ctx.save();
        ctx.translate(centerX, centerY);
        
        // Glow effect
        const gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 60);
        gradient.addColorStop(0, "#FDB813"); // Core
        gradient.addColorStop(0.5, "#FF9800"); // Mid
        gradient.addColorStop(1, "rgba(255, 152, 0, 0)"); // Edge

        // Outer Glow
        ctx.shadowBlur = 40;
        ctx.shadowColor = "#FFD700";
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fill();
        
        // Inner bright spot
        ctx.fillStyle = "#FFF";
        ctx.beginPath();
        ctx.arc(0, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    }

    // Draw Orbits and Planets
    function drawSolarSystem(time) {
        // Clear background
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, width, height);

        drawStars();
        drawSun();

        PLANETS.forEach(planet => {
            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Update angle
            planet.angle += planet.speed;

            // Draw Orbit Path
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();

            // Draw Planet
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Optional: Draw Ring for Saturn
            if (planet.hasRing) {
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 1.8, planet.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Planet Shadow (simple shading)
            ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Redraw the color on top to make it look spherical
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        requestAnimationFrame(drawSolarSystem);
    }

    // Initialize
    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(drawSolarSystem);

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Deep space black */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarCanvas"></canvas>

<script>
    const canvas = document.getElementById('solarCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Starfield data
    const stars = [];
    const numStars = 400;

    // Planet configuration
    // Distances and sizes are not to real scale for visual fit
    const planets = [
        { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   color: "#E3BB76", radius: 7, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   color: "#22A6B3", radius: 7, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    color: "#EB4D4B", radius: 5, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#F0932B", radius: 18, distance: 240, speed: 0.004, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  color: "#F6E58D", radius: 15, distance: 310, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus",  color: "#7ED6DF", radius: 10, distance: 370, speed: 0.002, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#4834D4", radius: 10, distance: 420, speed: 0.001, angle: Math.random() * Math.PI * 2 }
    ];

    // Initialize canvas size and stars
    function init() {
        resize();
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5 + 0.5,
                opacity: Math.random()
            });
        }
    }

    // Handle window resizing
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
    }

    // Draw the static starfield
    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0; // Reset opacity
    }

    // Draw the Sun with a glow effect
    function drawSun() {
        // Glow effect using shadow blur
        ctx.shadowBlur = 50;
        ctx.shadowColor = "#F9CA24";
        ctx.fillStyle = "#F9CA24";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
        ctx.fill();

        // Reset shadow for other elements
        ctx.shadowBlur = 0;
    }

    // Draw orbit paths
    function drawOrbits() {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        planets.forEach(planet => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();
        });
    }

    // Animation Loop
    function animate() {
        // Clear canvas
        ctx.clearRect(0, 0, width, height);

        // Draw background
        drawStars();
        drawOrbits();
        drawSun();

        // Draw and update planets
        planets.forEach(planet => {
            // Update angle
            planet.angle += planet.speed;

            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Planet
            ctx.fillStyle = planet.color;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Special rendering for Saturn's ring
            if (planet.hasRing) {
                ctx.strokeStyle = "rgba(200, 200, 200, 0.6)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Draw an ellipse to simulate a ring
                ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, planet.angle + Math.PI / 4, 0, Math.PI * 2);
                ctx.stroke();
            }
        });

        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);

    // Start
    init();
    animate();

</script>
</body>
</html>

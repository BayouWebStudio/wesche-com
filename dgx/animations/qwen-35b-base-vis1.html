<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let stars = [];
        let animationId;

        // Configuration for planets
        // Distances are scaled for visual fit, sizes are exaggerated for visibility
        const planets = [
            { name: "Mercury", color: "#A5A5A5", distance: 60, radius: 4, speed: 0.04, angle: Math.random() * Math.PI * 2 },
            { name: "Venus", color: "#E3BB76", distance: 90, radius: 7, speed: 0.015, angle: Math.random() * Math.PI * 2 },
            { name: "Earth", color: "#22A6F2", distance: 130, radius: 7.5, speed: 0.01, angle: Math.random() * Math.PI * 2 },
            { name: "Mars", color: "#FF5733", distance: 170, radius: 5, speed: 0.008, angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", color: "#D9A066", distance: 240, radius: 18, speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: "Saturn", color: "#EAD6B8", distance: 310, radius: 15, speed: 0.002, angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: "Uranus", color: "#D1F3F8", distance: 370, radius: 10, speed: 0.001, angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", color: "#3E54E8", distance: 420, radius: 10, speed: 0.0008, angle: Math.random() * Math.PI * 2 }
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            initStars();
        }

        function initStars() {
            stars = [];
            const starCount = 300;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    twinkleSpeed: 0.02 + Math.random() * 0.03
                });
            }
        }

        function drawStars() {
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.fill();

                // Twinkle effect
                star.alpha += star.twinkleSpeed;
                if (star.alpha > 1 || star.alpha < 0.2) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
            });
        }

        function drawSun() {
            // Sun Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 80);
            gradient.addColorStop(0, 'rgba(255, 200, 50, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 165, 0, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.3)');
            gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
            ctx.fill();

            // Sun Core
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.shadowBlur = 0; // Reset shadow
        }

        function drawPlanets() {
            planets.forEach(planet => {
                // Update position
                planet.angle += planet.speed;
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                // Draw Orbit Path
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Planet
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = planet.color;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset shadow for other elements

                // Draw Saturn's Ring
                if (planet.hasRing) {
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(234, 214, 184, 0.6)';
                    ctx.lineWidth = 4;
                    // Ellipse for ring
                    ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, planet.angle + Math.PI / 4, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });
        }

        function animate() {
            // Clear canvas with a slight fade for trails (optional, but here we clear fully)
            ctx.clearRect(0, 0, width, height);

            // Background
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            drawStars();
            drawSun();
            drawPlanets();

            animationId = requestAnimationFrame(animate);
        }

        // Initialization
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>

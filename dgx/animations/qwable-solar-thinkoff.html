<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505; /* Fallback color */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="solarCanvas"></canvas>

<script>
    const canvas = document.getElementById('solarCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;

    // Configuration for the planets
    // Distances and sizes are stylized for visual appeal, not astronomical accuracy
    const planets = [
        { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
        { name: "Venus",   color: "#E3BB76", radius: 7, distance: 90, speed: 0.03, angle: Math.random() * Math.PI * 2 },
        { name: "Earth",   color: "#22A6F2", radius: 7, distance: 130, speed: 0.025, angle: Math.random() * Math.PI * 2 },
        { name: "Mars",    color: "#DD4C22", radius: 5, distance: 170, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#D6A566", radius: 18, distance: 240, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn",  color: "#F4D03F", radius: 15, distance: 310, speed: 0.008, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus",  color: "#7DE3F4", radius: 10, distance: 370, speed: 0.006, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#3E54E8", radius: 10, distance: 420, speed: 0.005, angle: Math.random() * Math.PI * 2 }
    ];

    // Starfield data
    const stars = [];
    const numStars = 400;

    function init() {
        resize();
        generateStars();
        animate();
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
    }

    function generateStars() {
        stars.length = 0;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    function drawStars() {
        ctx.fillStyle = "white";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    function drawSun() {
        // Outer Glow
        const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, 80);
        gradient.addColorStop(0, "rgba(255, 200, 0, 1)");
        gradient.addColorStop(0.2, "rgba(255, 150, 0, 0.8)");
        gradient.addColorStop(0.5, "rgba(255, 100, 0, 0.2)");
        gradient.addColorStop(1, "rgba(255, 50, 0, 0)");

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 80, 0, Math.PI * 2);
        ctx.fill();

        // Sun Core
        ctx.fillStyle = "#FFF59D";
        ctx.beginPath();
        ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawPlanets() {
        planets.forEach(planet => {
            // Update angle
            planet.angle += planet.speed;

            // Calculate position
            const x = centerX + Math.cos(planet.angle) * planet.distance;
            const y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Orbit Path
            ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
            ctx.stroke();

            // Draw Planet Shadow (simple 3D effect)
            const shadowGrad = ctx.createRadialGradient(x - planet.radius/3, y - planet.radius/3, planet.radius/4, x, y, planet.radius);
            shadowGrad.addColorStop(0, planet.color);
            shadowGrad.addColorStop(1, "black");

            ctx.fillStyle = shadowGrad;
            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Special handling for Saturn's rings
            if (planet.hasRing) {
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Draw an ellipse-like ring
                ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.8, planet.angle + Math.PI/4, 0, Math.PI * 2);
                ctx.stroke();
            }
        });
    }

    function animate() {
        // Clear canvas with a very slight transparency for a trail effect (optional, currently set to full clear)
        ctx.fillStyle = "#050505"; 
        ctx.fillRect(0, 0, width, height);

        drawStars();
        drawSun();
        drawPlanets();

        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', () => {
        resize();
        generateStars(); // Regenerate stars to fill new screen dimensions
    });

    // Start
    init();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const starCount = 600;
        const stars = [];

        // Configuration
        const arms = 2; // Number of spiral arms
        const tightness = 0.005; // How tight the spiral is
        const baseSpeed = 0.002; // Base rotation speed

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random angle and distance
                this.angle = Math.random() * Math.PI * 2;
                // Distribute stars more towards center, but some far out
                const r = Math.random();
                this.radius = Math.pow(r, 0.8) * Math.min(width, height) * 0.4;
                
                // Assign to a spiral arm
                const armIndex = Math.floor(Math.random() * arms);
                const armAngle = (Math.PI * 2 * armIndex) / arms;
                
                // Offset angle by arm position and some randomness
                this.angle = armAngle + (Math.random() - 0.5) * 0.5;
                
                // Calculate starting position
                this.x = centerX + Math.cos(this.angle) * this.radius;
                this.y = centerY + Math.sin(this.angle) * this.radius;
                
                // Properties for animation
                this.speed = baseSpeed + Math.random() * 0.002;
                this.size = Math.random() * 1.5 + 0.5;
                
                // Color variation based on distance from center
                // Close to center: Yellow/White, Far: Blue/Cool
                const distFactor = this.radius / (Math.min(width, height) * 0.4);
                const hue = 200 - (distFactor * 180); // Blue to Yellow
                this.color = `hsla(${hue}, 80%, ${60 + Math.random() * 20}%,`;
                
                // Twinkle properties
                this.twinkleSpeed = 0.02 + Math.random() * 0.03;
                this.twinkleOffset = Math.random() * Math.PI * 2;
                this.baseAlpha = 0.6 + Math.random() * 0.4;
            }

            update() {
                // Rotate the star
                this.angle += this.speed;
                
                // Update position
                this.x = centerX + Math.cos(this.angle) * this.radius;
                this.y = centerY + Math.sin(this.angle) * this.radius;
                
                // Twinkle effect
                this.currentAlpha = this.baseAlpha * (0.5 + 0.5 * Math.sin(Date.now() * this.twinkleSpeed + this.twinkleOffset));
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + this.currentAlpha + ')';
                ctx.fill();
            }
        }

        function init() {
            resize();
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Create a glowing core
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 80);
            gradient.addColorStop(0, 'rgba(255, 255, 240, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 250, 200, 0.8)');
            gradient.addColorStop(0.5, 'rgba(200, 220, 255, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            // Draw the bright core
            drawCore();
            
            // Update and draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        animate();
    </script>
</body>
</html>

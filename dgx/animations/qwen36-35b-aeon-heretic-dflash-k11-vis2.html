<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>
    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let centerX, centerY;
        let stars = [];
        const STAR_COUNT = 1500;
        const SPINCHES = 4;
        const CORE_SIZE = 80;
        const MAX_RADIUS = 600;

        // Resize handler
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Star class
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Random distance from center
                this.r = Math.random() * MAX_RADIUS;
                
                // Angle offset for spiral arms
                this.theta = Math.random() * Math.PI * 2;
                
                // Determine which arm this star belongs to
                this.armIndex = Math.floor(Math.random() * SPINCHES);
                
                // Add some noise to the angle to make arms less rigid
                this.theta += (this.armIndex / SPINCHES) * Math.PI * 2;
                
                // Add some spread to the angle based on distance
                this.theta += (Math.random() - 0.5) * (0.5 / (1 + this.r / 100));
                
                // Size
                this.size = Math.random() * 2 + 0.5;
                
                // Twinkle speed
                this.twinkleSpeed = 0.02 + Math.random() * 0.05;
                this.twinklePhase = Math.random() * Math.PI * 2;
                
                // Color variation
                const colorRand = Math.random();
                if (colorRand < 0.7) {
                    // White-ish
                    this.color = `rgba(255, 255, 255,`;
                } else if (colorRand < 0.85) {
                    // Blue-ish
                    this.color = `rgba(150, 200, 255,`;
                } else if (colorRand < 0.95) {
                    // Yellow-ish
                    this.color = `rgba(255, 220, 150,`;
                } else {
                    // Red-ish
                    this.color = `rgba(255, 150, 100,`;
                }
                
                // Brightness
                this.brightness = 0.5 + Math.random() * 0.5;
            }

            draw(currentAngle) {
                // Calculate current position with rotation
                const currentTheta = this.theta + currentAngle;
                const x = centerX + this.r * Math.cos(currentTheta);
                const y = centerY + this.r * Math.sin(currentTheta);
                
                // Calculate twinkle
                const twinkle = Math.sin(this.twinklePhase) * 0.3 + 0.7;
                this.twinklePhase += this.twinkleSpeed;
                
                // Calculate alpha based on brightness and twinkle
                const alpha = this.brightness * twinkle;
                
                // Draw star
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color + alpha + ')';
                ctx.fill();
            }
        }

        // Initialize stars
        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        // Draw core glow
        function drawCore() {
            // Create radial gradient for core
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, CORE_SIZE * 2
            );
            
            // Add multiple color stops for a more realistic core
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.1, 'rgba(255, 240, 220, 0.6)');
            gradient.addColorStop(0.3, 'rgba(255, 200, 150, 0.3)');
            gradient.addColorStop(0.7, 'rgba(200, 150, 100, 0.1)');
            gradient.addColorStop(1, 'rgba(150, 100, 50, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, CORE_SIZE * 2, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // Animation loop
        let currentAngle = 0;
        let lastTime = 0;
        
        function animate(timestamp) {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Slight transparency for trails
            ctx.fillRect(0, 0, width, height);
            
            // Draw core
            drawCore();
            
            // Draw stars
            for (let star of stars) {
                star.draw(currentAngle);
            }
            
            // Update angle for rotation
            currentAngle += 0.001;
            
            // Continue animation
            requestAnimationFrame(animate);
        }

        // Initialize and start
        initStars();
        requestAnimationFrame(animate);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>

    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        // Resize canvas to full window
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Generate random stars for background
        const stars = [];
        const numStars = 300;
        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * 2000 - 500, // Spread wider than screen
                y: Math.random() * 2000 - 500,
                size: Math.random() * 2 + 0.5,
                opacity: Math.random()
            });
        }

        // Planet configuration
        // Distances and speeds are relative for visual balance
        const planets = [
            { name: "Mercury", radius: 4, distance: 60, speed: 0.04, color: "#A5A5A5", angle: Math.random() * Math.PI * 2 },
            { name: "Venus", radius: 7, distance: 90, speed: 0.025, color: "#E3BB76", angle: Math.random() * Math.PI * 2 },
            { name: "Earth", radius: 7.5, distance: 130, speed: 0.02, color: "#22A6F2", angle: Math.random() * Math.PI * 2 },
            { name: "Mars", radius: 5, distance: 170, speed: 0.016, color: "#E27B58", angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", radius: 18, distance: 240, speed: 0.008, color: "#D6A566", angle: Math.random() * Math.PI * 2 },
            { name: "Saturn", radius: 15, distance: 310, speed: 0.006, color: "#F4D03F", angle: Math.random() * Math.PI * 2, hasRings: true }
        ];

        function drawStars() {
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function drawSun() {
            // Sun Glow
            ctx.shadowBlur = 50;
            ctx.shadowColor = "#FDB813";
            
            // Sun Body
            ctx.fillStyle = "#FDB813";
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Reset shadow for other elements
            ctx.shadowBlur = 0;
        }

        function drawOrbit(distance) {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, distance, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawPlanet(planet) {
            // Calculate position
            planet.x = centerX + Math.cos(planet.angle) * planet.distance;
            planet.y = centerY + Math.sin(planet.angle) * planet.distance;

            // Draw Orbit Path
            drawOrbit(planet.distance);

            // Draw Planet
            ctx.fillStyle = planet.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = planet.color;
            
            ctx.beginPath();
            ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Saturn's Rings
            if (planet.hasRings) {
                ctx.shadowBlur = 0;
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 3;
                ctx.beginPath();
                // Ellipse approximation for rings
                ctx.ellipse(planet.x, planet.y, planet.radius * 2.2, planet.radius * 0.8, planet.angle, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Reset shadow
            ctx.shadowBlur = 0;
        }

        function animate() {
            // Clear canvas with slight fade effect for trails? No, clean clear requested.
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, width, height);

            // Draw Stars
            drawStars();

            // Draw Sun
            drawSun();

            // Draw Planets
            planets.forEach(planet => {
                drawPlanet(planet);
                planet.angle += planet.speed;
            });

            requestAnimationFrame(animate);
        }

        // Start animation
        animate();

    </script>
</body>
</html>

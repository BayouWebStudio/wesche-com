<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" context="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="controls">
    <h3>Solar System</h3>
    <p>Hover over planets to see names.</p>
</div>
<canvas id="solarCanvas"></canvas>

<script>
    const canvas = document.getElementById('solarCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY;
    let stars = [];
    const mouse = { x: -100, y: -100 };

    // Configuration for planets
    // Distances and sizes are not to scale (for visibility)
    const planets = [
        { name: "Mercury", color: "#A5A5A5", radius: 6, distance: 60, speed: 0.02, angle: Math.random() * Math.PI * 2 },
        { name: "Venus", color: "#E39E44", radius: 10, distance: 90, speed: 0.015, angle: Math.random() * Math.PI * 2 },
        { name: "Earth", color: "#22A0D6", radius: 10.5, distance: 130, speed: 0.01, angle: Math.random() * Math.PI * 2 },
        { name: "Mars", color: "#D64222", radius: 8, distance: 170, speed: 0.008, angle: Math.random() * Math.PI * 2 },
        { name: "Jupiter", color: "#D6A35B", radius: 22, distance: 240, speed: 0.004, angle: Math.random() * Math.PI * 2 },
        { name: "Saturn", color: "#F2D29B", radius: 18, distance: 310, speed: 0.003, angle: Math.random() * Math.PI * 2, hasRing: true },
        { name: "Uranus", color: "#82C4C4", radius: 14, distance: 370, speed: 0.002, angle: Math.random() * Math.PI * 2 },
        { name: "Neptune", color: "#4262D6", radius: 13, distance: 420, speed: 0.0015, angle: Math.random() * Math.PI * 2 }
    ];

    // Initialize Canvas Size
    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
        generateStars();
    }

    // Generate Starfield
    function generateStars() {
        stars = [];
        for (let i = 0; i < 300; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    // Draw Stars
    function drawStars() {
        ctx.fillStyle = "#FFF";
        stars.forEach(star => {
            ctx.globalAlpha = star.opacity;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    // Draw Sun
    function drawSun() {
        // Outer Glow
        ctx.save();
        ctx.shadowBlur = 50;
        ctx.shadowColor = "#FDB813";
        
        // Sun Body
        const sunRadius = 35;
        const gradient = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.2, centerX, centerY, sunRadius);
        gradient.addColorStop(0, "#FFF");
        gradient.addColorStop(0.3, "#FDB813");
        gradient.addColorStop(1, "#F27200");

        ctx.beginPath();
        ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.restore();
    }

    // Draw Orbit Paths
    function drawOrbits() {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1;
        planets.forEach(p => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, p.distance, 0, Math.PI * 2);
            ctx.stroke();
        });
    }

    // Draw Planets
    function drawPlanets() {
        planets.forEach(p => {
            // Update Angle
            p.angle += p.speed;

            // Calculate Position
            const x = centerX + Math.cos(p.angle) * p.distance;
            const y = centerY + Math.sin(p.angle) * p.distance;

            // Store current position for interaction
            p.currentX = x;
            p.currentY = y;

            // Draw Planet Body
            ctx.save();
            ctx.shadowBlur = 5;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(x, y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Draw Saturn's Ring (Simple visual)
            if (p.hasRing) {
                ctx.save();
                ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Ellipse approximation
                ctx.ellipse(x, y, p.radius * 2, p.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // Draw Label on Hover
            const distToMouse = Math.hypot(mouse.x - x, mouse.y - y);
            if (distToMouse < p.radius + 10) {
                ctx.fillStyle = "#FFF";
                ctx.font = "14px Arial";
                ctx.textAlign = "center";
                ctx.fillText(p.name, x, y - p.radius - 10);
                canvas.style.cursor = 'pointer';
            } else {
                canvas.style.cursor = 'default';
            }
        });
    }

    // Animation Loop
    function animate() {
        // Clear Canvas
        ctx.clearRect(0, 0, width, height);

        // Draw Elements
        drawStars();
        drawOrbits();
        drawSun();
        drawPlanets();

        requestAnimationFrame(animate);
    }

    // Event Listeners
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    // Initialize
    resize();
    animate();

</script>
</body>
</html>

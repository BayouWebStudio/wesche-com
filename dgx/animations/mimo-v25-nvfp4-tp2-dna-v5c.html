<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Double Helix Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>

    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        // DNA Parameters
        const numNodes = 40;
        const nodeSpacing = 30;
        const amplitude = 120;
        const verticalSpeed = 0.8;
        const rotationSpeed = 0.02;
        const nodeRadius = 6;
        const rungWidth = 2;

        // Color palettes for the two strands
        const strandColors = [
            { base: [70, 130, 230], glow: [100, 160, 255] },   // Blue strand
            { base: [220, 100, 70], glow: [255, 130, 100] }    // Orange/Red strand
        ];

        let time = 0;

        function draw() {
            ctx.clearRect(0, 0, width, height);

            const centerX = width / 2;
            const centerY = height / 2;

            // Store positions of nodes to draw rungs later
            const strandA = [];
            const strandB = [];

            for (let i = 0; i < numNodes; i++) {
                const t = (i / numNodes) * Math.PI * 4 + time;
                const y = centerY - (numNodes * nodeSpacing) / 2 + i * nodeSpacing;

                // Strand A position
                const xA = centerX + Math.sin(t) * amplitude;
                const zA = Math.cos(t); // Z-depth factor (-1 to 1)

                // Strand B position (offset by PI)
                const xB = centerX + Math.sin(t + Math.PI) * amplitude;
                const zB = Math.cos(t + Math.PI);

                strandA.push({ x: xA, y: y, z: zA });
                strandB.push({ x: xB, y: y, z: zB });
            }

            // Draw Rungs first (behind the nodes if they are far back)
            // We need to sort all elements by Z-depth to handle occlusion properly,
            // but for simplicity and performance, we'll draw rungs then nodes 
            // with varying opacity based on depth.
            
            // Draw connecting rungs
            for (let i = 0; i < numNodes; i++) {
                const pA = strandA[i];
                const pB = strandB[i];
                
                // Average Z for depth sorting logic (simplified)
                const avgZ = (pA.z + pB.z) / 2;
                const depthAlpha = 0.15 + (avgZ + 1) * 0.25; // Range roughly 0.15 to 0.65

                ctx.beginPath();
                ctx.moveTo(pA.x, pA.y);
                ctx.lineTo(pB.x, pB.y);
                ctx.strokeStyle = `rgba(120, 120, 150, ${depthAlpha})`;
                ctx.lineWidth = rungWidth;
                ctx.stroke();

                // Small circles at connection points (optional, makes it look like bonds)
                if (Math.abs(avgZ) > 0.5) {
                    // Only show dots if somewhat visible
                    ctx.fillStyle = `rgba(120, 120, 150, ${depthAlpha * 0.5})`;
                    ctx.beginPath();
                    ctx.arc((pA.x + pB.x)/2, (pA.y + pB.y)/2, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            }

            // Draw Strands (lines connecting sequential nodes)
            for (let s = 0; s < 2; s++) {
                const strand = s === 0 ? strandA : strandB;
                const colors = strandColors[s];

                ctx.beginPath();
                for (let i = 0; i < strand.length; i++) {
                    const p = strand[i];
                    if (i === 0) {
                        ctx.moveTo(p.x, p.y);
                    } else {
                        ctx.lineTo(p.x, p.y);
                    }
                }
                
                // Create gradient or just use alpha
                // Since lines cross depth, a simple stroke is easiest
                // To make it look 3D, we vary the line width slightly or just rely on node size
                
                ctx.strokeStyle = `rgba(${colors.base[0]}, ${colors.base[1]}, ${colors.base[2]}, 0.6)`;
                ctx.lineWidth = 3;
                ctx.lineJoin = 'round';
                ctx.stroke();
            }

            // Draw Nodes (circles)
            // We need to draw them in order of Z-depth so front covers back.
            // Collect all nodes into one array with Z info
            const allNodes = [];
            
            for (let i = 0; i < numNodes; i++) {
                const pA = strandA[i];
                const pB = strandB[i];
                
                allNodes.push({
                    x: pA.x, y: pA.y, z: pA.z, 
                    color: strandColors[0],
                    type: 'node'
                });
                allNodes.push({
                    x: pB.x, y: pB.y, z: pB.z, 
                    color: strandColors[1],
                    type: 'node'
                });
            }

            // Sort nodes from lowest Z (back) to highest Z (front)
            allNodes.sort((a, b) => a.z - b.z);

            for (const node of allNodes) {
                const scale = 0.6 + (node.z + 1) * 0.4; // Scale 0.6 to 1.4
                const radius = nodeRadius * scale;
                const alpha = 0.3 + (node.z + 1) * 0.35; // Alpha 0.3 to 1.0

                // Glow effect
                const gradient = ctx.createRadialGradient(
                    node.x, node.y, 0, 
                    node.x, node.y, radius * 2.5
                );
                gradient.addColorStop(0, `rgba(${node.color.glow[0]}, ${node.color.glow[1]}, ${node.color.glow[2]}, ${alpha * 0.5})`);
                gradient.addColorStop(1, `rgba(${node.color.glow[0]}, ${node.color.glow[1]}, ${node.color.glow[2]}, 0)`);

                ctx.beginPath();
                ctx.arc(node.x, node.y, radius * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Solid core
                ctx.beginPath();
                ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${node.color.base[0]}, ${node.color.base[1]}, ${node.color.base[2]}, ${alpha})`;
                ctx.fill();
                
                // Highlight
                ctx.beginPath();
                ctx.arc(node.x - radius * 0.2, node.y - radius * 0.2, radius * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
                ctx.fill();
            }

            time += rotationSpeed;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>

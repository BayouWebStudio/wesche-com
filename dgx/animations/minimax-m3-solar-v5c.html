<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System Animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="solarSystem"></canvas>
<script>
(function() {
  const canvas = document.getElementById('solarSystem');
  const ctx = canvas.getContext('2d');

  let width, height, cx, cy;
  let stars = [];
  let planets = [];

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    cx = width / 2;
    cy = height / 2;
    initStars();
    initPlanets();
  }

  function initStars() {
    stars = [];
    const count = Math.floor((width * height) / 2500);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.2 + 0.2,
        twinkle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.005
      });
    }
  }

  function initPlanets() {
    planets = [
      { name: 'Mercury', radius: 8,  orbit: 70,  speed: 0.020, color: '#b0a090', glow: 'rgba(176,160,144,0.3)', angle: 0 },
      { name: 'Venus',   radius: 14, orbit: 110, speed: 0.015, color: '#e8c282', glow: 'rgba(232,194,130,0.3)', angle: 1.2 },
      { name: 'Earth',   radius: 15, orbit: 160, speed: 0.012, color: '#4fa8e8', glow: 'rgba(79,168,232,0.3)', angle: 2.5 },
      { name: 'Mars',    radius: 11, orbit: 210, speed: 0.010, color: '#d05a3a', glow: 'rgba(208,90,58,0.3)', angle: 4.0 },
      { name: 'Jupiter', radius: 28, orbit: 290, speed: 0.006, color: '#d8a878', glow: 'rgba(216,168,120,0.3)', angle: 0.8 },
      { name: 'Saturn',  radius: 24, orbit: 360, speed: 0.004, color: '#e8d090', glow: 'rgba(232,208,144,0.3)', angle: 3.3, ring: true },
      { name: 'Uranus',  radius: 18, orbit: 430, speed: 0.003, color: '#8ed8e0', glow: 'rgba(142,216,224,0.3)', angle: 5.0 },
      { name: 'Neptune', radius: 17, orbit: 500, speed: 0.002, color: '#4060d0', glow: 'rgba(64,96,208,0.3)', angle: 1.8 }
    ];

    // Scale orbits to fit screen
    const maxOrbit = planets[planets.length - 1].orbit;
    const maxAllowed = Math.min(width, height) * 0.45;
    if (maxOrbit > maxAllowed) {
      const scale = maxAllowed / maxOrbit;
      planets.forEach(p => {
        p.orbit *= scale;
        p.radius *= scale;
      });
    }
  }

  function drawStars(time) {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const alpha = 0.5 + 0.5 * Math.sin(s.twinkle + time * s.speed);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
      ctx.fill();
    }
  }

  function drawSun(time) {
    const baseRadius = 30;
    const pulse = Math.sin(time * 0.002) * 3;

    // Outer glow layers
    const glowLayers = [
      { r: baseRadius + 60 + pulse, color: 'rgba(255,180,60,0.05)' },
      { r: baseRadius + 45 + pulse, color: 'rgba(255,200,80,0.10)' },
      { r: baseRadius + 30 + pulse, color: 'rgba(255,220,120,0.18)' }
    ];

    glowLayers.forEach(layer => {
      const grad = ctx.createRadialGradient(cx, cy, baseRadius, cx, cy, layer.r);
      grad.addColorStop(0, layer.color);
      grad.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.beginPath();
      ctx.arc(cx, cy, layer.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    });

    // Sun core
    const coreGrad = ctx.createRadialGradient(cx - 5, cy - 5, 2, cx, cy, baseRadius);
    coreGrad.addColorStop(0, '#fff8e0');
    coreGrad.addColorStop(0.3, '#ffd860');
    coreGrad.addColorStop(0.7, '#ff9a30');
    coreGrad.addColorStop(1, '#ff6020');

    ctx.beginPath();
    ctx.arc(cx, cy, baseRadius, 0, Math.PI * 2);
    ctx.fillStyle = coreGrad;
    ctx.fill();

    // Sun corona shimmer
    ctx.beginPath();
    ctx.arc(cx, cy, baseRadius + 2 + Math.sin(time * 0.005) * 1.5, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,230,150,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawOrbit(orbit) {
    ctx.beginPath();
    ctx.arc(cx, cy, orbit, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100,140,200,0.12)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function drawPlanet(p) {
    const x = cx + Math.cos(p.angle) * p.orbit;
    const y = cy + Math.sin(p.angle) * p.orbit;

    // Planet glow
    const glowGrad = ctx.createRadialGradient(x, y, p.radius * 0.3, x, y, p.radius * 2.2);
    glowGrad.addColorStop(0, p.glow);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(x, y, p.radius * 2.2, 0, Math.PI * 2);
    ctx.fillStyle = glowGrad;
    ctx.fill();

    // Saturn ring
    if (p.ring) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.4);
      ctx.beginPath();
      ctx.ellipse(0, 0, p.radius * 1.9, p.radius * 0.6, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(220,190,130,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(0, 0, p.radius * 2.3, p.radius * 0.75, 0, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(220,190,130,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    // Planet body with shading
    const bodyGrad = ctx.createRadialGradient(
      x - p.radius * 0.35, y - p.radius * 0.35, p.radius * 0.1,
      x, y, p.radius
    );
    bodyGrad.addColorStop(0, lightenColor(p.color, 0.6));
    bodyGrad.addColorStop(0.5, p.color);
    bodyGrad.addColorStop(1, darkenColor(p.color, 0.5));

    ctx.beginPath();
    ctx.arc(x, y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
  }

  function lightenColor(hex, amount) {
    const c = hexToRgb(hex);
    return 'rgb(' +
      Math.min(255, Math.floor(c.r + (255 - c.r) * amount)) + ',' +
      Math.min(255, Math.floor(c.g + (255 - c.g) * amount)) + ',' +
      Math.min(255, Math.floor(c.b + (255 - c.b) * amount)) + ')';
  }

  function darkenColor(hex, amount) {
    const c = hexToRgb(hex);
    return 'rgb(' +
      Math.floor(c.r * (1 - amount)) + ',' +
      Math.floor(c.g * (1 - amount)) + ',' +
      Math.floor(c.b * (1 - amount)) + ')';
  }

  function hexToRgb(hex) {
    const v = hex.replace('#', '');
    return {
      r: parseInt(v.substring(0, 2), 16),
      g: parseInt(v.substring(2, 4), 16),
      b: parseInt(v.substring(4, 6), 16)
    };
  }

  function animate(time) {
    // Background with slight trail effect
    ctx.fillStyle = 'rgba(2, 4, 12, 1)';
    ctx.fillRect(0, 0, width, height);

    drawStars(time);
    drawSun(time);

    planets.forEach(p => {
      drawOrbit(p.orbit);
    });

    planets.forEach(p => {
      p.angle += p.speed;
      drawPlanet(p);
    });

    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>

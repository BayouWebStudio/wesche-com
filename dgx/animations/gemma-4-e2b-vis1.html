<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystemCanvas"></canvas>

    <script>
        const canvas = document.getElementById('solarSystemCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size to fill the window
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Simulation Parameters ---

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const sunRadius = 20;
        const planets = [];

        // Define the solar system bodies: [radius, orbitalSpeed (radians per frame), color, size]
        const solarSystemData = [
            // Sun (not orbiting, just glows)
            { type: 'sun', radius: 0, speed: 0, color: 'yellow', size: sunRadius * 2 },
            // Mercury
            { type: 'planet', radius: 100, speed: 0.015, color: 'gray', size: 4 },
            // Venus
            { type: 'planet', radius: 150, speed: 0.010, color: '#f0e68c', size: 5 },
            // Earth
            { type: 'planet', radius: 220, speed: 0.007, color: '#1e90ff', size: 5 },
            // Mars
            { type: 'planet', radius: 290, speed: 0.005, color: '#e44d26', size: 4 },
            // Jupiter
            { type: 'planet', radius: 380, speed: 0.003, color: '#ff8c00', size: 8 },
            // Saturn
            { type: 'planet', radius: 480, speed: 0.002, color: '#f0e68c', size: 7 },
            // Uranus
            { type: 'planet', radius: 580, speed: 0.001, color: '#b0e0e6', size: 5 },
            // Neptune
            { type: 'planet', radius: 680, speed: 0.0008, color: '#4169e1', size: 5 }
        ];

        // Initialize planets array
        solarSystemData.forEach(data => {
            if (data.type !== 'sun') {
                planets.push({
                    ...data,
                    angle: Math.random() * Math.PI * 2, // Start at a random position
                    orbitRadius: data.radius,
                    orbitSpeed: data.speed,
                    color: data.color,
                    size: data.size
                });
            }
        });


        // --- Drawing Functions ---

        function drawStarfield() {
            // Dark background (already handled by CSS, but drawing subtle stars helps)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; // Slight fade for trailing effect
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw random stars
            const starCount = 100;
            for (let i = 0; i < starCount; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 1.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.8})`;
                ctx.fillRect(x, y, size, size);
            }
        }

        function drawSun() {
            const sunData = solarSystemData.find(d => d.type === 'sun');
            const radius = sunData.size;
            
            // Create a glowing effect
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0, 
                centerX, centerY, radius * 2
            );
            gradient.addColorStop(0, 'rgba(255, 255, 150, 1)'); // Bright center
            gradient.addColorStop(0.8, 'rgba(255, 165, 0, 0.7)'); // Orange glow
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); // Transparent edge

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius * 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPlanet(planet) {
            const { radius, angle, orbitRadius, color, size } = planet;

            // Calculate current position based on angle and radius
            const x = centerX + orbitRadius * Math.cos(angle);
            const y = centerY + orbitRadius * Math.sin(angle);

            // Draw the planet body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();

            // Optional: Draw a subtle orbit line
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(centerX, centerY, orbitRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        // --- Animation Loop ---

        function animate() {
            // 1. Clear the canvas (or redraw the starfield effect)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawStarfield();

            // 2. Update and Draw Bodies
            solarSystemData.find(d => d.type === 'sun')?.radius = sunRadius * 2; // Update sun size if needed

            planets.forEach(planet => {
                // Update angle based on speed
                planet.angle += planet.orbitSpeed;

                // Calculate new position
                const x = centerX + planet.orbitRadius * Math.cos(planet.angle);
                const y = centerY + planet.orbitRadius * Math.sin(planet.angle);

                // Draw the planet
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(x, y, planet.size, 0, Math.PI * 2);
                ctx.fill();
            });

            drawSun();

            // Request the next frame
            requestAnimationFrame(animate);
        }

        // Start the animation
        animate();

    </script>
</body>
</html>

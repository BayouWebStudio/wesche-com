<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }

        // Starfield
        const stars = [];
        function generateStars() {
            stars.length = 0;
            const count = Math.floor((width * height) / 1500);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.2,
                    opacity: Math.random()
                });
            }
        }

        // Planet data (scaled for visual representation)
        const planets = [
            { name: 'Mercury', radius: 4, orbitRadius: 60, speed: 0.02, color: '#A5A5A5', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', radius: 8, orbitRadius: 90, speed: 0.015, color: '#E3BB76', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', radius: 9, orbitRadius: 130, speed: 0.01, color: '#22A6F2', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', radius: 6, orbitRadius: 170, speed: 0.008, color: '#FF4500', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', radius: 22, orbitRadius: 240, speed: 0.004, color: '#D48A5F', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', radius: 18, orbitRadius: 320, speed: 0.003, color: '#E8D191', angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: 'Uranus', radius: 14, orbitRadius: 390, speed: 0.002, color: '#80D6E6', angle: Math.random() * Math.PI * 2 },
            { name: 'Neptune', radius: 13, orbitRadius: 450, speed: 0.0015, color: '#3F54BA', angle: Math.random() * Math.PI * 2 }
        ];

        function drawStars() {
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();
            });
        }

        function drawSun() {
            // Outer glow
            for (let i = 4; i > 0; i--) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, 25 + i * 8, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 160, 50, ${0.1 / i})`;
                ctx.fill();
            }

            // Core
            const gradient = ctx.createRadialGradient(centerX, centerY, 5, centerX, centerY, 25);
            gradient.addColorStop(0, '#FFF');
            gradient.addColorStop(0.2, '#FFD700');
            gradient.addColorStop(0.8, '#FF8C00');
            gradient.addColorStop(1, '#FF4500');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        function drawOrbits() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.orbitRadius, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        function drawPlanet(planet) {
            const x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
            const y = centerY + Math.sin(planet.angle) * planet.orbitRadius;

            // Planet shadow/glow
            ctx.beginPath();
            ctx.arc(x, y, planet.radius + 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fill();

            // Planet body
            const gradient = ctx.createRadialGradient(
                x - planet.radius / 3, y - planet.radius / 3, planet.radius / 4,
                x, y, planet.radius
            );
            gradient.addColorStop(0, lightenColor(planet.color, 40));
            gradient.addColorStop(1, planet.color);

            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Saturn's Ring
            if (planet.hasRing) {
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 2.2, planet.radius * 0.6, Math.PI / 6, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(210, 180, 140, 0.6)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        function updatePlanets() {
            planets.forEach(planet => {
                planet.angle += planet.speed;
            });
        }

        function lightenColor(color, percent) {
            const num = parseInt(color.replace("#",""), 16),
                amt = Math.round(2.55 * percent),
                R = (num >> 16) + amt,
                B = (num >> 8 & 0x00FF) + amt,
                G = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            drawStars();
            drawOrbits();
            drawSun();
            
            updatePlanets();
            planets.forEach(planet => drawPlanet(planet));

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>

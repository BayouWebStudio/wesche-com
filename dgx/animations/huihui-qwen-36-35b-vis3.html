<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating DNA Double Helix</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="dnaCanvas"></canvas>
    <script>
        const canvas = document.getElementById('dnaCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const numNodes = 60;
        const radius = 150;
        const verticalSpacing = 18;
        const phaseShift = Math.PI; // 180 degrees between strands
        const rotationSpeed = 0.02;
        let rotationAngle = 0;

        // Colors for the two strands
        const color1 = { r: 60, g: 180, b: 255 }; // Cyan/Blue
        const color2 = { r: 255, g: 60, b: 120 };  // Pink/Red

        // Rung color
        const rungColor = { r: 100, g: 255, b: 200 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function drawNode(x, y, color, alpha) {
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
            ctx.fill();
            
            // Glow effect
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha * 0.3})`;
            ctx.fill();
        }

        function drawStrand(nodes, color) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.6)`;
            ctx.lineWidth = 2;
            
            for (let i = 0; i < nodes.length; i++) {
                if (i === 0) {
                    ctx.moveTo(nodes[i].x, nodes[i].y);
                } else {
                    ctx.lineTo(nodes[i].x, nodes[i].y);
                }
            }
            ctx.stroke();
        }

        function drawRung(node1, node2) {
            const alpha = (node1.depth + node2.depth) / 2 * 0.5 + 0.2;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(${rungColor.r}, ${rungColor.g}, ${rungColor.b}, ${alpha})`;
            ctx.lineWidth = 2;
            ctx.moveTo(node1.x, node1.y);
            ctx.lineTo(node2.x, node2.y);
            ctx.stroke();
        }

        function animate() {
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, width, height);
            
            const centerX = width / 2;
            const centerY = height / 2;
            const totalHeight = numNodes * verticalSpacing;
            const startY = centerY - totalHeight / 2;

            const nodes1 = [];
            const nodes2 = [];

            for (let i = 0; i < numNodes; i++) {
                const y = startY + i * verticalSpacing;
                const angle1 = rotationAngle + (i * 0.2);
                const angle2 = rotationAngle + (i * 0.2) + phaseShift;
                
                const x1 = centerX + Math.cos(angle1) * radius;
                const z1 = Math.sin(angle1) * radius;
                const depth1 = (z1 + radius) / (2 * radius);
                
                const x2 = centerX + Math.cos(angle2) * radius;
                const z2 = Math.sin(angle2) * radius;
                const depth2 = (z2 + radius) / (2 * radius);
                
                nodes1.push({ x: x1, y: y, depth: depth1 });
                nodes2.push({ x: x2, y: y, depth: depth2 });
            }

            // Draw rungs
            for (let i = 0; i < numNodes; i++) {
                drawRung(nodes1[i], nodes2[i]);
            }

            // Draw strands
            drawStrand(nodes1, color1);
            drawStrand(nodes2, color2);

            // Draw nodes
            for (let i = 0; i < numNodes; i++) {
                const alpha1 = nodes1[i].depth * 0.8 + 0.2;
                const alpha2 = nodes2[i].depth * 0.8 + 0.2;
                drawNode(nodes1[i].x, nodes1[i].y, color1, alpha1);
                drawNode(nodes2[i].x, nodes2[i].y, color2, alpha2);
            }

            rotationAngle += rotationSpeed;
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxy"></canvas>
    <script>
        const canvas = document.getElementById('galaxy');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        
        // Galaxy Configuration
        const STAR_COUNT = 1500;
        const ARMS = 3;
        const ARM_SPREAD = 0.8; // How wide the arms are (0 to 1)
        const ARM_CURVE = 0.005; // The spiral tightness
        const ROTATION_SPEED = 0.0005; // Global rotation speed
        const CORE_SIZE = 25;
        
        // Star Data Array
        const stars = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        // Utility: Random number between min and max
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Utility: Random integer
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Distance from center (0 to 1, normalized)
                // More stars near the center
                this.distance = Math.pow(Math.random(), 1.5); 
                
                // Angle logic for spiral arms
                // Base angle based on distance to create the spiral shape
                const spiralAngle = this.distance * ARM_CURVE * 500;
                
                // Add a random offset to spread stars along the arms
                const armOffset = random(-ARM_SPREAD, ARM_SPREAD);
                
                // Determine which arm this star belongs to
                const armIndex = randomInt(0, ARMS - 1);
                const armAngle = (Math.PI * 2 / ARMS) * armIndex;

                this.angle = spiralAngle + armAngle + armOffset;

                // Twinkle properties
                this.twinkleSpeed = random(0.01, 0.05);
                this.twinklePhase = random(0, Math.PI * 2);
                this.baseAlpha = random(0.3, 1);
                this.alpha = this.baseAlpha;

                // Size
                this.size = this.distance < 0.1 ? random(1, 3) : random(0.5, 1.5);

                // Color: Core is warmer (orange/yellow), outer is cooler (blue/white)
                // HSL: 200-280 is blue/purple, 30-60 is orange/yellow
                const hue = this.distance < 0.2 ? random(20, 50) : random(200, 280);
                const saturation = random(50, 100);
                const lightness = random(60, 90);
                this.color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
            }

            update() {
                // Rotate the star around the center
                // Closer stars rotate faster (differential rotation)
                const speed = this.distance < 0.1 ? ROTATION_SPEED * 2 : ROTATION_SPEED / (this.distance * 2 + 0.5);
                this.angle += speed;

                // Twinkle effect
                this.alpha = this.baseAlpha + Math.sin(Date.now() * this.twinkleSpeed + this.twinklePhase) * 0.3;
                if (this.alpha < 0) this.alpha = 0;
                if (this.alpha > 1) this.alpha = 1;
            }

            draw() {
                // Convert polar coordinates to cartesian
                // Scale distance to screen size (max radius is half the smallest dimension)
                const maxRadius = Math.min(width, height) / 2;
                const x = centerX + Math.cos(this.angle) * (this.distance * maxRadius);
                const y = centerY + Math.sin(this.angle) * (this.distance * maxRadius);

                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            resize();
            stars.length = 0;
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
        }

        function drawCore() {
            // Draw a glowing core
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CORE_SIZE * 3);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 230, 200, 0.8)');
            gradient.addColorStop(0.5, 'rgba(255, 150, 100, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, CORE_SIZE * 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function animate() {
            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Draw core
            drawCore();

            // Update and draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        // Event Listeners
        window.addEventListener('resize', () => {
            resize();
            // Re-calculate star positions if needed, but for this simple simulation
            // we can just let them continue rotating in the new bounds.
        });

        // Start
        init();
        animate();

    </script>
</body>
</html>

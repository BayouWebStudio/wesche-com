<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const starCount = 1500; // Number of stars
        const stars = [];
        
        // Galaxy configuration
        const galaxyConfig = {
            coreBrightness: 0.8,
            rotationSpeed: 0.0005, // Base rotation speed
            spiralArms: 3,
            armSpread: 0.8, // How wide the arms are
            dustiness: 0.6 // Probability of a star being "dust" (dimmer/darker)
        };

        // Initialize canvas size
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
        }

        // Star class
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                // Distance from center (Gaussian distribution for density)
                const r = Math.abs(Math.random() * Math.random() * Math.min(width, height) * 0.45);
                
                // Angle based on distance (creates the spiral)
                // Further stars are rotated more to form arms
                const baseAngle = (r / (Math.min(width, height) * 0.45)) * Math.PI * 2 * galaxyConfig.spiralArms;
                
                // Add randomness to angle to create "arms" rather than solid lines
                // The further out, the wider the spread
                const spread = (r / (Math.min(width, height) * 0.45)) * galaxyConfig.armSpread;
                const angleOffset = (Math.random() - 0.5) * spread;
                
                this.angle = baseAngle + angleOffset;
                this.radius = r;
                
                // Calculate x, y relative to center
                this.x = centerX + Math.cos(this.angle) * this.radius;
                this.y = centerY + Math.sin(this.angle) * this.radius;
                
                // Size based on distance (closer = bigger)
                this.size = Math.random() * 1.5 + 0.5;
                if (r < 20) this.size += 2; // Core stars are bigger
                
                // Color variation
                const hue = Math.random() * 60 + 200; // Blue to Purple range
                const saturation = Math.random() * 50 + 50;
                const lightness = Math.random() * 40 + 60; // Brightness
                
                // Some stars are red/orange (older stars on outside)
                if (Math.random() > 0.8) {
                    this.color = `hsla(${Math.random() * 40 + 10}, ${Math.random() * 50 + 50}%, ${Math.random() * 40 + 60}%, 1)`;
                } else {
                    this.color = `hsla(${hue}, ${saturation}%, ${lightness}%, 1)`;
                }
                
                // Twinkle properties
                this.twinkleSpeed = Math.random() * 0.05 + 0.01;
                this.twinklePhase = Math.random() * Math.PI * 2;
                this.baseAlpha = Math.random() * 0.5 + 0.5;
                
                // Rotation speed (closer stars rotate faster)
                this.rotationSpeed = galaxyConfig.rotationSpeed / (this.radius * 0.01 + 1);
            }

            update(time) {
                // Rotate around center
                this.angle += this.rotationSpeed;
                
                // Update position
                this.x = centerX + Math.cos(this.angle) * this.radius;
                this.y = centerY + Math.sin(this.angle) * this.radius;
                
                // Twinkle effect
                this.alpha = this.baseAlpha + Math.sin(time * this.twinkleSpeed + this.twinklePhase) * 0.3;
            }

            draw(ctx) {
                ctx.fillStyle = this.color.replace('1)', `${this.alpha})`);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Initialize stars
        function init() {
            stars.length = 0;
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }
        }

        // Draw the bright core
        function drawCore() {
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 60);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            gradient.addColorStop(0.3, 'rgba(200, 200, 255, 0.5)');
            gradient.addColorStop(0.7, 'rgba(100, 100, 200, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60, 0, Math.PI * 2);
            ctx.fill();
        }

        // Animation loop
        let time = 0;
        function animate() {
            // Clear canvas with slight transparency for trail effect (optional, currently disabled)
            // ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            // ctx.fillRect(0, 0, width, height);
            
            // Clear completely for crisp animation
            ctx.clearRect(0, 0, width, height);
            
            // Draw core
            drawCore();
            
            // Update and draw stars
            time++;
            for (let i = 0; i < stars.length; i++) {
                stars[i].update(time);
                stars[i].draw(ctx);
            }
            
            requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener('resize', () => {
            resize();
            init(); // Reinitialize stars on resize
        });

        // Start
        resize();
        init();
        animate();
    </script>
</body>
</html>

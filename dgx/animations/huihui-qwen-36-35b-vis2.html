<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spiral Galaxy</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const NUM_STARS = 1200;
const SPIRAL_ARMS = 4;
const CORE_STARS = 300;
const STARS = [];

function randomGaussian() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

function getStarColor(dist, armIndex) {
    // Inner stars are hotter (bluish-white), outer are reddish-orange
    const t = Math.min(1, dist / 400);
    const hue = 200 - t * 160 + (Math.random() * 20 - 10); // blue to red
    const sat = 40 + Math.random() * 40;
    const light = 70 + Math.random() * 25;
    return `hsla(${hue}, ${sat}%, ${light}%, 1)`;
}

// Initialize spiral arms
for (let i = 0; i < NUM_STARS; i++) {
    const armIndex = i % SPIRAL_ARMS;
    const armAngle = (armIndex / SPIRAL_ARMS) * Math.PI * 2;
    // Distance from core with gaussian distribution
    const dist = Math.abs(randomGaussian()) * 150 + 20;
    // Spiral angle increases with distance
    const spiralAngle = armAngle + dist * 0.015 + randomGaussian() * 0.4;
    // Spread perpendicular to arm
    const spread = randomGaussian() * (15 + dist * 0.08);
    
    STARS.push({
        dist: dist,
        baseAngle: spiralAngle,
        x: Math.cos(spiralAngle) * dist + Math.cos(spiralAngle + Math.PI/2) * spread,
        y: Math.sin(spiralAngle) * dist + Math.sin(spiralAngle + Math.PI/2) * spread,
        speed: 0.2 / (dist * 0.01 + 1), // closer stars orbit faster
        size: 0.5 + Math.random() * 1.5,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.5 + Math.random() * 2,
        color: getStarColor(dist, armIndex)
    });
}

// Core stars
for (let i = 0; i < CORE_STARS; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.abs(randomGaussian()) * 30;
    STARS.push({
        dist: dist,
        baseAngle: angle,
        x: Math.cos(angle) * dist,
        y: Math.sin(angle) * dist,
        speed: 0.5 / (dist * 0.01 + 1),
        size: 0.8 + Math.random() * 2,
        twinklePhase: Math.random() * Math.PI * 2,
        twinkleSpeed: 1 + Math.random() * 3,
        color: `hsla(${40 + Math.random() * 20}, 80%, ${85 + Math.random() * 15}%, 1)`
    });
}

let time = 0;

function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, W, H);
    
    const cx = W / 2;
    const cy = H / 2;
    
    // Draw core glow
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80);
    gradient.addColorStop(0, 'rgba(255, 240, 200, 0.3)');
    gradient.addColorStop(0.5, 'rgba(255, 200, 150, 0.1)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
    
    time += 0.016;
    
    ctx.fillStyle = '#fff';
    
    for (let star of STARS) {
        // Update angle based on orbital speed
        star.baseAngle += star.speed * 0.016;
        
        const x = cx + Math.cos(star.baseAngle) * star.dist + Math.cos(star.baseAngle + Math.PI/2) * (star.x - Math.cos(star.baseAngle) * star.dist);
        const y = cy + Math.sin(star.baseAngle) * star.dist + Math.sin(star.baseAngle + Math.PI/2) * (star.y - Math.sin(star.baseAngle) * star.dist);
        
        // Twinkle effect
        const twinkle = 0.7 + 0.3 * Math.sin(time * star.twinkleSpeed + star.twinklePhase);
        
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = star.color;
        ctx.beginPath();
        ctx.arc(x, y, star.size, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
}

// Initial clear
ctx.fillStyle = '#000';
ctx.fillRect(0, 0, W, H);

animate();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiral Galaxy Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Galaxy Configuration
        const STAR_COUNT = 1500;
        const ARM_COUNT = 2;
        const ARM_SPREAD = 0.3; // How wide the arms are
        const CORE_COUNT = 400; // Stars in the center
        const CORE_RADIUS = 80;
        const DISTANCE = 300; // Max radius of the galaxy
        const ROTATION_SPEED = 0.0005;
        const ARM_ROTATION = 0.4; // Angle offset for spiral arms

        let globalRotation = 0;

        const stars = [];

        // Helper: Random number between min and max
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Helper: Random integer
        function randomInt(min, max) {
            return Math.floor(random(min, max));
        }

        // Create Star Objects
        function createStars() {
            stars.length = 0;

            for (let i = 0; i < STAR_COUNT; i++) {
                const armIndex = i % ARM_COUNT;
                const angle = (i / (STAR_COUNT / ARM_COUNT)) * Math.PI * 2;
                
                // Spiral logic: Angle increases as distance increases
                const distance = random(20, DISTANCE);
                const spiralAngle = angle + (distance / DISTANCE) * ARM_ROTATION;
                
                // Add randomness to spread stars into arms
                const spread = random(-ARM_SPREAD, ARM_SPREAD) * distance;

                const x = Math.cos(spiralAngle + armIndex * (Math.PI / ARM_COUNT)) * distance + Math.cos(spiralAngle) * spread;
                const y = Math.sin(spiralAngle + armIndex * (Math.PI / ARM_COUNT)) * distance + Math.sin(spiralAngle) * spread;

                // Star colors: Mix of white, blue, and slight purple/red
                const hue = random(190, 270);
                const saturation = random(50, 100);
                const lightness = random(60, 90);
                const color = `hsla(${hue}, ${saturation}%, ${lightness}%, ${random(0.6, 1)})`;

                stars.push({
                    x,
                    y,
                    size: random(0.5, 2),
                    color,
                    // Twinkle properties
                    twinkleSpeed: random(0.02, 0.08),
                    twinkleOffset: random(0, Math.PI * 2),
                    opacity: 1
                });
            }

            // Add Core Stars
            for (let i = 0; i < CORE_COUNT; i++) {
                const angle = random(0, Math.PI * 2);
                const distance = random(0, CORE_RADIUS);
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                
                // Core stars are brighter and more yellow/white
                const hue = random(30, 60);
                const color = `hsla(${hue}, 0%, 100%, ${random(0.8, 1)})`;

                stars.push({
                    x,
                    y,
                    size: random(1, 3),
                    color,
                    twinkleSpeed: random(0.05, 0.15),
                    twinkleOffset: random(0, Math.PI * 2),
                    opacity: 1,
                    isCore: true
                });
            }
        }

        createStars();

        function animate(time) {
            // Clear canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, width, height);

            // Rotate the entire galaxy slowly
            globalRotation += ROTATION_SPEED;

            // Set blend mode for glowing effect
            ctx.globalCompositeOperation = 'lighter';

            // Draw Stars
            for (const star of stars) {
                // Calculate rotation
                const rotatedX = star.x * Math.cos(globalRotation) - star.y * Math.sin(globalRotation);
                const rotatedY = star.x * Math.sin(globalRotation) + star.y * Math.cos(globalRotation);

                // Calculate twinkle
                const twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset);
                const opacity = star.isCore ? 1 : 0.5 + (twinkle * 0.5);
                
                ctx.fillStyle = star.color;
                ctx.globalAlpha = opacity;
                
                ctx.beginPath();
                ctx.arc(centerX + rotatedX, centerY + rotatedY, star.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Core Glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, CORE_RADIUS);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.2, 'rgba(200, 220, 255, 0.2)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.globalAlpha = 1;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, CORE_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a1a; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>
    <script>
        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, sunX, sunY;
        let stars = [];
        const planets = [
            { name: 'Mercury', orbitRadius: 60, radius: 4, speed: 0.04, color: '#a6a6a6', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', orbitRadius: 90, radius: 6, speed: 0.03, color: '#e6c87a', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', orbitRadius: 120, radius: 6.5, speed: 0.02, color: '#4a90e2', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', orbitRadius: 160, radius: 5, speed: 0.015, color: '#e74c3c', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', orbitRadius: 220, radius: 12, speed: 0.01, color: '#d4a373', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', orbitRadius: 280, radius: 10, speed: 0.008, color: '#f4e4bc', angle: Math.random() * Math.PI * 2, hasRings: true }
        ];

        function generateStars() {
            stars = [];
            const starCount = 200;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    opacity: Math.random() * 0.7 + 0.3
                });
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            sunX = width / 2;
            sunY = height / 2;
            generateStars();
        }

        function draw() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, width, height);

            // Draw starfield
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();
            });

            // Draw orbit paths
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(sunX, sunY, planet.orbitRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // Draw glowing Sun
            const sunGradient = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 50);
            sunGradient.addColorStop(0, '#fff9e6');
            sunGradient.addColorStop(0.2, '#ffcc00');
            sunGradient.addColorStop(0.5, '#ff9900');
            sunGradient.addColorStop(1, 'rgba(255, 102, 0, 0)');
            ctx.beginPath();
            ctx.arc(sunX, sunY, 50, 0, Math.PI * 2);
            ctx.fillStyle = sunGradient;
            ctx.fill();

            // Draw planets
            planets.forEach(planet => {
                const x = sunX + planet.orbitRadius * Math.cos(planet.angle);
                const y = sunY + planet.orbitRadius * Math.sin(planet.angle);

                // Draw Saturn's rings first (behind planet body)
                if (planet.hasRings) {
                    ctx.beginPath();
                    ctx.ellipse(x, y, planet.radius * 1.8, planet.radius * 0.4, 0, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(210, 180, 140, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // Draw planet body
                ctx.beginPath();
                ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                ctx.fill();

                // Update orbital position
                planet.angle += planet.speed;
            });

            requestAnimationFrame(draw);
        }

        resize();
        window.addEventListener('resize', resize);
        draw();
    </script>
</body>
</html>

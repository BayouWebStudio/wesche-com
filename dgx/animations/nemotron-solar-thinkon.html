<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System Canvas Animation</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="solar"></canvas>
<script>
(() => {
  const canvas = document.getElementById('solar');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  // Starfield
  const starCount = 150;
  const stars = [];
  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2,
      alpha: Math.random() * 0.6 + 0.4
    });
  }

  // Sun
  const sunRadius = 40;

  // Planets: [orbitRadius, size, color, speed (rad per second)]
  const planets = [
    {orbitRadius: 80,  size: 8,  color: '#88c0d0', speed: 0.004}, // Mercury-like
    {orbitRadius: 120, size: 12, color: '#e cb8', speed: 0.0025}, // Venus-like
    {orbitRadius: 160, size: 14, color: '#4fc3f7', speed: 0.0018}, // Earth-like
    {orbitRadius: 200, size: 10, color: '#ffcc80', speed: 0.0014}, // Mars-like
    {orbitRadius: 260, size: 22, color: '#ffb74d', speed: 0.0008}, // Jupiter-like
    {orbitRadius: 320, size: 18, color: '#81c784', speed: 0.0005}  // Saturn-like
  ];
  planets.forEach(p => p.angle = Math.random() * Math.PI * 2);

  let lastTime = 0;
  function drawSun() {
    const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, sunRadius * 2);
    grad.addColorStop(0, '#fff9c4');
    grad.addColorStop(0.4, '#ffeb3b');
    grad.addColorStop(1, '#f57f17');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
    ctx.fill();
    // outer glow
    ctx.shadowColor = '#ffeb3b';
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function drawStar(s) {
    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlanet(p) {
    const x = centerX + Math.cos(p.angle) * p.orbitRadius;
    const y = centerY + Math.sin(p.angle) * p.orbitRadius;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
    // subtle glow
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const delta = timestamp - lastTime; // ms
    lastTime = timestamp;

    // clear
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // stars
    stars.forEach(drawStar);

    // update and draw planets
    planets.forEach(p => {
      p.angle += p.speed * delta * 0.001; // scale to make speed sensible
      drawPlanet(p);
    });

    // sun
    drawSun();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

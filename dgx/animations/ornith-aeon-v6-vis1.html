<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Solar System</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarSystem"></canvas>
    <script>
        const canvas = document.getElementById('solarSystem');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }

        window.addEventListener('resize', resize);
        resize();

        // Starfield
        let stars = [];
        function generateStars() {
            stars = [];
            const starCount = 500;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    opacity: Math.random(),
                    twinkleSpeed: Math.random() * 0.02 + 0.005
                });
            }
        }

        // Planets
        const planets = [
            { name: 'Mercury', radius: 4, orbitRadius: 60, speed: 0.04, color: '#A5A5A5', angle: Math.random() * Math.PI * 2 },
            { name: 'Venus', radius: 7, orbitRadius: 90, speed: 0.03, color: '#E3BB76', angle: Math.random() * Math.PI * 2 },
            { name: 'Earth', radius: 8, orbitRadius: 130, speed: 0.025, color: '#4F97E3', angle: Math.random() * Math.PI * 2 },
            { name: 'Mars', radius: 6, orbitRadius: 170, speed: 0.02, color: '#E35E4F', angle: Math.random() * Math.PI * 2 },
            { name: 'Jupiter', radius: 20, orbitRadius: 230, speed: 0.012, color: '#D6A36D', angle: Math.random() * Math.PI * 2 },
            { name: 'Saturn', radius: 17, orbitRadius: 290, speed: 0.009, color: '#E8D3A8', angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: 'Uranus', radius: 12, orbitRadius: 340, speed: 0.006, color: '#7DE3E3', angle: Math.random() * Math.PI * 2 },
            { name: 'Neptune', radius: 11, orbitRadius: 380, speed: 0.005, color: '#4F4FE3', angle: Math.random() * Math.PI * 2 }
        ];

        function drawStars(time) {
            stars.forEach(star => {
                const opacity = 0.5 + 0.5 * Math.sin(time * star.twinkleSpeed);
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity * star.opacity})`;
                ctx.fill();
            });
        }

        function drawSun() {
            // Outer glow
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 50);
            gradient.addColorStop(0, 'rgba(255, 255, 200, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 200, 50, 0.8)');
            gradient.addColorStop(0.6, 'rgba(255, 150, 0, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 50, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Inner sun
            const sunGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 25);
            sunGradient.addColorStop(0, '#FFFFFF');
            sunGradient.addColorStop(0.5, '#FFFACD');
            sunGradient.addColorStop(1, '#FFD700');
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, 25, 0, Math.PI * 2);
            ctx.fillStyle = sunGradient;
            ctx.fill();
        }

        function drawOrbit(orbitRadius) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, orbitRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        function drawPlanet(planet, time) {
            const x = centerX + Math.cos(planet.angle) * planet.orbitRadius;
            const y = centerY + Math.sin(planet.angle) * planet.orbitRadius;

            // Planet shadow for 3D effect
            const shadowGradient = ctx.createRadialGradient(
                x - planet.radius * 0.3, 
                y - planet.radius * 0.3, 
                0,
                x, 
                y, 
                planet.radius
            );
            shadowGradient.addColorStop(0, planet.color);
            shadowGradient.addColorStop(1, '#000000');

            ctx.beginPath();
            ctx.arc(x, y, planet.radius, 0, Math.PI * 2);
            ctx.fillStyle = shadowGradient;
            ctx.fill();

            // Saturn's ring
            if (planet.hasRing) {
                ctx.beginPath();
                ctx.ellipse(x, y, planet.radius * 2, planet.radius * 0.5, 0, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(200, 180, 140, 0.6)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Planet name label
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(planet.name, x, y + planet.radius + 15);
        }

        function animate(time) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            drawStars(time);
            drawSun();

            planets.forEach(planet => {
                drawOrbit(planet.orbitRadius);
                drawPlanet(planet, time);
                planet.angle += planet.speed;
            });

            requestAnimationFrame(animate);
        }

        // Initial clear
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);

        requestAnimationFrame(animate);
    </script>
</body>
</html>

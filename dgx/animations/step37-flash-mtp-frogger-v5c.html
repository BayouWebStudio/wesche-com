<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Retro Frogger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .game-container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        h1 {
            color: #00ff00;
            text-shadow: 3px 3px 0 #004400;
            font-size: 2rem;
            text-align: center;
            margin: 10px 0;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 560px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .instructions {
            text-align: center;
            font-size: 0.9rem;
            color: #ccc;
            max-width: 560px;
            line-height: 1.4;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
            border: 4px solid #333;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.3);
            background-color: #000;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            max-width: 200px;
            width: 100%;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            border: 3px solid #333;
            background-color: #666;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:active {
            background-color: #999;
            transform: scale(0.95);
        }

        .horizontal-controls {
            display: flex;
            gap: 10px;
        }

        .restart-btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: 3px solid #333;
            background-color: #4CAF50;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .restart-btn:active {
            background-color: #45a049;
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
            .stats {
                font-size: 1rem;
            }
            .instructions {
                font-size: 0.8rem;
            }
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>RETRO FROGGER</h1>
        <div class="stats">
            <span>SCORE: <span id="score">0</span></span>
            <span>LIVES: <span id="lives">3</span></span>
        </div>
        <p class="instructions">Use Arrow Keys/WASD or on-screen buttons to move. Avoid cars, ride logs and turtles to reach the top safe zone!</p>
        <canvas id="gameCanvas" width="560" height="520"></canvas>
        <div class="controls">
            <button class="control-btn up" id="upBtn">▲</button>
            <div class="horizontal-controls">
                <button class="control-btn left" id="leftBtn">◀</button>
                <button class="control-btn down" id="downBtn">▼</button>
                <button class="control-btn right" id="rightBtn">▶</button>
            </div>
        </div>
        <button class="restart-btn" id="restartBtn">RESTART GAME</button>
    </div>

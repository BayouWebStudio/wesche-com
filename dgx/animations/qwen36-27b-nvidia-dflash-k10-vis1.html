<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Solar System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; /* Fallback dark color */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="solarCanvas"></canvas>

    <script>
        /**
         * Solar System Simulation
         * - No external libraries
         * - HTML5 Canvas API
         * - Responsive and smooth animation
         */

        const canvas = document.getElementById('solarCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        let width, height, centerX, centerY;
        let stars = [];
        
        // Planet Configuration
        const planets = [
            { name: "Mercury", color: "#A5A5A5", radius: 4, distance: 60, speed: 0.04, angle: Math.random() * Math.PI * 2 },
            { name: "Venus",   color: "#E3BB76", radius: 7, distance: 90, speed: 0.025, angle: Math.random() * Math.PI * 2 },
            { name: "Earth",   color: "#22A6F2", radius: 7.5, distance: 130, speed: 0.02, angle: Math.random() * Math.PI * 2 },
            { name: "Mars",    color: "#FF5733", radius: 5, distance: 170, speed: 0.016, angle: Math.random() * Math.PI * 2 },
            { name: "Jupiter", color: "#D9A066", radius: 18, distance: 230, speed: 0.008, angle: Math.random() * Math.PI * 2 },
            { name: "Saturn",  color: "#E0C896", radius: 15, distance: 290, speed: 0.006, angle: Math.random() * Math.PI * 2, hasRing: true },
            { name: "Uranus",  color: "#4FD0E7", radius: 10, distance: 340, speed: 0.004, angle: Math.random() * Math.PI * 2 },
            { name: "Neptune", color: "#3E54E8", radius: 10, distance: 390, speed: 0.003, angle: Math.random() * Math.PI * 2 }
        ];

        // Resize handling
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            centerX = width / 2;
            centerY = height / 2;
            generateStars();
        }

        // Generate static starfield
        function generateStars() {
            stars = [];
            const starCount = 300;
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
        }

        // Draw the glowing Sun
        function drawSun() {
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Create a radial gradient for the glow
            const gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 40);
            gradient.addColorStop(0, '#FFF');       // Core white
            gradient.addColorStop(0.2, '#FDB813');  // Inner yellow
            gradient.addColorStop(0.5, '#F39C12');  // Outer orange
            gradient.addColorStop(1, 'rgba(243, 156, 18, 0)'); // Fade out

            ctx.beginPath();
            ctx.arc(0, 0, 40, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Solid core
            ctx.beginPath();
            ctx.arc(0, 0, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#FFF';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#F39C12';
            ctx.fill();
            
            ctx.restore();
        }

        // Draw the background stars
        function drawStars() {
            ctx.fillStyle = "#FFF";
            stars.forEach(star => {
                ctx.globalAlpha = star.opacity;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0; // Reset alpha
        }

        // Draw Orbit Paths
        function drawOrbits() {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 1;
            
            planets.forEach(planet => {
                ctx.beginPath();
                ctx.arc(centerX, centerY, planet.distance, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        // Draw Planets
        function drawPlanets() {
            planets.forEach(planet => {
                // Update angle
                planet.angle += planet.speed;

                // Calculate position
                const x = centerX + Math.cos(planet.angle) * planet.distance;
                const y = centerY + Math.sin(planet.angle) * planet.distance;

                ctx.save();
                ctx.translate(x, y);

                // Draw Saturn's Ring (simple representation)
                if (planet.hasRing) {
                    ctx.beginPath();
                    ctx.strokeStyle = "rgba(200, 180, 150, 0.6)";
                    ctx.lineWidth = 4;
                    ctx.rotate(planet.angle); // Rotate ring with planet
                    ctx.ellipse(0, 0, planet.radius * 2.2, planet.radius * 0.8, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Draw Planet Body
                ctx.beginPath();
                ctx.arc(0, 0, planet.radius, 0, Math.PI * 2);
                ctx.fillStyle = planet.color;
                
                // Add a slight shadow for 3D effect
                ctx.shadowBlur = 5;
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;
                
                ctx.fill();
                
                // Reset shadow for next elements
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // Draw Name (optional, keeps it clean)
                // ctx.fillStyle = "rgba(255,255,255,0.7)";
                // ctx.font = "10px Arial";
                // ctx.fillText(planet.name, planet.radius + 2, 4);

                ctx.restore();
            });
        }

        // Main Animation Loop
        function animate() {
            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Draw layers
            drawStars();
            drawOrbits();
            drawSun();
            drawPlanets();

            requestAnimationFrame(animate);
        }

        // Initialization
        window.addEventListener('resize', resize);
        resize(); // Initial setup
        animate(); // Start loop

    </script>
</body>
</html>

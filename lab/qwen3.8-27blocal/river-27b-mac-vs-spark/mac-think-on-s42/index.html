<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>River Shaper</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e13;font-family:system-ui,sans-serif}
  #hud{position:fixed;top:12px;left:12px;color:#dfe8f5;background:rgba(15,20,30,.72);
       border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px 14px;
       font-size:13px;line-height:1.55;backdrop-filter:blur(4px);user-select:none;min-width:210px}
  #hud h1{font-size:14px;margin:0 0 6px;font-weight:600;letter-spacing:.5px}
  #hud .row{display:flex;justify-content:space-between;gap:14px}
  #hud .val{color:#8fd3ff;font-variant-numeric:tabular-nums}
  input[type=range]{width:130px;vertical-align:middle}
  button{background:#2b6cb0;color:#fff;border:none;border-radius:6px;padding:6px 14px;
         cursor:pointer;font-size:13px;margin-top:8px}
  button:hover{background:#3182ce}
  #help{position:fixed;bottom:12px;left:12px;color:#9fb0c8;background:rgba(15,20,30,.6);
        border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">
  <h1>🏞️ River Shaper</h1>
  <div class="row"><span>Flow rate</span><span class="val" id="vFlow">5.0</span></div>
  <div class="row"><span>Water volume</span><span class="val" id="vVol">0</span></div>
  <div class="row"><span>FPS</span><span class="val" id="vFps">0</span></div>
  <div class="row" style="margin-top:6px"><span>Flow</span><input type="range" id="sFlow" min="0" max="12" step="0.1" value="5"></div>
  <div class="row"><span>Brush size</span><input type="range" id="sBrush" min="2" max="24" step="1" value="7"></div>
  <button id="bReset">Reset terrain</button>
</div>
<div id="help">
  <b>Left-drag</b> raise land &nbsp;·&nbsp; <b>Right-drag / Shift+Left</b> dig<br>
  <b>Middle-drag or Space+Left</b> orbit camera &nbsp;·&nbsp; <b>Scroll</b> zoom &nbsp;·&nbsp; <b>+/−</b> flow
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- constants ---------------- */
const N = 128;                 // grid resolution
const S = 64;                  // world size (units)
const CELL = S / N;
const MAXW = 8;                // depth clamp — sim can never blow up
const idx = (ix, iz) => iz * N + ix;

/* ---------------- state ---------------- */
let H = new Float32Array(N * N);       // terrain height
let W = new Float32Array(N * N);       // water depth
let P = new Float32Array(N * N);       // pipe height = H + W
let SPD = new Float32Array(N * N);     // flow magnitude for foam
let springRate = 5;

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101825);
scene.fog = new THREE.Fog(0x101825, 90, 260);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 55, 68);

scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x3a3128, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.4);
sun.position.set(40, 80, -30);
scene.add(sun);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: null };
controls.maxPolarAngle = Math.PI * 0.49;

/* ---------------- terrain mesh ---------------- */
function makeGridGeo() {
  const g = new THREE.PlaneGeometry(S, S, N - 1, N - 1);
  g.rotateX(-Math.PI / 2);
  return g;
}
const terrainGeo = makeGridGeo();
const waterGeo = makeGridGeo();

// vertex -> cell map (both geometries share the same layout)
const vmap = new Int32Array(terrainGeo.attributes.position.count);
{
  const pos = terrainGeo.attributes.position;
  for (let v = 0; v < pos.count; v++) {
    const ix = Math.min(N - 1, Math.max(0, Math.round(pos.getX(v) + S / 2)));
    const iz = Math.min(N - 1, Math.max(0, Math.round(pos.getZ(v) + S / 2)));
    vmap[v] = idx(ix, iz);
  }
}
terrainGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(terrainGeo.attributes.position.count * 3), 3));
waterGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(waterGeo.attributes.position.count * 3), 3));

const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 });
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrain);

const waterMat = new THREE.MeshStandardMaterial({
  vertexColors: true, transparent: true, opacity: 0.78,
  roughness: 0.25, metalness: 0.05, depthWrite: false, side: THREE.FrontSide
});
const water = new THREE.Mesh(waterGeo, waterMat);
scene.add(water);

/* ---------------- terrain generation ---------------- */
function genTerrain() {
  for (let iz = 0; iz < N; iz++) {
    for (let ix = 0; ix < N; ix++) {
      const x = ix - S / 2, z = iz - S / 2;
      let h = 9 * (1 - iz / (N - 1));                       // slope high edge -> low edge
      const rx = S / 2 + 9 * Math.sin(iz * 0.08) + 6 * Math.sin(iz * 0.021 + 1.7);
      const dx = x - rx;
      h -= 4.5 * Math.exp(-(dx * dx) / (2 * 7 * 7));       // meandering valley
      h += 1.7 * Math.sin(x * 0.11 + 1.3) * Math.cos(z * 0.14 + 0.7)
         + 1.1 * Math.sin(x * 0.045 + 4.1) * Math.cos(z * 0.06 + 2.2)
         + 0.5 * Math.sin(x * 0.31) * Math.cos(z * 0.27);
      H[idx(ix, iz)] = h;
    }
  }
  W.fill(0); SPD.fill(0);
}
genTerrain();

/* ---------------- colouring helpers ---------------- */
function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
const cGrass = [0.30, 0.52, 0.22], cDirt = [0.48, 0.36, 0.22],
      cRock = [0.52, 0.51, 0.50], cSand = [0.72, 0.66, 0.45];

function updateTerrainMesh() {
  const pos = terrainGeo.attributes.position;
  const col = terrainGeo.attributes.color;
  for (let v = 0; v < pos.count; v++) {
    const c = vmap[v];
    const h = H[c];
    pos.setY(v, h);
    const r = c % N, d = (c / N) | 0;
    const sx = (r < N - 1 ? H[c + 1] - H[c - 1] : H[c + 1] - h) * 0.5;
    const sz = (d < N - 1 ? H[c + N] - H[c - N] : H[c + N] - h) * 0.5;
    const slope = Math.hypot(sx, sz);
    let rock = Math.min(1, smoothstep(0.85, 1.6, slope) + smoothstep(6.0, 8.5, h));
    let dirt = smoothstep(2.6, 4.2, h) * (1 - rock);
    let sand = smoothstep(2.2, 0.4, h) * (1 - rock);
    let cr = cGrass[0] + (cDirt[0] - cGrass[0]) * dirt + (cSand[0] - cGrass[0]) * sand;
    let cg = cGrass[1] + (cDirt[1] - cGrass[1]) * dirt + (cSand[1] - cGrass[1]) * sand;
    let cb = cGrass[2] + (cDirt[2] - cGrass[2]) * dirt + (cSand[2] - cGrass[2]) * sand;
    cr += (cRock[0] - cr) * rock; cg += (cRock[1] - cg) * rock; cb += (cRock[2] - cb) * rock;
    col.setXYZ(v, cr, cg, cb);
  }
  pos.needsUpdate = true;
  col.needsUpdate = true;
  terrainGeo.computeVertexNormals();
}

function updateWaterMesh() {
  const pos = waterGeo.attributes.position;
  const col = waterGeo.attributes.color;
  for (let v = 0; v < pos.count; v++) {
    const c = vmap[v];
    const w = W[c];
    pos.setY(v, w > 0.02 ? H[c] + w : H[c] - 0.08);   // sink below terrain when dry
    const foam = Math.min(1, SPD[c] * 1.6);
    const depth = Math.min(1, w * 0.35);
    const m = 0.55 + 0.45 * depth;
    col.setXYZ(v,
      (0.14 + 0.72 * foam) * m + 0.72 * foam,
      (0.38 + 0.60 * foam) * m + 0.58 * foam,
      (0.78 + 0.20 * foam) * m + 0.15 * foam);
  }
  pos.needsUpdate = true;
  col.needsUpdate = true;
}

/* ---------------- virtual-pipe water sim ---------------- */
function simStep(dt) {
  const sub = 4, sdt = dt / sub;
  for (let s = 0; s < sub; s++) {
    // spring at high edge
    if (springRate > 0) {
      const add = springRate * sdt * 0.55;
      for (let ix = 0; ix < N; ix++) {
        const i = idx(ix, 0);
        W[i] = Math.min(MAXW, W[i] + add);
      }
    }
    // pipe relaxation (alternate sweep direction to reduce bias)
    const fwd = (s & 1) === 0;
    for (let iz = 0; iz < N; iz++)
      for (let ix = 0; ix < N; ix++) {
        const i = fwd ? idx(ix, iz) : idx(N - 1 - ix, N - 1 - iz);
        const wi = W[i];
        if (wi <= 1e-5) continue;
        let pi = P[i];
        const r = i % N, d = (i / N) | 0;
        if (r > 0) { const j = i - 1; const pj = P[j];
          if (pi > pj) { let t = (pi - pj) * 0.5; if (t > wi * 0.5) t = wi * 0.5;
            if (t > 0) { W[i] -= t; W[j] = Math.min(MAXW, W[j] + t); pi -= t; SPD[i] += t; SPD[j] += t * 0.4; } } }
        if (r < N - 1) { const j = i + 1; const pj = P[j];
          if (pi > pj) { let t = (pi - pj) * 0.5; if (t > wi * 0.5) t = wi * 0.5;
            if (t > 0) { W[i] -= t; W[j] = Math.min(MAXW, W[j] + t); pi -= t; SPD[i] += t; SPD[j] += t * 0.4; } } }
        if (d > 0) { const j = i - N; const pj = P[j];
          if (pi > pj) { let t = (pi - pj) * 0.5; if (t > wi * 0.5) t = wi * 0.5;
            if (t > 0) { W[i] -= t; W[j] = Math.min(MAXW, W[j] + t); pi -= t; SPD[i] += t; SPD[j] += t * 0.4; } } }
        if (d < N - 1) { const j = i + N; const pj = P[j];
          if (pi > pj) { let t = (pi - pj) * 0.5; if (t > wi * 0.5) t = wi * 0.5;
            if (t > 0) { W[i] -= t; W[j] = Math.min(MAXW, W[j] + t); pi -= t; SPD[i] += t; SPD[j] += t * 0.4; } } }
        W[i] = Math.min(MAXW, Math.max(0, W[i]));
        P[i] = H[i] + W[i];
      }
    // drain at low edge
    for (let ix = 0; ix < N; ix++) W[idx(ix, N - 1)] *= 0.15;
  }
  for (let i = 0; i < N * N; i++) SPD[i] *= 0.82;
}

/* ---------------- tools ---------------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let toolActive = false, toolMode = 1, brush = 7, hoverCell = -1, spaceHeld = false;

function updatePointer(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(terrain, false)[0];
  if (hit) {
    const ix = Math.round(hit.point.x + S / 2), iz = Math.round(hit.point.z + S / 2);
    hoverCell = (ix >= 0 && ix < N && iz >= 0 && iz < N) ? idx(ix, iz) : -1;
  } else hoverCell = -1;
}

const cv = renderer.domElement;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  const orbit = (e.button === 1) || (e.button === 0 && spaceHeld);
  controls.enabled = orbit;
  if (!orbit) {
    toolActive = true;
    toolMode = (e.button === 2 || e.shiftKey) ? -1 : 1;
    updatePointer(e);
  }
});
addEventListener('pointerup', () => { toolActive = false; });
cv.addEventListener('pointermove', e => { if (toolActive || e.buttons) updatePointer(e); });

function applyBrush() {
  if (!toolActive || hoverCell < 0) return;
  const r = brush, cx = hoverCell % N, cy = (hoverCell / N) | 0;
  const r2 = r * r;
  for (let dy = -r; dy <= r; dy++) {
    const y = cy + dy;
    if (y < 0 || y >= N) continue;
    for (let dx = -r; dx <= r; dx++) {
      const x = cx + dx;
      if (x < 0 || x >= N) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 > r2) continue;
      const f = Math.cos(Math.PI * Math.sqrt(d2) / r) * 0.5 + 0.5;
      const i = idx(x, y);
      const oldPipe = H[i] + W[i];
      const nh = Math.min(16, Math.max(-6, H[i] + toolMode * 0.22 * f));
      W[i] = Math.min(MAXW, Math.max(0, oldPipe - nh));
      H[i] = nh;
    }
  }
  updateTerrainMesh();
}

/* ---------------- HUD / inputs ---------------- */
const sFlow = document.getElementById('sFlow');
const sBrush = document.getElementById('sBrush');
const vFlow = document.getElementById('vFlow');
const vVol = document.getElementById('vVol');
const vFps = document.getElementById('vFps');
sFlow.addEventListener('input', () => { springRate = +sFlow.value; });
sBrush.addEventListener('input', () => { brush = +sBrush.value; });
sFlow.addEventListener('change', () => sFlow.blur());
sBrush.addEventListener('change', () => sBrush.blur());

addEventListener('keydown', e => {
  if (e.code === 'Space') { spaceHeld = true; e.preventDefault(); }
  if (e.key === '+' || e.key === '=') { springRate = Math.min(12, springRate + 0.5); sFlow.value = springRate; }
  if (e.key === '-' || e.key === '_') { springRate = Math.max(0, springRate - 0.5); sFlow.value = springRate; }
});
addEventListener('keyup', e => { if (e.code === 'Space') spaceHeld = false; });

document.getElementById('bReset').addEventListener('click', () => {
  genTerrain();
  updateTerrainMesh();
  updateWaterMesh();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------------- main loop ---------------- */
let last = performance.now(), fps = 60, hudT = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (dt > 0) fps = fps * 0.92 + (1 / dt) * 0.08;

  simStep(dt);
  applyBrush();
  updateWaterMesh();
  controls.enabled = controls.enabled; // (state managed on pointerdown)
  controls.update();
  renderer.render(scene, camera);

  hudT += dt;
  if (hudT > 0.2) {
    hudT = 0;
    let vol = 0;
    for (let i = 0; i < N * N; i++) vol += W[i];
    vFlow.textContent = springRate.toFixed(1);
    vVol.textContent = Math.round(vol * CELL * CELL) + ' m³';
    vFps.textContent = Math.round(fps);
  }
}
updateTerrainMesh();
updateWaterMesh();
requestAnimationFrame(animate);
</script>
</body>
</html>

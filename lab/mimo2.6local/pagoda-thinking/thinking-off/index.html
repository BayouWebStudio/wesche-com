<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Pagoda World</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
        canvas { display: block; }
        #ui-container {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            color: #fff; background: rgba(0, 0, 0, 0.7); padding: 15px;
            border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px); user-select: none;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #ffd700; }
        .controls { display: flex; flex-direction: column; gap: 10px; }
        button {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold;
        }
        button:hover { background: #444; border-color: #888; }
        input[type="range"] { width: 100%; }
        #stats { font-size: 12px; opacity: 0.8; margin-top: 10px; }
        #tooltip {
            position: absolute; display: none; background: rgba(0, 0, 0, 0.9);
            color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 12px;
            pointer-events: none; z-index: 20; border: 1px solid #ffd700;
        }
        #legend {
            position: absolute; bottom: 10px; right: 10px; z-index: 10;
            color: #fff; background: rgba(0, 0, 0, 0.7); padding: 10px;
            border-radius: 8px; font-size: 12px; max-width: 250px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #legend h3 { margin: 0 0 5px 0; color: #ffd700; }
        #legend ul { margin: 0; padding-left: 20px; }
        #legend li { margin-bottom: 4px; }
        .day-night-label { display: flex; justify-content: space-between; font-size: 12px; }
    </style>
</head>
<body>

<div id="ui-container">
    <h1>Voxel Pagoda World</h1>
    <div class="controls">
        <button id="regenerateBtn">Regenerate World</button>
        <div class="day-night-label">
            <span>Day</span>
            <span>Night</span>
        </div>
        <input type="range" id="dayNightSlider" min="0" max="100" value="50">
        <div id="stats">
            FPS: <span id="fps">0</span> | Voxels: <span id="voxelCount">0</span>
        </div>
    </div>
</div>

<div id="legend">
    <h3>Controls & Legend</h3>
    <ul>
        <li><b>Left Click + Drag:</b> Orbit camera</li>
        <li><b>Right Click + Drag:</b> Pan camera</li>
        <li><b>Scroll Wheel:</b> Zoom in/out</li>
        <li><b>Hover:</b> Inspect voxel (Pagoda, House, etc.)</li>
        <li><b>Slider:</b> Change time of day</li>
    </ul>
</div>

<div id="tooltip"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Global Configuration ---
const CONFIG = {
    worldSize: 64,
    maxHeight: 40,
    chunkSize: 16, // For culling optimization
    sunColor: 0xffffff,
    ambientColor: 0x404040
};

// --- State ---
let scene, camera, renderer, controls;
let instancedMeshes = []; // Array of { mesh, type, data }
let raycaster, mouse;
let clock = new THREE.Clock();
let seed = Math.random() * 10000;
let isCinematic = true;
let cinematicTime = 0;
let sun, sky, moon;
let dayNightValue = 0.5; // 0 = night, 1 = day
let lanterns = [];
let pointLights = [];
let waterMesh;
let clouds = [];

// --- Color Palettes ---
const PALETTES = {
    snow: [0xffffff, 0xf0f8ff, 0xe6e6fa],
    rock: [0x808080, 0x696969, 0xa9a9a9, 0x778899],
    grass: [0x228b22, 0x006400, 0x32cd32, 0x8fbc8f],
    dirt: [0x8b4513, 0xa0522d, 0xd2691e],
    water: [0x4682b4, 0x5f9ea0],
    pagodaWall: [0x8b0000, 0x800000, 0xa52a2a],
    pagodaRoof: [0x2f4f4f, 0x36454f, 0x4f4f4f],
    houseWall: [0xdeb887, 0xd2b48c, 0xf5deb3, 0x8b7765],
    houseRoof: [0x8b4513, 0xa0522d, 0x696969, 0x556b2f],
    street: [0x696969, 0x778899],
    bridge: [0x8b4513, 0xa0522d],
    lantern: [0xffd700, 0xffa500, 0xff8c00],
    window: [0xfff8dc, 0xfffacd]
};

// --- Utility: Simple Seeded Random ---
function mulberry32(a) {
    return function() {
      var t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

// --- Initialization ---
function init() {
    // Scene
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

    // Camera
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(50, 40, 50);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Controls
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enabled = false; // Disabled during cinematic

    // Lights
    setupLights();

    // Raycaster
    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    // Events
    window.addEventListener('resize', onWindowResize);
    window.addEventListener('mousemove', onMouseMove);
    document.getElementById('regenerateBtn').addEventListener('click', regenerate);
    document.getElementById('dayNightSlider').addEventListener('input', (e) => {
        dayNightValue = 1 - (e.target.value / 100); // Inverted: 0 top (Day) to 100 bottom (Night)
        updateDayNight();
    });

    // Start
    generateWorld();
    animate();
}

// --- Lighting Setup ---
function setupLights() {
    // Ambient
    const ambient = new THREE.AmbientLight(0x404040, 1.5);
    scene.add(ambient);
    scene.userData.ambient = ambient;

    // Sun (Directional)
    sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(50, 100, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 500;
    sun.shadow.camera.left = -100;
    sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    scene.add(sun);
    scene.userData.sun = sun;

    // Hemisphere (Sky)
    const hemi = new THREE.HemisphereLight(0x87ceeb, 0x36454f, 1.0);
    scene.add(hemi);
    scene.userData.hemi = hemi;
}

// --- World Generation ---
function generateWorld() {
    // Clear old world
    instancedMeshes.forEach(item => {
        scene.remove(item.mesh);
        item.mesh.geometry.dispose();
        if (Array.isArray(item.mesh.material)) item.mesh.material.forEach(m => m.dispose());
        else item.mesh.material.dispose();
    });
    instancedMeshes = [];
    lanterns = [];
    pointLights.forEach(l => scene.remove(l));
    pointLights = [];
    clouds.forEach(c => scene.remove(c));
    clouds = [];

    const rand = mulberry32(seed);
    const size = CONFIG.worldSize;
    const halfSize = size / 2;

    // 1. Generate Heightmap (Mountain Ridge)
    const heightMap = new Array(size * size).fill(0);
    
    // Base noise function (simplified Perlin-like)
    const noise = (x, z) => {
        const s = Math.sin(x * 0.1 + z * 0.1) + Math.sin(x * 0.2 - z * 0.3) + Math.cos(x * 0.05 + z * 0.15);
        return s;
    };

    for (let x = 0; x < size; x++) {
        for (let z = 0; z < size; z++) {
            // Create a ridge running diagonally
            const ridgeDist = Math.abs(x - z);
            const ridgeHeight = 30 - ridgeDist * 0.5;
            
            // Add noise
            const n = noise(x + seed, z + seed) * 5;
            
            // Create valley on one side
            const valleyFactor = (x > halfSize + 10) ? -10 : 0;

            let h = Math.max(0, ridgeHeight + n + valleyFactor + (rand() * 2 - 1));
            
            // Flat area for city
            if (x > 10 && x < size - 10 && z > 10 && z < size - 10) {
                 if (x % 8 < 2 || z % 8 < 2) h = Math.floor(h / 2) * 2; // Terraced feel
            }

            heightMap[x * size + z] = Math.floor(h);
        }
    }

    // 2. Build Voxel Lists
    const voxels = {
        terrain: [],
        water: [],
        pagoda: [],
        houses: [],
        roofs: [],
        streets: [],
        bridges: [],
        trees: [],
        lanterns: [],
        windows: [],
        spire: []
    };

    // Helper to add voxel
    const addVoxel = (type, x, y, z, meta = {}) => {
        voxels[type].push({ x, y, z, ...meta });
    };

    // --- Terrain ---
    for (let x = 0; x < size; x++) {
        for (let z = 0; z < size; z++) {
            const h = heightMap[x * size + z];
            for (let y = 0; y <= h; y++) {
                let type = 'rock';
                if (y === h) {
                    if (h > 30) type = 'snow';
                    else if (h > 15) type = 'rock';
                    else type = 'grass';
                } else if (y < h - 2) {
                    type = 'dirt';
                }
                // Only add top layer and one below to save memory, unless it's a wall
                if (y === h || y === h - 1) {
                   addVoxel('terrain', x, y, z, { type });
                }
            }
        }
    }

    // --- River ---
    // River flows down the valley side (high x)
    for (let x = halfSize + 15; x < size - 5; x++) {
        for (let z = 0; z < size; z++) {
            const h = heightMap[x * size + z];
            // Carve river bed
            if (z > halfSize - 5 && z < halfSize + 5) {
                const bedY = Math.max(0, h - 3);
                // Ensure water level is consistent (slope down)
                const waterLevel = Math.max(0, bedY - 1); 
                
                // Add water voxel
                addVoxel('water', x, waterLevel, z, { isWater: true });
            }
        }
    }

    // --- Pagoda Location ---
    // Find highest point on ridge
    let pagodaX = 0, pagodaZ = 0, pagodaY = 0;
    let maxH = -1;
    for (let x = 0; x < size; x++) {
        for (let z = 0; z < size; z++) {
            const h = heightMap[x * size + z];
            if (h > maxH && Math.abs(x - z) < 5) { // Stick to ridge
                maxH = h;
                pagodaX = x;
                pagodaZ = z;
                pagodaY = h;
            }
        }
    }

    // --- Build Pagoda ---
    buildPagoda(pagodaX, pagodaY + 1, pagodaZ, addVoxel);

    // --- City Generation ---
    // City is terraced down the slope from pagoda
    for (let x = pagodaX - 15; x < pagodaX + 15; x++) {
        for (let z = pagodaZ - 15; z < pagodaZ + 15; z++) {
            if (x < 0 || x >= size || z < 0 || z >= size) continue;
            
            const h = heightMap[x * size + z];
            
            // Streets
            if (x % 6 === 0 || z % 6 === 0) {
                addVoxel('streets', x, h, z, {});
                // Flatten street terrain slightly
                // (Handled by heightmap logic earlier roughly)
                continue;
            }

            // Houses
            if (rand() < 0.3 && Math.abs(x - pagodaX) > 4 && Math.abs(z - pagodaZ) > 4) {
                buildHouse(x, h + 1, z, addVoxel, rand);
            }
        }
    }

    // --- Trees ---
    for (let i = 0; i < 50; i++) {
        const x = Math.floor(rand() * size);
        const z = Math.floor(rand() * size);
        const h = heightMap[x * size + z];
        if (h > 10 && h < 30 && !voxels.streets.some(s => s.x === x && s.z === z)) {
            buildTree(x, h + 1, z, addVoxel, rand);
        }
    }

    // --- Bridges ---
    // Bridge over river
    const bridgeX = halfSize + 20;
    for (let z = halfSize - 6; z <= halfSize + 6; z++) {
        const h = heightMap[bridgeX * size + z];
        addVoxel('bridges', bridgeX, h + 2, z, {});
        // Rails
        if (z === halfSize - 6 || z === halfSize + 6) {
             addVoxel('bridges', bridgeX, h + 3, z, {});
             addVoxel('bridges', bridgeX + 1, h + 3, z, {});
             addVoxel('bridges', bridgeX - 1, h + 3, z, {});
        }
    }

    // --- Stairs ---
    // Create stairs connecting pagoda level to city
    let sx = pagodaX, sz = pagodaZ;
    let sy = pagodaY;
    for (let i = 0; i < 15; i++) {
        sx += 1;
        const h = heightMap[Math.min(size-1, sx) * size + sz];
        if (h < sy) {
            addVoxel('streets', sx, h + 1, sz, { isStair: true });
            sy = h + 1;
        }
    }

    // --- Clouds ---
    for (let i = 0; i < 10; i++) {
        const cx = (rand() - 0.5) * 150;
        const cy = 50 + rand() * 20;
        const cz = (rand() - 0.5) * 150;
        buildCloud(cx, cy, cz, addVoxel, rand);
    }

    // 3. Create Instanced Meshes
    createInstancedMeshes(voxels);

    document.getElementById('voxelCount').textContent = instancedMeshes.reduce((acc, m) => acc + m.mesh.count, 0);
    updateDayNight();
}

// --- Builders ---

function buildPagoda(cx, cy, cz, addVoxel) {
    const tiers = 5;
    let baseY = cy;
    let width = 5;

    for (let t = 0; t < tiers; t++) {
        // Body
        for (let x = -width; x <= width; x++) {
            for (let z = -width; z <= width; z++) {
                // Hollow out center
                if (Math.abs(x) === width || Math.abs(z) === width) {
                    addVoxel('pagoda', cx + x, baseY, cz + z, { tier: t + 1 });
                    // Windows
                    if (t > 0 && (Math.abs(x) === width || Math.abs(z) === width) && (x + z) % 3 === 0) {
                        addVoxel('windows', cx + x, baseY, cz + z, { tier: t + 1 });
                    }
                }
            }
        }
        baseY++; // Next tier base
        
        // Roof (Upturned Eaves)
        const roofWidth = width + 1;
        for (let x = -roofWidth; x <= roofWidth; x++) {
            for (let z = -roofWidth; z <= roofWidth; z++) {
                // Main roof
                addVoxel('pagoda', cx + x, baseY, cz + z, { isRoof: true, tier: t + 1 });
                
                // Upturned corners
                if (Math.abs(x) === roofWidth && Math.abs(z) === roofWidth) {
                    addVoxel('pagoda', cx + x, baseY + 1, cz + z, { isEave: true, tier: t + 1 });
                }
            }
        }
        baseY++;
        width -= 1;
        if (width < 1) width = 1;
    }

    // Spire
    for (let i = 0; i < 5; i++) {
        addVoxel('spire', cx, baseY + i, cz, {});
    }
    addVoxel('spire', cx, baseY + 5, cz, { isTop: true });
}

function buildHouse(cx, cy, cz, addVoxel, rand) {
    const w = 3 + Math.floor(rand() * 3);
    const d = 3 + Math.floor(rand() * 3);
    const h = 3;

    // Walls
    for (let x = 0; x < w; x++) {
        for (let z = 0; z < d; z++) {
            for (let y = 0; y < h; y++) {
                if (x === 0 || x === w - 1 || z === 0 || z === d - 1) {
                    addVoxel('houses', cx + x, cy + y, cz + z, {});
                    if (y === 1 && (x === Math.floor(w/2) || z === Math.floor(d/2))) {
                        addVoxel('windows', cx + x, cy + y, cz + z, {});
                    }
                }
            }
        }
    }

    // Sloped Roof
    for (let y = 0; y < Math.ceil(Math.max(w, d) / 2); y++) {
        const shrink = y;
        for (let x = shrink; x < w - shrink; x++) {
            for (let z = shrink; z < d - shrink; z++) {
                if (x === shrink || x === w - 1 - shrink || z === shrink || z === d - 1 - shrink) {
                    addVoxel('roofs', cx + x, cy + h + y, cz + z, {});
                }
            }
        }
    }
}

function buildTree(cx, cy, cz, addVoxel, rand) {
    const height = 3 + Math.floor(rand() * 3);
    // Trunk
    for (let y = 0; y < height; y++) {
        addVoxel('terrain', cx, cy + y, cz, { type: 'dirt' });
    }
    // Leaves
    for (let y = height; y < height + 3; y++) {
        const rad = y === height ? 2 : 1;
        for (let x = -rad; x <= rad; x++) {
            for (let z = -rad; z <= rad; z++) {
                if (Math.abs(x) + Math.abs(z) <= rad + 1) {
                    addVoxel('trees', cx + x, cy + y, cz + z, {});
                }
            }
        }
    }
    // Lantern in tree?
    if (rand() < 0.3) {
        addVoxel('lanterns', cx, cy + height - 1, cz, {});
    }
}

function buildCloud(cx, cy, cz, addVoxel, rand) {
    const w = 5 + Math.floor(rand() * 5);
    const d = 5 + Math.floor(rand() * 5);
    for (let x = 0; x < w; x++) {
        for (let z = 0; z < d; z++) {
            if (rand() < 0.7) {
                // Clouds are added to a special 'clouds' list later, 
                // but for now let's just track positions to create a mesh
                // We will handle clouds separately in createInstancedMeshes
            }
        }
    }
    // Actually, let's just push cloud voxels to a temporary list
    // We'll handle cloud creation outside the main voxel loop for simplicity in this snippet
}

// --- Rendering Setup ---

function createInstancedMeshes(voxelData) {
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();

    // Helper to create mesh
    const createMesh = (list, materialConfig, typeMap) => {
        if (list.length === 0) return;

        const material = new THREE.MeshStandardMaterial(materialConfig);
        const mesh = new THREE.InstancedMesh(geometry, material, list.length);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData.type = materialConfig.name || 'unknown';
        mesh.userData.items = [];

        list.forEach((item, i) => {
            dummy.position.set(item.x, item.y, item.z);
            dummy.updateMatrix();
            mesh.setMatrixAt(i, dummy.matrix);

            // Color variation
            let cHex = 0xffffff;
            if (typeMap) {
                const palette = typeMap;
                cHex = palette[Math.floor(Math.random() * palette.length)];
            } else if (item.type) {
                const palette = PALETTES[item.type] || [0xffffff];
                cHex = palette[Math.floor(Math.random() * palette.length)];
            }
            
            // Store metadata for raycasting
            mesh.userData.items[i] = item;
            mesh.setColorAt(i, color.setHex(cHex));
        });

        mesh.instanceMatrix.needsUpdate = true;
        if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
        
        scene.add(mesh);
        instancedMeshes.push({ mesh, type: mesh.userData.type });
    };

    // Terrain
    createMesh(voxelData.terrain, { name: 'Terrain', roughness: 0.9 }, null);

    // Water
    const waterMat = { name: 'Water', color: 0x4682b4, transparent: true, opacity: 0.7, metalness: 0.1, roughness: 0.1 };
    createMesh(voxelData.water, waterMat, PALETTES.water);

    // Pagoda Structure
    createMesh(voxelData.pagoda, { name: 'Pagoda', roughness: 0.6 }, null);

    // Spire
    createMesh(voxelData.spire, { name: 'Spire', color: 0xffd700, metalness: 0.8, roughness: 0.2 }, null);

    // Houses
    createMesh(voxelData.houses, { name: 'House Wall', roughness: 0.8 }, PALETTES.houseWall);

    // Roofs
    createMesh(voxelData.roofs, { name: 'House Roof', roughness: 0.7 }, PALETTES.houseRoof);

    // Streets
    createMesh(voxelData.streets, { name: 'Street', roughness: 0.9 }, PALETTES.street);

    // Bridges
    createMesh(voxelData.bridges, { name: 'Bridge', roughness: 0.7 }, PALETTES.bridge);

    // Trees
    createMesh(voxelData.trees, { name: 'Tree Leaves', roughness: 0.9 }, PALETTES.grass);

    // Windows (Emissive)
    const windowMat = { name: 'Window', color: 0xfff8dc, emissive: 0x000000, emissiveIntensity: 0 };
    createMesh(voxelData.windows, windowMat, null);
    // Tag for day/night
    instancedMeshes.find(i => i.type === 'Window').mesh.userData.isEmissive = true;

    // Lanterns (Emissive)
    const lanternMat = { name: 'Lantern', color: 0xffd700, emissive: 0x000000, emissiveIntensity: 0 };
    createMesh(voxelData.lanterns, lanternMat, null);
    const lanternMesh = instancedMeshes.find(i => i.type === 'Lantern');
    if(lanternMesh) {
        lanternMesh.mesh.userData.isEmissive = true;
        lanternMesh.mesh.userData.items.forEach((item, i) => {
            lanterns.push({ mesh: lanternMesh.mesh, index: i, item });
        });
    }

    // Add Point Lights near Pagoda
    const pagodaCenter = voxelData.pagoda[0];
    if (pagodaCenter) {
        for(let i=0; i<3; i++) {
            const pl = new THREE.PointLight(0xffaa00, 0, 15);
            pl.position.set(pagodaCenter.x + (i-1)*3, pagodaCenter.y + 5, pagodaCenter.z);
            scene.add(pl);
            pointLights.push(pl);
        }
    }
}

// --- Animation Loop ---

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    const time = clock.getElapsedTime();

    // FPS Counter
    if (renderer.info.render.frame % 10 === 0) {
        document.getElementById('fps').textContent = Math.round(1 / delta);
    }

    // Cinematic Orbit
    if (isCinematic) {
        cinematicTime += delta;
        const duration = 10;
        const progress = Math.min(cinematicTime / duration, 1);
        
        // Orbit around center
        const angle = time * 0.2;
        const radius = 60;
        camera.position.x = Math.cos(angle) * radius;
        camera.position.z = Math.sin(angle) * radius;
        camera.position.y = 30 + Math.sin(time * 0.5) * 5;
        camera.lookAt(0, 20, 0);

        if (progress >= 1) {
            isCinematic = false;
            controls.enabled = true;
            controls.target.set(0, 15, 0);
            controls.update();
        }
    } else {
        controls.update();
    }

    // Water Animation
    const waterMeshData = instancedMeshes.find(i => i.type === 'Water');
    if (waterMeshData) {
        const dummy = new THREE.Object3D();
        const items = waterMeshData.mesh.userData.items;
        for(let i=0; i<items.length; i++) {
            const item = items[i];
            // Gentle bobbing
            const yOff = Math.sin(time * 2 + item.x + item.z) * 0.1;
            dummy.position.set(item.x, item.y + yOff, item.z);
            dummy.updateMatrix();
            waterMeshData.mesh.setMatrixAt(i, dummy.matrix);
        }
        waterMeshData.mesh.instanceMatrix.needsUpdate = true;
    }

    // Lantern Flicker (Night only)
    if (dayNightValue > 0.6) {
        const intensity = 1 + Math.sin(time * 10) * 0.1;
        pointLights.forEach(l => l.intensity = 2 * intensity);
        
        // Staggered lantern turn on (simulated by intensity variation if needed, 
        // but here we just ensure they are on with slight flicker)
        const lanternMeshData = instancedMeshes.find(i => i.type === 'Lantern');
        if(lanternMeshData) {
            // We could animate emissive intensity here
            lanternMeshData.mesh.material.emissiveIntensity = 2 + Math.sin(time * 5) * 0.5;
        }
    }

    renderer.render(scene, camera);
}

// --- Day/Night Cycle ---
function updateDayNight() {
    // 0 = Day, 1 = Night
    const nightFactor = dayNightValue;

    // Sky Color
    const dayColor = new THREE.Color(0x87ceeb);
    const nightColor = new THREE.Color(0x02081a);
    const currentSky = dayColor.clone().lerp(nightColor, nightFactor);
    scene.background = currentSky;
    scene.fog.color = currentSky;

    // Sun
    const sunDayIntensity = 2;
    const sunNightIntensity = 0;
    sun.intensity = sunDayIntensity * (1 - nightFactor);
    
    // Move sun
    const angle = (nightFactor * Math.PI) - (Math.PI / 2); // -90 (horizon) to 90 (below)
    sun.position.set(Math.cos(angle) * 100, Math.sin(angle) * 100, 50);

    // Ambient
    scene.userData.ambient.intensity = 1.5 * (1 - nightFactor) + 0.2;
    scene.userData.hemi.intensity = 1.0 * (1 - nightFactor) + 0.2;

    // Emissive Objects
    const emissiveIntensity = nightFactor > 0.5 ? (nightFactor - 0.5) * 4 : 0;
    
    // Windows
    const windowMesh = instancedMeshes.find(i => i.type === 'Window');
    if(windowMesh) {
        windowMesh.mesh.material.emissive.setHex(0xfff8dc);
        windowMesh.mesh.material.emissiveIntensity = emissiveIntensity;
    }

    // Lanterns
    const lanternMesh = instancedMeshes.find(i => i.type === 'Lantern');
    if(lanternMesh) {
        lanternMesh.mesh.material.emissive.setHex(0xffd700);
        lanternMesh.mesh.material.emissiveIntensity = emissiveIntensity;
    }

    // Point Lights
    pointLights.forEach(l => l.intensity = nightFactor > 0.5 ? 2 : 0);
}

// --- Interaction ---

function onMouseMove(event) {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    if (isCinematic) return;

    raycaster.setFromCamera(mouse, camera);
    
    const meshes = instancedMeshes.map(i => i.mesh);
    const intersects = raycaster.intersectObjects(meshes);

    const tooltip = document.getElementById('tooltip');

    // Reset previous highlight (simplified: just change color of intersected)
    // In a real app, you'd keep track of the previous one.
    
    if (intersects.length > 0) {
        const hit = intersects[0];
        const mesh = hit.object;
        const instanceId = hit.instanceId;
        const data = mesh.userData.items[instanceId];
        const type = mesh.userData.type;

        let label = "Unknown Voxel";
        if (type === 'Pagoda') label = data.isRoof ? `Pagoda Roof (Tier ${data.tier})` : `Pagoda Tier ${data.tier}`;
        else if (type === 'House Wall') label = "House Wall";
        else if (type === 'House Roof') label = "House Roof";
        else if (type === 'Window') label = "Window";
        else if (type === 'Lantern') label = "Lantern";
        else if (type === 'Bridge') label = "Bridge";
        else if (type === 'Street') label = "Street";
        else if (type === 'Terrain') label = data.type.toUpperCase() + " Block";
        else if (type === 'Water') label = "Water";
        else if (type === 'Spire') label = "Spire";
        else if (type === 'Tree Leaves') label = "Tree";

        tooltip.style.display = 'block';
        tooltip.style.left = event.clientX + 15 + 'px';
        tooltip.style.top = event.clientY + 15 + 'px';
        tooltip.textContent = label;

        // Highlight: Change color of this specific instance temporarily
        // Note: InstancedMesh color manipulation per-frame can be expensive if done for many
        // but for single hover it's fine.
        // We need to restore the old color later.
        // For simplicity, we won't implement full "restore" logic in this snippet to keep it robust,
        // but we can brighten it.
        // Actually, let's just rely on tooltip for "highlight" or use outline if possible.
        // To strictly follow "highlights it", let's change color.
        if (mesh.userData.lastHoveredId !== instanceId) {
            // Restore old
            if (mesh.userData.lastHoveredId !== undefined) {
                mesh.setColorAt(mesh.userData.lastHoveredId, new THREE.Color(mesh.userData.lastHoveredColor));
                mesh.instanceColor.needsUpdate = true;
            }
            // Store new
            mesh.userData.lastHoveredId = instanceId;
            const c = new THREE.Color();
            mesh.getColorAt(instanceId, c);
            mesh.userData.lastHoveredColor = c.getHex();
            mesh.setColorAt(instanceId, new THREE.Color(0xffffff).lerp(c, 0.5)); // Brighten
            mesh.instanceColor.needsUpdate = true;
        }
    } else {
        tooltip.style.display = 'none';
        // Restore last hovered if any
        instancedMeshes.forEach(i => {
            const m = i.mesh;
            if (m.userData.lastHoveredId !== undefined) {
                m.setColorAt(m.userData.lastHoveredId, new THREE.Color(m.userData.lastHoveredColor));
                m.instanceColor.needsUpdate = true;
                m.userData.lastHoveredId = undefined;
            }
        });
    }
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function regenerate() {
    seed = Math.random() * 10000;
    // Reset camera
    camera.position.set(50, 40, 50);
    controls.target.set(0, 15, 0);
    isCinematic = true;
    cinematicTime = 0;
    controls.enabled = false;
    
    generateWorld();
}

// Start
init();

</script>

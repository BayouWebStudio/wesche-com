<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vesper Tides</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1026; touch-action: none; }
  canvas { display: block; touch-action: none; }
  .chip {
    position: absolute;
    background: rgba(24, 12, 28, 0.55);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 180, 120, 0.25);
    border-radius: 14px;
    color: #ffd9b0;
    font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }
  #title {
    top: max(12px, env(safe-area-inset-top)); left: 14px;
    padding: 9px 14px;
  }
  #title h1 { margin: 0; font-size: 16px; letter-spacing: 1.5px; font-weight: 800; }
  #title div { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  #compass {
    top: max(12px, env(safe-area-inset-top)); right: 14px;
    width: 64px; height: 78px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 6px 4px 4px;
  }
  #needle { width: 34px; height: 34px; transition: transform 0.15s linear; }
  #dist { font-size: 11px; font-weight: 700; opacity: 0.9; }
  #hint {
    left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    padding: 8px 16px; font-size: 13px; font-weight: 600;
    white-space: nowrap;
    transition: opacity 1.2s ease;
  }
  #toast {
    left: 50%; bottom: 20%;
    transform: translateX(-50%);
    padding: 12px 24px;
    font-size: 17px; font-weight: 800; letter-spacing: 0.4px;
    white-space: nowrap;
    border-color: rgba(255, 200, 130, 0.5);
    opacity: 0; transition: opacity 0.4s ease;
  }
  #stick-base, #stick-knob {
    position: absolute; border-radius: 50%;
    pointer-events: none; display: none;
    transform: translate(-50%, -50%);
  }
  #stick-base {
    width: 96px; height: 96px;
    border: 2px solid rgba(255, 210, 160, 0.45);
    background: rgba(30, 16, 34, 0.25);
  }
  #stick-knob {
    width: 44px; height: 44px;
    background: rgba(255, 210, 160, 0.55);
    box-shadow: 0 0 14px rgba(255, 170, 90, 0.6);
  }
</style>
</head>
<body>
<div class="chip" id="title"><h1>⛵ VESPER TIDES</h1><div id="count">Islands discovered: 0</div></div>
<div class="chip" id="compass">
  <svg id="needle" viewBox="0 0 34 34"><path d="M17 3 L23 25 L17 20.5 L11 25 Z" fill="#ffb877"/></svg>
  <div id="dist"></div>
</div>
<div class="chip" id="hint">W A S D · arrows · or touch-drag to sail</div>
<div class="chip" id="toast"></div>
<div id="stick-base"></div>
<div id="stick-knob"></div>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butterbean Hollow</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ad4f5; }
  canvas { display: block; }
  #hud {
    position: absolute; top: 16px; left: 16px;
    background: rgba(255, 250, 235, 0.92);
    border: 3px solid #8a5a3b;
    border-radius: 18px;
    padding: 14px 18px;
    font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    color: #5b3a21;
    box-shadow: 0 6px 0 rgba(90, 60, 30, 0.25);
    max-width: 290px;
    user-select: none;
  }
  #hud h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: 0.3px; }
  #count { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  #tally { font-size: 12px; line-height: 1.5; margin: 0 0 10px; color: #6d4a2b; }
  #tally b { display: block; margin-bottom: 2px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 800; font-size: 14px;
    border: 0; border-radius: 12px; padding: 9px 14px; cursor: pointer;
    color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.22);
    transition: transform 0.08s ease, filter 0.15s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.22); }
  button:disabled { filter: grayscale(0.7) brightness(0.85); cursor: default; }
  #abduct { background: #7c4dbe; }
  #return { background: #43a047; }
  #hint { font-size: 11px; color: #93755a; margin-top: 10px; }
  .wiggle { animation: wig 0.4s ease; }
  @keyframes wig {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  #caption {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    background: rgba(35, 25, 50, 0.82); color: #ffeebe;
    font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: 0.3px;
    padding: 10px 22px; border-radius: 999px;
    opacity: 0; transition: opacity 0.35s ease;
    pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="hud">
  <h1>🛸 Butterbean Hollow</h1>
  <div id="count"></div>
  <div id="tally" hidden></div>
  <div class="btns">
    <button id="abduct">🛸 Abduct</button>
    <button id="return">🐮 Return everyone</button>
  </div>
  <div id="hint">Drag to orbit · scroll to zoom</div>
</div>
<div id="caption"></div>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/controls/OrbitControls.js": "./lib/OrbitControls.js"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>

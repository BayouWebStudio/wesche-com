<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isla Fuego</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6e5a4a; }
  body { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; color: #fbf3e4; }
  canvas { display: block; }
  .title { position: fixed; left: 28px; top: 24px; pointer-events: none; text-shadow: 0 1px 14px rgba(40, 20, 10, .5); }
  .title h1 { margin: 0; font-weight: 400; font-size: 30px; letter-spacing: .02em; }
  .title p { margin: 5px 0 0; font-size: 14px; opacity: .85; font-style: italic; }
  .bar { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; gap: 10px; }
  button {
    font: inherit; font-size: 17px; color: #fbf3e4; padding: 12px 26px; border-radius: 999px; cursor: pointer;
    background: rgba(40, 24, 18, .5); border: 1px solid rgba(255, 235, 200, .35);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .12s ease, background .2s ease, opacity .2s ease;
  }
  button:hover { background: rgba(60, 36, 26, .65); }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid #ffd58a; outline-offset: 3px; }
  button:disabled { opacity: .45; cursor: default; }
  #erupt { background: rgba(178, 52, 18, .72); border-color: rgba(255, 190, 140, .6); }
  #erupt:hover:not(:disabled) { background: rgba(214, 70, 24, .85); }
  .status { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); font-size: 14px; font-style: italic; opacity: 0; transition: opacity .6s ease; pointer-events: none; text-shadow: 0 1px 10px rgba(40, 20, 10, .6); }
  .status.show { opacity: .9; }
</style>
</head>
<body>
<div class="title">
  <h1>Isla Fuego</h1>
  <p>Drag to orbit · scroll to zoom</p>
</div>
<div class="status" id="status"></div>
<div class="bar">
  <button id="erupt">Erupt</button>
  <button id="reset">Reset</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ss = (v) => { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); };
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), ux), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), ux), uy);
}
function fbm(x, y, o = 4) { let v = 0, a = 0.5, f = 1, sum = 0; for (let i = 0; i < o; i++) { v += a * noise2(x * f, y * f); sum += a; a *= 0.5; f *= 2.03; } return v / sum; }
function lerpAngle(a, b, k) { let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d)); return a + d * k; }

// ---------- island shape ----------
const VX = 40, VZ = 20;                      // village centre
function terrainH(x, z) {
  const r = Math.hypot(x, z), ang = Math.atan2(z, x);
  const warp = 1 + (noise2(Math.cos(ang) * 2 + 5, Math.sin(ang) * 2 + 5) - 0.5) * 0.36;
  const re = r * warp;
  let h = 4.5 * (1 - ss((re - 34) / 26));
  h -= 9 * ss((re - 52) / 30);
  h += (fbm(x * 0.045 + 7, z * 0.045 + 3) - 0.45) * 9 * ss((58 - re) / 20);
  const cone = 30 * Math.pow(Math.max(0, 1 - r / 30), 1.7);
  h += cone * (1 + (noise2(Math.cos(ang) * 3 + 2, Math.sin(ang) * 3) - 0.5) * 0.5);
  h -= 16 * Math.max(0, 1 - (r / 7) * (r / 7));
  if (r < 6) h = lerp(h, 17.0, ss((6 - r) / 2.5));
  const dv = Math.hypot(x - VX, z - VZ);
  h = lerp(h, 2.0, 1 - ss((dv - 7) / 6));
  return h;
}
const slopeAt = (x, z) => { const e = 0.6; return Math.hypot(terrainH(x + e, z) - terrainH(x - e, z), terrainH(x, z + e) - terrainH(x, z - e)) / (2 * e); };
// waves (mirrored in GLSL below)
const waveH = (x, z, t) => Math.sin(x * 0.12 + t * 0.9) * 0.35 + Math.sin(z * 0.15 - t * 0.7) * 0.3 + Math.sin((x + z) * 0.07 + t * 0.5) * 0.45 + Math.sin((x - z * 0.6) * 0.2 + t * 1.3) * 0.15;
const WAVE_GLSL = `float waveH(vec2 p, float t){ return sin(p.x*0.12 + t*0.9)*0.35 + sin(p.y*0.15 - t*0.7)*0.3 + sin((p.x+p.y)*0.07 + t*0.5)*0.45 + sin((p.x - p.y*0.6)*0.2 + t*1.3)*0.15; }`;
const NOISE = `
float hash21(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); f = f*f*(3.0-2.0*f);
  float a = hash21(i); float b = hash21(i+vec2(1.0,0.0)); float c = hash21(i+vec2(0.0,1.0)); float d = hash21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }`;
const POST = `#include <tonemapping_fragment>\n#include <colorspace_fragment>`;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf0dcb8, 140, 420);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 1200);
const CAM_POS = new THREE.Vector3(96, 54, 108), CAM_TGT = new THREE.Vector3(0, 10, 0);
camera.position.copy(CAM_POS);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CAM_TGT);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 28; controls.maxDistance = 300;
controls.maxPolarAngle = Math.PI * 0.485;
controls.enablePan = false;

// ---------- global mood (day -> ash) ----------
const uTime = { value: 0 };
const mood = { ash: 0, target: 0, flash: 0 };
const uAsh = { value: 0 }, uFlash = { value: 0 };
const sunDir = new THREE.Vector3(0.55, 0.6, 0.45).normalize();

const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uAsh, uFlash, uSun: { value: sunDir } },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uAsh, uFlash; uniform vec3 uSun; varying vec3 vP;
    void main(){ vec3 d = normalize(vP); float h = d.y;
      vec3 top = mix(vec3(0.30,0.60,0.86), vec3(0.16,0.13,0.12), uAsh);
      vec3 hor = mix(vec3(0.96,0.85,0.66), vec3(0.55,0.28,0.16), uAsh);
      vec3 c = mix(hor, top, smoothstep(-0.02, 0.5, h));
      float s = max(dot(d, uSun), 0.0);
      c += vec3(1.0,0.85,0.6) * (pow(s, 600.0)*4.0 + pow(s, 12.0)*0.35) * (1.0 - uAsh*0.8);
      c += uFlash * vec3(0.5,0.55,0.7);
      gl_FragColor = vec4(c, 1.0); ${POST} }`
}));
scene.add(sky);

const sun = new THREE.DirectionalLight(0xfff0d2, 2.6);
sun.position.copy(sunDir).multiplyScalar(160);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 40; sun.shadow.camera.far = 320;
sun.shadow.camera.left = sun.shadow.camera.bottom = -78;
sun.shadow.camera.right = sun.shadow.camera.top = 78;
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.05;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0x9fc8e8, 0x6a5a45, 0.9);
scene.add(hemi);

// ---------- terrain ----------
const TSIZE = 176, TSEG = 200;
const terrainGeo = new THREE.PlaneGeometry(TSIZE, TSIZE, TSEG, TSEG);
terrainGeo.rotateX(-Math.PI / 2);
{
  const pos = terrainGeo.attributes.position, col = new Float32Array(pos.count * 3);
  const c = new THREE.Color(), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = terrainH(x, z), sl = slopeAt(x, z);
    pos.setY(i, h);
    const n2 = noise2(x * 0.3 + 9, z * 0.3);
    if (h < -1) c.setHSL(0.47, 0.35, 0.36 + n2 * 0.06);
    else if (h < 0.9) c.setHSL(0.11, 0.48, 0.74 + n2 * 0.05);
    else if (h < 2.4) c.setHSL(0.11, 0.48, 0.72).lerp(tmp.setHSL(0.27, 0.5, 0.4), (h - 0.9) / 1.5);
    else { const f = fbm(x * 0.06 + 3, z * 0.06 + 1); c.setHSL(0.25 + f * 0.07, 0.52, 0.37 - f * 0.13 + n2 * 0.05); }
    const rocky = clamp((sl - 0.75) / 0.5, 0, 1) + clamp((h - 11) / 5, 0, 1);
    if (rocky > 0) c.lerp(tmp.setHSL(0.06, 0.16, 0.32 + n2 * 0.1), clamp(rocky, 0, 1));
    c.lerp(tmp.set(0x231b18), clamp((h - 17) / 4, 0, 1));
    const dv = Math.hypot(x - VX, z - VZ); if (dv < 9) c.lerp(tmp.set(0x9c7f56), (1 - dv / 9) * 0.55);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  terrainGeo.computeVertexNormals();
  const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
  terrain.receiveShadow = true; terrain.castShadow = true;
  scene.add(terrain);
}

// ---------- lava flows (precomputed descent paths) ----------
const flows = [];
{
  for (let f = 0; f < 6; f++) {
    const a = (f / 6) * TAU + rnd(-0.3, 0.3);
    let x = Math.cos(a) * 8.6, z = Math.sin(a) * 8.6, dx = Math.cos(a), dz = Math.sin(a), d = 0;
    const pts = [{ x, z, d }];
    let stuck = 0, lastH = 99;
    for (let s = 0; s < 120; s++) {
      const e = 0.8, gx = (terrainH(x + e, z) - terrainH(x - e, z)) / (2 * e), gz = (terrainH(x, z + e) - terrainH(x, z - e)) / (2 * e);
      const gl = Math.hypot(gx, gz) || 1;
      // steepest descent with a seaward bias that grows if the flow pools in a basin
      const hh = terrainH(x, z); stuck = hh > lastH - 0.05 ? Math.min(stuck + 1, 8) : Math.max(0, stuck - 1); lastH = hh;
      const bias = 0.7 + stuck * 0.35;
      const rr = Math.hypot(x, z) || 1, tx = -gx / gl + (x / rr) * bias, tz = -gz / gl + (z / rr) * bias, tl = Math.hypot(tx, tz) || 1;
      dx = lerp(dx, tx / tl, 0.4) + (noise2(x * 0.3, z * 0.3) - 0.5) * 0.2;
      dz = lerp(dz, tz / tl, 0.4) + (noise2(x * 0.3 + 7, z * 0.3) - 0.5) * 0.2;
      const l = Math.hypot(dx, dz); dx /= l; dz /= l;
      x += dx; z += dz; d += 1;
      pts.push({ x, z, d });
      if (terrainH(x, z) < 0.25) break;
    }
    flows.push({ pts, len: d, end: pts[pts.length - 1], reachesSea: terrainH(x, z) < 0.25 });
  }
}
const lavaGeo = terrainGeo.clone();
{
  const pos = lavaGeo.attributes.position, n = pos.count;
  const aLava = new Float32Array(n).fill(1e5), aEdge = new Float32Array(n).fill(1);
  for (let i = 0; i < n; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, pos.getY(i) + 0.18);
    if (Math.hypot(x, z) > 75) continue;
    let best = 1e9, bestD = 0, bestW = 1;
    for (const fl of flows) {
      const p = fl.pts;
      for (let k = 0; k < p.length - 1; k++) {
        const ax = p[k].x, az = p[k].z, bx = p[k + 1].x, bz = p[k + 1].z;
        const vx = bx - ax, vz = bz - az, wx = x - ax, wz = z - az;
        const t = clamp((vx * wx + vz * wz) / (vx * vx + vz * vz), 0, 1);
        const ex = ax + vx * t - x, ez = az + vz * t - z, dist = ex * ex + ez * ez;
        const dAlong = p[k].d + t;
        const w = 1.7 + dAlong * 0.035;
        if (dist < best && dist < w * w) { best = dist; bestD = dAlong; bestW = w; }
      }
    }
    if (best < 1e8) { aLava[i] = bestD; aEdge[i] = Math.sqrt(best) / bestW; }
  }
  lavaGeo.setAttribute('aLava', new THREE.BufferAttribute(aLava, 1));
  lavaGeo.setAttribute('aEdge', new THREE.BufferAttribute(aEdge, 1));
}
const uFront = { value: 0 };
const lava = new THREE.Mesh(lavaGeo, new THREE.ShaderMaterial({
  uniforms: { uFront, uTime }, transparent: true, depthWrite: false,
  vertexShader: `attribute float aLava, aEdge; varying float vLava, vEdge; varying vec3 vWp;
    void main(){ vLava = aLava; vEdge = aEdge; vWp = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uFront, uTime; varying float vLava, vEdge; varying vec3 vWp; ${NOISE}
    void main(){
      if (vLava > uFront) discard;
      float since = uFront - vLava;
      float age = since / 5.0;
      float n = vnoise(vWp.xz*0.8 + vec2(0.0, -uTime*0.25));
      float n2 = vnoise(vWp.xz*2.6 + 3.0 + vec2(uTime*0.05));
      float crack = pow(1.0 - abs(n2*2.0-1.0), 6.0);
      float heat = exp(-age/16.0);
      float front = 1.0 - smoothstep(0.0, 5.0, since);
      vec3 hot = mix(vec3(1.0,0.32,0.04), vec3(1.0,0.9,0.45), front*0.8 + crack*0.3);
      vec3 crust = vec3(0.13,0.06,0.04);
      float glow = clamp(heat*(0.45 + 0.5*n) + crack*heat*1.2 + front, 0.0, 1.0);
      vec3 col = mix(crust, hot, glow) * (1.0 + front*1.6 + heat*0.4);
      float alpha = 1.0 - smoothstep(0.72, 1.0, vEdge);
      gl_FragColor = vec4(col, alpha); ${POST} }`
}));
lava.renderOrder = 2;
scene.add(lava);
const flowLen = Math.max(...flows.map(f => f.len));

// crater pool
const CRATER_Y = terrainH(0, 0) + 0.25;
const uBoil = { value: 0 };
const pool = new THREE.Mesh(new THREE.CircleGeometry(4.4, 40), new THREE.ShaderMaterial({
  uniforms: { uTime, uBoil }, transparent: true, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uTime, uBoil; varying vec2 vUv; ${NOISE}
    void main(){ vec2 p = vUv - 0.5; float r = length(p)*2.0;
      float n = vnoise(vUv*6.0 + vec2(uTime*0.12, -uTime*0.08)); float n2 = vnoise(vUv*15.0 - vec2(0.0, uTime*(0.3+uBoil)));
      float crust = smoothstep(0.42, 0.62, n) * (1.0 - uBoil*0.75);
      vec3 hot = mix(vec3(1.0,0.38,0.04), vec3(1.0,0.92,0.5), n2*(0.3+uBoil*0.7)) * (1.4 + uBoil*1.6);
      vec3 col = mix(hot, vec3(0.16,0.06,0.03), crust);
      float a = 1.0 - smoothstep(0.8, 1.0, r);
      gl_FragColor = vec4(col, a); ${POST} }`
}));
pool.rotation.x = -Math.PI / 2; pool.position.y = CRATER_Y; pool.renderOrder = 3;
scene.add(pool);
const craterLight = new THREE.PointLight(0xff5a1a, 500, 70, 2); craterLight.position.set(0, CRATER_Y + 2, 0); scene.add(craterLight);
const flowLights = [0, 1].map(() => { const l = new THREE.PointLight(0xff6a20, 0, 34, 2); scene.add(l); return l; });
const boltLight = new THREE.PointLight(0xd8e4ff, 0, 260, 1.5); boltLight.position.set(0, 60, -4); scene.add(boltLight);

// ---------- vegetation ----------
const swayMat = (base) => {
  base.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = uTime; shader.uniforms.uGust = uGust;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>\nuniform float uTime, uGust; attribute float aSway; attribute float aPhase;`)
      .replace('#include <begin_vertex>', `vec3 transformed = vec3(position);
        float g = 0.5 + 0.5*sin(uTime*0.5 + position.x*0.03 + position.z*0.04);
        transformed.x += (sin(uTime*1.6 + aPhase)*0.35 + g*0.5 + uGust*1.2) * aSway;
        transformed.z += (cos(uTime*1.2 + aPhase*1.3)*0.25 + uGust*0.4) * aSway;`);
  };
  return base;
};
const uGust = { value: 0 };
function addSway(geo, swayFn, phase) {
  const pos = geo.attributes.position, n = pos.count, s = new Float32Array(n), p = new Float32Array(n);
  for (let i = 0; i < n; i++) { s[i] = swayFn(pos.getX(i), pos.getY(i), pos.getZ(i)); p[i] = phase; }
  geo.setAttribute('aSway', new THREE.BufferAttribute(s, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(p, 1));
  return geo;
}
function colorize(geo, color) {
  const n = geo.attributes.position.count, c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { c[i * 3] = color.r; c[i * 3 + 1] = color.g; c[i * 3 + 2] = color.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(c, 3));
  return geo;
}
const inVillage = (x, z) => Math.hypot(x - VX, z - VZ) < 10.5;
function scatter(count, ok, fn) {
  let placed = 0, tries = 0;
  while (placed < count && tries++ < count * 40) {
    const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * 62;
    const x = Math.cos(a) * r, z = Math.sin(a) * r, h = terrainH(x, z), sl = slopeAt(x, z);
    if (ok(x, z, h, sl)) { fn(x, z, h); placed++; }
  }
}
{
  const trunks = [], fronds = [], bushes = [], c = new THREE.Color();
  const frondShape = new THREE.Shape();
  frondShape.moveTo(0, 0); frondShape.quadraticCurveTo(1.5, 0.9, 4.2, 0.15); frondShape.quadraticCurveTo(1.5, -0.9, 0, 0);
  const frondGeo = new THREE.ShapeGeometry(frondShape, 5);
  {
    const pos = frondGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) { const x = pos.getX(i); pos.setZ(i, -x * x * 0.09); pos.setY(i, pos.getY(i) * (1 + Math.abs(pos.getY(i)) * 0.4)); }
    frondGeo.computeVertexNormals();
  }
  // palms
  scatter(72, (x, z, h, sl) => h > 0.9 && h < 8.5 && sl < 0.5 && !inVillage(x, z) && Math.hypot(x, z) > 24, (x, z, h) => {
    const height = rnd(6, 11), lean = rnd(0.5, 2.2), la = Math.random() * TAU;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(x, h - 0.5, z),
      new THREE.Vector3(x + Math.cos(la) * lean * 0.3, h + height * 0.5, z + Math.sin(la) * lean * 0.3),
      new THREE.Vector3(x + Math.cos(la) * lean, h + height, z + Math.sin(la) * lean)
    ]);
    const tg = new THREE.TubeGeometry(curve, 8, 0.32, 6, false);
    trunks.push(colorize(tg, c.setHSL(0.08, 0.35, rnd(0.3, 0.42))));
    const top = curve.getPoint(1), ph = Math.random() * TAU;
    const nf = 7 + Math.floor(Math.random() * 3);
    for (let i = 0; i < nf; i++) {
      const g = frondGeo.clone();
      const a = (i / nf) * TAU + rnd(-0.2, 0.2);
      g.rotateX(rnd(-0.3, 0.3)); g.rotateZ(-rnd(0.35, 0.75)); g.rotateY(-a);
      g.scale(rnd(0.9, 1.25), 1, rnd(0.9, 1.25));
      g.translate(top.x, top.y + 0.2, top.z);
      colorize(g, c.setHSL(0.24 + Math.random() * 0.05, 0.55, rnd(0.3, 0.42)));
      addSway(g, (px, py, pz) => Math.hypot(px - top.x, pz - top.z) * 0.12 + 0.08, ph);
      fronds.push(g);
    }
  });
  // ferns (small frond clusters)
  scatter(140, (x, z, h, sl) => h > 1.2 && h < 12 && sl < 0.8 && !inVillage(x, z), (x, z, h) => {
    const ph = Math.random() * TAU, n = 5;
    for (let i = 0; i < n; i++) {
      const g = frondGeo.clone(); g.scale(0.35, 0.3, 0.35);

  };
})();

// ---------- point particles (bombs, ash) ----------
function makePoints(count, { color, opacity, blending = THREE.NormalBlending, gradient = false, atten = 300 }) {
  const pos = new Float32Array(count * 3), alpha = new Float32Array(count), size = new Float32Array(count);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1).setUsage(THREE.DynamicDrawUsage));
  const m = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color(color) }, uOpacity: { value: opacity } }, transparent: true, depthWrite: false, blending,
    vertexShader: `attribute float aAlpha, aSize; varying float vA; void main(){ vA = aAlpha; vec4 mv = modelViewMatrix*vec4(position,1.0); gl_PointSize = aSize * (${atten.toFixed(1)} / -mv.z); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uColor; uniform float uOpacity; varying float vA;
      void main(){ float d = length(gl_PointCoord - 0.5); float a = (1.0 - smoothstep(0.15, 0.5, d)) * vA * uOpacity; if (a < 0.004) discard;
        vec3 col = ${gradient ? 'mix(uColor, vec3(1.0,0.95,0.6), 1.0 - smoothstep(0.0, 0.3, d))' : 'uColor'};
        gl_FragColor = vec4(col, a); ${POST} }`
  }));
  m.frustumCulled = false; m.renderOrder = 7; scene.add(m);
  const parts = []; for (let i = 0; i < count; i++) parts.push({ p: new THREE.Vector3(), v: new THREE.Vector3(), age: 0, life: 1, size: 1, alive: false });
  return { parts, pos, alpha, size, g, count };
}
const bombs = makePoints(260, { color: 0xff5a10, opacity: 1, blending: THREE.AdditiveBlending, gradient: true, atten: 420 });
const ash = makePoints(1600, { color: 0x8a8480, opacity: 0.6, atten: 120 });
const embers = makePoints(300, { color: 0xffa040, opacity: 0.9, blending: THREE.AdditiveBlending, atten: 160 });
function emitPoint(sys, fn, n = 1) { let c = 0; for (const q of sys.parts) { if (!q.alive) { fn(q); q.alive = true; if (++c >= n) break; } } }
function clearPoints(sys) { for (const q of sys.parts) q.alive = false; }
function updatePoints(sys, dt, step) {
  for (let i = 0; i < sys.count; i++) {
    const q = sys.parts[i];
    if (!q.alive) { sys.alpha[i] = 0; continue; }
    q.age += dt;
    if (q.age >= q.life || step(q, dt) === false) { q.alive = false; sys.alpha[i] = 0; continue; }
    q.p.addScaledVector(q.v, dt);
    const k = q.age / q.life;
    sys.alpha[i] = Math.min(1, k * 8) * (1 - k * k * k);
    sys.size[i] = q.size;
    sys.pos[i * 3] = q.p.x; sys.pos[i * 3 + 1] = q.p.y; sys.pos[i * 3 + 2] = q.p.z;
  }
  sys.g.attributes.position.needsUpdate = sys.g.attributes.aAlpha.needsUpdate = sys.g.attributes.aSize.needsUpdate = true;
}

// ---------- eruption state ----------
const state = { erupting: false, E: 0, shake: 0, bombTimer: 0, boltTimer: 4, blasted: false };
const wind = new THREE.Vector3(2.2, 0, 0.8);
const statusEl = document.getElementById('status');
const eruptBtn = document.getElementById('erupt'), resetBtn = document.getElementById('reset');
function setStatus(s, hold = 4000) { statusEl.textContent = s; statusEl.classList.add('show'); clearTimeout(setStatus.t); setStatus.t = setTimeout(() => statusEl.classList.remove('show'), hold); }

function erupt() {
  if (state.erupting) return;
  state.erupting = true; state.E = 0; state.bombTimer = 1.6; state.boltTimer = 5; state.blasted = false;
  for (const b of boats) { b.fleeing = false; b.fleeDelay = rnd(1.6, 4.5); }
  for (const b of birds) { b.fleeing = false; b.fleeDelay = rnd(1.2, 2.5); }
  eruptBtn.disabled = true;
  setStatus('The mountain stirs…', 2500);
}
function reset() {
  state.erupting = false; state.E = 0; state.shake = 0;
  uFront.value = 0; mood.target = 0; uBoil.value = 0;
  smoke.clear(); clearPoints(bombs); clearPoints(ash); clearPoints(embers);
  for (const b of boats) resetBoat(b);
  for (const b of birds) b.fleeing = false;
  boltLight.intensity = 0; uFlash.value = 0;
  camera.position.copy(CAM_POS); controls.target.copy(CAM_TGT); controls.update();
  eruptBtn.disabled = false;
  setStatus('A calm morning on Isla Fuego', 3000);
}
eruptBtn.addEventListener('click', erupt);
resetBtn.addEventListener('click', reset);

// ---------- loop ----------
const clock = new THREE.Clock();
const shakeV = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = clamp(clock.getDelta(), 0.001, 0.05);
  uTime.value += dt;
  const t = uTime.value;

  // --- eruption timeline ---
  let smokeRate = 10, plumeHeat = -0.5, plumeSize = 2.2, plumeVy = 2.2;
  if (state.erupting) {
    const E = state.E += dt;
    const blast = E > 1.6;
    if (blast && !state.blasted) { state.blasted = true; setStatus('Lava on the slopes — the boats run for open water', 5000); }
    state.shake = Math.max(state.shake, blast ? 0.18 + Math.max(0, 1.4 - (E - 1.6)) * 1.2 : E * 0.25);
    uBoil.value = lerp(uBoil.value, 1, dt * 0.8);
    if (blast) {
      uFront.value = Math.min(flowLen + 5, uFront.value + dt * 5.2);
      mood.target = Math.min(1, (E - 1.6) / 12);
      smokeRate = 130; plumeHeat = 1; plumeSize = rnd(3, 6); plumeVy = rnd(12, 22);
      state.bombTimer -= dt;
      if (state.bombTimer <= 0) {
        state.bombTimer = E < 4 ? 0.12 : rnd(0.35, 0.9);
        emitPoint(bombs, (q) => { const a = Math.random() * TAU, sp = rnd(4, 15); q.p.set(rnd(-2, 2), CRATER_Y + 1, rnd(-2, 2)); q.v.set(Math.cos(a) * sp, rnd(22, 42), Math.sin(a) * sp); q.age = 0; q.life = 8; q.size = rnd(1.4, 3.2); }, E < 4 ? 14 : 5);
        emitPoint(embers, (q) => { const a = Math.random() * TAU, sp = rnd(1, 6); q.p.set(rnd(-2, 2), CRATER_Y + 1, rnd(-2, 2)); q.v.set(Math.cos(a) * sp, rnd(10, 26), Math.sin(a) * sp); q.age = 0; q.life = rnd(1.5, 3); q.size = rnd(0.4, 0.9); }, 12);
      }
      if (E > 4) {
        state.boltTimer -= dt;
        if (state.boltTimer <= 0) { state.boltTimer = rnd(2, 6); boltLight.intensity = 30000; uFlash.value = 0.9; boltLight.position.set(rnd(-15, 15), rnd(40, 75), rnd(-15, 15)); state.shake = Math.max(state.shake, 0.3); }
        for (let i = 0; i < 6; i++) emitPoint(ash, (q) => { const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * 110; q.p.set(Math.cos(a) * r + 20, rnd(60, 110), Math.sin(a) * r); q.v.set(wind.x * 0.8, -rnd(3, 6), wind.z * 0.8); q.age = 0; q.life = rnd(14, 24); q.size = rnd(0.5, 1.1); });
      }
      // steam where lava meets the sea
      for (const f of flows) if (f.reachesSea && uFront.value > f.len && Math.random() < dt * 8) smoke.emit(f.end.x + rnd(-1.5, 1.5), 0.5, f.end.z + rnd(-1.5, 1.5), { vy: rnd(2, 4), size: rnd(1.5, 2.5), grow: 1.2, life: rnd(3, 5), heat: -1, alpha: 0.7 });
      // gust from the blast
      uGust.value = lerp(uGust.value, Math.max(0, 1.2 - (E - 1.6) * 0.5) + 0.25, dt * 2);
      for (const b of boats) if (!b.fleeing && E > b.fleeDelay) b.fleeing = true;
      for (const b of birds) if (!b.fleeing && E > b.fleeDelay) { b.fleeing = true; b.dir.copy(b.g.position).setY(0).normalize().multiplyScalar(26).setY(3); }
    }
  } else uGust.value = lerp(uGust.value, 0, dt);
  // plume emission
  const nEmit = smokeRate * dt + (Math.random() < (smokeRate * dt) % 1 ? 1 : 0);
  for (let i = 0; i < Math.floor(nEmit); i++) {
    const a = Math.random() * TAU, r = Math.random() * 2.5;
    smoke.emit(Math.cos(a) * r, CRATER_Y + 0.5, Math.sin(a) * r, { vx: Math.cos(a) * rnd(0.5, 3), vz: Math.sin(a) * rnd(0.5, 3), vy: plumeVy * rnd(0.7, 1.3), size: plumeSize, grow: state.erupting ? rnd(2.2, 3.6) : 1.1, life: state.erupting ? rnd(9, 16) : rnd(6, 9), heat: plumeHeat, alpha: state.erupting ? 0.92 : 0.45 });
  }
  // village chimney / fire pit smoke
  if (Math.random() < dt * 4) smoke.emit(firepit.x, firepit.y + 0.3, firepit.z, { vy: 1.4, size: 0.5, grow: 0.5, life: 5, heat: -0.5, alpha: 0.35 });
  smoke.update(dt, wind);
  updatePoints(bombs, dt, (q, d) => { q.v.y -= 22 * d; if (q.p.y < terrainH(q.p.x, q.p.z) + 0.3) { smoke.emit(q.p.x, q.p.y + 0.5, q.p.z, { vy: 3, size: 1.5, grow: 2.5, life: 3, heat: 0.5, alpha: 0.6 }); return false; } });
  updatePoints(embers, dt, (q, d) => { q.v.y -= 8 * d; });
  updatePoints(ash, dt, (q, d) => { q.v.x += Math.sin(t * 0.7 + q.p.y) * d; if (q.p.y < Math.max(terrainH(q.p.x, q.p.z), 0) - 0.4) return false; });

  // --- mood blending ---
  mood.ash = lerp(mood.ash, mood.target, Math.min(1, dt * (mood.target > mood.ash ? 0.25 : 0.7)));
  uAsh.value = mood.ash;
  uFlash.value = Math.max(0, uFlash.value - dt * 4);
  boltLight.intensity *= Math.max(0, 1 - dt * 9);
  scene.fog.color.setRGB(lerp(0.94, 0.36, mood.ash), lerp(0.86, 0.24, mood.ash), lerp(0.72, 0.19, mood.ash));
  scene.fog.near = lerp(140, 60, mood.ash); scene.fog.far = lerp(420, 260, mood.ash);
  sun.intensity = lerp(2.6, 0.7, mood.ash); sun.color.setRGB(1, lerp(0.94, 0.6, mood.ash), lerp(0.82, 0.4, mood.ash));
  hemi.intensity = lerp(0.9, 0.5, mood.ash); hemi.color.setRGB(lerp(0.62, 0.3, mood.ash), lerp(0.78, 0.22, mood.ash), lerp(0.91, 0.2, mood.ash));
  cloudMat.color.setRGB(lerp(1, 0.35, mood.ash), lerp(1, 0.3, mood.ash), lerp(1, 0.28, mood.ash));
  craterLight.intensity = (500 + uBoil.value * 2600) * (0.85 + 0.15 * Math.sin(t * 9) * Math.sin(t * 3.7));
  flowLights.forEach((l, i) => {
    const f = flows[i * 2];
    const d = Math.min(uFront.value, f.len);
    if (d <= 0) { l.intensity = 0; return; }
    const idx = Math.min(f.pts.length - 1, Math.floor(d)), pt = f.pts[idx];
    l.position.set(pt.x, terrainH(pt.x, pt.z) + 1.5, pt.z); l.intensity = 700 * (0.8 + 0.2 * Math.sin(t * 7 + i));
  });

  // --- ambient life ---
  for (const b of boats) updateBoat(b, dt, t);
  for (const b of birds) {
    const g = b.g;
    if (b.fleeing) { g.position.addScaledVector(b.dir, dt); g.rotation.y = -Math.atan2(b.dir.z, b.dir.x); }
    else {
      const a = t * b.spd + b.ph;
      g.position.set(b.center.x + Math.cos(a) * b.rad, b.center.y + Math.sin(t * 0.8 + b.ph) * 1.5, b.center.z + Math.sin(a) * b.rad);
      g.rotation.y = -(a + Math.PI / 2);
    }
    const flap = Math.sin(t * (b.fleeing ? 14 : 9) + b.ph) * 0.55;
    b.l.rotation.x = -flap; b.r.rotation.x = flap;
  }
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 260) c.position.x = -260; }

  // --- camera ---
  controls.update();
  state.shake = Math.max(0, state.shake - dt * 0.9);
  if (state.erupting && state.E > 1.6) state.shake = Math.max(state.shake, 0.12);
  const s = state.shake;
  shakeV.set((Math.random() - 0.5) * s, (Math.random() - 0.5) * s, (Math.random() - 0.5) * s).multiplyScalar(0.9);
  camera.position.add(shakeV);
  renderer.render(scene, camera);
  camera.position.sub(shakeV);
}
animate();

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>

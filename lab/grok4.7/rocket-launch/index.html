const NOISE = `
float hash13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.zyx + 31.32);
  return fract((p.x + p.y) * p.z);
}
float noise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i+vec3(1.0,0.0,0.0)), f.x),
                 mix(hash13(i+vec3(0.0,1.0,0.0)), hash13(i+vec3(1.0,1.0,0.0)), f.x), f.y),
             mix(mix(hash13(i+vec3(0.0,0.0,1.0)), hash13(i+vec3(1.0,0.0,1.0)), f.x),
                 mix(hash13(i+vec3(0.0,1.0,1.0)), hash13(i+vec3(1.0,1.0,1.0)), f.x), f.y), f.z);
}
float fbm(vec3 p){
  float a = 0.5;
  float s = 0.0;
  for (int i = 0; i < 4; i++) {
    s += a * noise(p);
    p = p * 2.03 + vec3(1.7, 9.2, 3.1);
    a *= 0.5;
  }
  return s;
}
`;

class Puffs {
  constructor(count, map, additive) {
    this.count = count;
    this.pool = [];
    for (let i = 0; i < count; i++) {
      this.pool.push({
        alive: false, x: 0, y: -999, z: 0, vx: 0, vy: 0, vz: 0,
        age: 0, life: 1, size0: 1, size1: 1, spin: 0, spinVel: 0,
        r: 1, g: 1, b: 1, a0: 1, tr: 0.8, tg: 0.82, tb: 0.84, kind: 0, seed: Math.random() * 50,
      });
    }
    this.cursor = 0;
    const plane = new THREE.PlaneGeometry(1, 1);
    const geo = new THREE.InstancedBufferGeometry();
    geo.index = plane.index;
    geo.setAttribute("position", plane.attributes.position);
    geo.setAttribute("uv", plane.attributes.uv);
    this.aPos = new THREE.InstancedBufferAttribute(new Float32Array(count * 3), 3);
    this.aSize = new THREE.InstancedBufferAttribute(new Float32Array(count * 2), 2);
    this.aColor = new THREE.InstancedBufferAttribute(new Float32Array(count * 4), 4);
    geo.setAttribute("iPos", this.aPos);
    geo.setAttribute("iSizeSpin", this.aSize);
    geo.setAttribute("iColor", this.aColor);
    geo.instanceCount = count;
    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: additive ? THREE.AdditiveBlending : THREE.CustomBlending,
      blendSrc: THREE.OneFactor,
      blendDst: additive ? THREE.OneFactor : THREE.OneMinusSrcAlphaFactor,
      uniforms: { uMap: { value: map } },
      vertexShader: `
        attribute vec3 iPos;
        attribute vec2 iSizeSpin;
        attribute vec4 iColor;
        varying vec2 vUv;
        varying vec4 vColor;
        void main() {
          vUv = uv;
          vColor = iColor;
          float s = sin(iSizeSpin.y);
          float c = cos(iSizeSpin.y);
          vec2 p = position.xy * iSizeSpin.x;
          vec2 r = vec2(c * p.x - s * p.y, s * p.x + c * p.y);
          vec4 mv = viewMatrix * vec4(iPos, 1.0);
          mv.xy += r;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform sampler2D uMap;
        varying vec2 vUv;
        varying vec4 vColor;
        void main() {
          float a = texture2D(uMap, vUv).a * vColor.a;
          if (a < 0.004) discard;
          gl_FragColor = vec4(vColor.rgb * a, ${additive ? "a" : "a"});
        }
      `,
    });
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.frustumCulled = false;
    this.mesh.renderOrder = additive ? 7 : 2;
  }
  spawn(o) {
    for (let n = 0; n < this.count; n++) {
      const i = (this.cursor + n) % this.count;
      const p = this.pool[i];
      if (!p.alive) {
        this.cursor = (i + 1) % this.count;
        p.alive = true;
        p.x = o.x; p.y = o.y; p.z = o.z;
        p.vx = o.vx; p.vy = o.vy; p.vz = o.vz;
        p.age = 0;
        p.life = o.life;
        p.size0 = o.size0;
        p.size1 = o.size1;
        p.spin = Math.random() * Math.PI * 2;
        p.spinVel = (Math.random() - 0.5) * (o.kind === 2 ? 8 : 2.4);
        p.r = o.r; p.g = o.g; p.b = o.b; p.a0 = o.a0;
        p.tr = o.tr ?? o.r; p.tg = o.tg ?? o.g; p.tb = o.tb ?? o.b;
        p.kind = o.kind;
        return p;
      }
    }
    return null;
  }
  update(dt, t) {
    const pos = this.aPos.array;
    const size = this.aSize.array;
    const col = this.aColor.array;
    for (let i = 0; i < this.count; i++) {
      const p = this.pool[i];
      if (p.alive) {
        p.age += dt;
        if (p.age >= p.life) p.alive = false;
      }
      if (!p.alive) {
        size[i * 2] = 0;
        col[i * 4 + 3] = 0;
        continue;
      }
      if (p.kind === 0 || p.kind === 3) {
        p.vy += (0.45 - p.vy * 0.22) * dt;
        p.vx += Math.sin(t * 0.8 + p.seed) * 1.6 * dt;
        p.vz += Math.cos(t * 0.7 + p.seed * 1.3) * 1.6 * dt;
        const drag = Math.exp(-0.35 * dt);
        p.vx *= drag; p.vy *= Math.exp(-0.12 * dt); p.vz *= drag;
        p.r += (p.tr - p.r) * dt * 0.45;
        p.g += (p.tg - p.g) * dt * 0.45;
        p.b += (p.tb - p.b) * dt * 0.45;
      } else if (p.kind === 1) {
        const gnd = terrainHeight(p.x, p.z) + 0.2;
        p.vy -= 4 * dt;
        if (p.y < gnd) { p.y = gnd; p.vy = 0; p.vx *= 0.98; p.vz *= 0.98; }
      } else if (p.kind === 2 || p.kind === 4) {
        p.vy -= (p.kind === 2 ? 8 : 1.5) * dt;
      } else if (p.kind === 5) {
        p.vy += 0.6 * dt;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      p.spin += p.spinVel * dt;
      const u = p.age / p.life;
      const fadeIn = Math.min(1, p.age / 0.18);
      const fadeOut = 1 - smooth(0.45, 1, u);
      pos[i * 3] = p.x;
      pos[i * 3 + 1] = p.y;
      pos[i * 3 + 2] = p.z;
      size[i * 2] = p.size0 + (p.size1 - p.size0) * u;
      size[i * 2 + 1] = p.spin;
      col[i * 4] = p.r;
      col[i * 4 + 1] = p.g;
      col[i * 4 + 2] = p.b;
      col[i * 4 + 3] = p.a0 * fadeIn * fadeOut;
    }
    this.aPos.needsUpdate = true;
    this.aSize.needsUpdate = true;
    this.aColor.needsUpdate = true;
  }
}

}

const jump = Number(new URLSearchParams(location.search).get("t") || 0);
if (jump > 0) {
  const steps = Math.min(3600, Math.round(jump * 60));
  for (let i = 0; i < steps; i++) tick(1 / 60);
} else {
  tick(0);
}
render();
console.log("LAUNCH_OK");
window.addEventListener("error", (event) => {
  console.error("LAUNCH_ERR", event.message);
});
requestAnimationFrame(loop);
let last = performance.now();

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (dt > 0) tick(dt);
  render();
  requestAnimationFrame(loop);
}

function tick(dt) {
  elapsed += dt;
  const thrust = overallThrust(elapsed);
  const released = smooth(T_RELEASE, T_RELEASE + 0.62, elapsed);
  if (!airborne && elapsed >= T_LIFTOFF && released > 0.82 && thrust > 0.72) airborne = true;
  if (airborne) {
    const flight = elapsed - T_LIFTOFF;
    const accel = 4.4 + smooth(0, 6.5, flight) * 11;
    vy = Math.min(vy + accel * dt, 16.5);
    altitude += vy * dt;
  }

  const vib = thrust * thrust * (airborne ? Math.exp(-(elapsed - T_LIFTOFF) * 1.5) * 0.45 : 1);
  rocket.position.set(
    Math.sin(elapsed * 48) * 0.055 * vib,
    BASE_Y + altitude,
    Math.cos(elapsed * 37) * 0.038 * vib
  );
  rocket.rotation.x = Math.cos(elapsed * 42) * 0.0032 * vib;
  rocket.rotation.z = Math.sin(elapsed * 54) * 0.0042 * vib;

  const armOpen = smooth(T_RELEASE, T_RELEASE + 0.72, elapsed);
  const overshoot = Math.sin(armOpen * Math.PI) * (1 - armOpen) * 0.07;
  for (const arm of arms) arm.pivot.rotation.z = arm.open * armOpen + overshoot;
  for (const clamp of clamps) {
    clampSwing.setFromAxisAngle(sunUp, clamp.sign * armOpen * 1.25);
    clamp.pivot.quaternion.copy(clamp.base).multiply(clampSwing);
  }

  updateFlames(thrust);
  updateLights(thrust);
  updateParticles(dt, thrust);
  updateVegetation(dt, thrust);
  updateClouds(dt);
  for (const hub of windHubs) hub.rotation.z += dt * hub.userData.spin;
  radar.rotation.y += dt * 0.45;
  for (const lamp of lamps) {
    const blink = Math.pow(Math.max(0, Math.sin(elapsed * (lamp.userData.fast ? 7 : 3.2) + lamp.userData.phase)), 10);
    lamp.material.emissiveIntensity = 0.25 + blink * (lamp.userData.fast ? 5 : 3.4);
  }
  for (const banner of banners) {
    banner.material.uniforms.uTime.value = elapsed;
    banner.material.uniforms.uBlast.value = thrust;
  }
  for (const ring of rings) {
    const u = (elapsed - (T_LIFTOFF + ring.delay)) / ring.life;
    if (u > 0 && u < 1) {
      ring.mesh.visible = true;
      ring.mesh.scale.setScalar(1.5 + u * 32);
      ring.mesh.material.opacity = (1 - u) * (1 - u) * 0.6;
    } else ring.mesh.visible = false;
  }
  if (!debrisFired && thrust > 0.7) {
    debrisFired = true;
    for (const d of debris) if (d.loose) launchDebris(d);
  }
  for (const d of debris) stepDebris(d, dt, thrust);
  updateCamera(dt, thrust);
  updateShadows();
}

function render() {
  rocket.updateWorldMatrix(true, false);
  nozzleWorld.copy(nozzleLocal).applyMatrix4(rocket.matrixWorld);
  belowWorld.copy(nozzleWorld);
  belowWorld.y -= 12;
  ndcA.copy(nozzleWorld).project(camera);
  ndcB.copy(belowWorld).project(camera);
  const ax = ndcA.x * 0.5 + 0.5;
  const ay = ndcA.y * 0.5 + 0.5;
  let dx = (ndcB.x - ndcA.x);
  let dy = (ndcB.y - ndcA.y);
  const len = Math.hypot(dx, dy) || 1;
  dx /= len;
  dy /= len;
  const heat = overallThrust(elapsed) * (ndcA.z < 1 ? 1 : 0);
  post.composite.uniforms.uNozzle.value.set(ax, ay);
  post.composite.uniforms.uDir.value.set(dx, dy);
  post.composite.uniforms.uHeat.value = heat;
  post.composite.uniforms.uTime.value = elapsed;

  renderer.setRenderTarget(post.sceneRT);
  renderer.render(scene, camera);
  blit(post.brightMat, post.bright);
  post.blurMat.uniforms.tDiffuse.value = post.bright.texture;
  post.blurMat.uniforms.uDir.value.set(1.6 / post.bright.width, 0);
  blit(post.blurMat, post.blurA);
  post.blurMat.uniforms.tDiffuse.value = post.blurA.texture;
  post.blurMat.uniforms.uDir.value.set(0, 1.6 / post.bright.height);
  blit(post.blurMat, post.blurB);
  post.blurMat.uniforms.tDiffuse.value = post.blurB.texture;
  post.blurMat.uniforms.uDir.value.set(1.1 / post.bright.width, 0);
  blit(post.blurMat, post.blurA);
  post.blurMat.uniforms.tDiffuse.value = post.blurA.texture;
  post.blurMat.uniforms.uDir.value.set(0, 1.1 / post.bright.height);
  blit(post.blurMat, post.blurB);
  post.composite.uniforms.tBloom.value = post.blurB.texture;
  renderer.setRenderTarget(null);
  blit(post.composite, null);
}

function blit(material, target) {
  post.quad.material = material;
  renderer.setRenderTarget(target);
  renderer.render(post.quadScene, post.quadCam);
}

function overallThrust(t) {
  let s = 0;
  for (let i = 0; i < 5; i++) s += engineThrust(i, t);
  return s / 5;
}

function engineThrust(i, t) {
  const delay = 2.32 + (i === 0 ? 0 : 0.16 * i);
  const ign = smooth(delay, delay + 1.05, t);
  const ramp = smooth(4.3, 7.15, t);
  return ign * Math.max(0.42, ramp);
}

function updateFlames(thrust) {
  const nozzleY = BASE_Y + altitude - 1.38;
  const clearance = Math.max(0.8, nozzleY - 0.55);
  let plumeLen = altitude < 2.2 ? 2.4 + thrust * 7.5 : Math.min(clearance * 0.92, 12 + altitude * 0.55 + vy * 0.35);
  plumeLen = Math.max(0.4, plumeLen);
  flames.coreMat.uniforms.uTime.value = elapsed;
  flames.outerMat.uniforms.uTime.value = elapsed;
  flames.longCoreMat.uniforms.uTime.value = elapsed;
  flames.longOuterMat.uniforms.uTime.value = elapsed;
  flames.coreMat.uniforms.uThrust.value = Math.max(thrust, 0.001);
  flames.outerMat.uniforms.uThrust.value = Math.max(thrust, 0.001) * 0.85;
  flames.longCoreMat.uniforms.uThrust.value = thrust;
  flames.longOuterMat.uniforms.uThrust.value = thrust * 0.72;
  for (const e of engines) {
    const et = engineThrust(e.index, elapsed);
    const show = et > 0.04;
    e.core.visible = show;
    e.outer.visible = show;
    const L = (2.2 + et * 4.2) * e.scale;
    e.core.scale.set(0.55 * e.scale, L * 0.62, 0.55 * e.scale);
    e.core.position.y = -L * 0.62 * 0.5;
    e.outer.scale.set(1.25 * e.scale, L, 1.25 * e.scale);
    e.outer.position.y = -L * 0.5;
    e.anchor.rotation.x = Math.sin(elapsed * 6 + e.index) * 0.03 * thrust;
    e.anchor.rotation.z = Math.cos(elapsed * 5 + e.index) * 0.03 * thrust;
    e.glow.material.emissiveIntensity = 0.2 + et * 8.5;
  }
  const longL = plumeLen;
  const girth = 2.4 + longL * 0.11;
  flames.longCore.scale.set(girth * 0.42, longL, girth * 0.42);
  flames.longCore.position.y = -longL * 0.5;
  flames.longOuter.scale.set(girth, longL * 1.08, girth);
  flames.longOuter.position.y = -longL * 1.08 * 0.5;
  flames.longCore.visible = thrust > 0.05;
  flames.longOuter.visible = thrust > 0.05;
  disc.material.uniforms.uTime.value = elapsed;
  disc.material.uniforms.uAlpha.value = thrust * (1 - smooth(5, 24, nozzleY));
  disc.scale.setScalar(3.2 + thrust * 6.5);
  glowMat.emissiveIntensity = 0.15 + thrust * 6;
}

function updateLights(thrust) {
  const flicker = 0.86 + 0.14 * Math.sin(elapsed * 43) * Math.sin(elapsed * 19);
  const flash = Math.exp(-((elapsed - T_IGNITE) ** 2) * 7) + Math.exp(-((elapsed - T_LIFTOFF) ** 2) * 3.2);
  rocket.localToWorld(engineLight.position.copy(nozzleLocal));
  engineLight.intensity = (thrust * thrust * 380 + flash * 240) * flicker;
  const groundFade = 1 - smooth(6, 30, altitude);
  padLight.intensity = thrust * 220 * groundFade * flicker;
  padLight.position.set(0, 1.15, 2.4);
}

function updateParticles(dt, thrust) {
  const nozzle = nozzleWorld;
  if (elapsed < T_IGNITE + 0.4) {
    emit(7 * dt, () => puffs.spawn({
      x: ROCKET_R * 0.82, y: BASE_Y + 16.2 + altitude, z: 0.2,
      vx: 0.4, vy: 1.4 + randLive(), vz: 0.2,
      life: 2.8, size0: 0.35, size1: 2.1,
      r: 0.95, g: 0.97, b: 1, a0: 0.28, kind: 3,
    }));
  }
  emit((2.5 + thrust * 4) * dt, () => {
    const a = Math.random() * Math.PI * 2;
    const rad = 1.5 + Math.random() * 2.2;
    puffs.spawn({
      x: Math.cos(a) * rad, y: 0.8 + Math.random() * 0.6, z: Math.sin(a) * rad,
      vx: Math.cos(a) * 0.4, vy: 0.35, vz: Math.sin(a) * 0.4,
      life: 4.5, size0: 0.8, size1: 3.5,
      r: 0.9, g: 0.92, b: 0.94, a0: 0.16, kind: 3,
    });
  });
  emit(thrust * 82 * dt, () => {
    const a = Math.random() * Math.PI * 2;
    const rad = 0.6 + Math.random() * 2.4;

function updateVegetation(dt, thrust) {
  const blast = thrust;
  const dummy = grass.dummy;
  for (let i = 0; i < grass.items.length; i++) {
    const g = grass.items[i];
    const flutter = Math.sin(elapsed * 2.2 + g.seed) * 0.06;
    const ang = Math.min(1.05, flutter + blast * g.fall * (0.85 + 0.12 * Math.sin(elapsed * 16 + g.seed)));
    dummy.position.set(g.x, g.y, g.z);
    dummy.rotation.set(g.dirz * ang, g.yaw, -g.dirx * ang);
    dummy.scale.setScalar(g.s);
    dummy.updateMatrix();
    grass.mesh.setMatrixAt(i, dummy.matrix);
  }
  grass.mesh.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < flowers.items.length; i++) {
    const g = flowers.items[i];
    const push = blast * g.fall * 1.1;
    dummy.position.set(g.x + g.dirx * push, g.y - blast * g.fall * 0.2, g.z + g.dirz * push);
    dummy.rotation.set(g.dirz * blast * g.fall, g.yaw, -g.dirx * blast * g.fall);
    dummy.scale.setScalar(g.s * (1 - blast * g.fall * 0.25));
    dummy.updateMatrix();
    flowers.mesh.setMatrixAt(i, dummy.matrix);
  }
  flowers.mesh.instanceMatrix.needsUpdate = true;
  for (const tree of trees) {
    const d = Math.hypot(tree.position.x, tree.position.z);
    const fall = 1 - smooth(14, 48, d);
    const dirx = tree.position.x / (d || 1);
    const dirz = tree.position.z / (d || 1);
    const ang = Math.sin(elapsed * 1.3 + d) * 0.025 + blast * fall * 0.55;
    tree.rotation.x = dirz * ang;
    tree.rotation.z = -dirx * ang;
  }
}

function updateClouds(dt) {
  const mat = clouds.material;
  mat.uniforms.uTime.value = elapsed;
  mat.uniforms.uThrust.value = overallThrust(elapsed);
  mat.uniforms.uRocket.value.set(0, BASE_Y + altitude - 1, 0);
  for (const c of clouds.groups) {
    c.position.x += c.userData.vx * dt;
    c.position.z += c.userData.vz * dt;
  }
}

function updateCamera(dt, thrust) {
  const baseW = BASE_Y + altitude;
  const climbT = smooth(0, 125, altitude);
  const drama = Math.sin(Math.min(1, Math.max(0, (elapsed - 2.4) / 6.35)) * Math.PI);
  const dist = 46 - drama * 3 + climbT * 26;
  const fov = 40 + drama * 2 + climbT * 8;
  const camY = baseW + 11 - drama * 1.5 + climbT * 12;
  const lookY = baseW + 13.5 - drama * 3.2 - climbT * 16;
  const ang = 0.46 + Math.min(elapsed, 70) * 0.02;
  camDesired.set(Math.sin(ang) * dist, camY, Math.cos(ang) * dist);
  lookDesired.set(Math.sin(ang) * 0.5, lookY, Math.cos(ang) * 0.25);
  const k = 1 - Math.exp(-3.2 * Math.max(dt, 1 / 60));
  if (!camState.ready) {
    camState.pos.copy(camDesired);
    camState.look.copy(lookDesired);
    camState.ready = true;
  } else {
    camState.pos.lerp(camDesired, k);
    camState.look.lerp(lookDesired, k);
  }
  const liftoffPulse = Math.exp(-((((elapsed - T_LIFTOFF) * 0.85) ** 2)));
  const amp = 0.045 * thrust + 0.2 * liftoffPulse;
  shakeVec.set(
    Math.sin(elapsed * 53.2) * Math.sin(elapsed * 17.7),
    Math.sin(elapsed * 47.1) * Math.cos(elapsed * 23.3),
    Math.cos(elapsed * 41.9) * Math.sin(elapsed * 19.1)
  ).multiplyScalar(amp);
  camera.up.set(Math.sin(elapsed * 29) * amp * 0.28, 1, 0).normalize();
  camera.position.copy(camState.pos).add(shakeVec);
  camera.fov = fov;
  camera.lookAt(camState.look);
  camera.updateProjectionMatrix();
}

function updateShadows() {
  focus.set(0, BASE_Y + altitude * 0.55 + 8, 0);
  sun.position.copy(focus).addScaledVector(SUN_DIR, 180);
  sun.target.position.copy(focus);
  const sc = sun.shadow.camera;
  const span = 110;
  sc.left = -span;
  sc.right = span;
  sc.top = span;
  sc.bottom = -span;
  sc.near = 20;
  sc.far = 460;
  sc.updateProjectionMatrix();
}

function launchDebris(d) {
  const dist = Math.hypot(d.x, d.z) || 1;
  d.vx = (d.x / dist) * (6 + Math.random() * 10);
  d.vz = (d.z / dist) * (6 + Math.random() * 10);
  d.vy = 2.5 + Math.random() * 6;
  d.flying = true;
}

function stepDebris(d, dt, thrust) {
  if (d.flying) {
    d.vy -= 11 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.z += d.vz * dt;
    const gnd = terrainHeight(d.x, d.z) + d.rest;
    if (d.y < gnd) {
      d.y = gnd;
      d.vy *= -0.34;
      d.vx *= 0.8;
      d.vz *= 0.8;
      if (Math.abs(d.vy) < 0.45) d.vy = 0;
    }
    d.mesh.position.set(d.x, d.y, d.z);
    d.mesh.rotation.x += d.vr * dt;
    d.mesh.rotation.z += d.vr * 0.6 * dt;
  } else if (d.loose && thrust > 0.15) {
    const j = 0.04 * thrust;
    d.mesh.position.set(
      d.x + Math.sin(elapsed * 36 + d.seed) * j,
      d.y,
      d.z + Math.cos(elapsed * 33 + d.seed) * j
    );
  }
}

function emit(n, fn) {
  const whole = Math.min(24, Math.floor(n));
  for (let i = 0; i < whole; i++) fn();
  if (Math.random() < n - whole) fn();
}

function skyMaterial() {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: true,
    uniforms: { uSun: { value: SUN_DIR.clone() } },
    vertexShader: `
      varying vec3 vW;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }
    `,
    fragmentShader: `
      varying vec3 vW;
      uniform vec3 uSun;
      void main() {
        vec3 n = normalize(vW);
        float h = n.y;
        vec3 top = vec3(0.12, 0.38, 0.98);
        vec3 mid = vec3(0.28, 0.62, 1.18);
        vec3 hor = vec3(0.72, 0.92, 1.18);
        vec3 below = vec3(0.45, 0.62, 0.38);
        vec3 col = mix(hor, mid, smoothstep(0.0, 0.28, h));
        col = mix(col, top, smoothstep(0.18, 0.85, h));
        col = mix(below, col, smoothstep(-0.18, 0.02, h));
        float d = max(dot(n, normalize(uSun)), 0.0);
        col += vec3(1.15, 0.85, 0.4) * pow(d, 8.0) * 0.35;
        col += vec3(2.2, 1.7, 1.05) * pow(d, 1800.0);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });
}

function buildTerrain() {
  const seg = 168;
  const size = 640;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const col = new THREE.Color();
  const palette = {
    grass: new THREE.Color("#3cba4a"),
    lime: new THREE.Color("#c6e34e"),
    dry: new THREE.Color("#e4b56a"),
    sand: new THREE.Color("#f3d7a6"),
    pink: new THREE.Color("#ef6ea4"),
    gold: new THREE.Color("#f2c14e"),
    lav: new THREE.Color("#b89af0"),
    rock: new THREE.Color("#d08958"),
    far: new THREE.Color("#8eb6e8"),
    deep: new THREE.Color("#1f8a45"),
  };
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const y = terrainHeight(x, z);
    pos.setY(i, y);
    const d = Math.hypot(x, z);
    const field = Math.sin(x * 0.046 + z * 0.012);
    const n = Math.sin(x * 0.17) * Math.cos(z * 0.15);
    const lake = lakeMask(x, z);
    if (lake < 1.3) col.copy(palette.sand);
    else if (d < 36) col.copy(palette.dry).lerp(palette.lime, smooth(16, 36, d));
    else if (field > 0.74 && d < 150) col.copy(palette.gold);
    else if (field < -0.78 && d < 160) col.copy(palette.pink);
    else if (Math.sin(x * 0.02 + 2) > 0.84 && d > 55 && d < 170) col.copy(palette.lav);
    else if (y > 7) col.copy(palette.rock);
    else col.copy(palette.grass).lerp(n > 0 ? palette.lime : palette.deep, Math.abs(n));
    col.lerp(palette.far, smooth(100, 280, d) * 0.5);
    colors[i * 3] = col.r;
    colors[i * 3 + 1] = col.g;
    colors[i * 3 + 2] = col.b;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.94,
    metalness: 0,
  }));
  mesh.receiveShadow = true;
  return mesh;
}

function buildWater() {
  const geo = new THREE.CircleGeometry(1, 56);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: { uTime: { value: 0 }, uSun: { value: SUN_DIR.clone() } },
    vertexShader: `
      varying vec3 vW;
      varying vec3 vN;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * w;
      }
    `,
    fragmentShader: `
      varying vec3 vW;
      varying vec3 vN;
      uniform float uTime;
      uniform vec3 uSun;
      void main() {
        float rip = sin(vW.x * 0.42 + uTime * 1.5) * sin(vW.z * 0.33 - uTime * 1.15);
        vec3 col = mix(vec3(0.02, 0.38, 0.55), vec3(0.18, 0.82, 0.78), 0.5 + 0.5 * rip);
        vec3 viewDir = normalize(cameraPosition - vW);
        float fres = pow(1.0 - max(dot(normalize(vN), viewDir), 0.0), 2.4);
        float spec = pow(max(dot(normalize(vN), normalize(uSun)), 0.0), 80.0);
        col = mix(col, vec3(0.85, 0.95, 1.0), fres * 0.45);
        col += vec3(1.0, 0.9, 0.6) * spec * 0.7;
        gl_FragColor = vec4(col, 0.9);
      }
    `,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(98, -1.05, -46);
  mesh.scale.set(54, 1, 32);
  mesh.renderOrder = 1;
  mesh.onBeforeRender = () => { mat.uniforms.uTime.value = elapsed; };
  return mesh;
}

function addHill(x, z, rx, ry, rz, c1, c2) {
  const geo = new THREE.SphereGeometry(1, 28, 16);
  const pos = geo.attributes.position;
  const cols = new Float32Array(pos.count * 3);
  const a = new THREE.Color(c1);
  const b = new THREE.Color(c2);
  const snow = new THREE.Color("#f7fbff");
  const col = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    col.copy(a).lerp(b, smooth(-0.3, 0.75, y));
    if (y > 0.62) col.lerp(snow, (y - 0.62) / 0.38 * 0.55);
    cols[i * 3] = col.r;
    cols[i * 3 + 1] = col.g;
    cols[i * 3 + 2] = col.b;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  geo.scale(rx, ry, rz);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 }));
  mesh.position.set(x, terrainHeight(x, z) - ry * 0.35, z);
  mesh.receiveShadow = true;
  scene.add(mesh);
}

function addRoad(points, width) {
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(p[0], 0, p[1])));
  const seg = 70;
  const positions = [];
  const uvs = [];
  const indices = [];
  const up = new THREE.Vector3(0, 1, 0);
  const tangent = new THREE.Vector3();
  const right = new THREE.Vector3();
  const point = new THREE.Vector3();
  for (let i = 0; i <= seg; i++) {
    curve.getPoint(i / seg, point);
    curve.getTangent(i / seg, tangent);
    tangent.y = 0;
    if (tangent.lengthSq() < 1e-6) tangent.set(0, 0, 1);
    tangent.normalize();
    right.crossVectors(tangent, up);
    const d = Math.hypot(point.x, point.z);
    const ramp = 1 - smooth(12, 24, d);
    const y = terrainHeight(point.x, point.z) + 0.14 + ramp * (padTopHeight() - 0.1);
    positions.push(
      point.x + right.x * width, y, point.z + right.z * width,
      point.x - right.x * width, y, point.z - right.z * width
    );
    const u = (i / seg) * 12;
    uvs.push(u, 1, u, 0);
    if (i < seg) {
      const a = i * 2;
      indices.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    map: roadTexture(),
    roughness: 0.86,
    metalness: 0.02,
  }));
  mesh.receiveShadow = true;
  scene.add(mesh);
}

  const deflectorMat = new THREE.MeshStandardMaterial({

  const scorch = new THREE.Mesh(

  const wallMat = new THREE.MeshStandardMaterial({ color: 0xb7bdc6, roughness: 0.8, metalness: 0.08 });
  for (const side of [-1, 1]) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.3, 11), wallMat);
    wall.position.set(side * 2.5, 0.7, 6.2);
    wall.castShadow = true;
    wall.receiveShadow = true;
    scene.add(wall);
  }
  const floor = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.25, 12), wallMat);
  floor.position.set(0, 0.2, 7.2);
  floor.receiveShadow = true;
  scene.add(floor);

  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + 0.2;
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, top, 10), wallMat);
    col.position.set(Math.cos(a) * 10.6, top * 0.5, Math.sin(a) * 10.6);
    col.castShadow = true;
    scene.add(col);
  }

  const orig = deflectorMat.emissiveIntensity;
  deflector.onBeforeRender = () => {
    const t = overallThrust(elapsed);
    deflectorMat.emissiveIntensity = t * 3.2;
    scorch.material.emissiveIntensity = t * 1.4;
  };
  void orig;
  return top;
}

function buildTower() {
  const matrices = [];
  const dummy = new THREE.Object3D();
  const tx = -8.05;
  const hs = 1.22;
  function beam(x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
    dummy.position.set(x, y, z);
    dummy.rotation.set(rx, ry, rz);
    dummy.scale.set(sx, sy, sz);
    dummy.updateMatrix();
    matrices.push(dummy.matrix.clone());
  }
  for (const [lx, lz] of [[-hs, -hs], [hs, -hs], [hs, hs], [-hs, hs]]) {
    beam(tx + lx, 17.2, lz, 0.24, 34.4, 0.24);
  }
  for (let y = 1.2; y <= 33; y += 2.4) {
    beam(tx, y, -hs, hs * 2 + 0.2, 0.1, 0.1);
    beam(tx, y, hs, hs * 2 + 0.2, 0.1, 0.1);
    beam(tx - hs, y, 0, 0.1, 0.1, hs * 2 + 0.2);
    beam(tx + hs, y, 0, 0.1, 0.1, hs * 2 + 0.2);
    const len = Math.hypot(hs * 2, 2.4);
    const ang = Math.atan2(2.4, hs * 2);
    beam(tx, y + 1.2, -hs, len, 0.07, 0.07, 0, 0, ang);
    beam(tx, y + 1.2, hs, len, 0.07, 0.07, 0, 0, -ang);
    beam(tx - hs, y + 1.2, 0, 0.07, 0.07, len, ang, 0, 0);
    beam(tx + hs, y + 1.2, 0, 0.07, 0.07, len, -ang, 0, 0);
  }
  for (const y of [8, 15, 23, 30]) {
    const deck = new THREE.Mesh(
      new THREE.BoxGeometry(3.1, 0.12, 2.8),
      new THREE.MeshStandardMaterial({ color: 0xd5dbe3, roughness: 0.55, metalness: 0.25 })
    );
    deck.position.set(tx + 0.3, y, 0);
    deck.castShadow = true;
    deck.receiveShadow = true;
    scene.add(deck);
  }
  const paint = new THREE.MeshStandardMaterial({ color: 0xdfe5ec, roughness: 0.42, metalness: 0.55, envMapIntensity: 0.8 });
  const tower = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), paint, matrices.length);
  for (let i = 0; i < matrices.length; i++) tower.setMatrixAt(i, matrices[i]);
  tower.castShadow = true;
  tower.receiveShadow = true;
  scene.add(tower);

  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 6, 8), paintMat(0x12c2b0, 0.35, 0.2));
  mast.position.set(tx, 36.5, 0);
  scene.add(mast);
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshStandardMaterial({
    color: 0xff2a2a, emissive: 0xff1a1a, emissiveIntensity: 2, roughness: 0.4,
  }));
  beacon.position.set(tx, 39.6, 0);
  beacon.userData.phase = 0;
  beacon.userData.fast = true;
  scene.add(beacon);
  beacon.userData.track = true;
  scene.userData.beacon = beacon;
}

function buildBanners() {
  const list = [];
  const colors = [0xff5a1f, 0x12c2b0, 0xffd60a, 0x7a5cff, 0xef6ea4, 0x3ecf4a, 0xffffff, 0x1f6feb];
  for (let i = 0; i < 8; i++) {
    const a = -0.8 + (i / 8) * Math.PI * 1.3;
    const rad = 27 + (i % 3);
    const x = Math.cos(a) * rad;
    const z = Math.sin(a) * rad;
    const y = terrainHeight(x, z);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 4.4, 8), metalMat(0xe8eef5, 0.35, 0.5));
    pole.position.set(x, y + 2.2, z);
    pole.castShadow = true;
    scene.add(pole);
    const geo = new THREE.PlaneGeometry(1.8, 1.05, 12, 4);
    geo.translate(0.9, 3.35, 0);
    const mat = new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      uniforms: {
        uTime: { value: 0 },
        uBlast: { value: 0 },
        uColor: { value: new THREE.Color(colors[i]) },
      },
      vertexShader: `
        uniform float uTime;
        uniform float uBlast;
        varying vec2 vUv;
        void main() {
          vUv = uv;
          vec3 p = position;
          float along = clamp(position.x / 1.8, 0.0, 1.0);
          p.z += sin(position.x * 5.5 + uTime * 3.4 + position.y) * along * 0.24;
          p.y += cos(position.x * 3.0 + uTime * 2.1) * along * 0.06;
          p.y -= uBlast * along * 0.85;
          p.x += uBlast * along * 0.4;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying vec2 vUv;
        void main() {
          float shade = 0.82 + 0.18 * vUv.y;
          gl_FragColor = vec4(uColor * shade * 1.25, 1.0);
        }
      `,
    });
    const flag = new THREE.Mesh(geo, mat);
    flag.position.set(x, y, z);
    flag.rotation.y = a + Math.PI;
    scene.add(flag);
    list.push(flag);
  }
  return list;
}

function makeFinGeo() {

function glowMatShared() {

function buildEngines(group) {
  const list = [];
  const positions = [{ x: 0, z: 0, s: 1.18, i: 0 }];
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + k * Math.PI / 2;
    positions.push({ x: Math.cos(a) * 0.95, z: Math.sin(a) * 0.95, s: 0.78, i: k + 1 });
  }
  const bellMat = metalMat(0x8b93a0, 0.28, 0.88);
  bellMat.side = THREE.DoubleSide;
  for (const p of positions) {
    const anchor = new THREE.Group();
    anchor.position.set(p.x, 0, p.z);
    const bell = new THREE.Mesh(bellGeometry(), bellMat);
    bell.scale.setScalar(p.s);
    bell.castShadow = true;
    const glow = new THREE.Mesh(new THREE.ConeGeometry(0.34 * p.s, 1.05 * p.s, 16, 1, true), glowMatShared());
    glow.position.y = -0.72 * p.s;
    anchor.add(bell, glow);
    group.add(anchor);
    list.push({ anchor, index: p.i, scale: p.s, glow, core: null, outer: null });
  }
  return list;
}

function bellGeometry() {
  const pts = [];
  const steps = 12;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const y = -t * 1.38;
    const r = 0.2 + Math.pow(t, 1.28) * 0.5;
    pts.push(new THREE.Vector2(r, y));
  }
  return new THREE.LatheGeometry(pts, 22);
}

function buildFlames(group) {
  const cone = new THREE.ConeGeometry(1, 1, 28, 18, true);
  const coreMat = flameMaterial(new THREE.Vector3(14, 10, 3.2), new THREE.Vector3(8, 2.2, 0.15), new THREE.Vector3(1.6, 0.15, 0.02));
  const outerMat = flameMaterial(new THREE.Vector3(10, 3.4, 0.3), new THREE.Vector3(5.5, 0.7, 0.05), new THREE.Vector3(1.2, 0.08, 0.01));
  const longCoreMat = flameMaterial(new THREE.Vector3(13, 8.5, 2.4), new THREE.Vector3(8.5, 2.4, 0.25), new THREE.Vector3(3.2, 0.55, 0.05));
  const longOuterMat = flameMaterial(new THREE.Vector3(9, 3.2, 0.35), new THREE.Vector3(6.2, 1.2, 0.08), new THREE.Vector3(2.4, 0.35, 0.03));
  for (const e of engines) {
    const pivot = new THREE.Group();
    pivot.position.y = -1.38;
    e.anchor.add(pivot);
    e.anchor = pivot;
    const core = new THREE.Mesh(cone, coreMat);
    const outer = new THREE.Mesh(cone, outerMat);
    core.frustumCulled = false;
    outer.frustumCulled = false;
    core.renderOrder = 6;
    outer.renderOrder = 5;
    pivot.add(outer, core);
    e.core = core;
    e.outer = outer;
  }
  const longPivot = new THREE.Group();
  longPivot.position.y = -1.38;
  group.add(longPivot);
  const longCore = new THREE.Mesh(cone, longCoreMat);
  const longOuter = new THREE.Mesh(cone, longOuterMat);
  longCore.frustumCulled = false;
  longOuter.frustumCulled = false;
  longCore.renderOrder = 6;
  longOuter.renderOrder = 5;
  longPivot.add(longOuter, longCore);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1, 48), discMaterial());
  disc.rotation.x = -Math.PI / 2;
  disc.position.set(0, 0.95, 1.4);
  disc.frustumCulled = false;
  disc.renderOrder = 4;
  scene.add(disc);
  return {
    flames: { coreMat, outerMat, longCoreMat, longOuterMat, longCore, longOuter },
    disc,
  };
}

function flameMaterial(core, mid, tail) {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.CustomBlending,
    blendSrc: THREE.OneFactor,
    blendDst: THREE.OneMinusSrcAlphaFactor,
    uniforms: {
      uTime: { value: 0 },
      uThrust: { value: 0 },
      uCore: { value: core },
      uMid: { value: mid },
      uTail: { value: tail },
    },
    vertexShader: `
      varying vec2 vUv;
      varying float vTail;
      varying vec3 vN;
      varying vec3 vView;
      uniform float uTime;
      uniform float uThrust;
      ${NOISE}
      void main() {
        vUv = uv;
        float tail = 1.0 - uv.y;
        vTail = tail;
        vec3 pos = position;
        float n = noise(vec3(uv.x * 9.0, uv.y * 3.0 - uTime * 5.5, uTime * 0.8));
        float wob = sin(uv.y * 20.0 - uTime * 30.0 + uv.x * 14.0);
        pos.xz *= 1.0 + (n - 0.35) * 0.6 * tail * (0.35 + uThrust);
        pos.xz += vec2(cos(wob), sin(wob)) * 0.045 * tail;
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        vN = normalize(normalMatrix * normal);
        vView = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec2 vUv;
      varying float vTail;
      varying vec3 vN;
      varying vec3 vView;
      uniform float uTime;
      uniform float uThrust;
      uniform vec3 uCore;
      uniform vec3 uMid;
      uniform vec3 uTail;
      ${NOISE}
      void main() {
        float fromNozzle = vUv.y;
        float n = noise(vec3(vUv.x * 16.0, vUv.y * 2.4 - uTime * 8.0, uTime));
        float streaks = 0.62 + 0.75 * n;
        float diamonds = pow(abs(sin(vTail * 24.0 - uTime * 18.0)), 12.0) * smoothstep(0.12, 0.6, fromNozzle);
        vec3 col = mix(uTail, uMid, smoothstep(0.0, 0.35, fromNozzle));
        col = mix(col, uCore, pow(clamp(fromNozzle, 0.0, 1.0), 0.42));
        col *= streaks;
        col += vec3(1.2, 1.0, 0.75) * diamonds * 2.0;
        float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vView))), 1.25);
        float edge = 1.0 - smoothstep(0.05, 1.0, fres);
        float alpha = edge * smoothstep(0.0, 0.04, fromNozzle) * (1.0 - smoothstep(0.62, 1.0, vTail));
        alpha *= clamp(uThrust, 0.0, 1.2);
        gl_FragColor = vec4(col * alpha, alpha);
      }
    `,
  });
}

function discMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.CustomBlending,
    blendSrc: THREE.OneFactor,
    blendDst: THREE.OneMinusSrcAlphaFactor,
    uniforms: { uTime: { value: 0 }, uAlpha: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      varying vec2 vUv;
      uniform float uTime;
      uniform float uAlpha;
      ${NOISE}
      void main() {
        vec2 p = vUv * 2.0 - 1.0;
        float r = length(p);
        float ang = atan(p.y, p.x);
        float n = noise(vec3(ang * 1.5, r * 8.0 - uTime * 10.0, uTime * 0.5));
        float a = smoothstep(0.05, 0.18, r) * (1.0 - smoothstep(0.28, 0.98, r));
        a *= (0.4 + 0.9 * n) * uAlpha;
        vec3 col = mix(vec3(2.0, 0.3, 0.03), vec3(9.0, 4.2, 0.6), smoothstep(0.85, 0.12, r));
        gl_FragColor = vec4(col * a, a);
      }
    `,
  });
}

function buildRings() {
  const list = [];

function buildGrass() {
  const items = [];
  for (let i = 0; i < 1600 && items.length < 1100; i++) {
    const a = rand() * Math.PI * 2;
    const rad = 15.5 + rand() * 38;
    const x = Math.cos(a) * rad;
    const z = Math.sin(a) * rad;
    if (lakeMask(x, z) < 1.25) continue;
    const d = Math.hypot(x, z);
    items.push({
      x, z, y: terrainHeight(x, z),
      dirx: x / d, dirz: z / d,
      yaw: rand() * Math.PI,
      s: 0.7 + rand() * 1.15,
      seed: rand() * 20,
      fall: 1 - smooth(15, 46, d),
      hue: rand(),
    });
  }
  const geo = new THREE.ConeGeometry(0.085, 1.05, 4);
  geo.translate(0, 0.52, 0);
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.75, metalness: 0, side: THREE.DoubleSide,
  }), items.length);
  const c = new THREE.Color();
  const dummy = new THREE.Object3D();
  for (let i = 0; i < items.length; i++) {
    const g = items[i];
    if (g.hue > 0.9) c.set("#ef6ea4");
    else if (g.hue > 0.8) c.set("#f2c14e");
    else if (g.hue > 0.45) c.set("#7ed321");
    else c.set("#1f9d45");
    mesh.setColorAt(i, c);
    dummy.position.set(g.x, g.y, g.z);
    dummy.scale.setScalar(g.s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceColor.needsUpdate = true;
  scene.add(mesh);
  return { mesh, items, dummy: new THREE.Object3D() };
}

function buildFlowers() {

    items.length
  );
  const c = new THREE.Color();
  const dummy = new THREE.Object3D();
  for (let i = 0; i < items.length; i++) {

function buildTrees() {
  const list = [];

    if (lakeMask(x, z) < 1.4) continue;

function buildClouds() {
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: {
      uTime: { value: 0 },
      uSun: { value: SUN_DIR.clone() },
      uThrust: { value: 0 },
      uRocket: { value: new THREE.Vector3() },
    },
    vertexShader: `
      varying vec3 vW;
      varying vec3 vN;
      varying vec3 vV;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vW = w.xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        vec4 mv = viewMatrix * w;
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vW;
      varying vec3 vN;
      varying vec3 vV;
      uniform float uTime;
      uniform vec3 uSun;
      uniform float uThrust;
      uniform vec3 uRocket;
      ${NOISE}
      void main() {
        float n = fbm(vW * 0.045 + vec3(uTime * 0.012, 0.0, uTime * 0.008));
        float fres = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 1.35);
        float alpha = smoothstep(0.28, 0.72, n) * (1.0 - fres * 0.85);
        if (alpha < 0.03) discard;
        float ndl = dot(normalize(vN), normalize(uSun)) * 0.5 + 0.5;
        vec3 col = mix(vec3(0.62, 0.74, 0.9), vec3(1.05, 1.02, 0.98), ndl);
        float d = length(vW - uRocket);
        col += vec3(1.0, 0.4, 0.1) * uThrust * smoothstep(40.0, 4.0, d) * 0.35;
        gl_FragColor = vec4(col, alpha * 0.58);
      }
    `,
  });
  const groups = [];
  function cluster(x, y, z, scale) {
    const g = new THREE.Group();
    g.position.set(x, y, z);
    g.userData.vx = (rand() - 0.5) * 0.6;
    g.userData.vz = (rand() - 0.5) * 0.45;
    const puffsN = 5;
    for (let i = 0; i < puffsN; i++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), mat);
      s.position.set((rand() - 0.5) * scale * 0.8, (rand() - 0.5) * scale * 0.25, (rand() - 0.5) * scale * 0.7);
      s.scale.set(scale * (0.55 + rand() * 0.6), scale * (0.28 + rand() * 0.2), scale * (0.5 + rand() * 0.55));
      g.add(s);
    }
    scene.add(g);
    groups.push(g);
  }
  const banks = [
    [0, 62, -8, 16], [22, 70, 18, 12], [-28, 78, 6, 14],
    [8, 98, -20, 18], [-18, 110, 14, 15], [30, 120, 0, 13],
    [-10, 150, -12, 20], [16, 168, 20, 16], [0, 190, -6, 18],
    [90, 36, 40, 22], [-110, 42, -30, 26], [40, 48, -120, 24],
    [-60, 30, 90, 20], [140, 55, 20, 18], [-40, 86, -70, 17],
    [42, 46, 18, 11], [-48, 52, 24, 13], [18, 58, 48, 10], [-24, 44, -36, 12],
  ];
  for (const b of banks) cluster(b[0], b[1], b[2], b[3]);
  return { groups, material: mat };
}

function buildPost() {
  const sceneRT = makeRT(2, 2, 4, true);
  const bright = makeRT(2, 2, 0, false);
  const blurA = makeRT(2, 2, 0, false);
  const blurB = makeRT(2, 2, 0, false);
  const brightMat = new THREE.ShaderMaterial({
    uniforms: { tScene: { value: sceneRT.texture } },
    vertexShader: PASS_VS,
    fragmentShader: `
      uniform sampler2D tScene;
      varying vec2 vUv;
      void main() {
        vec3 c = texture2D(tScene, vUv).rgb;
        float m = smoothstep(1.05, 2.4, max(c.r, max(c.g, c.b)));
        gl_FragColor = vec4(c * m, 1.0);
      }
    `,
  });
  const blurMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: bright.texture }, uDir: { value: new THREE.Vector2() } },
    vertexShader: PASS_VS,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform vec2 uDir;
      varying vec2 vUv;
      void main() {
        vec3 c = texture2D(tDiffuse, vUv).rgb * 0.227;
        c += texture2D(tDiffuse, vUv + uDir).rgb * 0.194;
        c += texture2D(tDiffuse, vUv - uDir).rgb * 0.194;
        c += texture2D(tDiffuse, vUv + uDir * 2.0).rgb * 0.121;
        c += texture2D(tDiffuse, vUv - uDir * 2.0).rgb * 0.121;
        c += texture2D(tDiffuse, vUv + uDir * 3.0).rgb * 0.072;
        c += texture2D(tDiffuse, vUv - uDir * 3.0).rgb * 0.072;
        gl_FragColor = vec4(c, 1.0);
      }
    `,
  });
  const composite = new THREE.ShaderMaterial({
    uniforms: {
      tScene: { value: sceneRT.texture },
      tBloom: { value: blurB.texture },
      uNozzle: { value: new THREE.Vector2(0.5, 0.5) },
      uDir: { value: new THREE.Vector2(0, -1) },
      uHeat: { value: 0 },
      uTime: { value: 0 },
      uExposure: { value: 1.02 },
      uBloom: { value: 0.42 },
    },
    vertexShader: PASS_VS,
    fragmentShader: `
      uniform sampler2D tScene;
      uniform sampler2D tBloom;
      uniform vec2 uNozzle;
      uniform vec2 uDir;
      uniform float uHeat;
      uniform float uTime;
      uniform float uExposure;
      uniform float uBloom;
      varying vec2 vUv;
      vec3 aces(vec3 x) {
        return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
      }
      void main() {
        vec2 rel = vUv - uNozzle;
        float along = dot(rel, uDir);
        float perp = length(rel - uDir * along);
        float mask = (1.0 - smoothstep(0.0, 0.16, perp)) * smoothstep(-0.01, 0.015, along) * (1.0 - smoothstep(0.02, 0.5, along));
        float wob = sin(vUv.y * 90.0 + uTime * 24.0) * sin(vUv.x * 70.0 - uTime * 18.0);
        vec2 ofs = vec2(wob, wob * 0.65) * (0.0055 * uHeat * mask);
        vec3 sceneCol = texture2D(tScene, vUv + ofs).rgb;
        vec3 bloom = texture2D(tBloom, vUv).rgb;
        vec3 col = (sceneCol + bloom * uBloom) * uExposure;
        col = aces(col);
        float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
        col = mix(vec3(l), col, 1.12);
        col = pow(max(col, 0.0), vec3(0.454545));
        float dither = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
        col += (dither - 0.5) / 255.0;
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });
  const quadScene = new THREE.Scene();
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  quad.frustumCulled = false;
  quadScene.add(quad);
  return { sceneRT, bright, blurA, blurB, brightMat, blurMat, composite, quadScene, quadCam, quad };
}

function makeRT(w, h, samples, depth) {
  return new THREE.WebGLRenderTarget(w, h, {
    type: THREE.HalfFloatType,
    depthBuffer: depth,
    stencilBuffer: false,
    samples,
    magFilter: THREE.LinearFilter,
    minFilter: THREE.LinearFilter,
    colorSpace: THREE.LinearSRGBColorSpace,
  });
}


function paintMat(color, roughness = 0.4, metalness = 0.06, clearcoat = 0.45, map = null) {
  return new THREE.MeshPhysicalMaterial({
    color,
    map,
    roughness,
    metalness,
    clearcoat,
    clearcoatRoughness: 0.32,
    envMapIntensity: 0.55,
  });
}

function metalMat(color, roughness = 0.35, metalness = 0.8) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness,
    envMapIntensity: 1,
  });
}

function pipeBetween(a, b, radius, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  if (len < 0.001) return;
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 10), mat);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().multiplyScalar(1 / len));
  mesh.position.copy(a).addScaledVector(dir, 0.5 / len);
  mesh.castShadow = true;
  scene.add(mesh);
  const joint = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.25, 10, 8), mat);
  joint.position.copy(b);
  scene.add(joint);
}

function panelTexture(base, rows, cols, emblem) {
  const c = document.createElement("canvas");
  c.width = 1024;
  c.height = 512;
  const g = c.getContext("2d");
  g.fillStyle = base;
  g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 7000; i++) {
    g.fillStyle = `rgba(20,30,40,${Math.random() * 0.05})`;
    g.fillRect(Math.random() * 1024, Math.random() * 512, 2, 2);
  }
  g.strokeStyle = "rgba(28,40,58,0.65)";
  g.lineWidth = 3;
  for (let y = 1; y < rows; y++) {
    g.beginPath();
    g.moveTo(0, (y * 512) / rows);
    g.lineTo(1024, (y * 512) / rows);
    g.stroke();
  }
  for (let x = 0; x < cols; x++) {
    g.beginPath();
    g.moveTo((x * 1024) / cols, 0);
    g.lineTo((x * 1024) / cols, 512);
    g.stroke();
  }
  g.fillStyle = "rgba(60,72,88,0.8)";
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      g.beginPath();
      g.arc((x * 1024) / cols + 10, (y * 512) / rows + 10, 2.3, 0, Math.PI * 2);
      g.fill();
    }
  }
  g.fillStyle = "rgba(30,42,58,0.16)";
  for (let i = 0; i < 18; i++) {
    const x = (i * 97) % 980;
    const y = (i * 53) % 470;
    g.fillRect(x, y, 70, 36);
  }
  if (emblem) {
    g.translate(512, 250);
    g.fillStyle = "#ff5a1f";
    g.beginPath();
    g.moveTo(0, -70);
    g.lineTo(46, 0);
    g.lineTo(0, 70);
    g.lineTo(-46, 0);
    g.closePath();
    g.fill();
    g.fillStyle = "#12c2b0";
    g.beginPath();
    g.arc(0, 0, 22, 0, Math.PI * 2);
    g.fill();
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function concreteTexture() {
  const c = document.createElement("canvas");
  c.width = 1024;
  c.height = 1024;
  const g = c.getContext("2d");
  g.fillStyle = "#c8ccd3";
  g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 12000; i++) {
    g.fillStyle = `rgba(80,80,90,${Math.random() * 0.15})`;
    g.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
  }
  g.strokeStyle = "rgba(90,90,100,0.45)";
  g.lineWidth = 4;
  for (let i = 1; i < 6; i++) {
    g.beginPath();
    g.moveTo((i * 1024) / 6, 0);
    g.lineTo((i * 1024) / 6, 1024);
    g.stroke();
    g.beginPath();
    g.moveTo(0, (i * 1024) / 6);
    g.lineTo(1024, (i * 1024) / 6);
    g.stroke();
  }
  g.strokeStyle = "#f2c21a";
  g.lineWidth = 18;
  g.beginPath();
  g.arc(512, 512, 430, 0, Math.PI * 2);
  g.stroke();
  g.strokeStyle = "#1b1b1b";
  g.lineWidth = 10;
  g.setLineDash([28, 22]);
  g.beginPath();
  g.arc(512, 512, 430, 0, Math.PI * 2);
  g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function hazardTexture() {
  const c = document.createElement("canvas");
  c.width = 128;
  c.height = 64;
  const g = c.getContext("2d");
  g.fillStyle = "#f2c21a";
  g.fillRect(0, 0, 128, 64);
  g.fillStyle = "#161616";
  g.beginPath();
  for (let x = -64; x < 160; x += 32) {
    g.moveTo(x, 64);
    g.lineTo(x + 28, 0);
    g.lineTo(x + 44, 0);
    g.lineTo(x + 16, 64);
  }
  g.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  return t;
}

function puffTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  g.clearRect(0, 0, 256, 256);
  for (let i = 0; i < 8; i++) {
    const x = 128 + (Math.random() - 0.5) * 70;
    const y = 128 + (Math.random() - 0.5) * 70;
    const rad = 46 + Math.random() * 60;
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    grd.addColorStop(0, "rgba(255,255,255,0.5)");
    grd.addColorStop(0.45, "rgba(255,255,255,0.18)");
    grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.beginPath();
    g.arc(x, y, rad, 0, Math.PI * 2);
    g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.LinearSRGBColorSpace;
  return t;
}

function sparkTexture() {
  const c = document.createElement("canvas");
  c.width = 64;
  c.height = 64;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 30);
  grd.addColorStop(0, "rgba(255,255,255,1)");
  grd.addColorStop(0.3, "rgba(255,255,255,0.8)");
  grd.addColorStop(1, "rgba(255,255,255,0)");

  g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.LinearSRGBColorSpace;
  return t;
}

function terrainHeight(x, z) {
  const d = Math.hypot(x, z);
  const flat = smooth(30, 80, d);
  let h = 0;
  h += Math.sin(x * 0.031 + 1.2) * Math.cos(z * 0.027) * 1.6;
  h += Math.sin(x * 0.011 + z * 0.008) * 5.2;
  h += Math.sin(x * 0.0042) * Math.cos(z * 0.0051) * 16 * smooth(55, 180, d);
  h += (1 - Math.abs(Math.sin(x * 0.017 + z * 0.011))) * 2.6 * smooth(90, 160, d);
  const lake = lakeMask(x, z);
  if (lake < 1) h = Math.min(h, -1.7);
  else if (lake < 1.4) h = Math.min(h, -1.7 + (lake - 1) * 5);
  return h * flat;
}

function lakeMask(x, z) {
  return Math.hypot((x - 98) / 54, (z + 46) / 32);
}

function smooth(a, b, x) {
  if (x <= a) return 0;
  if (x >= b) return 1;
  const t = (x - a) / (b - a);
  return t * t * (3 - 2 * t);
}

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randLive() {
  return Math.random();

const rand  = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const V3 = THREE.Vector3;
function n2(x,z){ return 0.5+0.5*Math.sin(x*1.7+Math.sin(z*1.31)*1.9)*Math.cos(z*1.13+Math.sin(x*0.71)*1.4); }
function terrainH(x,z){
  const r=Math.hypot(x,z); let h=0;
  const flat=smooth(26,80,r);
  h+=flat*(Math.sin(x*0.043)*Math.cos(z*0.05)*1.8+Math.sin(x*0.021+z*0.033)*2.6+Math.sin(x*0.09+1)*Math.sin(z*0.083)*0.7);
  const far=smooth(200,560,r);
  const ridge=0.5+0.5*Math.sin(x*0.012+2)*Math.cos(z*0.014+1);
  h+=far*far*(18+ridge*55+far*40);
  return h;
}

const skyMat = new THREE.ShaderMaterial({
  uniforms:{ uSunDir:{value:new V3(80,120,55).normalize()} },
  vertexShader:`varying vec3 vDir; void main(){ vDir=normalize(position);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
  uniform vec3 uSunDir; varying vec3 vDir;
  void main(){
    float h=clamp(vDir.y,-0.2,1.0);
    vec3 col=mix(vec3(0.878,0.945,1.0), vec3(0.478,0.749,0.973), smoothstep(0.0,0.18,h));

/* ============================ particle system (instanced billboards) ============================ */
const puffVert=`
attribute vec3 iPos; attribute float iScale; attribute float iAlpha; attribute float iRot;
attribute vec3 iTint; attribute float iSeed;
varying vec2 vUv; varying float vAlpha; varying vec3 vTint; varying float vSeed; varying float vDepth;
void main(){
  vUv=uv; vAlpha=iAlpha; vTint=iTint; vSeed=iSeed;
  vec3 camRight=vec3(viewMatrix[0][0],viewMatrix[1][0],viewMatrix[2][0]);
  vec3 camUp   =vec3(viewMatrix[0][1],viewMatrix[1][1],viewMatrix[2][1]);
  float c=cos(iRot), s=sin(iRot);
  vec2 p=position.xy;
  vec2 rp=vec2(p.x*c-p.y*s, p.x*s+p.y*c);
  vec4 mv=viewMatrix*vec4(iPos+(camRight*rp.x+camUp*rp.y)*iScale,1.0);
  vDepth=-mv.z;
  gl_Position=projectionMatrix*mv;
}`;
const puffFrag=`
uniform sampler2D uMap; uniform float uTime; uniform vec3 uFogColor;
uniform float uFogNear; uniform float uFogFar;
varying vec2 vUv; varying float vAlpha; varying vec3 vTint; varying float vSeed; varying float vDepth;
void main(){
  float a0=vAlpha*smoothstep(2.5,8.0,vDepth);
  if(a0<0.004) discard;
  vec2 cuv=vUv-0.5;
  float an=uTime*(vSeed-0.5)*0.25;
  float cs=cos(an), sn=sin(an);
  cuv=vec2(cuv.x*cs-cuv.y*sn, cuv.x*sn+cuv.y*cs)+0.5;
  vec4 tex=texture2D(uMap,cuv);
  vec3 col=vTint*(0.72+0.5*tex.r);
  col=mix(col,uFogColor,smoothstep(uFogNear,uFogFar,vDepth));
  gl_FragColor=vec4(col, tex.a*a0);
}`;

class Puffs{
  constructor(count, texture, sorted, fogNear, fogFar){
    this.count=count; this.sorted=sorted; this.cursor=0; this.p=[];
    for(let i=0;i<count;i++) this.p.push({on:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,age:0,life:1,
      s0:1,grow:0,rot:0,rv:0,a0:1,r:1,g:1,b:1,drag:0.6,buoy:0,hugT:0,seed:Math.random(),stat:false,s:1,a:0,rr:0});
    const base=new THREE.PlaneGeometry(1,1);
    const geo=new THREE.InstancedBufferGeometry();
    geo.setIndex(base.index);
    geo.setAttribute('position', base.attributes.position);
    geo.setAttribute('uv', base.attributes.uv);
    const mk=(n,sz)=>{ const a=new THREE.InstancedBufferAttribute(new Float32Array(n*sz),sz); a.setUsage(THREE.DynamicDrawUsage); return a; };
    this.aPos=mk(count,3); this.aScale=mk(count,1); this.aAlpha=mk(count,1);
    this.aRot=mk(count,1); this.aTint=mk(count,3); this.aSeed=mk(count,1);
    geo.setAttribute('iPos',this.aPos); geo.setAttribute('iScale',this.aScale);
    geo.setAttribute('iAlpha',this.aAlpha); geo.setAttribute('iRot',this.aRot);
    geo.setAttribute('iTint',this.aTint); geo.setAttribute('iSeed',this.aSeed);
    geo.instanceCount=count;
    this.mat=new THREE.ShaderMaterial({
      uniforms:{uMap:{value:texture},uTime:{value:0},uFogColor:{value:FOGC.clone()},uFogNear:{value:fogNear},uFogFar:{value:fogFar}},
      vertexShader:puffVert, fragmentShader:puffFrag,
      transparent:true, depthWrite:false, depthTest:true, blending:THREE.NormalBlending
    });
    this.mesh=new THREE.Mesh(geo,this.mat);
    this.mesh.frustumCulled=false;
    this.order=Array.from({length:count},(_,i)=>({i,d:0}));
    scene.add(this.mesh);
  }
  spawn(o){
    const q=this.p[this.cursor]; this.cursor=(this.cursor+1)%this.count;
    q.on=true; q.x=o.x; q.y=o.y; q.z=o.z; q.vx=o.vx||0; q.vy=o.vy||0; q.vz=o.vz||0;
    q.age=0; q.life=o.life; q.s0=o.s0; q.grow=o.grow||0; q.rot=rand(0,6.28); q.rv=o.rv!==undefined?o.rv:rand(-1.2,1.2);
    q.a0=o.a0; q.r=o.r; q.g=o.g; q.b=o.b; q.drag=o.drag!==undefined?o.drag:0.55;
    q.buoy=o.buoy||0; q.hugT=o.hugT||0; q.stat=!!o.stat; q.seed=Math.random();
  }
  update(dt,time,cam){
    const cp=cam.position;
    for(let i=0;i<this.count;i++){
      const q=this.p[i];
      if(!q.on){ q.a=0; q.s=0; continue; }
      if(q.stat){
        q.x+=q.vx*dt; q.z+=q.vz*dt; if(q.x>520)q.x-=1040;
        q.s=q.s0*(1+0.05*Math.sin(time*0.4+q.seed*20)); q.a=q.a0; q.rr=q.rot; continue;
      }
      q.age+=dt;
      if(q.age>=q.life){ q.on=false; q.a=0; q.s=0; continue; }
      const tb=time*0.7+q.seed*17;
      q.vx+=(Math.sin(q.y*0.32+tb)*0.9+Math.sin(q.z*0.21-tb*1.3)*0.5)*dt;
      q.vz+=(Math.cos(q.x*0.27-tb*0.8)*0.9+Math.cos(q.y*0.19+tb)*0.5)*dt;
      q.vy+=(q.age>q.hugT?q.buoy:-2.0)*dt;
      const dr=Math.max(0,1-q.drag*dt);
      q.vx*=dr; q.vy*=dr; q.vz*=dr;
      q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt;
      if(q.y<0.35&&q.vy<0){ q.y=0.35; q.vy*=-0.12; q.vx*=0.985; q.vz*=0.985; }
      q.rot+=q.rv*dt;
      const lf=q.age/q.life;
      q.a=q.a0*Math.min(1,q.age/(q.life*0.1))*(1-smooth(0.5,1,lf));
      q.s=q.s0+q.grow*q.age*(0.7+0.6*lf);
      q.rr=q.rot;
    }
    if(this.sorted){
      for(let i=0;i<this.count;i++){ const q=this.p[i];
        this.order[i].d=q.on?(q.x-cp.x)*(q.x-cp.x)+(q.y-cp.y)*(q.y-cp.y)+(q.z-cp.z)*(q.z-cp.z):-1; }
      this.order.sort((a,b)=>b.d-a.d);
    }
    for(let k=0;k<this.count;k++){
      const i=this.sorted?this.order[k].i:k, q=this.p[i], k3=k*3;
      this.aPos.array[k3]=q.x; this.aPos.array[k3+1]=q.y; this.aPos.array[k3+2]=q.z;
      this.aScale.array[k]=q.s; this.aAlpha.array[k]=q.a; this.aRot.array[k]=q.rr;
      this.aTint.array[k3]=q.r; this.aTint.array[k3+1]=q.g; this.aTint.array[k3+2]=q.b;
      this.aSeed.array[k]=q.seed;
    }
    this.aPos.needsUpdate=this.aScale.needsUpdate=this.aAlpha.needsUpdate=true;
    this.aRot.needsUpdate=this.aTint.needsUpdate=this.aSeed.needsUpdate=true;
    this.mat.uniforms.uTime.value=time;
  }
}

/* clouds: layered clusters, including two anchored to the ascent path */
(function initClouds(){
  const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5);
  function cluster(cx,cy,cz,n,smin,smax,amin,amax,tint){
    for(let i=0;i<n;i++){
      clouds.spawn({x:cx+gauss()*17, y:cy+gauss()*3.5, z:cz+gauss()*17,
        vx:rand(1.0,1.8), vz:rand(0.2,0.5), stat:true,
        s0:rand(smin,smax), a0:rand(amin,amax), r:tint[0],g:tint[1],b:tint[2]});
    }
  }
  const layers=[
    {y:[105,150], n:14, s:[18,34], a:[0.45,0.7],  r:[40,380], t:[1,1,1]},
    {y:[240,290], n:8,  s:[30,55], a:[0.3,0.5],   r:[60,420], t:[0.92,0.95,1]},
    {y:[55,80],   n:6,  s:[14,24], a:[0.35,0.55], r:[260,420],t:[0.97,0.98,1]}
  ];
  for(const L of layers) for(let c=0;c<L.n;c++){
    const a=rand(0,6.28), r=rand(L.r[0],L.r[1]);
    cluster(Math.cos(a)*r, rand(L.y[0],L.y[1]), Math.sin(a)*r, 6+(Math.random()*4|0), L.s[0],L.s[1],L.a[0],L.a[1],L.t);
  }
  cluster(40,118,-4, 9, 22,38, 0.5,0.68,[1,1,1]);   // lower punch-through cloud
  cluster(58,258,8, 8, 34,55, 0.35,0.5,[0.92,0.95,1]); // high veil cloud
})();

/* ============================ sparks (GPU points) ============================ */
class Sparks{
  constructor(count){
    this.count=count; this.cursor=0; this.p=[];
    for(let i=0;i<count;i++) this.p.push({on:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,age:0,life:1,size:1});
    const geo=new THREE.BufferGeometry();
    this.pos=new Float32Array(count*3); this.col=new Float32Array(count*3);
    this.alp=new Float32Array(count);   this.siz=new Float32Array(count);
    geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aCol',new THREE.BufferAttribute(this.col,3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aAlpha',new THREE.BufferAttribute(this.alp,1).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aSize',new THREE.BufferAttribute(this.siz,1).setUsage(THREE.DynamicDrawUsage));
    const mat=new THREE.ShaderMaterial({
      vertexShader:`attribute float aSize; attribute float aAlpha; attribute vec3 aCol;
        varying float vA; varying vec3 vC;
        void main(){ vA=aAlpha; vC=aCol;
          vec4 mv=modelViewMatrix*vec4(position,1.0);
          gl_PointSize=aSize*(320.0/max(1.0,-mv.z));
          gl_Position=projectionMatrix*mv; }`,
      fragmentShader:`varying float vA; varying vec3 vC;
        void main(){ if(vA<0.01) discard;
          float r=length(gl_PointCoord-0.5)*2.0;
          float a=pow(max(0.0,1.0-r),1.6)*vA;
          gl_FragColor=vec4(vC,a); }`,
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
    });
    this.points=new THREE.Points(geo,mat);
    this.points.frustumCulled=false; this.points.renderOrder=15;
    scene.add(this.points);
  }
  spawn(x,y,z,vx,vy,vz,life,size){
    const q=this.p[this.cursor]; this.cursor=(this.cursor+1)%this.count;
    q.on=true; q.x=x; q.y=y; q.z=z; q.vx=vx; q.vy=vy; q.vz=vz; q.age=0; q.life=life; q.size=size;
  }
  update(dt){
    for(let i=0;i<this.count;i++){
      const q=this.p[i], i3=i*3;
      if(!q.on){ this.alp[i]=0; continue; }
      q.age+=dt;
      if(q.age>=q.life){ q.on=false; this.alp[i]=0; continue; }
      q.vy-=22*dt;
      const dr=Math.max(0,1-0.6*dt); q.vx*=dr; q.vy*=dr; q.vz*=dr;
      q.x+=q.vx*dt; q.y+=q.vy*dt; q.z+=q.vz*dt;
      if(q.y<0.15&&q.vy<0){ q.y=0.15; q.vy*=-0.35; q.vx*=0.7; q.vz*=0.7; }
      const lf=q.age/q.life, hot=Math.min(1,lf*1.5);
      this.pos[i3]=q.x; this.pos[i3+1]=q.y; this.pos[i3+2]=q.z;
      this.col[i3]=1; this.col[i3+1]=lerp(0.85,0.2,hot); this.col[i3+2]=lerp(0.4,0.03,hot);
      this.alp[i]=Math.pow(1-lf,1.4)*0.95;

    float c=cos(iRot), s=sin(iRot);
    p=vec3(p.x*c-p.z*s, p.y, p.x*s+p.z*c);
    float w=sin(uTime*1.9+iPhase+iPos.x*0.25+iPos.z*0.2)*0.5+sin(uTime*3.1+iPhase*1.7)*0.22;
    vec2 toC=iPos.xz; float d=length(toC)+0.001; vec2 away=toC/d;
    float fall=uBlast*smoothstep(7.0,26.0,d);
    vec2 bdir=normalize(vec2(cos(iPhase),sin(iPhase))+away*fall*6.0);
    float bend=(w*0.10+fall*1.4)*yF*yF;
    vec3 wp=vec3(iPos.x+bdir.x*bend*iScale,
                 iPos.y+p.y*iScale*(1.0-0.45*fall*yF*yF),
                 iPos.z+bdir.y*bend*iScale);
    vY=yF; vCol=iColor;

  fragmentShader:`varying vec3 vCol; varying float vY;

uniform float uTime; uniform float uIntensity; uniform float uDiamond;

varying vec2 vUv;
void main(){

  gl_FragColor=vec4(col*uIntensity, clamp(I,0.0,1.0));
}`;

  if(t>=7.2) rate=160;

  sparkAcc+=sr*dt;

function updateFlames(dt){
  const t=time, y=rocket.position.y, th=thrust;
  const flick=0.85+0.3*Math.sin(t*47)*Math.sin(t*31.7+1.3)+0.12*Math.sin(t*73);
  nozzleGlowMat.emissiveIntensity=th*(3+2*flick);
  const coreL=th*(3.2+1.6*flick);
  corePlume.visible=th>0.02;
  corePlume.scale.set(0.85+0.15*flick,Math.max(0.01,coreL),0.85+0.15*flick);
  corePlume.position.y=-1.2-coreL/2;
  corePlume.material.uniforms.uTime.value=t;
  corePlume.material.uniforms.uIntensity.value=th*(1.1+0.25*flick);
  const outL=th*(6+3*flick);
  outerPlume.visible=th>0.02;
  outerPlume.scale.set(1.5,Math.max(0.01,outL),1.5);
  outerPlume.position.y=-1.1-outL/2;
  outerPlume.material.uniforms.uTime.value=t;
  outerPlume.material.uniforms.uIntensity.value=th*0.8;
  trailLen=th*(5+Math.min(58,y*0.30)+4*flick);
  trailPlume.visible=th>0.05;
  const rs=1.15+y*0.004;
  trailPlume.scale.set(rs,Math.max(0.01,trailLen),rs);
  trailPlume.position.y=-1.2-trailLen/2;
  trailPlume.material.uniforms.uTime.value=t;
  trailPlume.material.uniforms.uIntensity.value=th*(0.9+0.2*flick);
  trailPlume.material.uniforms.uDiamond.value=smooth(0,1,th)*clamp(y/10,0,1);
  const splash=th*clamp(1-y/12,0,1);
  splashA.visible=splashB.visible=splash>0.02;
  splashA.material.uniforms.uTime.value=splashB.material.uniforms.uTime.value=t;
  splashA.material.uniforms.uIntensity.value=splashB.material.uniforms.uIntensity.value=splash*(0.8+0.3*flick);
  splashA.scale.set(2.4,4.5+1.5*flick,1.6);
  splashB.scale.set(2.4,4.5+1.5*flick,1.6);
  fireMat.uniforms.uTime.value=t;
  fireMat.uniforms.uThrust.value=splash;
  firePool.rotation.y=t*0.6;
  padLight.intensity=th*1500*clamp(1-y/80,0.05,1)*(0.85+0.3*flick);
  engLight.intensity=th*650*(0.8+0.4*flick);
  const flash=(t>4.05&&t<6)?Math.exp(-(t-4.05)*2.5)*0.5:0;
  glowCore.m.opacity=th*0.9; let s=th*(2.6+0.8*flick); glowCore.s.scale.set(s,s,1);
  glowBig.m.opacity=th*0.5;  s=th*(7+1.5*flick);     glowBig.s.scale.set(s,s,1);
  glowHuge.m.opacity=th*0.16+flash; s=th*(16+3*flick)+flash*20; glowHuge.s.scale.set(s,s,1);
}

function updateCamera(dt){
  const t=time;
  let i=0; while(i<KEYS.length-2&&t>KEYS[i+1].t) i++;
  const a=KEYS[i], b=KEYS[i+1], u=smooth(a.t,b.t,t);
  _tp.set(lerp(a.p[0],b.p[0],u),lerp(a.p[1],b.p[1],u),lerp(a.p[2],b.p[2],u));
  _tl.set(lerp(a.l[0],b.l[0],u),lerp(a.l[1],b.l[1],u),lerp(a.l[2],b.l[2],u));
  const cb=smooth(27,31,t);
  if(cb>0){
    const ang=0.9+t*0.04, D=46;
    _cp.set(rocket.position.x+Math.sin(ang)*D, rocket.position.y-9, rocket.position.z+Math.cos(ang)*D);
    _cl.set(rocket.position.x, rocket.position.y+3, rocket.position.z);
    _tp.lerp(_cp,cb); _tl.lerp(_cl,cb);
  }
  const k=1-Math.exp(-3.2*dt);
  posS.lerp(_tp,k); lookS.lerp(_tl,k);
  px+=(mx-px)*Math.min(1,dt*3); py+=(my-py)*Math.min(1,dt*3);
  camera.position.copy(posS);
  camera.lookAt(lookS);
  _right.setFromMatrixColumn(camera.matrix,0);
  _up.setFromMatrixColumn(camera.matrix,1);
  camera.position.addScaledVector(_right,px*2).addScaledVector(_up,-py*1.3);
  camera.lookAt(
    lookS.x+_right.x*px*5-_up.x*py*3,
    lookS.y+_right.y*px*5-_up.y*py*3,
    lookS.z+_right.z*px*5-_up.z*py*3);
  const sh=Math.min(0.7,
    0.12*smooth(4,7.2,t)+
    (t>LIFTOFF?0.6*Math.exp(-(t-LIFTOFF)*1.1):0)+
    0.06*thrust*clamp(1-rocket.position.y/150,0,1));
  camera.position.x+=(Math.sin(t*39)+0.5*Math.sin(t*27.7+1.7))*sh*0.22;
  camera.position.y+=(Math.sin(t*44.3+2)+0.5*Math.sin(t*23.1))*sh*0.18;
  camera.position.z+=(Math.sin(t*35.7+4)+0.5*Math.sin(t*31.3))*sh*0.22;
  camera.rotation.z+=Math.sin(t*29)*sh*0.008;
  camera.fov=52+6*smooth(9.8,13,t);
  camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
}
function updateShimmer(){
  const su=shimmerPass.uniforms;
  su.uTime.value=time; su.uAspect.value=innerWidth/innerHeight;
  if(thrust>0.02){
    _ew.set(rocket.position.x,Math.max(2,rocket.position.y-trailLen*0.4),rocket.position.z);
    _pr.copy(_ew).project(camera);
    if(_pr.z<1){
      su.uCenter.value.set(_pr.x*0.5+0.5,_pr.y*0.5+0.5);
      const d=camera.position.distanceTo(_ew);
      su.uStrength.value=thrust*clamp(90/d,0.15,1)*clamp(1-rocket.position.y/600,0.25,1);
      return;
    }
  }
  su.uStrength.value=0;
}

/* ============================ main loop ============================ */
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  time+=dt;
  const t=time;
  thrust=t<4?0:smooth(4,7.2,t);

  /* ascent */
  if(t<LIFTOFF){ vy=0; rocket.position.y=BASE_Y; }
  else{
    vy=Math.min(vy+(8.5*thrust-1.6)*dt,20);
    rocket.position.y+=vy*dt;
  }
  const tilt=0.14*smooth(130,300,rocket.position.y);
  rocket.rotation.z=-tilt;
  if(t>=LIFTOFF) rocket.position.x+=Math.sin(tilt)*vy*dt;
  rocketV=vy;

  /* pre-liftoff vibration */
  const vAmp=thrust*(t<LIFTOFF?0.12:0.05*Math.max(0,1-rocket.position.y/160));
  rocketBody.position.set(
    (Math.sin(t*43.7)+0.6*Math.sin(t*67.3))*vAmp,
    (Math.sin(t*51.1+2)+0.5*Math.sin(t*77.9))*vAmp*0.7,
    (Math.sin(t*39.3+4)+0.6*Math.sin(t*61.7))*vAmp);
  rocketBody.rotation.z=0.03*Math.sin(t*57)*vAmp;

  /* cloud punch-throughs + shockwave rings */
  if(!punch1&&rocket.position.y>118){ punch1=true; cloudBurst(rocket.position.x,121,rocket.position.z); }
  if(!punch2&&rocket.position.y>255){ punch2=true; cloudBurst(rocket.position.x,258,rocket.position.z); }
  if(!ringFired[0]&&t>=LIFTOFF){ ringFired[0]=true; ringT[0]=t; }
  if(!ringFired[1]&&t>=LIFTOFF+0.35){ ringFired[1]=true; ringT[1]=t; }
  rings.forEach((r,i)=>{
    const e=t-ringT[i];
    if(ringFired[i]&&e<1.8){
      const s=2+e*26; r.scale.set(s,s,s);
      r.material.opacity=0.4*(1-e/1.8); r.visible=true;
    }else r.visible=false;
  });

  /* arms + hold-downs */
  for(const a of arms) a.grp.rotation.y=a.dir*smooth(a.t0,a.t0+1.5,t);
  const hu=smooth(LIFTOFF-0.25,LIFTOFF+0.1,t);
  for(const h of holdDowns) h.rotation.z=0.45-1.15*hu;

  updateFlames(dt);
  updateEmissions(dt);
  smoke.update(dt,t,camera);
  clouds.update(dt,t,camera);
  sparks.update(dt);

  /* environment life */
  blast+=(thrust*clamp(1-rocket.position.y/55,0,1)-blast)*Math.min(1,dt*3);
  grassMat.uniforms.uTime.value=t;
  grassMat.uniforms.uBlast.value=blast;
  for(const p of props){
    p.m.position.set(p.bx+p.dx*blast*blast*3.2, p.by+blast*0.35, p.bz+p.dz*blast*blast*3.2);
    p.m.rotation.z=blast*0.5*p.sg;
  }
  for(const b of beacons)
    b.mat.emissiveIntensity=0.6+4*Math.pow(Math.max(0,Math.sin(t*2.6+b.phase)),6);
  radar.rotation.y=t*0.5;
  window._flagMat.uniforms.uTime.value=t;

  updateCamera(dt);
  updateShimmer();
  composer.render();
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  shimmerPass.uniforms.uAspect.value=innerWidth/innerHeight;
});
</script>

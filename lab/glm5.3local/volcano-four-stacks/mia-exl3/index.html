<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;}
  canvas{display:block;}
  #fade{position:fixed;inset:0;background:#000;pointer-events:none;transition:opacity 1.6s ease;z-index:10;}

{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }

<body>
<div id="fade"></div>
<script type="module">
import * as THREE from 'three';

/* ============================== utilities ============================== */
const V3 = THREE.Vector3;
const lerp = (a,b,t)=>a+(b-a)*t;
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
function sstep(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry(1337);

function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453123; return s-Math.floor(s); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return hash2(xi,yi)*(1-u)*(1-v)+hash2(xi+1,yi)*u*(1-v)+hash2(xi,yi+1)*(1-u)*v+hash2(xi+1,yi+1)*u*v;
}
function fbm(x,y){ let a=0,amp=0.5,f=1; for(let i=0;i<3;i++){ a+=amp*vnoise(x*f,y*f); f*=2.13; amp*=0.5; } return a; }

/* ============================== terrain function ============================== */
const ISLAND_R=620, VOL_R=300, CRATER_FLOOR=200;
const village={x:-376,z:-435}, station={x:-138,z:190};
const FLATS=[];
function rawHeight(x,z){
  const r=Math.hypot(x,z);
  let h=0;
  const t=Math.max(0,1-r/ISLAND_R);
  h+=Math.pow(t,0.8)*46;
  h+=(fbm(x*0.006+7.3,z*0.006+2.1)-0.42)*58*t;
  if(r<VOL_R){
    const a=1-r/VOL_R;
    let cone=Math.pow(a,1.25)*235;
    cone+=Math.exp(-Math.pow((r-70)/20,2))*20;
    const b=Math.max(0,1-r/66);
    cone-=b*b*80;
    cone*=0.94+0.12*fbm(x*0.012+3.7,z*0.012+9.2);
    h+=cone;
    h+=(fbm(x*0.03+1,z*0.03+5)-0.5)*14*Math.min(1,a*3);
  }
  h-=sstep(ISLAND_R*0.92,ISLAND_R+320,r)*70;
  return h;
}
function terrainH(x,z){
  let h=rawHeight(x,z);
  for(const s of FLATS){ const d=Math.hypot(x-s.x,z-s.z); const m=sstep(s.r*1.7,s.r*0.5,d); h=h*(1-m)+s.h*m; }
  return h;
}
function terrainNormal(x,z,out){
  const e=3;
  const hx=terrainH(x+e,z)-terrainH(x-e,z), hz=terrainH(x,z+e)-terrainH(x,z-e);
  return out.set(-hx,2*e,-hz).normalize();
}
FLATS.push({x:village.x,z:village.z,r:42,h:rawHeight(village.x,village.z)});
FLATS.push({x:station.x,z:station.z,r:26,h:rawHeight(station.x,station.z)});

/* ============================== renderer / scene ============================== */
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NoToneMapping; // ACES done manually in post pass
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xd6ecff,1000,3200);
const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,1.5,9000);

const SUN=new V3(0.55,0.75,0.35).normalize();
const sun=new THREE.DirectionalLight(0xfff1d6,3.2);
sun.position.copy(SUN).multiplyScalar(1500);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-820,right:820,top:820,bottom:-820,near:400,far:3000});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=2.5;
scene.add(sun,sun.target);
scene.add(new THREE.HemisphereLight(0xbfe4ff,0x9a8a70,0.85));

/* ============================== textures ============================== */
function canvasTex(size,draw){ const c=document.createElement('canvas'); c.width=c.height=size; draw(c.getContext('2d'),size); const t=new THREE.CanvasTexture(c); return t; }
const softTex=canvasTex(128,(g,s)=>{
  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.3,'rgba(255,255,255,0.75)');
  gr.addColorStop(0.65,'rgba(255,255,255,0.22)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s);
});
const glowTex=canvasTex(128,(g,s)=>{
  const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.2,'rgba(255,255,255,0.9)');
  gr.addColorStop(0.5,'rgba(255,255,255,0.25)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,s,s);
});
const flameTex=canvasTex(128,(g,s)=>{
  g.translate(s/2,s/2); g.scale(0.62,1);
  const gr=g.createRadialGradient(0,0,0,0,0,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.25,'rgba(255,230,140,0.95)');
  gr.addColorStop(0.55,'rgba(255,120,20,0.6)'); gr.addColorStop(1,'rgba(255,60,0,0)');
  g.fillStyle=gr; g.fillRect(-s/2,-s/2,s,s);
});
const cloudTex=canvasTex(256,(g,s)=>{
  const blob=(x,y,r,a)=>{ const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(255,255,255,${a})`); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); };
  blob(128,140,95,0.85); blob(85,120,65,0.7); blob(175,115,70,0.7); blob(120,95,55,0.6); blob(150,155,60,0.55);
});

/* ============================== sky ============================== */
const sky=new THREE.Mesh(new THREE.SphereGeometry(3600,32,20),new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{uSun:{value:SUN}},
  vertexShader:`varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.0)).xyz;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vW; uniform vec3 uSun;
    void main(){
      vec3 d=normalize(vW-cameraPosition);
      float h=max(d.y,-0.05);
      vec3 col=mix(vec3(0.82,0.93,1.0),vec3(0.38,0.66,0.96),smoothstep(0.0,0.18,h));
      col=mix(col,vec3(0.10,0.38,0.88),smoothstep(0.15,0.65,h));
      float s=max(dot(d,uSun),0.0);
      col+=vec3(1.0,0.9,0.7)*pow(s,8.0)*0.22;
      col+=vec3(1.0,0.95,0.8)*pow(s,700.0)*3.0;
      gl_FragColor=vec4(col,1.0);
    }`
}));
sky.renderOrder=-1; sky.frustumCulled=false; scene.add(sky);

/* ============================== sea ============================== */
const seaGeo=new THREE.PlaneGeometry(4400,4400,120,120); seaGeo.rotateX(-Math.PI/2);
const seaMat=new THREE.ShaderMaterial({
  fog:false,
  uniforms:{uTime:{value:0},uSun:{value:SUN},uFog:{value:new THREE.Color(0xd6ecff)}},
  vertexShader:`
    uniform float uTime; varying vec3 vW; varying vec3 vN; varying float hT;
    float dome(vec2 p){ float r=length(p); float t=max(0.0,1.0-r/620.0); return pow(t,0.8)*46.0; }
    void main(){
      vec3 wp=position;
      hT=dome(wp.xz);
      float t=uTime;
      float f1=0.045*wp.x+1.1*t, f2=0.06*wp.z-0.9*t, f3=0.02*(wp.x+wp.z)+0.6*t;
      wp.y+=0.5*sin(f1)+0.45*sin(f2)+0.7*sin(f3);
      float dx=0.5*0.045*cos(f1)+0.7*0.02*cos(f3);
      float dz=0.45*0.06*cos(f2)+0.7*0.02*cos(f3);
      vN=normalize(vec3(-dx*6.0,1.0,-dz*6.0));
      vW=wp;
      gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.0);
    }`,
  fragmentShader:`
    uniform float uTime; uniform vec3 uSun; uniform vec3 uFog;
    varying vec3 vW; varying vec3 vN; varying float hT;
    void main(){
      vec3 col=mix(vec3(0.20,0.88,0.78),vec3(0.06,0.66,0.75),smoothstep(2.0,-6.0,hT));
      col=mix(col,vec3(0.02,0.32,0.60),smoothstep(-6.0,-42.0,hT));
      vec3 n=vN;
      n.xz+=0.16*vec2(sin(vW.x*0.55+uTime*3.1)+sin(vW.z*0.48-uTime*2.4),
                      sin(vW.z*0.5+uTime*2.8)+sin(vW.x*0.42-uTime*2.1));
      n=normalize(n);
      vec3 V=normalize(cameraPosition-vW);
      float fres=pow(1.0-max(dot(V,n),0.0),3.0);
      col=mix(col,vec3(0.66,0.86,0.98),fres*0.55);
      vec3 R=reflect(-V,n);
      col+=vec3(1.0,0.95,0.8)*pow(max(dot(R,uSun),0.0),180.0)*2.4;
      float cap=smoothstep(0.78,1.0,sin(vW.x*0.21+uTime*1.4)*sin(vW.z*0.19-uTime*1.1));
      col+=cap*0.10;
      float fn=0.5+0.5*sin(vW.x*0.11+uTime*1.3)*sin(vW.z*0.13-uTime*1.1)
              +0.3*sin(vW.x*0.31-uTime*2.0)*sin(vW.z*0.27+uTime*1.7);
      float edge=smoothstep(2.6,0.6,hT)*(1.0-smoothstep(-1.8,-0.2,hT));
      col=mix(col,vec3(0.96,0.99,1.0),edge*smoothstep(0.45,0.9,fn)*0.85);
      float fogF=smoothstep(1000.0,3200.0,length(cameraPosition-vW));
      col=mix(col,uFog,fogF);
      gl_FragColor=vec4(col,1.0);
    }`
});
scene.add(new THREE.Mesh(seaGeo,seaMat));

/* ============================== terrain mesh + colors ============================== */
const TSEG=200, TSIZE=2400, CELL=TSIZE/TSEG;
const terGeo=new THREE.PlaneGeometry(TSIZE,TSIZE,TSEG,TSEG); terGeo.rotateX(-Math.PI/2);
{
  const p=terGeo.attributes.position, N=TSEG+1;
  const H=new Float32Array(N*N);
  for(let iy=0;iy<N;iy++)for(let ix=0;ix<N;ix++){
    const i=iy*N+ix, x=p.getX(i), z=p.getZ(i);
    const h=terrainH(x,z); H[i]=h; p.setY(i,h);
  }
  const cols=new Float32Array(p.count*3);
  const cSand=new THREE.Color(0.105,0.098,0.09), cWet=new THREE.Color(0.055,0.052,0.05);
  const g1=new THREE.Color(0.11,0.48,0.20), g2=new THREE.Color(0.25,0.66,0.28), g3=new THREE.Color(0.52,0.76,0.30);
  const sA=new THREE.Color(0.36,0.25,0.21), sB=new THREE.Color(0.70,0.38,0.22), sC=new THREE.Color(0.80,0.60,0.41);
  const cAsh=new THREE.Color(0.62,0.59,0.55), cCliff=new THREE.Color(0.42,0.35,0.28);
  const cChan=new THREE.Color(0.085,0.07,0.06), cCrater=new THREE.Color(0.15,0.10,0.09), cCr=new THREE.Color(0.34,0.09,0.02);
  const tmp=new THREE.Color(), rc=new THREE.Color();
  for(let iy=0;iy<N;iy++)for(let ix=0;ix<N;ix++){
    const i=iy*N+ix, h=H[i];
    const x=p.getX(i), z=p.getZ(i);
    const hx=H[iy*N+Math.min(ix+1,N-1)]-H[iy*N+Math.max(ix-1,0)];
    const hz=H[Math.min(iy+1,N-1)*N+ix]-H[Math.max(iy-1,0)*N+ix];
    const slope=Math.min(1.2,Math.hypot(hx,hz)/(2*CELL));
    const n=fbm(x*0.02+11,z*0.02+4), n2=fbm(x*0.09+3,z*0.09+8);
    if(h<1.1) tmp.copy(cWet);
    else if(h<4.2) tmp.copy(cSand);
    else{
      tmp.copy(g1).lerp(g2,n).lerp(g3,Math.max(0,n2-0.55)*1.4);
      const rm=sstep(42,95,h+(n-0.5)*26);
      if(rm>0){
        const band=Math.sin(h*0.24+n*7)*0.5+0.5;
        rc.copy(sA).lerp(sB,band).lerp(sC,n2*0.55);
        tmp.lerp(rc,rm);
      }
      tmp.lerp(cAsh,sstep(150,218,h)*0.55);
    }
    const r=Math.hypot(x,z);
    if(r<76){ const m=sstep(76,30,r); tmp.lerp(cCrater,m*0.9); tmp.lerp(cCr,sstep(30,6,r)*0.5); }
    for(const th of [1.75,4.55]){
      let d=Math.atan2(z,x)-th; d=Math.atan2(Math.sin(d),Math.cos(d));
      const w=0.05+0.05*r/500;
      const m=Math.exp(-(d*d)/(w*w))*sstep(78,120,r)*sstep(640,500,r);
      if(m>0.01) tmp.lerp(cChan,Math.min(1,m*1.15));
    }
    tmp.lerp(cCliff,sstep(0.5,0.9,slope)*0.5);
    const vv=0.9+0.2*n2;
    cols[i*3]=tmp.r*vv; cols[i*3+1]=tmp.g*vv; cols[i*3+2]=tmp.b*vv;
  }
  terGeo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  terGeo.computeVertexNormals();
}
const terrain=new THREE.Mesh(terGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0}));
terrain.castShadow=true; terrain.receiveShadow=true; scene.add(terrain);

/* ============================== lava rivers (precomputed) ============================== */
const rivers=[];
function walkRiver(sx,sz,maxLen){
  const pts=[]; let x=sx,z=sz;
  for(let i=0;i<95;i++){
    const h=terrainH(x,z); pts.push(new V3(x,h,z));
    if(h<0.6||pts.length*9>maxLen) break;
    const gx=terrainH(x+4,z)-terrainH(x-4,z), gz=terrainH(x,z+4)-terrainH(x,z-4);
    let dx=-gx,dz=-gz; const L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
    const wob=Math.sin(i*0.55+sx*0.01)*0.55, cs=Math.cos(wob), sn=Math.sin(wob);
    const rx=dx*cs-dz*sn, rz=dx*sn+dz*cs;
    let fx=rx*0.75+dx*0.25, fz=rz*0.75+dz*0.25;
    const fl=Math.hypot(fx,fz)||1;
    x+=fx/fl*9; z+=fz/fl*9;
  }
  return pts;
}
function riverLength(p){ let L=0; for(let i=1;i<p.length;i++) L+=p[i].distanceTo(p[i-1]); return L; }
function buildRibbon(path,w0,w1){
  const n=path.length,pos=[],uv=[],idx=[];
  const side=new V3(),tan=new V3();
  for(let i=0;i<n;i++){
    tan.subVectors(path[Math.min(n-1,i+1)],path[Math.max(0,i-1)]).normalize();
    side.set(-tan.z,0,tan.x).normalize();
    const f=i/(n-1), w=lerp(w0,w1,f), p=path[i];
    pos.push(p.x-side.x*w,p.y+1.0,p.z-side.z*w, p.x+side.x*w,p.y+1.0,p.z+side.z*w);
    uv.push(0,f,1,f);
  }
  for(let i=0;i<n-1;i++){ const k=i*2; idx.push(k,k+1,k+2,k+1,k+3,k+2); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  return g;
}
const riverFrag=`
  uniform float uTime,uProgress,uHeat; varying vec2 vUv;
  float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
  void main(){
    float along=vUv.y;
    if(along>uProgress) discard;
    float edge=smoothstep(0.0,0.18,vUv.x)*smoothstep(1.0,0.82,vUv.x);
    float n1=noise(vec2(vUv.x*4.0,along*60.0-uTime*2.6));
    float n2=noise(vec2(vUv.x*9.0+5.0,along*110.0-uTime*4.2));
    float flow=n1*0.65+n2*0.35;
    float core=pow(1.0-abs(vUv.x-0.5)*2.0,1.6);
    vec3 hot=mix(vec3(1.0,0.60,0.10),vec3(1.0,0.96,0.68),core*0.85)*(0.8+0.55*flow);
    float crustN=noise(vec2(vUv.x*7.0,along*26.0));
    float crust=smoothstep(0.55,0.78,crustN);
    float crustAmt=clamp(along*1.7-0.12,0.0,1.0)*0.9;
    float crack=smoothstep(0.09,0.0,abs(crustN-0.56));
    vec3 col=mix(hot,vec3(0.15,0.10,0.09),crust*crustAmt);
    col+=vec3(1.0,0.45,0.12)*crack*crustAmt*(0.5+0.9*flow);
    col+=vec3(1.0,0.85,0.45)*smoothstep(uProgress-0.06,uProgress-0.005,along)*1.6*uHeat;
    float alpha=edge*(1.0-smoothstep(uProgress-0.012,uProgress,along));
    if(alpha<0.01) discard;
    gl_FragColor=vec4(col,alpha);
  }`;
const riverVert=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
function addRiver(path,w0,w1,startT,speed){
  const mat=new THREE.ShaderMaterial({
    vertexShader:riverVert,fragmentShader:riverFrag,transparent:true,depthWrite:false,side:THREE.DoubleSide,
    uniforms:{uTime:{value:0},uProgress:{value:0},uHeat:{value:0}}
  });
  const mesh=new THREE.Mesh(buildRibbon(path,w0,w1),mat);
  mesh.renderOrder=5; mesh.frustumCulled=false; scene.add(mesh);
  const rv={path,mat,mesh,startT,speed,progress:0,len:riverLength(path),mouth:path[path.length-1].clone(),nextSteam:0,firstHit:false};
  rivers.push(rv); return rv;
}
addRiver(walkRiver(Math.cos(2.9)*64,Math.sin(2.9)*64,560),4,15,27,30);
addRiver(walkRiver(Math.cos(5.55)*64,Math.sin(5.55)*64,560),4,13,30,28);
addRiver(walkRiver(Math.cos(0.7)*64,Math.sin(0.7)*64,560),4,12,33,26);
// branch off river 0 at ~42% of its path
{
  const p0=rivers[0].path, bi=Math.floor(p0.length*0.42), bp=p0[bi];
  const off=walkRiver(bp.x+10,bp.z+6,300);
  addRiver(off,3,9,27.5,26).branchOf=0; rivers[3].branchStart=0.42; rivers[3].started=false;
}
// burn spots along each river
for(const rv of rivers){
  rv.spots=[];
  for(let i=3;i<rv.path.length-3;i+=4){
    const p=rv.path[i];
    if(terrainH(p.x,p.z)>3) rv.spots.push({p,f:i/(rv.path.length-1),done:false});
  }
}

/* ============================== merged geometry helper ============================== */
function newAcc(){ return {v:[],n:[],c:[],i:[]}; }
function pushGeom(acc,geo,mat,color){
  const g=geo.clone(); if(mat) g.applyMatrix4(mat);
  if(!g.getAttribute('normal')) g.computeVertexNormals();
  const p=g.getAttribute('position'), n=g.getAttribute('normal');
  const base=acc.v.length/3, idx=g.getIndex();
  for(let i=0;i<p.count;i++){
    acc.v.push(p.getX(i),p.getY(i),p.getZ(i));
    acc.n.push(n.getX(i),n.getY(i),n.getZ(i));
    acc.c.push(color.r,color.g,color.b);
  }
  if(idx) for(let i=0;i<idx.count;i++) acc.i.push(base+idx.getX(i));
  else for(let i=0;i<p.count;i++) acc.i.push(base+i);
}
function accMesh(acc,rough=0.9){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(acc.v,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(acc.n,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(acc.c,3));
  g.setIndex(acc.i);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:rough,metalness:0}));
  m.castShadow=true; m.receiveShadow=true; return m;
}
const _m4=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_s=new V3(),_p=new V3();

}

    this.seed=new Float32Array(max);

    this.aP=new THREE.BufferAttribute(this.pos,3).setUsage(THREE.DynamicDrawUsage);
    this.aS=new THREE.BufferAttribute(new Float32Array(max),1).setUsage(THREE.DynamicDrawUsage);
    this.aC=new THREE.BufferAttribute(new Float32Array(max*3),3).setUsage(THREE.DynamicDrawUsage);
    this.aA=new THREE.BufferAttribute(new Float32Array(max),1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position',this.aP); g.setAttribute('aSize',this.aS);
    g.setAttribute('aColor',this.aC); g.setAttribute('aAlpha',this.aA);
    this.mat=new THREE.ShaderMaterial({
      uniforms:{uTex:{value:texture},uScale:{value:1000}},
      vertexShader:`
        attribute float aSize,aAlpha; attribute vec3 aColor;
        varying vec3 vC; varying float vA;
        uniform float uScale;
        void main(){ vC=aColor; vA=aAlpha;
          vec4 mv=modelViewMatrix*vec4(position,1.0);
          gl_PointSize=min(aSize*uScale/max(1.0,-mv.z),750.0);
          gl_Position=projectionMatrix*mv; }`,
      fragmentShader:`
        uniform sampler2D uTex; varying vec3 vC; varying float vA;
        void main(){ float a=texture2D(uTex,gl_PointCoord).a*vA;
          if(a<0.004) discard; gl_FragColor=vec4(vC,a); }`,
      transparent:true,depthWrite:false,depthTest:true,blending
    });
    this.mesh=new THREE.Points(g,this.mat);
    this.mesh.frustumCulled=false; scene.add(this.mesh);
    this.onUpdate=null;
  }
  spawn(o){
    const i=this.cur; this.cur=(this.cur+1)%this.max;
    this.pos.set(o.p,i*3); this.vel.set(o.v,i*3);
    this.age[i]=0; this.maxLife[i]=o.life;
    this.s0[i]=o.s0; this.s1[i]=o.s1!==undefined?o.s1:o.s0;
    this.c0.set(o.c0,i*3); this.c1.set(o.c1||o.c0,i*3);
    this.a0[i]=o.a0!==undefined?o.a0:1; this.a1[i]=o.a1!==undefined?o.a1:0;
    this.grav[i]=o.grav||0; this.drag[i]=o.drag||0; this.seed[i]=rnd()*20;
  }
  update(dt,time){
    for(let i=0;i<this.max;i++){
      if(this.age[i]>=this.maxLife[i]){ this.aS.array[i]=0; continue; }
      this.age[i]+=dt;
      const u=Math.min(1,this.age[i]/this.maxLife[i]), i3=i*3;
      this.vel[i3+1]-=this.grav[i]*dt;
      const d=1-Math.min(0.9,this.drag[i]*dt);
      this.vel[i3]*=d; this.vel[i3+1]*=d; this.vel[i3+2]*=d;
      if(this.onUpdate) this.onUpdate(i,u,dt,time);
      this.pos[i3]+=this.vel[i3]*dt; this.pos[i3+1]+=this.vel[i3+1]*dt; this.pos[i3+2]+=this.vel[i3+2]*dt;
      this.aS.array[i]=this.s0[i]+(this.s1[i]-this.s0[i])*u;
      this.aC.array[i3]=this.c0[i3]+(this.c1[i3]-this.c0[i3])*u;
      this.aC.array[i3+1]=this.c0[i3+1]+(this.c1[i3+1]-this.c0[i3+1])*u;
      this.aC.array[i3+2]=this.c0[i3+2]+(this.c1[i3+2]-this.c0[i3+2])*u;
      this.aA.array[i]=this.a0[i]+(this.a1[i]-this.a0[i])*u;
    }
    this.aP.needsUpdate=this.aS.needsUpdate=this.aC.needsUpdate=this.aA.needsUpdate=true;
  }
}

/* ash column dynamics */
ash.onUpdate=(i,u,dt,time)=>{
  const i3=i*3, y=ash.pos[i3+1], alt=y-CRATER_FLOOR;
  if(alt>S.columnTop*0.98||u>=1){ ash.age[i]=ash.maxLife[i]; ash.aS.array[i]=0; return; }
  let x=ash.pos[i3], z=ash.pos[i3+2];
  const r=Math.hypot(x,z)||1;
  const sw=ash.spin[i]*(1.0/(1+alt/220));
  const vxT=-z/r*sw*22, vzT=x/r*sw*22;
  const anvil=S.columnTop*0.72;
  let rad=ash.rad[i];
  if(alt>anvil) rad+=((alt-anvil)/55)*dt*30;
  ash.rad[i]=Math.min(rad,16);
  const vy=ash.vy[i]*(1-0.55*alt/Math.max(40,S.columnTop));
  ash.vel[i3]=vxT+x/r*rad+WIND.x*0.5;
  ash.vel[i3+1]=vy;
  ash.vel[i3+2]=vzT+z/r*rad+WIND.z*0.5;
};

}
function ashTint(time){
  for(let i=0;i<ash.max;i++){
    if(ash.age[i]>=ash.maxLife[i]) continue;
    const i3=i*3, alt=ash.pos[i3+1]-CRATER_FLOOR;
    const g=Math.exp(-Math.max(0,alt)/110)*S.glow*(0.6+0.4*Math.sin(time*2.5+ash.seed[i]*3));
    const m=Math.min(0.92,g*1.25);
    let r=ash.c0[i3],gg=ash.c0[i3+1],b=ash.c0[i3+2];
    r=r+(1.0-r)*m; gg=gg+(0.42-gg)*m; b=b+(0.10-b)*m;

    ash.aC.array[i3]=r+f*0.7; ash.aC.array[i3+1]=gg+f*0.8; ash.aC.array[i3+2]=b+f;
  }
  ash.aC.needsUpdate=true;
}

  if(t<72){ sampleKeys(camKeys,t,camPos); sampleKeys({t:camKeys.t,p:camKeys.tg},t,camTgt); }
  else{
    const th=2.07-(t-72)*0.02, R=1170, y=Math.min(430,340+(t-72)*0.5);
    camPos.set(Math.cos(th)*R,y,Math.sin(th)*R); camTgt.set(0,190,0);
  }
  smx=lerp(smx,mx,dt*3); smy=lerp(smy,my,dt*3);
  _right.subVectors(camTgt,camPos).cross(camera.up).normalize();
  _up.crossVectors(_right,camera.up).normalize().negate();
  camPos.addScaledVector(_right,smx*16).addScaledVector(_up,-smy*9);
  camTgt.addScaledVector(_right,smx*26).addScaledVector(_up,-smy*14);
  const s=shakeAmp(t), tt=t;
  camPos.x+=(Math.sin(tt*31.7)+Math.sin(tt*17.3+2))*s*0.9;
  camPos.y+=(Math.sin(tt*27.1+1)+Math.sin(tt*13.7))*s*0.7;
  camPos.z+=(Math.sin(tt*23.3+3)+Math.sin(tt*19.1))*s*0.9;
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
  camera.rotation.z+=Math.sin(tt*19)*0.004*s;
  camera.fov=56+(t>=21?5*Math.exp(-(t-21)*0.4):0)+0.5*s;
  camera.updateProjectionMatrix();
}

/* ============================== director / main loop ============================== */
const acc={wisp:0,fuma:0,rim:0,fount:0,ember:0,flake:0,surge:0,rock:0};
let bombNext=0, started=false;
const clock=new THREE.Clock();
const _v=new V3(), _v2=new V3();

function director(t,dt){
  /* --- warning beacons --- */
  let blink=0;
  if(t>4&&t<9){ const p=t%1.6; blink=(p<0.12||(p>0.3&&p<0.42))?1:0; }
  else if(t>=9&&t<21) blink=(t%0.28<0.12)?1:0;
  else if(t>=21) blink=(t%0.14<0.07)?1:0;
  warnBulb.material.emissiveIntensity=blink*4;
  warnLight.intensity=blink*55;
  const pb=(t>5&&t%1.1<0.1)?1:0;
  pierBeacon.material.emissiveIntensity=pb*3.5;
  pierLight.intensity=pb*35;

  /* --- tremor rocks & rim dust --- */
  const tremor=sstep(9,12,t)*sstep(18,14.5,t);
  if(tremor>0){
    acc.rock+=tremor*dt*1.4; while(acc.rock>1){ acc.rock--; spawnTumbler(); }
    acc.rim+=tremor*dt*7; while(acc.rim>1){ acc.rim--;
      const a=rnd()*Math.PI*2, r=64+rnd()*16;
      const x=Math.cos(a)*r,z=Math.sin(a)*r;
      smoke.spawn({p:[x,terrainH(x,z)+3,z],v:[(rnd()-0.5)*4,3+rnd()*4,(rnd()-0.5)*4],
        life:1.5+rnd()*1.5,drag:1,s0:4+rnd()*4,s1:14+rnd()*8,c0:[0.5,0.45,0.4],c1:[0.4,0.37,0.35],a0:0.4,a1:0});
    }
  }
  if(t>23&&rnd()<dt*0.4) spawnTumbler();

  /* --- crater glow --- */
  S.heat=sstep(12,23,t);
  S.glow=sstep(21,27,t);
  S.pulse=t>=21?0.8+0.3*Math.sin(t*1.7)+0.12*Math.sin(t*4.3):1;
  glowDisc.material.uniforms.uHeat.value=S.heat;
  glowDisc.material.uniforms.uTime.value=t;
  craterLight.color.setHSL(lerp(0.02,0.075,S.heat),1,lerp(0.25,0.55,S.heat));
  craterLight.intensity=1600*S.heat*S.heat+(t>=21?(6000+32000*S.glow)*S.pulse:0);
  craterLight.position.y=CRATER_FLOOR+28+S.glow*10;

  /* --- calm steam wisp + fumaroles --- */
  const wispRate=t<21?2+sstep(12,20,t)*3:0;
  acc.wisp+=wispRate*dt; while(acc.wisp>1){ acc.wisp--;
    smoke.spawn({p:[(rnd()-0.5)*6,CRATER_FLOOR+6,(rnd()-0.5)*6],
      v:[WIND.x*0.3+(rnd()-0.5)*1.5,6+rnd()*4,WIND.z*0.3+(rnd()-0.5)*1.5],
      life:5+rnd()*3,drag:0.15,s0:5+rnd()*3,s1:18+rnd()*10,c0:[0.95,0.96,0.97],c1:[0.88,0.9,0.92],a0:0.3,a1:0});
  }
  acc.fuma+=dt*2.4; while(acc.fuma>1){ acc.fuma--;
    const fa=[1.2,3.3,5.2][Math.floor(rnd()*3)], fr=[175,160,185][Math.floor(rnd()*3)];
    const fx=Math.cos(fa)*fr,fz=Math.sin(fa)*fr;
    smoke.spawn({p:[fx,terrainH(fx,fz)+2,fz],v:[WIND.x*0.4+(rnd()-0.5),3.5+rnd()*2.5,WIND.z*0.4+(rnd()-0.5)],
      life:4+rnd()*3,drag:0.1,s0:2.5+rnd()*2,s1:10+rnd()*6,c0:[0.93,0.94,0.95],c1:[0.85,0.87,0.9],a0:0.28,a1:0});
  }

  /* --- eruption one-shots --- */
  if(t>=21&&bombNext===0){ bombNext=t+1.4; }
  if(t>=bombNext){ launchBomb(); if(rnd()<0.3) launchBomb(); bombNext=t+1.1+rnd()*2.4; }

  /* --- lava fountain --- */
  const fr=t>=21?(130*Math.min(1,(t-21)/4))*S.pulse:0;
  acc.fount+=fr*dt;
  while(acc.fount>1){
    acc.fount--;
    const kind=rnd(), a=rnd()*Math.PI*2, rr=rnd()*10;
    const px=Math.cos(a)*rr,pz=Math.sin(a)*rr;
    if(kind<0.4) fountain.spawn({p:[px,CRATER_FLOOR+8,pz],
      v:[Math.cos(a)*(2+rnd()*6),58+rnd()*30,Math.sin(a)*(2+rnd()*6)],grav:42,
      life:0.9+rnd()*0.5,s0:4.5+rnd()*4,s1:1.5,c0:[1,0.97,0.82],c1:[1,0.78,0.3],a0:1,a1:0});
    else if(kind<0.78) fountain.spawn({p:[px,CRATER_FLOOR+8,pz],
      v:[Math.cos(a)*(6+rnd()*16),40+rnd()*28,Math.sin(a)*(6+rnd()*16)],grav:42,
      life:1.4+rnd()*0.7,s0:7+rnd()*6,s1:2.5,c0:[1,0.8,0.42],c1:[0.95,0.32,0.06],a0:0.95,a1:0,trail:0});
    else{ fountain.spawn({p:[px,CRATER_FLOOR+8,pz],
      v:[Math.cos(a)*(12+rnd()*26),30+rnd()*24,Math.sin(a)*(12+rnd()*26)],grav:42,
      life:1.8+rnd()*0.8,s0:6+rnd()*4,s1:2,c0:[1,0.56,0.18],c1:[0.7,0.2,0.03],a0:0.9,a1:0});
      if(rnd()<0.3) fountain.trailFlag[fountain.cur===0?fountain.max-1:fountain.cur-1]=1;
    }
  }
  // molten arc trails
  for(let i=0;i<fountain.max;i++){
    if(!fountain.trailFlag[i]||fountain.age[i]>=fountain.maxLife[i]) continue;
    const i3=i*3;
    glow.spawn({p:[fountain.pos[i3],fountain.pos[i3+1],fountain.pos[i3+2]],v:[0,0,0],
      life:0.18+rnd()*0.1,s0:2.6,s1:0.8,c0:[1,0.44,0.1],c1:[0.8,0.15,0.02],a0:0.55,a1:0});
    fountain.trailFlag[i]=fountain.age[i]<fountain.maxLife[i]-0.1?1:0;
  }

  /* --- ash column --- */
  S.columnTop=Math.min(540,t>=22?(t-22)*30:0);
  const ar=t>=22?50*Math.min(1,(t-22)/5):0;
  acc.ember+=ar*dt*0; // (emission below uses its own accumulator)
  const ashAcc=(t>=22?50*Math.min(1,(t-22)/5):0)*dt;
  acc.flakeAcc=(acc.flakeAcc||0)+ashAcc;
  while(acc.flakeAcc>1){ acc.flakeAcc--; spawnAsh(); }

  /* --- ambient embers / ash flakes / ground surge --- */
  acc.ember+=26*S.glow*dt; while(acc.ember>1){ acc.ember--;
    const a=rnd()*Math.PI*2, r=rnd()*30;
    glow.spawn({p:[Math.cos(a)*r,CRATER_FLOOR+10+rnd()*20,Math.sin(a)*r],
      v:[(rnd()-0.5)*6+WIND.x*0.5,7+rnd()*14,(rnd()-0.5)*6+WIND.z*0.5],
      life:2+rnd()*3,drag:0.4,s0:2+rnd()*2.5,s1:0.4,c0:[1,0.72,0.28],c1:[0.9,0.18,0.02],a0:0.9,a1:0});
  }
  acc.flake+=16*S.glow*dt; while(acc.flake>1){ acc.flake--;
    const a=rnd()*Math.PI*2, r=160+rnd()*320;
    const fx=Math.cos(a)*r,fz=Math.sin(a)*r;
    smoke.spawn({p:[fx,200+rnd()*180,fz],v:[WIND.x*0.8,-3.5-rnd()*4,WIND.z*0.8],
      life:9+rnd()*5,drag:0.05,s0:3+rnd()*3,s1:5+rnd()*3,c0:[0.6,0.57,0.54],c1:[0.5,0.48,0.46],a0:0.32,a1:0});
  }
  acc.surge+=8*sstep(23,27,t)*sstep(75,58,t)*dt; while(acc.surge>1){ acc.surge--;
    const a=rnd()*Math.PI*2, r=66+rnd()*14;
    const x=Math.cos(a)*r,z=Math.sin(a)*r;
    terrainNormal(x,z,_n);
    smoke.spawn({p:[x,terrainH(x,z)+4,z],
      v:[Math.cos(a)*13+_n.x*8,1.5,Math.sin(a)*13+_n.z*8],
      life:4+rnd()*3,drag:0.25,s0:9+rnd()*6,s1:30+rnd()*14,c0:[0.5,0.44,0.38],c1:[0.38,0.35,0.33],a0:0.45,a1:0});
  }

  /* --- rivers --- */
  let bestFront=null;
  for(const rv of rivers){
    if(rv.branchStart!==undefined){
      if(!rv.started&&rivers[rv.branchOf].progress>=rv.branchStart){ rv.started=true; }
      if(!rv.started) continue;
    }
    const active=t>=rv.startT;
    if(active) rv.progress=Math.min(1,rv.progress+rv.speed*dt/rv.len);
    rv.mat.uniforms.uTime.value=t;
    rv.mat.uniforms.uProgress.value=rv.progress;
    rv.mat.uniforms.uHeat.value=S.glow;
    if(rv.progress>0.02){
      const fi=Math.floor(rv.progress*(rv.path.length-1));
      const fp=rv.path[fi];
      if(!bestFront||fp.y>bestFront.y) bestFront=fp;
      // burn spots
      for(const s of rv.spots){
        if(!s.done&&rv.progress>=s.f){
          s.done=true; activateBurn(s.p);
          for(const hp of heroPalms){
            if(!hp.burning&&hp.triggerF<Infinity&&rv.progress>=hp.triggerF&&
               Math.hypot(hp.pos.x-s.p.x,hp.pos.z-s.p.z)<14) hp.ignite(t);
          }
        }
      }
      // sea steam
      if(fp.y<2.2&&rv.progress<1&&t>rv.nextSteam){
        rv.nextSteam=t+2.4;
        seaSteamBurst(fp,!rv.firstHit); rv.firstHit=true;
      }else if(fp.y<2.2&&rv.progress>=1&&t>rv.nextSteam){
        rv.nextSteam=t+2.8; seaSteamBurst(fp,false);
      }
    }
  }
  if(bestFront&&S.glow>0.3){ riverLight.position.copy(bestFront).y+=8; riverLight.intensity=12000*S.glow; }

  /* --- persistent burn sites --- */
  for(let i=burnSites.length-1;i>=0;i--){
    const b=burnSites[i];
    if(t>b.end){ burnSites.splice(i,1); continue; }
    b.nextFlame-=dt;
    if(b.nextFlame<=0){ b.nextFlame=0.12+rnd()*0.1;
      fireFlame(_v.set(b.p.x+(rnd()-0.5)*7,b.p.y+2+rnd()*5,b.p.z+(rnd()-0.5)*7),3.5+rnd()*3,0.5+rnd()*0.5);
    }
    b.nextSmoke-=dt;
    if(b.nextSmoke<=0){ b.nextSmoke=0.25;
      smoke.spawn({p:[b.p.x+(rnd()-0.5)*6,b.p.y+4,b.p.z+(rnd()-0.5)*6],
        v:[(rnd()-0.5)*3+WIND.x*0.4,4+rnd()*4,(rnd()-0.5)*3+WIND.z*0.4],
        life:2.5+rnd()*2,drag:0.3,s0:4+rnd()*3,s1:16+rnd()*8,c0:[0.25,0.22,0.2],c1:[0.35,0.33,0.32],a0:0.5,a1:0});
      if(rnd()<0.4) glow.spawn({p:[b.p.x+(rnd()-0.5)*5,b.p.y+3,b.p.z+(rnd()-0.5)*5],
        v:[(rnd()-0.5)*2,3+rnd()*4,(rnd()-0.5)*2],life:1.5,s0:1.8,s1:0.3,c0:[1,0.6,0.2],c1:[0.8,0.1,0],a0:0.8,a1:0});
    }
  }

  /* --- lightning --- */
  if(t>34&&S.columnTop>260&&t>nextBolt) triggerBolt();
  S.flash=Math.max(0,S.flash-dt*7);
  flashLight.intensity=S.flash*70000;
  boltShow=Math.max(0,boltShow-dt);
  bolt.material.opacity=boltShow>0?(rnd()<0.75?1:0.15):0;

  /* --- birds --- */
  if(t>20.5) for(const b of birds) b.flee=true;
}

function loop(){
  const dt=Math.min(0.05,clock.getDelta());
  const t=clock.elapsedTime;
  S.T=t;
  director(t,dt);
  updateBombs(dt,t);
  updateTumble(dt,t);
  updateBirds(dt,t);
  updateFlames(dt,t);
  for(const s of scorches){ if(s.life>0){ s.life-=dt; s.m.material.opacity=Math.min(0.75,s.life*0.4); if(s.life<=0) s.m.visible=false; } }
  smoke.update(dt,t); glow.update(dt,t); fountain.update(dt,t);
  ash.update(dt,t); ashTint(t);
  for(const hp of heroPalms) hp.update(t,dt);
  for(const b of boats){ b.position.y=0.4+Math.sin(t*1.3+b.position.x)*0.28; b.rotation.z=Math.sin(t*0.9+b.position.z)*0.06; }
  // clouds uniforms
  cloudMat.uniforms.uTime.value=t;
  cloudMat.uniforms.uErupt.value=S.glow;
  cloudMat.uniforms.uEx.value.set(0,0,0);
  cloudMat.uniforms.uTop.value=S.columnTop;
  cloudMat.uniforms.uScale.value=renderer.domElement.height*0.95;
  smoke.mat.uniforms.uScale.value=glow.mat.uniforms.uScale.value=
    fountain.mat.uniforms.uScale.value=ash.mat.uniforms.uScale.value=renderer.domElement.height*0.95;
  // heat shimmer center
  _v.set(0,240+S.columnTop*0.3,0).project(camera);
  if(_v.z<1){ postMat.uniforms.uCenter.value.set(_v.x*0.5+0.5,_v.y*0.5+0.5);
    postMat.uniforms.uStrength.value=0.22+0.95*S.glow+0.3*S.heat; }
  else postMat.uniforms.uStrength.value=0;
  postMat.uniforms.uTime.value=t;
  updateCamera(t,dt);
  renderer.setRenderTarget(rt);
  renderer.render(scene,camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene,postCam);
}
renderer.setAnimationLoop(loop);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.getDrawingBufferSize(dbSize);
  rt.setSize(dbSize.x,dbSize.y);
});

// fade in from black once first frames are up
requestAnimationFrame(()=>requestAnimationFrame(()=>{
  const f=document.getElementById('fade'); f.style.opacity='0';
  setTimeout(()=>f.remove(),1800);
}));
</script>

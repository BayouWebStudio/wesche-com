<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= core ================= */
let W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W,H);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xcfe9f4,420,1500);
const camera=new THREE.PerspectiveCamera(52,W/H,0.5,4000);
camera.position.set(-182,11,168);

const hemi=new THREE.HemisphereLight(0xbfe3ff,0x9a7f56,0.85); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2df,1.25);
sun.position.set(300,340,180); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-340; sun.shadow.camera.right=340;
sun.shadow.camera.top=340; sun.shadow.camera.bottom=-340;
sun.shadow.camera.near=50; sun.shadow.camera.far=1000; sun.shadow.bias=-0.0006;
scene.add(sun);
const SUN=new THREE.Vector3(300,340,180).normalize();

const lavaLight=new THREE.PointLight(0xff7a26,0,900,2);
lavaLight.position.set(0,100,0); scene.add(lavaLight);
const frontLight=new THREE.PointLight(0xff5a1a,0,140,2); scene.add(frontLight);
const flashLight=new THREE.PointLight(0xcfe0ff,0,320,2); scene.add(flashLight);

/* ================= helpers ================= */
function clamp(x,a,b){return x<a?a:(x>b?b:x);}
function lerp(a,b,t){return a+(b-a)*t;}
function smoothstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}
function frac(x){return x-Math.floor(x);}
function hash2(x,y){return frac(Math.sin(x*127.1+y*311.7)*43758.5453);}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){return vnoise(x,y)*0.6+vnoise(x*2.3+7.7,y*2.3+3.1)*0.3+vnoise(x*5.1+13,y*5.1+9)*0.1;}
function flick(t){return 0.5+0.5*Math.sin(t*13.7)*Math.sin(t*7.3+1.7)+0.15*Math.sin(t*31);}
function canvasTex(sz,fn){const c=document.createElement('canvas');c.width=c.height=sz;fn(c.getContext('2d'),sz);return new THREE.CanvasTexture(c);}

/* ================= terrain shape ================= */
const CHANNELS=[
 {a0:1.35, wig:0.50, wf:0.030, ph:0.7, r0:27, end:292, flow:'main'},
 {a0:0.0,  wig:0.42, wf:0.034, ph:1.9, r0:110, end:238, flow:'branch'},
 {a0:5.9,  wig:0.50, wf:0.032, ph:0.2, r0:30, end:175, flow:null}
];
function chanAngle(c,r){return c.a0+Math.sin(r*c.wf+c.ph)*c.wig;}
CHANNELS[1].a0=chanAngle(CHANNELS[0],112)-Math.sin(110*CHANNELS[1].wf+CHANNELS[1].ph)*CHANNELS[1].wig;
function chanLateral(c,x,z){
  const r=Math.hypot(x,z);
  if(r<c.r0-2||r>c.end+4)return 1e9;
  const a=Math.atan2(z,x);
  let d=a-chanAngle(c,r); d=Math.atan2(Math.sin(d),Math.cos(d));
  return Math.abs(d)*r;
}
function islandH(x,z){
  const r=Math.hypot(x,z);
  let h=10.5*(1-smoothstep(150,272,r));
  h+=(fbm(x*0.013+5,z*0.013+5)-0.5)*11*(1-smoothstep(140,260,r));
  h+=(fbm(x*0.05+9,z*0.05+9)-0.5)*2.2;
  h-=8*smoothstep(258,330,r);
  return h;
}
function volH(r){
  if(r>=172)return -1e9;
  if(r<27){const u=Math.max(0,(r-12)/15);return 81.1+15.0*Math.pow(u,1.7);}
  return 120*Math.pow(1-r/172,1.3);
}
function groundH(x,z){
  const r=Math.hypot(x,z);
  let h=islandH(x,z);
  if(r<175){
    let v=volH(r);
    v=lerp(v,h-2.5,smoothstep(150,172,r));
    if(v>h)h=v;
  }
  for(let i=0;i<3;i++){
    const c=CHANNELS,lat=chanLateral(c,x,z);
    if(lat<10){
      const fade=smoothstep(c.r0-4,c.r0+4,r)*(1-smoothstep(c.end-4,c.end+8,r));
      h-=2.4*(1-smoothstep(2.5,9,lat))*fade;
    }
  }
  return h;
}

/* ================= sky ================= */
const skyMat=new THREE.ShaderMaterial({
  uniforms:{uSun:{value:SUN}},
  vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform vec3 uSun;varying vec3 vDir;
  void main(){vec3 d=normalize(vDir);
    float y=max(d.y,0.0);
    vec3 col=mix(vec3(0.84,0.93,0.99),vec3(0.15,0.5,0.88),pow(y,0.6));
    float s=max(dot(d,uSun),0.0);
    col+=vec3(1.0,0.9,0.7)*(pow(s,900.0)*1.5+pow(s,10.0)*0.18);
    gl_FragColor=vec4(col,1.0);}`,
  side:THREE.BackSide,depthWrite:false,fog:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(1900,24,16),skyMat);
sky.renderOrder=-1; sky.frustumCulled=false; scene.add(sky);

/* ================= textures ================= */
const texSoft=canvasTex(128,(g,s)=>{const r=g.createRadialGradient(64,64,0,64,64,64);
  r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(0.35,'rgba(255,255,255,0.6)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,s,s);});
const texSmoke=canvasTex(128,(g,s)=>{
  const r=g.createRadialGradient(64,64,6,64,64,62);
  r.addColorStop(0,'rgba(255,255,255,0.95)');r.addColorStop(0.55,'rgba(255,255,255,0.45)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,s,s);
  g.globalAlpha=0.15;g.fillStyle='#000';
  for(let i=0;i<28;i++){const a=Math.random()*6.28,d=Math.random()*42;
    g.beginPath();g.arc(64+Math.cos(a)*d,64+Math.sin(a)*d,5+Math.random()*14,0,6.28);g.fill();}});
const texFlame=canvasTex(128,(g,s)=>{
  const r=g.createRadialGradient(64,86,4,64,74,60);
  r.addColorStop(0,'rgba(255,255,230,1)');r.addColorStop(0.3,'rgba(255,190,60,0.9)');
  r.addColorStop(0.65,'rgba(255,90,20,0.5)');r.addColorStop(1,'rgba(255,60,0,0)');
  g.fillStyle=r;g.fillRect(0,0,s,s);});
const texStreak=canvasTex(128,(g,s)=>{
  g.clearRect(0,0,s,s);
  for(let i=0;i<40;i++){const x=Math.random()*s;
    const gr=g.createLinearGradient(x,0,x+8,0);
    gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(0.5,'rgba(255,255,255,'+(0.05+Math.random()*0.12)+')');gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.fillRect(x,0,8,s);}});

/* ================= particle material ================= */
function pointsMat(tex,blending){
  return new THREE.ShaderMaterial({
    uniforms:{uTex:{value:tex}},
    vertexShader:`attribute float aSize;attribute vec4 aColor;varying vec4 vColor;
      void main(){vColor=aColor;vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aSize*(340.0/max(1.0,-mv.z));gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform sampler2D uTex;varying vec4 vColor;
      void main(){vec4 t=texture2D(uTex,gl_PointCoord);
      gl_FragColor=vec4(vColor.rgb*t.rgb,vColor.a*t.a);
      if(gl_FragColor.a<0.01)discard;}`,
    transparent:true,depthWrite:false,blending:blending,fog:false});
}
function makeSys(n,tex,blend,order){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(n*3),col=new Float32Array(n*4),siz=new Float32Array(n);
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aColor',new THREE.BufferAttribute(col,4));
  g.setAttribute('aSize',new THREE.BufferAttribute(siz,1));
  const pts=new THREE.Points(g,pointsMat(tex,blend));
  pts.frustumCulled=false; pts.renderOrder=order; scene.add(pts);
  return {g,pos,col,siz,n,cur:0};
}
function alphaEnv(age,life,inn,outFrac){
  return smoothstep(0,inn,age)*(1-smoothstep((1-outFrac)*life,life,age));
}

/* ---- puff system (dust / steam / smoke) ---- */
const puff=makeSys(900,texSmoke,THREE.NormalBlending,10);
const pP={x:new Float32Array(900),y:new Float32Array(900),z:new Float32Array(900),
  vx:new Float32Array(900),vy:new Float32Array(900),vz:new Float32Array(900),
  age:new Float32Array(900),life:new Float32Array(900),s0:new Float32Array(900),
  gr:new Float32Array(900),r:new Float32Array(900),g2:new Float32Array(900),b:new Float32Array(900),a0:new Float32Array(900)};
let puffRateAcc=0;
function spawnPuff(x,y,z,vx,vy,vz,life,s0,gr,r,g,b,a){
  const i=puff.cur;puff.cur=(puff.cur+1)%900;
  pP.x[i]=x;pP.y[i]=y;pP.z[i]=z;pP.vx[i]=vx;pP.vy[i]=vy;pP.vz[i]=vz;
  pP.age[i]=0;pP.life[i]=life;pP.s0[i]=s0;pP.gr[i]=gr;
  pP.r[i]=r;pP.g2[i]=g;pP.b[i]=b;pP.a0[i]=a;
}
function updatePuffs(dt){
  for(let i=0;i<900;i++){
    const L=pP.life[i];if(L<=0){puff.col[i*4+3]=0;continue;}
    pP.age[i]+=dt;
    if(pP.age[i]>=L){pP.life[i]=0;puff.col[i*4+3]=0;continue;}
    pP.vx[i]*=(1-1.1*dt);pP.vz[i]*=(1-1.1*dt);
    pP.x[i]+=pP.vx[i]*dt;pP.y[i]+=pP.vy[i]*dt;pP.z[i]+=pP.vz[i]*dt;
    const k=i*4,ag=pP.age[i];
    puff.pos[i*3]=pP.x[i];puff.pos[i*3+1]=pP.y[i];puff.pos[i*3+2]=pP.z[i];
    puff.siz[i]=pP.s0[i]+ag*pP.gr[i];
    puff.col[k]=pP.r[i];puff.col[k+1]=pP.g2[i];puff.col[k+2]=pP.b[i];
    puff.col[k+3]=pP.a0[i]*alphaEnv(ag,L,0.3,0.35);
  }
  puff.g.attributes.position.needsUpdate=true;
  puff.g.attributes.aColor.needsUpdate=true;
  puff.g.attributes.aSize.needsUpdate=true;
}

/* ---- ember / spark system (additive) ---- */
const emb=makeSys(900,texSoft,THREE.AdditiveBlending,13);
const eP={x:new Float32Array(900),y:new Float32Array(900),z:new Float32Array(900),
  vx:new Float32Array(900),vy:new Float32Array(900),vz:new Float32Array(900),
  age:new Float32Array(900),life:new Float32Array(900),s0:new Float32Array(900),
  grav:new Float32Array(900),seed:new Float32Array(900)};
let emberAcc=0;
function spawnEmber(x,y,z,vx,vy,vz,life,s0,grav,r,g,b,a){
  const i=emb.cur;emb.cur=(emb.cur+1)%900;
  eP.x[i]=x;eP.y[i]=y;eP.z[i]=z;eP.vx[i]=vx;eP.vy[i]=vy;eP.vz[i]=vz;
  eP.age[i]=0;eP.life[i]=life;eP.s0[i]=s0;eP.grav[i]=grav;eP.seed[i]=Math.random()*7;
  const k=i*4;emb.col[k]=r;emb.col[k+1]=g;emb.col[k+2]=b;emb.col[k+3]=a;
}
function updateEmbers(dt,T){
  for(let i=0;i<900;i++){
    const L=eP.life[i];
    if(L<=0){emb.col[i*4+3]=0;continue;}
    eP.age[i]+=dt;
    if(eP.age[i]>=L){eP.life[i]=0;emb.col[i*4+3]=0;continue;}
    eP.vy[i]-=eP.grav[i]*dt;
    eP.vx[i]*=(1-0.4*dt);eP.vz[i]*=(1-0.4*dt);
    eP.x[i]+=eP.vx[i]*dt+2.0*dt;eP.y[i]+=eP.vy[i]*dt;eP.z[i]+=eP.vz[i]*dt;
    const k=i*4,ag=eP.age[i];
    emb.pos[i*3]=eP.x[i];emb.pos[i*3+1]=eP.y[i];emb.pos[i*3+2]=eP.z[i];
    emb.col[k+3]*=1; // kept from spawn, faded below
    const fade=alphaEnv(ag,L,0.02,0.5);
    emb.col[k+3]=fade*(0.55+0.45*Math.sin(T*17+eP.seed[i]*9));
    emb.siz[i]=eP.s0[i];
  }
  emb.g.attributes.position.needsUpdate=true;
  emb.g.attributes.aColor.needsUpdate=true;
  emb.g.attributes.aSize.needsUpdate=true;
}

/* ---- ash column ---- */
const AN=4200;
const ash=makeSys(AN,texSmoke,THREE.NormalBlending,11);
const aS={ang:new Float32Array(AN),rad:new Float32Array(AN),y:new Float32Array(AN),
  vy:new Float32Array(AN),spin:new Float32Array(AN),dx:new Float32Array(AN),dz:new Float32Array(AN),
  age:new Float32Array(AN),life:new Float32Array(AN),s0:new Float32Array(AN),
  s1:new Float32Array(AN),s2:new Float32Array(AN)};
let ashOn=false,ashAcc=0,windX=2.2,windZ=0.8;
function spawnAsh(n,y0){
  for(let q=0;q<n;q++){
    const i=ash.cur;ash.cur=(ash.cur+1)%AN;
    aS.ang[i]=Math.random()*6.283;
    aS.rad[i]=1+Math.random()*8;
    aS.y[i]=y0;
    aS.vy[i]=20+Math.random()*22;
    aS.spin[i]=(2.5+Math.random()*4)/(3+aS.rad[i]*0.2);
    aS.dx[i]=0;aS.dz[i]=0;
    aS.age[i]=0;aS.life[i]=8+Math.random()*7;
    aS.s0[i]=3+Math.random()*3;
    aS.s1[i]=Math.random();aS.s2[i]=Math.random();
  }
}
let colTop=90,anvilY=130;
function updateAsh(dt,t){
  if(ashOn){
    const rate=t<20?260:Math.min(230,60+(t-20)*9);
    ashAcc+=rate*dt;
    while(ashAcc>1){ashAcc--;spawnAsh(1,90);}
  }
  const steamMix=t-18;
  for(let i=0;i<AN;i++){
    const L=aS.life[i];
    if(L<=0){ash.col[i*4+3]=0;continue;}
    aS.age[i]+=dt;
    if(aS.age[i]>=L){aS.life[i]=0;ash.col[i*4+3]=0;continue;}
    const y=aS.y[i];
    aS.ang[i]+=aS.spin[i]*dt;
    aS.rad[i]+=(0.7+aS.rad[i]*0.10+Math.max(0,y-120)*0.02)*dt;
    if(y>anvilY)aS.rad[i]+=10*dt;
    aS.vy[i]+=((14+aS.s1[i]*16)-aS.vy[i])*0.4*dt;
    aS.y[i]+=aS.vy[i]*dt;
    const wf=clamp(y/110,0.2,1.4);
    aS.dx[i]+=windX*dt*wf;aS.dz[i]+=windZ*dt*wf;
    const ca=Math.cos(aS.ang[i]),sa=Math.sin(aS.ang[i]);
    const x=aS.rad[i]*ca+aS.dx[i],z=aS.rad[i]*sa+aS.dz[i];
    ash.pos[i*3]=x;ash.pos[i*3+1]=y;ash.pos[i*3+2]=z;
    const ag=aS.age[i],k=i*4;
    ash.siz[i]=Math.min(24,aS.s0[i]+ag*1.9);
    let gray=0.40+0.30*aS.s2[i];
    let r=gray,g=gray*0.97,b=gray*0.95;
    if(ag<1.6){const m=(1.6-ag)/1.6;r=lerp(r,0.95,m);g=lerp(g,0.94,m);b=lerp(b,0.92,m);}
    const glow=glowStrength*(1-smoothstep(10,58,y));
    r=lerp(r,1.05,glow*0.85);g=lerp(g,0.42,glow*0.8);b=lerp(b,0.10,glow*0.8);
    const hi=smoothstep(150,300,y)*0.14;r+=hi;g+=hi;b+=hi;
    ash.col[k]=r;ash.col[k+1]=g;ash.col[k+2]=b;
    ash.col[k+3]=alphaEnv(ag,L,0.6,0.3)*0.9;
  }
  ash.g.attributes.position.needsUpdate=true;
  ash.g.attributes.aColor.needsUpdate=true;
  ash.g.attributes.aSize.needsUpdate=true;
}

/* ---- lava fountain ---- */
const FN=1500;
const fnt=makeSys(FN,texSoft,THREE.AdditiveBlending,12);
const fP={x:new Float32Array(FN),y:new Float32Array(FN),z:new Float32Array(FN),
  vx:new Float32Array(FN),vy:new Float32Array(FN),vz:new Float32Array(FN),
  age:new Float32Array(FN),life:new Float32Array(FN),s0:new Float32Array(FN),seed:new Float32Array(FN)};
let fntOn=false,fntAcc=0,trailAcc=0;
function spawnFount(n){
  for(let q=0;q<n;q++){
    const i=fnt.cur;fnt.cur=(fnt.cur+1)%FN;
    const a=Math.random()*6.283,rr=Math.random()*5;
    fP.x[i]=Math.cos(a)*rr;fP.y[i]=90;fP.z[i]=Math.sin(a)*rr;
    const core=Math.random()<0.35;
    fP.vy[i]=core?68+Math.random()*30:46+Math.random()*24;
    const sp=core?3+Math.random()*8:6+Math.random()*14;
    fP.vx[i]=Math.cos(a)*sp;fP.vz[i]=Math.sin(a)*sp;
    fP.age[i]=0;fP.life[i]=core?1.6+Math.random():2.2+Math.random()*1.4;
    fP.s0[i]=core?1.2+Math.random():2.0+Math.random()*1.4;
    fP.seed[i]=Math.random();
  }
}
function updateFountain(dt){
  if(fntOn){
    fntAcc+=(T<24?260:150)*dt;
    while(fntAcc>1){fntAcc--;spawnFount(1);}
  }
  for(let i=0;i<FN;i++){
    const L=fP.life[i];
    if(L<=0){fnt.col[i*4+3]=0;continue;}
    fP.age[i]+=dt;
    if(fP.age[i]>=L){fP.life[i]=0;fnt.col[i*4+3]=0;continue;}
    fP.vy[i]-=34*dt;
    fP.x[i]+=fP.vx[i]*dt;fP.y[i]+=fP.vy[i]*dt;fP.z[i]+=fP.vz[i]*dt;
    if(fP.y<groundH(fP.x[i],fP.z[i])+0.6){
      fP.life[i]=0;fnt.col[i*4+3]=0;
      for(let s=0;s<2;s++)spawnEmber(fP.x[i],fP.y[i]+0.5,fP.z[i],
        (Math.random()-0.5)*9,2+Math.random()*5,(Math.random()-0.5)*9,0.6+Math.random()*0.6,1.1,22,1.0,0.5,0.12,0.9);
      if(Math.random()<0.2)spawnPuff(fP.x[i],fP.y[i]+1,fP.z[i],0,2.5,0,1.6,2,4,0.35,0.28,0.22,0.5);
      continue;
    }
    const t2=fP.age[i]/L,k=i*4;
    fnt.pos[i*3]=fP.x[i];fnt.pos[i*3+1]=fP.y[i];fnt.pos[i*3+2]=fP.z[i];
    fnt.col[k]=lerp(1.5,0.9,t2);fnt.col[k+1]=lerp(1.3,0.22,t2);fnt.col[k+2]=lerp(1.05,0.05,t2);
    fnt.col[k+3]=(1-t2)*0.9;
    fnt.siz[i]=fP.s0[i]*(1+t2*1.2);
  }
  // glowing trail sparks off fast blobs
  if(fntOn){
    trailAcc+=40*dt;
    while(trailAcc>1){trailAcc--;
      const i=(Math.random()*FN)|0;
      if(fP.life[i]>0)spawnEmber(fP.x[i],fP.y[i],fP.z[i],(Math.random()-0.5)*3,-2,(Math.random()-0.5)*3,0.7,0.9,6,1.2,0.55,0.15,0.8);}
  }
  fnt.g.attributes.position.needsUpdate=true;
  fnt.g.attributes.aColor.needsUpdate=true;
  fnt.g.attributes.aSize.needsUpdate=true;
}

/* ================= terrain mesh ================= */
const tg=new THREE.PlaneGeometry(680,680,256,256);
tg.rotateX(-Math.PI/2);
{
  const tp=tg.attributes.position,n=tp.count;
  const colors=new Float32Array(n*3);
  const strata=[[0.44,0.30,0.21],[0.57,0.30,0.18],[0.34,0.30,0.27],[0.25,0.22,0.21]];
  for(let i=0;i<n;i++){
    const x=tp.getX(i),z=tp.getZ(i),h=groundH(x,z);
    tp.setY(i,h);
    const sl=Math.abs(groundH(x+2,z)-h)+Math.abs(groundH(x,z+2)-h);
    const r=Math.hypot(x,z);
    const n1=fbm(x*0.08,z*0.08),n2=fbm(x*0.3+3,z*0.3+3);
    let cr,cg,cb;
    if(h<0.35){cr=0.10;cg=0.22;cb=0.20;}
    else if(h<2.6){const v=0.9+n2*0.3;cr=0.135*v;cg=0.13*v;cb=0.125*v;}
    else if(h<15){
      const m=n1;
      cr=lerp(0.16,0.36,m);cg=lerp(0.52,0.78,m);cb=lerp(0.13,0.28,m);
      if(n2>0.72){cr=0.55;cg=0.62;cb=0.35;}
    }else if(h<24){
      const m=smoothstep(15,24,h);
      cr=lerp(0.20,0.30,m);cg=lerp(0.55,0.44,m);cb=lerp(0.16,0.20,m);
    }else{cr=0.30;cg=0.34;cb=0.20;}
    if(r<152&&h>18){
      const band=Math.floor(h*0.16+n1*2.2)%4;
      const s=strata[band];
      const mixAmt=smoothstep(18,26,h);
      cr=lerp(cr,s[0],mixAmt);cg=lerp(cg,s[1],mixAmt);cb=lerp(cb,s[2],mixAmt);
      if(sl>1.4){cr=lerp(cr,0.36,mixAmt);cg=lerp(cg,0.33,mixAmt);cb=lerp(cb,0.31,mixAmt);}
      if(h>70){const d=smoothstep(70,92,h);cr=lerp(cr,0.20,d);cg=lerp(cg,0.18,d);cb=lerp(cb,0.17,d);}
    }
    if(r<28){
      cr=0.16;cg=0.145;cb=0.135;
      const rd=smoothstep(92,82,h)*0.5;cr+=rd;cg+=rd*0.3;
    }
    for(let ci=0;ci<3;ci++){
      const lat=chanLateral(CHANNELS[ci],x,z);
      if(lat<11){
        const dk=1-smoothstep(5.5,11,lat);
        cr=lerp(cr,0.10,dk);cg=lerp(cg,0.09,dk);cb=lerp(cb,0.085,dk);
      }
    }
    const vj=0.94+n2*0.12;
    colors[i*3]=cr*vj;colors[i*3+1]=cg*vj;colors[i*3+2]=cb*vj;
  }
  tg.setAttribute('color',new THREE.BufferAttribute(colors,3));
  tg.computeVertexNormals();
}

function mergeGeoms(list){
  const pos=[],norm=[];
  for(const g0 of list){
    const g=g0.index?g0.toNonIndexed():g0;
    pos.push(...g.attributes.position.array);
    norm.push(...g.attributes.normal.array);
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  out.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(norm),3));
  return out;
}
function makeCloud(scale,y,rad,skipNear){
  for(let tries=0;tries<20;tries++){
    const a=Math.random()*6.283,d=rad*(0.7+Math.random()*0.6);
    const x=Math.cos(a)*d,z=Math.sin(a)*d;
    if(skipNear&&Math.hypot(x-skipNear.x,z-skipNear.z)<skipNear.r)continue;
    const blobs=[];
    const nb=5+(Math.random()*4|0);
    for(let b=0;b<nb;b++){
      const g=new THREE.IcosahedronGeometry(1,1);
      const m=new THREE.Matrix4().makeScale(scale*(0.7+Math.random()*0.8),scale*0.42*(0.7+Math.random()*0.5),scale*(0.7+Math.random()*0.8))
        .setPosition((Math.random()-0.5)*scale*2.1,(Math.random()-0.5)*scale*0.4,(Math.random()-0.5)*scale*1.1);
      blobs.push(g.applyMatrix4(m));
    }
    const mat=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x2e353a,flatShading:true});
    const mesh=new THREE.Mesh(mergeGeoms(blobs),mat);
    mesh.position.set(x,y,z);mesh.rotation.y=Math.random()*6;

  }

}

function buildFlowPath(c){
  const pts=[];
  for(let r=c.r0;r<=c.end;r+=3){
    const a=chanAngle(c,r),x=Math.cos(a)*r,z=Math.sin(a)*r;
    pts.push(new THREE.Vector3(x,groundH(x,z)+0.45,z));
  }
  return pts;
}
function buildRibbon(pts,w0,w1){
  const n=pts.length,pos=new Float32Array(n*2*3),uv=new Float32Array(n*2*2),idx=[];
  const up=new THREE.Vector3(0,1,0),tan=new THREE.Vector3(),side=new THREE.Vector3();
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
    tan.subVectors(b,a).normalize();
    side.crossVectors(up,tan).normalize();
    const w=lerp(w0,w1,i/(n-1));
    const lx=pts[i].x+side.x*w/2,lz=pts[i].z+side.z*w/2;
    const rx=pts[i].x-side.x*w/2,rz=pts[i].z-side.z*w/2;
    pos[i*6]=lx;pos[i*6+1]=groundH(lx,lz)+0.30;pos[i*6+2]=lz;
    pos[i*6+3]=rx;pos[i*6+4]=groundH(rx,rz)+0.30;pos[i*6+5]=rz;
    uv[i*4]=i/(n-1);uv[i*4+1]=0;uv[i*4+2]=i/(n-1);uv[i*4+3]=1;
    if(i<n-1){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  const mat=new THREE.ShaderMaterial({
    uniforms:{uProg:{value:0},uTime:{value:0},uOn:{value:0}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
    varying vec2 vUv;uniform float uProg;uniform float uTime;uniform float uOn;
    float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
      return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
    void main(){
      float edge=abs(vUv.y-0.5)*2.0;
      float behind=uProg-vUv.x;
      if(behind<0.0||uOn<0.01){
        gl_FragColor=vec4(vec3(0.085,0.075,0.07)*(0.8+0.4*vn(vec2(vUv.x*90.,vUv.y*8.))),1.0);return;}
      float crust=smoothstep(0.03,0.55,behind);
      float crack=smoothstep(0.5,0.85,vn(vec2(vUv.x*80.,vUv.y*7.)));
      float pulse=0.8+0.5*vn(vec2(vUv.x*40.-uTime*1.4,vUv.y*3.+uTime*0.3));
      float center=pow(1.0-edge,1.5);
      float molten=((1.0-crust)*1.1+crack*(1.0-smoothstep(0.05,0.8,behind))*1.2+smoothstep(0.05,0.0,behind)*2.0)*(1.2-edge*0.7);
      vec3 hot=vec3(1.35,0.5,0.10),core=vec3(1.7,1.35,0.8),crustC=vec3(0.13,0.09,0.08);
      vec3 col=mix(crustC,mix(hot,core,center),clamp(molten,0.0,1.0)*pulse);
      col+=vec3(1.2,0.7,0.3)*smoothstep(0.08,0.0,behind)*1.2;
      gl_FragColor=vec4(col,1.0);}`,
    side:THREE.DoubleSide,fog:false});
  const mesh=new THREE.Mesh(g,mat);mesh.renderOrder=1;scene.add(mesh);
  return {mesh,mat,total:(n-1)*3};
}
function makeFlow(ch,w0,w1){
  const pts=buildFlowPath(ch);
  const rib=buildRibbon(pts,w0,w1);
  let seaIdx=-1;
  for(let i=0;i<pts.length;i++)if(groundH(pts[i].x,pts[i].z)<0.35){seaIdx=i;break;}
  const front=new THREE.Mesh(new THREE.SphereGeometry(2.1,10,8),new THREE.MeshBasicMaterial({color:0xffaa33}));
  const fg=glowSprite(0xff9933,8);front.add(fg);
  front.visible=false;scene.add(front);
  return {ch,pts,rib,front,dist:0,active:false,seaIdx,seaDone:false,rate:12};
}

const clock=new THREE.Clock();
let treeCheck=0,wispAcc=0,fumAcc=0,fireSmokeAcc=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  T+=dt;
  runEvents();

  /* phase parameters */
  const tremor=smoothstep(7,9,T)*(1-smoothstep(18,20,T));
  const glowPhase=smoothstep(11.5,16.5,T)*0.35+smoothstep(16.5,18,T)*0.65;
  glowStrength=(T<18?glowPhase:1)*(T>18?1:1);
  const erupt=smoothstep(17.6,18.4,T);
  colTop=T<18?90:Math.min(340,90+(T-18)*11);
  anvilY=clamp(colTop-45,130,300);

  /* sky/sea/clouds */
  seaMat.uniforms.uTime.value=T;
  seaMat.uniforms.uLavaSeaI.value=seaGlowI;
  seaMat.uniforms.uLavaSea.value.copy(seaPoint);
  lowClouds.rotation.y+=0.0022*dt;
  highClouds.rotation.y-=0.0012*dt;
  const ct=smoothstep(200,300,colTop);
  for(const m of nearCloudMats)m.emissive.setRGB(0.18+0.55*ct,0.20+0.2*ct,0.22);

  /* beacons */
  for(const b of beacons){
    b.t+=dt;
    const rate=erupt>0?12:(tremor>0?5:1.4);
    const on=beaconsOn&&(Math.sin(b.t*rate*3.14)>0);
    b.mesh.material.emissiveIntensity=on?1.6:(erupt>0?1.2:0);
    b.sprite.material.opacity=on?0.8:(erupt>0?0.5:0);
  }

  /* crater glow + light */
  const fl=0.8+0.35*flick(T*3);
  lakeMat.uniforms.uTime.value=T;
  lakeMat.uniforms.uHeat.value=(0.06+glowPhase*0.8)+(erupt>0?(0.25+0.25*flick(T*5)):0)+tremor*0.1;
  lavaLight.intensity=glowStrength*6*fl;
  craterGlow.material.opacity=0.10+glowStrength*0.55*fl;
  craterGlow.scale.setScalar(10+glowStrength*(24+8*flick(T*4)));
  coreGlow.material.opacity=erupt*0.75*fl;
  jetGlow.material.opacity=erupt*0.5*fl;
  jetGlow.scale.set(11+3*flick(T*6),28+6*flick(T*3),1);

  /* pre-eruption steam wisp + fumaroles */
  if(T<18.5){
    wispAcc+=2.6*dt;
    while(wispAcc>1){wispAcc--;
      spawnPuff((Math.random()-0.5)*3,89,(Math.random()-0.5)*3,
        (Math.random()-0.5)*0.6,1.6+Math.random(),(Math.random()-0.5)*0.6,4+Math.random()*2,1.2,1.6,0.96,0.96,0.97,0.4);}
  }
  fumAcc+=dt;
  if(fumAcc>0.8){fumAcc=0;
    const fa=[0.7,3.4,5.2];
    for(const a of fa){
      const x=Math.cos(a)*40,z=Math.sin(a)*40;
      spawnPuff(x,groundH(x,z)+0.5,z,(Math.random()-0.5)*0.8,2+Math.random(),(Math.random()-0.5)*0.8,
        3.5,1.0,1.4,0.95,0.95,0.95,0.35);
    }
  }
  /* tremor rim dust */
  if(tremor>0&&Math.random()<0.5){
    const a=Math.random()*6.283,x=Math.cos(a)*22,z=Math.sin(a)*22;
    spawnPuff(x,groundH(x,z)+0.5,z,(Math.random()-0.5)*2,1+Math.random()*2,(Math.random()-0.5)*2,
      1.6+Math.random(),1.4,2.6,0.58,0.5,0.42,0.5*tremor);
  }

  /* particles */
  updatePuffs(dt);
  updateEmbers(dt,T);
  updateAsh(dt,T);
  updateFountain(dt);

  /* ambient cinders drifting from column */
  if(erupt>0&&Math.random()<0.03){
    const a=Math.random()*6.283,rr=6+Math.random()*26;
    spawnEmber(Math.cos(a)*rr,90+Math.random()*(colTop-90),Math.sin(a)*rr,
      windX*0.6,-1-Math.random()*2,windZ*0.6,4+Math.random()*2,0.8,-1.2,1.1,0.45,0.1,0.85);
  }

  if(bombRain){
    bombTimer-=dt;

  }
  for(const b of bombs){
    if(!b.active)continue;
    if(b.rest>0){
      b.rest-=dt;
      if(b.rest<=0){b.active=false;b.m.visible=false;}
      continue;
    }
    b.age+=dt;b.vy-=26*dt;
    b.m.position.x+=b.vx*dt;b.m.position.y+=b.vy*dt;b.m.position.z+=b.vz*dt;

    const cool=clamp(b.age/6,0,1);
    b.m.material.color.setRGB(lerp(1.0,0.2,cool),lerp(0.55,0.14,cool),lerp(0.2,0.11,cool));

        (Math.random()-0.5)*5,2+Math.random()*3,(Math.random()-0.5)*5,2.2,2,4,0.42,0.36,0.3,0.55);
      for(let s=0;s<12;s++)spawnEmber(b.m.position.x,gh+0.8,b.m.position.z,
        (Math.random()-0.5)*16,3+Math.random()*9,(Math.random()-0.5)*16,0.7+Math.random()*0.5,1.0,24,1.2,0.55,0.14,0.95);
      for(const t of treeData){

  }

    const sp=f.rate*smoothstep(0,2.5,T-(f===flowA?24:28));
    const maxD=f.seaIdx>0?f.seaIdx*3+6:f.rib.total;
    if(f.dist<maxD)f.dist+=sp*dt;

        (Math.random()-0.5)*7,8+Math.random()*9,(Math.random()-0.5)*7,3.5+Math.random()*2,4+Math.random()*3,6,0.97,0.98,1.0,0.85);
      for(let s=0;s<24;s++)spawnEmber(seaPoint.x,1,seaPoint.z,(Math.random()-0.5)*16,9+Math.random()*13,(Math.random()-0.5)*16,

      windX,5+Math.random()*4,windZ,4+Math.random()*2,3+Math.random()*2,5.5,0.97,0.98,1.0,0.7);

    }else if(t.state===2){
      const f2=0.8+0.5*Math.sin(T*11+i);
      canopies.setColorAt(i,tmpC.setRGB(0.9*f2,0.3,0.05));
      if(t.burnT>4.5){t.state=3;
        canopies.setColorAt(i,tmpC.setRGB(0.06,0.05,0.05));
        trunks.setColorAt(i,tmpC.setRGB(0.09,0.08,0.07));
        if(t.flame>=0){flames[t.flame].tree=-1;flames[t.flame].s.visible=false;t.flame=-1;}
      }
      if(t.flame>=0&&fireSmokeN<6&&Math.random()<0.2){
        fireSmokeN++;
        spawnPuff(t.x,t.y+6*t.s,t.z,windX*0.5,2.5,windZ*0.5,2.8,1.5,3,0.2,0.18,0.17,0.5);
      }
      t.lean=Math.min(0.55,t.lean+0.004);
    }
    if(t.state<3){
      tmpE.set(0,t.rot,0);tmpQ.setFromEuler(tmpE);
      tmpQ.setFromAxisAngle(new THREE.Vector3(t.ax,0,t.az).normalize(),t.lean*0.9);
      tmpM.compose(tmpV.set(t.x,t.y,t.z),tmpQ,new THREE.Vector3(t.s,t.s,t.s));
      trunks.setMatrixAt(i,tmpM);canopies.setMatrixAt(i,tmpM);
    }
  }
  canopies.instanceColor.needsUpdate=true;trunks.instanceColor.needsUpdate=true;
  trunks.instanceMatrix.needsUpdate=true;canopies.instanceMatrix.needsUpdate=true;
  for(const fl of flames){
    if(fl.tree<0)continue;
    const t=treeData[fl.tree];
    fl.s.visible=true;
    fl.s.position.set(t.x+(Math.random()-0.5)*0.8,t.y+5.4*t.s,t.z+(Math.random()-0.5)*0.8);
    const fs=(2.2+Math.sin(T*13+fl.tree)*0.7)*t.s;
    fl.s.scale.set(fs,fs*1.5,1);
    fl.s.material.opacity=0.8;
  }

  /* lightning */
  if(lightningOn){
    boltTimer-=dt;
    if(boltTimer<=0){boltTimer=2.5+Math.random()*3.5;strike();if(Math.random()<0.3)boltTimer=0.4;}
  }
  if(boltLine){
    boltLife-=dt;
    if(boltLife<=0){scene.remove(boltLine);boltLine.geometry.dispose();boltLine=null;}
  }
  flashI=Math.max(0,flashI-dt*280);
  flashLight.intensity=flashI;

  /* shimmer */
  for(const sh of shimmers){
    if(!sh.active&&erupt>0&&Math.random()<0.02){sh.active=true;sh.y=88;sh.x=(Math.random()-0.5)*16;sh.z=(Math.random()-0.5)*16;}
    if(sh.active){
      sh.y+=7*dt;sh.x+=windX*dt*0.6;
      sh.s.position.set(sh.x,sh.y,sh.z);
      sh.s.scale.set(7,13,1);
      sh.s.material.opacity=0.10*Math.sin(Math.PI*clamp((sh.y-88)/50,0,1));
      if(sh.y>145)sh.active=false,sh.s.material.opacity=0;
    }
  }

  /* birds */
  for(let i=0;i<birds.length;i++){
    const b=birds[i];
    if(b.flee){
      b.fleeT+=dt;
      b.a+=b.sp*dt*3;
      const rr=b.rad+b.fleeT*38;
      b.g.position.set(Math.cos(b.a)*rr,b.h+b.fleeT*10,Math.sin(b.a)*rr);
      b.g.scale.setScalar(Math.max(0.01,1-b.fleeT/7));
      if(b.fleeT>7)b.g.visible=false;
    }else{
      b.a+=b.sp*dt;
      b.g.position.set(Math.cos(b.a)*b.rad,b.h+Math.sin(T*0.7+i)*3,Math.sin(b.a)*b.rad);
      const nx=Math.cos(b.a+0.1*Math.sign(b.sp))*b.rad,nz=Math.sin(b.a+0.1*Math.sign(b.sp))*b.rad;
      b.g.lookAt(nx,b.g.position.y,nz);
    }
    const w=Math.sin(T*10+i*2)*0.65;
    b.l.rotation.y=w;b.r.rotation.y=-w;
  }

  /* boat bob */
  boat.position.y=0.35+0.3*Math.sin(T*1.1)+0.12*Math.sin(T*2.3);
  boat.rotation.z=0.06*Math.sin(T*0.9);

  /* camera */
  let t2=T,ck=camKeys;
  if(t2>=80){
    const base=ck[ck.length-1][1];
    const a=(t2-80)*0.01;
    camera.position.set(base.x*Math.cos(a)-base.z*Math.sin(a),base.y,base.x*Math.sin(a)+base.z*Math.cos(a));
  }else{
    let s=0;while(s<ck.length-2&&t2>ck[s+1][0])s++;
    const u=clamp((t2-ck[s][0])/(ck[s+1][0]-ck[s][0]),0,1);
    const e=u*u*(3-2*u);
    camera.position.lerpVectors(ck[s][1],ck[s+1][1],e);
  }
  const lookY=66+clamp((T-14)*2.1,0,70);
  lookCur.lerp(tmpV.set(mx*7,lookY-my*4,0),1-Math.pow(0.02,dt));
  trauma=Math.max(0,trauma-dt*0.55);
  const sh2=trauma*trauma;
  const hnd=0.16+tremor*1.1;
  camera.position.x+=(vnoise(T*1.7,3.3)-0.5)*hnd+(vnoise(T*11,7.7)-0.5)*2.4*sh2;
  camera.position.y+=(vnoise(T*1.9,9.1)-0.5)*hnd*0.6+(vnoise(T*13,4.2)-0.5)*2.4*sh2;
  camera.lookAt(lookCur);
  camera.rotateZ((vnoise(T*0.8,1.2)-0.5)*0.02+(vnoise(T*9,6.6)-0.5)*0.06*sh2);

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  W=innerWidth;H=innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});
</script>
</body>

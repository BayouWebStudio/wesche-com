<style>

  button.primary { color: #ffd9a0; border-color: rgba(255, 190, 120, 0.45); }

    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(4, 5, 12, 0.42) 100%);

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- error collector (first check of every run) ---------------- */
window.__errors = [];
const _origCE = console.error.bind(console);
console.error = (...a) => {
  try { window.__errors.push(a.map(x => (x && x.stack) ? String(x.stack) : String(x)).join(' ')); } catch (e) {}
  _origCE(...a);
};
window.addEventListener('error', e => window.__errors.push(String(e.error && e.error.stack || e.message)));
window.addEventListener('unhandledrejection', e => window.__errors.push('rejection: ' + String(e.reason && e.reason.stack || e.reason)));
function fail(e) {
  const el = document.getElementById('fail');
  el.style.display = 'block';
  el.textContent = 'BOOT ERROR\n\n' + ((e && e.stack) ? e.stack : String(e));
}

/* ---------------- shared uniforms (shared whole, never wrapped) ---------------- */
const U = {
  time:       { value: 0 },
  amp:        { value: 0.6 },
  storm:      { value: 0 },
  rain:       { value: 0 },
  beam:       { value: 0 },
  beamAz:     { value: new THREE.Vector2(0, 1) },
  wind:       { value: new THREE.Vector2(0.86, 0.4) },
  proj:       { value: 800 },
  fogColor:   { value: new THREE.Color(0x2b2c49) },
  fogDensity: { value: 0.0034 },
  sunDir:     { value: new THREE.Vector3(0.22, 0.05, -0.975).normalize() },
  sunCol:     { value: new THREE.Color(0xffb168) },
  beamCol:    { value: new THREE.Color(0xffe9b4) },
  cloudOp:    { value: 0.34 },
  cloudCol:   { value: new THREE.Color(0x8d7f8a) },
  flash:      { value: 0 },
};

const GLSL_NOISE = /* glsl */`
float hash21(vec2 p){ p = fract(p * vec2(123.34, 345.45)); p += dot(p, p + 34.345); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i); float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)); float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
`;

const GLSL_OUT = /* glsl */`
#include <tonemapping_fragment>
#include <colorspace_fragment>
`;

/* ============================================================ boot */
let renderer, scene, camera, controls, clock;
let simT = 0, frozen = false;
const holds = {};
const dyn = { storm: 0, rain: 0, beam: 0, amp: 0.6, windF: 1, lantern: 1 };
let phase = 'calm';
let userMoved = false, quality = 2, downgraded = false;
let emaMs = 16, fps = 0, _fc = 0, _ft = 0, _slowFrames = 0;
const partsMap = {};

/* palettes */
const C = h => new THREE.Color(h);
const PAL = {
  dusk: {
    skyTop: C(0x1b2450), skyMid: C(0x46356b), skyHor: C(0xff8a4d),
    sunCol: C(0xffb168), seaDeep: C(0x101c38), seaShal: C(0x27406b), seaHor: C(0xa86a4e),
    fog: C(0x2b2c49), fogD: 0.0034, hemiSky: C(0x33406b), hemiGnd: C(0x1c1a24), hemiI: 0.55,
    dirCol: C(0xffa566), dirI: 1.1, lantern: 1.0, beam: 0.0,
    cloudOp: 0.34, cloudCol: C(0x8d7f8a), amp: 0.6, wind: 1.0,
  },
  storm: {
    skyTop: C(0x070a12), skyMid: C(0x131a26), skyHor: C(0x2e3a46),
    sunCol: C(0x3a4656), seaDeep: C(0x0a101c), seaShal: C(0x182636), seaHor: C(0x39434e),
    fog: C(0x0d1219), fogD: 0.0072, hemiSky: C(0x232c3a), hemiGnd: C(0x0d0f14), hemiI: 0.42,
    dirCol: C(0x6f7f96), dirI: 0.35, lantern: 1.3, beam: 1.0,
    cloudOp: 0.97, cloudCol: C(0x1a2028), amp: 1.7, wind: 2.6,
  },
};

/* JS mirror of the ocean wave field (must match the vertex shader) */
const WAVES = [
  { dx: 1.0,   dz: 0.28,  wl: 62, q: 0.075, sp: 5.0 },
  { dx: -0.68, dz: 0.72,  wl: 33, q: 0.09,  sp: 4.1 },
  { dx: 0.32,  dz: -0.94, wl: 18, q: 0.105, sp: 3.3 },
  { dx: -0.44, dz: -0.88, wl: 10, q: 0.12,  sp: 2.6 },
].map(w => {
  const l = Math.hypot(w.dx, w.dz);
  return { nx: w.dx / l, nz: w.dz / l, k: 2 * Math.PI / w.wl, q: w.q, sp: w.sp };
});
function waveH(x, z, t, amp) {
  let h = 0;
  for (const w of WAVES) {
    const q = w.q * amp;
    h += (q / w.k) * Math.sin(w.k * (w.nx * x + w.nz * z - w.sp * t));
  }
  return h;
}
const damp = (cur, target, tau, dt) => cur + (target - cur) * (1 - Math.exp(-dt / tau));
const mixN = (a, b, s) => a + (b - a) * s;
const mixC = (out, a, b, s) => out.copy(a).lerp(b, s);

/* deterministic-ish pseudo random */
const prand = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ============================================================ ocean */
function buildSea() {
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const seg = isCoarse ? 150 : 240;
  const geo = new THREE.PlaneGeometry(700, 700, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.time, uAmp: U.amp, uStorm: U.storm,
      uDeep: { value: new THREE.Color() }, uShal: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
      uSunDir: U.sunDir, uSunCol: U.sunCol,
      uFogColor: U.fogColor, uFogDensity: U.fogDensity,
      uBeam: U.beam, uBeamCol: U.beamCol, uBeamAz: U.beamAz,
      uLH: { value: new THREE.Vector2(0, 0) },
      uFlash: U.flash,
    },
    vertexShader: /* glsl */`
      uniform float uTime;
      uniform float uAmp;
      varying vec3 vWorld;
      varying vec3 vNrm;
      varying float vH;
      varying float vFog;
      void gw(vec2 dir, float wl, float q, float spd, vec2 p, float t,
              inout vec3 disp, inout vec3 tx, inout vec3 tz){
        float k = 6.28318 / wl;
        float f = k * (dot(dir, p) - spd * t);
        float a = q / k;
        float s = sin(f);
        float c = cos(f);
        disp.x += dir.x * a * c;
        disp.z += dir.y * a * c;
        disp.y += a * s;
        tx += vec3(-dir.x * dir.x * q * s, dir.x * q * c, -dir.x * dir.y * q * s);
        tz += vec3(-dir.x * dir.y * q * s, dir.y * q * c, -dir.y * dir.y * q * s);
      }
      void main(){
        vec3 base = position;
        vec3 disp = vec3(0.0);
        vec3 tx = vec3(1.0, 0.0, 0.0);
        vec3 tz = vec3(0.0, 0.0, 1.0);
        vec2 p = base.xz;
        float amp = uAmp;
        gw(normalize(vec2(1.0, 0.28)),   62.0, 0.075 * amp, 5.0, p, uTime, disp, tx, tz);
        gw(normalize(vec2(-0.68, 0.72)), 33.0, 0.09  * amp, 4.1, p, uTime, disp, tx, tz);
        gw(normalize(vec2(0.32, -0.94)), 18.0, 0.105 * amp, 3.3, p, uTime, disp, tx, tz);
        gw(normalize(vec2(-0.44, -0.88)),10.0, 0.12  * amp, 2.6, p, uTime, disp, tx, tz);
        vec3 wp = vec3(base.x, 0.0, base.z) + disp;
        vH = disp.y;
        vNrm = normalize(cross(tz, tx));
        vWorld = wp;
        vec4 mv = viewMatrix * vec4(wp, 1.0);
        vFog = -mv.z;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uDeep;
      uniform vec3 uShal;
      uniform vec3 uHor;
      uniform vec3 uSunDir;
      uniform vec3 uSunCol;
      uniform vec3 uFogColor;
      uniform float uFogDensity;
      uniform float uStorm;
      uniform float uAmp;
      uniform float uTime;
      uniform float uBeam;
      uniform vec3 uBeamCol;
      uniform vec2 uBeamAz;
      uniform vec2 uLH;
      uniform float uFlash;
      varying vec3 vWorld;
      varying vec3 vNrm;
      varying float vH;
      varying float vFog;
      ${GLSL_NOISE}
      void main(){
        vec3 N = normalize(vNrm);
        vec3 V = normalize(cameraPosition - vWorld);
        float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
        vec3 col = mix(uDeep, uShal, clamp(vH * 0.5 + 0.35, 0.0, 1.0) * 0.6);
        col = mix(col, uHor, fres * (0.65 - 0.25 * uStorm));
        vec3 H = normalize(V + normalize(uSunDir));
        float spec = pow(max(dot(N, H), 0.0), 220.0);
        float glit = pow(max(dot(N, H), 0.0), 24.0);
        col += uSunCol * (spec * 1.2 + glit * 0.18) * (1.0 - uStorm);
        float hN = clamp(vH / max(uAmp, 0.001), -2.0, 2.0);
        float crest = smoothstep(0.55, 1.0, hN);
        float n = vnoise(vWorld.xz * 0.9 + uTime * 0.35);
        float foam = crest * smoothstep(0.35, 0.75, n * 0.6 + crest * 0.5);
        foam += smoothstep(0.85, 1.1, hN) * 0.5;
        col = mix(col, vec3(0.82, 0.87, 0.9), clamp(foam * (0.25 + 0.75 * uStorm), 0.0, 0.85));
        float dShore = length(vWorld.xz);
        float surf = smoothstep(8.5, 5.5, dShore) * (0.35 + 0.35 * vnoise(vWorld.xz * 1.3 - uTime * 0.5));
        col = mix(col, vec3(0.78, 0.84, 0.87), surf * 0.4 * (0.4 + 0.6 * uStorm));
        vec2 toF = vWorld.xz - uLH;
        float along = dot(toF, uBeamAz);
        float lat = length(toF - uBeamAz * along);
        float pool = exp(-lat * lat / max(0.8 + 0.06 * along, 0.2));
        pool *= smoothstep(1.5, 7.0, along) * exp(-along * 0.011);
        pool *= 0.7 + 0.6 * vnoise(vWorld.xz * 3.0 + uTime * 0.8);
        col += uBeamCol * pool * uBeam * 0.7;
        col += vec3(0.55, 0.6, 0.75) * uFlash * 0.12;
        float fogF = 1.0 - exp(-uFogDensity * uFogDensity * vFog * vFog);
        col = mix(col, uFogColor, clamp(fogF, 0.0, 1.0));
        gl_FragColor = vec4(col, 1.0);
        ${GLSL_OUT}
      }
    `,
  });
  const sea = new THREE.Mesh(geo, mat);
  sea.frustumCulled = false;
  sea.name = 'sea';
  return sea;
}

/* ============================================================ sky */
function buildSky() {
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      uTop: { value: new THREE.Color() }, uMid: { value: new THREE.Color() }, uHor: { value: new THREE.Color() },
      uSunCol: U.sunCol, uSunDir: U.sunDir, uStorm: U.storm, uFlash: U.flash,
    },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uTop;
      uniform vec3 uMid;
      uniform vec3 uHor;
      uniform vec3 uSunCol;
      uniform vec3 uSunDir;
      uniform float uStorm;
      uniform float uFlash;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        vec3 sd = normalize(uSunDir);
        float h = d.y;
        vec3 col = mix(uHor, uMid, smoothstep(0.0, 0.2, h));
        col = mix(col, uTop, smoothstep(0.1, 0.55, h));
        col = mix(col, uHor * 0.5, smoothstep(0.0, -0.12, h));
        float sunAmt = pow(max(dot(d, sd), 0.0), 4.0);
        float band = exp(-abs(h) * 5.5);
        col += uSunCol * (sunAmt * 0.55 + band * pow(sunAmt, 2.0) * 0.9) * (1.0 - uStorm);
        col = mix(col, uHor * 0.8, uStorm * 0.25 * band);
        col += vec3(0.55, 0.6, 0.75) * uFlash * (0.3 + 0.7 * band);
        gl_FragColor = vec4(col, 1.0);
        ${GLSL_OUT}
      }
    `,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(430, 32, 20), mat);
  sky.frustumCulled = false;
  sky.name = 'sky';
  return sky;
}

/* ============================================================ clouds */
function buildClouds() {
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const nClusters = isCoarse ? 13 : 24, per = isCoarse ? 18 : 22;
  const n = nClusters * per;
  const pos = new Float32Array(n * 3), size = new Float32Array(n), seed = new Float32Array(n);
  let i = 0;
  for (let c = 0; c < nClusters; c++) {
    const az = (c / nClusters) * Math.PI * 2 + (prand(c * 3.1) - 0.5) * 0.5;
    const rad = 55 + prand(c * 7.7) * 55;
    const cy = 26 + prand(c * 5.3) * 16;
    const cr = 12 + prand(c * 9.9) * 14;
    for (let p = 0; p < per; p++, i++) {
      const a = prand(c * 31.7 + p * 1.3) * Math.PI * 2;
      const rr = Math.pow(prand(c * 17.3 + p * 2.9), 0.7) * cr;
      pos[i * 3]     = Math.cos(az) * rad + Math.cos(a) * rr;
      pos[i * 3 + 1] = cy + (prand(c * 13.1 + p * 4.7) - 0.5) * cr * 0.5;
      pos[i * 3 + 2] = Math.sin(az) * rad + Math.sin(a) * rr;
      size[i] = 9 + prand(c * 23.7 + p * 5.1) * 12;
      seed[i] = prand(c * 41.3 + p * 6.7);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uProj: U.proj, uCloudOp: U.cloudOp, uCloudCol: U.cloudCol, uStorm: U.storm },
    vertexShader: /* glsl */`
      attribute float aSize;
      attribute float aSeed;
      uniform float uProj;
      varying float vSeed;
      void main(){
        vSeed = aSeed;
        vec4 mv = viewMatrix * modelMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(aSize * uProj / max(-mv.z, 0.5), 6.0, 300.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uCloudOp;
      uniform vec3 uCloudCol;
      uniform float uStorm;
      varying float vSeed;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c) * 2.0 + (vSeed - 0.5) * 0.35;
        float a = smoothstep(1.0, 0.15, d);
        a *= 0.55 + 0.45 * vSeed;
        vec3 col = uCloudCol;
        col += vec3(1.0, 0.45, 0.18) * 0.4 * (1.0 - uStorm) * smoothstep(0.6, 0.0, d);
        gl_FragColor = vec4(col, a * uCloudOp);
        ${GLSL_OUT}
      }
    `,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.name = 'clouds';
  return pts;
}

/* ============================================================ rain */
function buildRain() {
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const drops = isCoarse ? 1100 : 2200;
  const pos = new Float32Array(drops * 2 * 3);
  const base = new Float32Array(drops * 2 * 3);
  const side = new Float32Array(drops * 2);
  const speed = new Float32Array(drops * 2);
  const len = new Float32Array(drops * 2);
  for (let i = 0; i < drops; i++) {
    const bx = (prand(i * 3.7) - 0.5) * 130;
    const by = prand(i * 5.1) * 46;
    const bz = (prand(i * 7.3) - 0.5) * 130;
    const sp = 34 + prand(i * 9.7) * 12;
    const ln = 1.2 + prand(i * 11.3) * 0.9;
    for (let v = 0; v < 2; v++) {
      const k = i * 2 + v;
      base[k * 3] = bx; base[k * 3 + 1] = by; base[k * 3 + 2] = bz;
      side[k] = v;
      speed[k] = sp;
      len[k] = ln;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aBase', new THREE.BufferAttribute(base, 3));
  geo.setAttribute('aSide', new THREE.BufferAttribute(side, 1));
  geo.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
  geo.setAttribute('aLen', new THREE.BufferAttribute(len, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: U.time, uWind: U.wind, uRain: U.rain },
    vertexShader: /* glsl */`
      attribute vec3 aBase;
      attribute float aSide;
      attribute float aSpeed;
      attribute float aLen;
      uniform float uTime;
      uniform vec2 uWind;
      varying float vA;
      void main(){
        float boxH = 46.0;
        float y = mod(aBase.y - uTime * aSpeed, boxH);
        vec3 p = vec3(aBase.x, y, aBase.z);
        p.x += aSide * uWind.x * aLen * 0.55;
        p.z += aSide * uWind.y * aLen * 0.55;
        p.y += aSide * aLen;
        vA = 0.5 + 0.5 * fract(sin(dot(aBase.xz, vec2(12.9898, 78.233))) * 43758.5453);
        gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uRain;
      varying float vA;
      void main(){
        float a = uRain * 0.3 * (0.4 + 0.6 * vA);
        gl_FragColor = vec4(vec3(0.62, 0.68, 0.78), a);
        ${GLSL_OUT}
      }
    `,
  });
  const lines = new THREE.LineSegments(geo, mat);
  lines.frustumCulled = false;
  lines.name = 'rain';
  lines.userData.drops = drops;
  return lines;
}

/* ============================================================ island + lighthouse + dock */
function makeRock(scale, seed) {
  const geo = new THREE.IcosahedronGeometry(1, 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const l = Math.hypot(x, y, z) || 1;
    const n = prand(x * 12.9898 + y * 78.233 + z * 37.719 + seed * 13.7);
    const k = 1 + (n - 0.5) * 0.5;
    p.setXYZ(i, x / l * k, y / l * k, z / l * k);
  }
  const mesh = new THREE.Mesh(geo, rockMat);

function buildBeam() {
  const g = new THREE.Group();
  g.position.set(0.3, 12.95, -0.4);
  const L = 95, R = 6.5;
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    uniforms: { uBeam: U.beam, uBeamCol: U.beamCol, uLen: { value: L } },
    vertexShader: /* glsl */`
      uniform float uLen;
      varying float vT;
      varying vec3 vNv;
      varying vec3 vVv;
      void main(){
        vT = clamp(position.z / uLen, 0.0, 1.0);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vNv = normalize(normalMatrix * normal);
        vVv = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uBeam;
      uniform vec3 uBeamCol;
      varying float vT;
      varying vec3 vNv;
      varying vec3 vVv;
      void main(){
        float facing = abs(dot(normalize(vNv), normalize(vVv)));
        float axial = pow(1.0 - vT, 1.5);
        float a = axial * pow(facing, 1.3) * uBeam * 0.26;
        a += pow(1.0 - vT, 6.0) * uBeam * 0.16;
        gl_FragColor = vec4(uBeamCol * (0.7 + 0.6 * axial), a);
        ${GLSL_OUT}
      }
    `,
  });
  const coneGeo = new THREE.CylinderGeometry(0.06, R, L, 20, 1, true);
  coneGeo.translate(0, -L / 2, 0);
  coneGeo.rotateX(-Math.PI / 2); // apex at origin, extends +Z
  const c1 = new THREE.Mesh(coneGeo, mat);
  const c2 = new THREE.Mesh(coneGeo, mat);
  c2.rotation.y = Math.PI;
  g.add(c1, c2);
  g.rotation.x = 0.06; // rake slightly down onto the sea
  g.name = 'beam';
  return g;
}

let boltGroup, boltMain, boltBranch, boltT = 99, nextStrike = 8;
function boltPath(x0, z0, x1, z1, yTop, yBot, jag) {
  const pts = [];
  const n = 26;
  let x = x0, z = z0;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const tx = x0 + (x1 - x0) * t, tz = z0 + (z1 - z0) * t;
    x += (tx - x) * 0.55 + (prand(i * 3.7 + boltSeed) - 0.5) * jag;
    z += (tz - z) * 0.55 + (prand(i * 7.1 + boltSeed) - 0.5) * jag;
    pts.push(new THREE.Vector3(x, yTop + (yBot - yTop) * t, z));
  }
  return pts;
}
let boltSeed = 1;
function strikeNow(force) {
  if (!force && dyn.storm < 0.6) return;
  boltSeed = (boltSeed * 1.7 + 13) % 1000;
  const az = prand(boltSeed) * Math.PI * 2;
  const r = 38 + prand(boltSeed * 2.1) * 22;
  const x0 = Math.cos(az) * r, z0 = Math.sin(az) * r;
  const x1 = x0 * (0.35 + prand(boltSeed * 3.3) * 0.4), z1 = z0 * (0.35 + prand(boltSeed * 4.7) * 0.4);
  const main = boltPath(x0, z0, x1, z1, 42, 0.5, 3.2);
  boltMain.geometry.dispose();
  boltMain.geometry = new THREE.BufferGeometry().setFromPoints(main);
  const bi = 6 + Math.floor(prand(boltSeed * 5.9) * 10);
  const bp = main[bi];
  const branch = boltPath(bp.x, bp.z, bp.x + (prand(boltSeed * 7.7) - 0.5) * 18, bp.z + (prand(boltSeed * 8.3) - 0.5) * 18, bp.y, bp.y * 0.3, 2.0);
  boltBranch.geometry.dispose();
  boltBranch.geometry = new THREE.BufferGeometry().setFromPoints(branch);
  boltT = 0;
  boltGroup.visible = true;
  nextStrike = 6 + prand(boltSeed * 9.1) * 7;
}

function boot() {

  const el = renderer.domElement;

/* pixel stats probe (measurement when vision is unavailable) */
function pixelStats(x, y, w, h) {
  const src = renderer.domElement;
  const cols = 48, rows = 27;
  const cv = document.createElement('canvas');
  cv.width = cols; cv.rows = rows; cv.height = rows;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const sx = x / innerWidth * src.width, sy = y / innerHeight * src.height;
  const sw = w / innerWidth * src.width, sh = h / innerHeight * src.height;
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, cols, rows);
  const data = ctx.getImageData(0, 0, cols, rows).data;
  const ramp = ' .:-=+*#%@';
  let sum = 0, bright = 0;
  const grid = [];
  for (let r = 0; r < rows; r++) {
    let line = '';
    for (let c = 0; c < cols; c++) {
      const i = (r * cols + c) * 4;
      const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
      sum += lum;
      if (lum > 140) bright++;
      line += ramp[Math.min(ramp.length - 1, Math.floor(lum / 255 * ramp.length))];
    }
    grid.push(line);
  }
  return { mean: +(sum / (cols * rows) / 255).toFixed(4), brightFrac: +(bright / (cols * rows)).toFixed(4), grid };
}

  shipG.visible = true;
}
function press(which) {
  if (which === 'reset') {
    setPhase('calm');
    if (ship.state !== 'hidden') { ship.state = 'departing'; ship.wp = -1; }
    return;
  }
  if (phase === 'calm') setPhase('storm');
  else if (phase === 'storm') { spawnShip(); setPhase('docking'); }
}
function approachAngle(cur, target, k, dt) {
  let d = target - cur;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return cur + d * (1 - Math.exp(-k * dt));
}
function updateShip(dt) {
  if (ship.state === 'hidden') return;
  const amp = dyn.amp;
  if (ship.state === 'inbound' || ship.state === 'departing') {
    const target = ship.state === 'departing' ? ship.exit : ship.wps[ship.wp];
    const dx = target.x - ship.pos.x, dz = target.y - ship.pos.z;
    const dist = Math.hypot(dx, dz);
    if (ship.state === 'inbound' && dist < 4.5) {
      if (ship.wp < ship.wps.length - 1) ship.wp++;
      else ship.state = 'docking';
    }
    const desired = Math.atan2(dx, dz);
    ship.heading = approachAngle(ship.heading, desired, 1.4, dt);
    const cruise = ship.state === 'departing' ? 11 : (dist < 16 ? 3.4 : dist < 45 ? 6.5 : 10);
    ship.speed = damp(ship.speed, cruise, 1.8, dt);
    ship.pos.x += Math.sin(ship.heading) * ship.speed * dt;
    ship.pos.z += Math.cos(ship.heading) * ship.speed * dt;
    if (ship.state === 'departing' && dist > 155) { ship.state = 'hidden'; shipG.visible = false; }
  } else if (ship.state === 'docking') {
    const k = 1 - Math.exp(-dt / 1.7);
    ship.pos.x += (ship.dockPos.x - ship.pos.x) * k;
    ship.pos.z += (ship.dockPos.y - ship.pos.z) * k;
    ship.heading = approachAngle(ship.heading, ship.dockHeading, 1.6, dt);
    ship.speed = damp(ship.speed, 0, 1.2, dt);
    const d = Math.hypot(ship.dockPos.x - ship.pos.x, ship.dockPos.y - ship.pos.z);
    if (d < 0.3 && Math.abs(ship.heading - ship.dockHeading) < 0.06) setPhase('docked');
  }
  // bob on the wave field
  const t = simT;
  const h = waveH(ship.pos.x, ship.pos.z, t, amp);
  const hF = waveH(ship.pos.x + Math.sin(ship.heading) * 2.6, ship.pos.z + Math.cos(ship.heading) * 2.6, t, amp);
  const hB = waveH(ship.pos.x - Math.sin(ship.heading) * 2.6, ship.pos.z - Math.cos(ship.heading) * 2.6, t, amp);
  const hL = waveH(ship.pos.x + Math.cos(ship.heading) * 1.2, ship.pos.z - Math.sin(ship.heading) * 1.2, t, amp);
  const hR = waveH(ship.pos.x - Math.cos(ship.heading) * 1.2, ship.pos.z + Math.sin(ship.heading) * 1.2, t, amp);
  const soften = ship.state === 'docked' ? 0.35 : 1;
  shipG.position.set(ship.pos.x, h * 0.9 + 0.62, ship.pos.z);
  shipG.rotation.y = ship.heading;
  const pitch = damp(shipG.userData.pitch || 0, Math.atan2(hF - hB, 5.2) * soften, 0.5, dt);
  const roll = damp(shipG.userData.roll || 0, Math.atan2(hR - hL, 2.4) * soften * 0.7, 0.5, dt);
  shipG.userData.pitch = pitch;
  shipG.userData.roll = roll;
  shipG.rotation.x = pitch;
  shipG.rotation.z = roll;
  shipG.userData.wake.material.opacity = Math.min(Math.abs(ship.speed) / 10, 1) * 0.26;
}

/* ============================================================ per-frame */
let lastStatusKey = '';
function tick() {
  const dtRaw = clock.getDelta();
  const dt = Math.min(dtRaw, 0.1);
  if (!frozen) simT += dt;

  // fps / frame ms
  _fc++; _ft += dtRaw;
  if (_ft >= 0.5) { fps = Math.round(_fc / _ft); _fc = 0; _ft = 0; }
  emaMs = emaMs * 0.95 + dtRaw * 1000 * 0.05;
  if (emaMs > 34 && ++_slowFrames > 240) {
    if (quality > 1) {
      quality = 1;
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.2));
      cloudsPts.geometry.setDrawRange(0, Math.floor(cloudsPts.geometry.attributes.aSeed.count / 2));
    }
    _slowFrames = 120;
  } else if (emaMs < 22 && quality === 1 && !downgraded) {
    downgraded = true; // one-way back up, evaluated once the scene has settled
    quality = 2;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    cloudsPts.geometry.setDrawRange(0, Infinity);
  }

  // storm scalar
  const stormT = phase === 'calm' ? 0 : 1;
  dyn.storm = damp(dyn.storm, stormT, 2.2, dt);
  dyn.rain = damp(dyn.rain, stormT, 3.2, dt);
  const s = dyn.storm;
  const P = PAL.dusk, Q = PAL.storm;
  dyn.amp = damp(dyn.amp, mixN(P.amp, Q.amp, s), 3.0, dt);
  dyn.windF = mixN(P.wind, Q.wind, s);
  dyn.beam = damp(dyn.beam, mixN(P.beam, Q.beam, s), 2.6, dt);
  dyn.lantern = mixN(P.lantern, Q.lantern, s);

  // palettes -> uniforms
  U.time.value = simT;
  U.storm.value = s;
  U.rain.value = dyn.rain;
  U.amp.value = dyn.amp;
  U.fogDensity.value = mixN(P.fogD, Q.fogD, s);
  mixC(U.fogColor.value, P.fog, Q.fog, s);
  mixC(U.sunCol.value, P.sunCol, Q.sunCol, s);
  mixC(U.cloudCol.value, P.cloudCol, Q.cloudCol, s);
  U.cloudOp.value = mixN(P.cloudOp, Q.cloudOp, s);
  mixC(skyMesh.material.uniforms.uTop.value, P.skyTop, Q.skyTop, s);
  mixC(skyMesh.material.uniforms.uMid.value, P.skyMid, Q.skyMid, s);
  mixC(skyMesh.material.uniforms.uHor.value, P.skyHor, Q.skyHor, s);
  mixC(seaMesh.material.uniforms.uDeep.value, P.seaDeep, Q.seaDeep, s);
  mixC(seaMesh.material.uniforms.uShal.value, P.seaShal, Q.seaShal, s);
  mixC(seaMesh.material.uniforms.uHor.value, P.seaHor, Q.seaHor, s);
  scene.fog.color.copy(U.fogColor.value);
  scene.fog.density = U.fogDensity.value;
  mixC(hemi.color, P.hemiSky, Q.hemiSky, s);
  mixC(hemi.groundColor, P.hemiGnd, Q.hemiGnd, s);
  hemi.intensity = mixN(P.hemiI, Q.hemiI, s);
  mixC(dirL.color, P.dirCol, Q.dirCol, s);
  dirL.intensity = mixN(P.dirI, Q.dirI, s);

  // lightning
  let flash = 0;
  if (boltT < 1.4) {
    boltT += dt;
    const pulses = [[0, 1.0], [0.14, 0.8], [0.3, 0.5]];
    for (const [t0, a] of pulses) if (boltT >= t0) flash = Math.max(flash, a * Math.exp(-(boltT - t0) * 9));
    boltGroup.children[0].material.opacity = flash * (0.6 + 0.4 * Math.random());
    boltGroup.children[1].material.opacity = flash * 0.4;
    if (boltT >= 1.4) boltGroup.visible = false;
  } else if (phase !== 'calm' && dyn.storm > 0.6) {
    nextStrike -= dt;
    if (nextStrike <= 0) strikeNow(false);
  }
  if (holds.flash && simT < holds.flash.until) flash = holds.flash.v;
  else if (holds.flash && simT >= holds.flash.until) delete holds.flash;
  U.flash.value = flash;

  // beam sweep / guidance
  let targetAz = null;
  if ((ship.state === 'inbound' || ship.state === 'docking') && shipG.visible) {
    targetAz = Math.atan2(ship.pos.x - 0.3, ship.pos.z - (-0.4));
  }
  if (targetAz !== null) {
    let d = targetAz - beamRy;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    const maxStep = 1.35 * dt;
    beamRy += Math.abs(d) < maxStep ? d : Math.sign(d) * maxStep;
  } else {
    beamRy += dt * 0.55;
  }
  beamG.rotation.y = beamRy;
  U.beamAz.value.set(Math.sin(beamRy), Math.cos(beamRy));
  let beamV = dyn.beam;
  if (holds.beam && simT < holds.beam.until) beamV = holds.beam.v;
  else if (holds.beam && simT >= holds.beam.until) delete holds.beam;
  U.beam.value = beamV;
  spot.intensity = beamV * 85;
  rainLines.material.uniforms.uRain.value = dyn.rain;
  rainLines.visible = dyn.rain > 0.02;
  U.wind.value.set(0.86 * dyn.windF, 0.4 * dyn.windF);

  // lantern flicker
  const flick = 1 + 0.06 * Math.sin(simT * 7.3) + 0.04 * Math.sin(simT * 13.1);
  lanternLight.intensity = 26 * dyn.lantern * flick;
  lanternGlassMat.emissiveIntensity = 2.1 * dyn.lantern * flick;
  glowSprite.material.opacity = 0.75 * dyn.lantern * flick;
  cloudsPts.rotation.y += dt * 0.006;

  updateShip(dt);
  controls.update();
  renderer.render(scene, camera);
}

function onResize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  const portrait = w / h < 0.75;
  if (portrait) camera.fov = 62; else camera.fov = 55;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  U.proj.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
  if (!userMoved) {
    const r = portrait ? 36 : 27;
    camera.position.setFromSpherical(new THREE.Spherical(r, 1.19, 0.35));
    controls.target.set(0, 4.2, 0);
    controls.update();
  }
}

function params() {
  return {
    phase,
    storm: +dyn.storm.toFixed(3),
    rain: +dyn.rain.toFixed(3),
    amp: +dyn.amp.toFixed(3),
    beam: +dyn.beam.toFixed(3),
    beamAz: +beamRy.toFixed(3),
    flash: +U.flash.value.toFixed(3),
    ship: { state: ship.state, x: +ship.pos.x.toFixed(1), z: +ship.pos.z.toFixed(1), speed: +ship.speed.toFixed(2) },
    fps, frameMs: +emaMs.toFixed(1), quality, downgraded,
  };
}
function parts(name, vis) {
  if (name === undefined) return Object.keys(partsMap);
  const o = partsMap[name];
  if (!o) return null;
  o.visible = !!vis;
  return { name, visible: o.visible };
}

try {
  boot();
} catch (e) {
  fail(e);
  console.error(e);
}
</script>

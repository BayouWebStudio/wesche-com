<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koi Pond — a living water garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #10160f; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #f7f1df; font-family: 'Karla', sans-serif; }
  header { position: absolute; top: 30px; left: 38px; }
  h1 {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 520;
    font-size: clamp(30px, 4.2vw, 46px); line-height: 1; letter-spacing: 0.01em;
    text-shadow: 0 2px 30px rgba(10, 20, 12, 0.55);
  }
  .sub { margin-top: 10px; font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; opacity: 0.72; }
  .sub .mark { font-family: 'Fraunces', serif; font-size: 14px; letter-spacing: 0; vertical-align: -1px; margin-right: 8px; opacity: 0.9; }
  #panel {
    position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: auto; text-align: center;
  }
  #feedBtn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 27px 13px 21px; border-radius: 999px;
    border: 1px solid rgba(250, 244, 228, 0.42);
    background: rgba(17, 27, 21, 0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    color: #f6efdc; font-family: 'Karla', sans-serif; font-weight: 600; font-size: 14px;
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    transition: background .25s, color .25s, transform .2s, border-color .25s;
  }
  #feedBtn:hover { background: #f6efdc; color: #1c2a20; border-color: transparent; transform: translateY(-2px); }
  #feedBtn:active { transform: translateY(0) scale(0.96); }
  #status {
    font-family: 'Fraunces', serif; font-style: italic; font-size: 14.5px;
    opacity: 0.85; min-height: 20px; transition: opacity .45s;
    text-shadow: 0 1px 14px rgba(10, 20, 12, 0.65);
  }
  #fed { font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase; opacity: 0.55; }
  #hint {
    position: absolute; right: 34px; bottom: 30px; font-size: 10.5px;
    letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.5; transition: opacity 1.6s;
  }
  #hint.fade { opacity: 0; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 60%, rgba(12, 18, 12, 0.30));
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="ui">
  <header>
    <h1>Koi Pond</h1>
    <p class="sub"><span class="mark">鯉</span>a living water garden</p>
  </header>
  <div id="panel">
    <button id="feedBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.5 12c2.6-3.4 5.8-5.1 9-5.1 3.5 0 6.3 2 8 5.1-1.7 3.1-4.5 5.1-8 5.1-3.2 0-6.4-1.7-9-5.1z"/>
        <path d="M4.5 12 1.5 8.8M4.5 12l-3 3.2"/>
        <circle cx="17.2" cy="10.8" r="0.5" fill="currentColor" stroke="none"/>
      </svg>
      Feed the koi
    </button>
    <div id="status">the koi drift lazily beneath the surface</div>
    <div id="fed">9 koi in residence</div>
  </div>
  <div id="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; F to feed</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xecdfc0, 34, 110);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
camera.position.set(8, 10, 21);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.4, 0.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 34;
controls.maxPolarAngle = 1.45;
controls.minPolarAngle = 0.12;
controls.enablePan = false;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.45;

/* ---------------- lights & sky ---------------- */
const sunDir = new THREE.Vector3(13, 17, 7).normalize();
const sunLight = new THREE.DirectionalLight(0xffe2b8, 2.6);
sunLight.position.set(13, 17, 7);
scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0xd8ece4, 0x4c5a38, 0.85));

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { uSun: { value: sunDir } },
  vertexShader: `
    varying vec3 vDir;
    void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec3 vDir;
    uniform vec3 uSun;
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, -0.1, 1.0);
      vec3 col = mix(vec3(0.925, 0.875, 0.755), vec3(0.47, 0.66, 0.72), pow(smoothstep(0.0, 0.75, h), 0.75));
      float s = max(dot(d, uSun), 0.0);
      col += vec3(1.0, 0.78, 0.5) * (pow(s, 4.0) * 0.22 + pow(s, 64.0) * 0.55);
      col += vec3(0.9, 0.6, 0.35) * smoothstep(0.35, 0.0, abs(h - 0.06)) * 0.10;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), skyMat));

/* ---------------- helpers ---------------- */
let seed = 8;
function rand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function rr(a, b){ return a + rand() * (b - a); }
function sstep(a, b, x){ const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function wrapPi(a){ while(a > Math.PI) a -= Math.PI * 2; while(a < -Math.PI) a += Math.PI * 2; return a; }
function lerpAngle(a, b, t){ return a + wrapPi(b - a) * t; }
function hash2(x, y){ const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return hash2(xi, yi) * (1 - u) * (1 - v) + hash2(xi + 1, yi) * u * (1 - v)
       + hash2(xi, yi + 1) * (1 - u) * v + hash2(xi + 1, yi + 1) * u * v;
}
function fbm(x, y){ return vnoise(x, y) * 0.6 + vnoise(x * 2.3, y * 2.3) * 0.25 + vnoise(x * 5.1, y * 5.1) * 0.15; }

// JS mirror of the water vertex waves — floating things bob in sync with the shader
function waveY(x, z, t){
  return Math.sin(x * 0.9 + t * 0.9) * 0.018
       + Math.sin(z * 1.15 - t * 1.1 + x * 0.4) * 0.014
       + Math.sin((x + z) * 0.55 + t * 0.6) * 0.02
       + Math.sin(x * 2.3 - t * 1.7) * Math.sin(z * 1.9 + t * 1.3) * 0.008;
}
function surfaceY(x, z, t){ return 0.05 + waveY(x, z, t); }
function floorYAt(x, z){
  const r = Math.min(Math.hypot(x, z), 9.7);
  return -0.28 - 1.5 * Math.pow(Math.max(0, 1 - r / 9.7), 1.4);
}

const sharedTime = { value: 0 };
let elapsed = 0;

/* ---------------- ripples (shared by water shader) ---------------- */
const rippleData = Array.from({ length: 12 }, () => new THREE.Vector4(0, 0, -1000, 0));
let rippleCursor = 0;
function addRipple(x, z, amp = 1){
  rippleData[rippleCursor % 12].set(x, z, elapsed, amp);
  rippleCursor++;
}

/* ---------------- polar disc geometry (clean tessellation for the pond) ---------------- */
function discGeometry(radius, rings, segs){
  const pos = [0, 0, 0], idx = [];
  for(let r = 1; r <= rings; r++){
    const rad = radius * r / rings;
    for(let s = 0; s < segs; s++){
      const a = s / segs * Math.PI * 2;
      pos.push(Math.cos(a) * rad, 0, Math.sin(a) * rad);
    }
  }
  for(let s = 0; s < segs; s++) idx.push(0, 1 + s, 1 + (s + 1) % segs);
  for(let r = 1; r < rings; r++){
    const a0 = 1 + (r - 1) * segs, b0 = 1 + r * segs;
    for(let s = 0; s < segs; s++){
      const s1 = (s + 1) % segs;
      idx.push(a0 + s, b0 + s, a0 + s1, a0 + s1, b0 + s, b0 + s1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ---------------- caustics injection (shared by floor, koi, pads) ---------------- */
const cauChunk = `
float causLayer(vec2 p, float t){
  vec2 q = p; float v = 0.0;
  for(int i = 0; i < 3; i++){
    q += vec2(sin(q.y * 1.9 + t * 1.35 + float(i) * 2.1), cos(q.x * 1.6 - t * 1.05 + float(i) * 0.7)) * 0.42;
    v += 1.0 / (0.30 + abs(sin(q.x + t * 0.8) * cos(q.y - t * 0.6)));
  }
  return v / 3.0;
}
float causticFn(vec2 p, float t){
  float a = causLayer(p, t);
  float b = causLayer(p.yx + 37.13, -t * 0.85 + 3.0);
  return pow(clamp(min(a, b) * 0.30 - 0.16, 0.0, 1.0), 2.0) * 2.2;
}`;
function addCaustics(mat, strength, colorHex){
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uCauT = sharedTime;
    shader.uniforms.uCauS = { value: strength };
    shader.uniforms.uCauC = { value: new THREE.Color(colorHex) };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vCauW;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvCauW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vCauW;\nuniform float uCauT;\nuniform float uCauS;\nuniform vec3 uCauC;\n' + cauChunk)
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += uCauC * causticFn(vCauW.xz * 0.55, uCauT * 0.75) * uCauS;');
  };
}

/* ---------------- water surface ---------------- */
const FALL_A = new THREE.Vector3(-6.25, 2.95, -4.05);
const FALL_B = new THREE.Vector3(-5.95, 1.9, -3.75);
const FALL_C = new THREE.Vector3(-5.35, 0.02, -3.15);
function fallPoint(t, out){
  const a = 1 - t;
  return out.set(
    a * a * FALL_A.x + 2 * a * t * FALL_B.x + t * t * FALL_C.x,
    a * a * FALL_A.y + 2 * a * t * FALL_B.y + t * t * FALL_C.y,
    a * a * FALL_A.z + 2 * a * t * FALL_B.z + t * t * FALL_C.z
  );
}

const waterUniforms = {
  uTime: sharedTime,
  uSun: { value: sunDir },
  uCam: { value: new THREE.Vector3() },
  uRipples: { value: rippleData },
  uSplash: { value: new THREE.Vector2(FALL_C.x, FALL_C.z) },
  uFoam: { value: 0.8 }
};
const waveGLSL = `
float waveH(vec2 p, float t){
  float h = 0.0;
  h += sin(p.x * 0.9 + t * 0.9) * 0.018;
  h += sin(p.y * 1.15 - t * 1.1 + p.x * 0.4) * 0.014;
  h += sin((p.x + p.y) * 0.55 + t * 0.6) * 0.02;
  h += sin(p.x * 2.3 - t * 1.7) * sin(p.y * 1.9 + t * 1.3) * 0.008;
  return h;
}
float rippleH(vec2 p, float t){
  float h = 0.0;
  for(int i = 0; i < 12; i++){
    vec4 r = uRipples[i];
    float age = t - r.z;
    if(age < 0.0 || age > 7.0) continue;
    float d = length(p - r.xy);
    float front = age * 1.5 + 0.1;
    float band = exp(-pow((d - front) * 2.4, 2.0));
    h += sin(d * 16.0 - age * 14.0) * band * exp(-age * 1.05) * 0.05 * r.w;
  }
  return h;
}`;
const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  transparent: true, side: THREE.DoubleSide,
  vertexShader: `
    uniform float uTime;
    uniform vec4 uRipples[12];
    varying vec2 vP;
    varying vec3 vW;
    ${waveGLSL}
    void main(){
      vec3 pos = position;
      pos.y += waveH(pos.xz, uTime) + rippleH(pos.xz, uTime);
      vP = pos.xz;
      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uSun;
    uniform vec3 uCam;
    uniform vec4 uRipples[12];
    uniform vec2 uSplash;
    uniform float uFoam;
    varying vec2 vP;
    varying vec3 vW;
    ${waveGLSL}
    float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash21(i), hash21(i + vec2(1, 0)), u.x),
                 mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), u.x), u.y);
    }
    void main(){
      float e = 0.14;
      float hC = waveH(vP, uTime) + rippleH(vP, uTime);
      float hX = waveH(vP + vec2(e, 0.0), uTime) + rippleH(vP + vec2(e, 0.0), uTime);
      float hZ = waveH(vP + vec2(0.0, e), uTime) + rippleH(vP + vec2(0.0, e), uTime);
      vec3 n = normalize(vec3((hC - hX) / e * 1.4, 1.0, (hC - hZ) / e * 1.4));
      n.xz += (vnoise(vP * 5.0 + uTime * 0.4) - 0.5) * 0.22;
      n.xz += (vnoise(vP * 11.0 - uTime * 0.55) - 0.5) * 0.14;
      n = normalize(n);

      vec3 V = normalize(uCam - vW);
      float fres = pow(1.0 - max(dot(n, V), 0.0), 3.0);

      float rad = length(vP);
      float deep = smoothstep(8.8, 2.5, rad);
      vec3 col = mix(vec3(0.135, 0.42, 0.36), vec3(0.024, 0.16, 0.16), deep);

      vec3 R = reflect(-V, n);
      vec3 sky = mix(vec3(0.93, 0.86, 0.70), vec3(0.55, 0.74, 0.74), pow(clamp(R.y, 0.0, 1.0), 0.6));
      float sa = max(dot(normalize(vec3(R.x, 0.0, R.z)), normalize(vec3(uSun.x, 0.0, uSun.z))), 0.0);
      sky += vec3(1.0, 0.72, 0.42) * pow(sa, 5.0) * 0.5;
      col = mix(col, sky, 0.25 + fres * 0.55);

      vec3 H = normalize(normalize(uSun) + V);
      float ndh = max(dot(n, H), 0.0);
      float spec = pow(ndh, 260.0) * 3.0;
      float glint = step(0.965, vnoise(vP * 26.0 + uTime * 1.5)) * pow(ndh, 40.0);
      col += vec3(1.0, 0.88, 0.66) * (spec + glint * 0.9);

      float fd = length(vP - uSplash);
      float fn = vnoise(vP * 4.5 - uTime * 0.9) * 0.6 + vnoise(vP * 10.0 + uTime * 1.4) * 0.4;
      float foam = uFoam * smoothstep(2.4, 0.3, fd) * smoothstep(0.42, 0.8, fn);
      col = mix(col, vec3(0.92, 0.97, 0.94), clamp(foam, 0.0, 1.0));

      col *= 1.0 - smoothstep(7.9, 9.25, rad) * 0.45;
      float alpha = 0.78 + clamp(foam, 0.0, 1.0) * 0.2;
      gl_FragColor = vec4(col, alpha);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const water = new THREE.Mesh(discGeometry(9.3, 40, 96), waterMat);
water.position.y = 0.05;
water.renderOrder = 2;
scene.add(water);

/* ---------------- pond floor with caustics ---------------- */
{
  const geo = discGeometry(9.7, 26, 72);
  const p = geo.attributes.position;
  const cols = new Float32Array(p.count * 3);
  const c = new THREE.Color(), t1 = new THREE.Color(), t2 = new THREE.Color();
  for(let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i);
    const r = Math.hypot(x, z), t = 1 - Math.min(r / 9.7, 1);
    p.setY(i, -0.28 - 1.5 * Math.pow(t, 1.4));
    c.setHex(0xc4b28c).lerp(t1.setHex(0x8f7f60), fbm(x * 0.8 + 3, z * 0.8));
    c.lerp(t2.setHex(0x54604c), sstep(0.35, 0.9, t) * 0.55);
    const al = fbm(x * 1.7, z * 1.7 + 4);
    if(al > 0.62) c.lerp(t1.setHex(0x5d7247), sstep(0.62, 0.8, al) * 0.4);
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  addCaustics(mat, 0.9, 0xaef0d4);
  scene.add(new THREE.Mesh(geo, mat));
}
// scattered pebbles on the floor
{
  const geo = new THREE.SphereGeometry(0.075, 6, 5);
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const inst = new THREE.InstancedMesh(geo, mat, 110);
  inst.frustumCulled = false;
  const d = new THREE.Object3D();
  const palette = [0x9a8f7a, 0x7d7466, 0xa89a80, 0x6e6a5e, 0x8a8272];
  const c = new THREE.Color();
  for(let i = 0; i < 110; i++){
    const a = rand() * Math.PI * 2, r = Math.sqrt(rand()) * 9.2;
    d.position.set(Math.cos(a) * r, floorYAt(Math.cos(a) * r, Math.sin(a) * r) + 0.02, Math.sin(a) * r);
    d.scale.set(rr(0.5, 1.5), rr(0.3, 0.8), rr(0.5, 1.5));
    d.rotation.y = rr(0, 6.28);
    d.updateMatrix();
    inst.setMatrixAt(i, d.matrix);
    inst.setColorAt(i, c.setHex(palette[(rand() * palette.length) | 0]).multiplyScalar(rr(0.85, 1.05)));
  }
  inst.instanceMatrix.needsUpdate = true;
  inst.instanceColor.needsUpdate = true;
  scene.add(inst);
}
// dark wet rim where water meets the stones
{
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(9.26, 0.11, 6, 90).rotateX(Math.PI / 2),
    new THREE.MeshLambertMaterial({ color: 0x14231c })
  );
  rim.position.y = 0.02;
  scene.add(rim);
}

/* ---------------- soft blob shadows (generated texture) ---------------- */
function makeSoftTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(cv);
}
const softTex = makeSoftTexture();
const blobGeo = new THREE.CircleGeometry(1, 24).rotateX(-Math.PI / 2);
function blob(radius, opacity){
  const m = new THREE.Mesh(blobGeo, new THREE.MeshBasicMaterial({
    map: softTex, transparent: true, opacity, depthWrite: false, color: 0x000000
  }));
  m.scale.set(radius, 1, radius * 0.85);
  m.renderOrder = 1;
  scene.add(m);
  return m;
}

/* ---------------- rocks ---------------- */
function rockGeometry(sd, detail){
  const g = new THREE.IcosahedronGeometry(1, detail);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for(let i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    const n = fbm(v.x * 1.5 + sd, v.y * 1.5 + v.z * 1.3 + sd * 2.0);
    v.multiplyScalar(0.75 + n * 0.55);
    v.y *= 0.82;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
function placeRock(x, y, z, s, sd, mossy){
  const mat = new THREE.MeshLambertMaterial({
    color: new THREE.Color(0x8a8578).lerp(new THREE.Color(mossy ? 0x6a7a58 : 0x6e6a5e), rand() * 0.6),
    flatShading: true
  });
  const m = new THREE.Mesh(rockGeometry(sd, s > 1.2 ? 2 : 1), mat);
  m.position.set(x, y, z);

  s.pos[i * 3] = x; s.pos[i * 3 + 1] = y; s.pos[i * 3 + 2] = z;

function stepParticles(s, dt, gravity, waterKill){
  for(let i = 0; i < s.count; i++){
    if(s.life[i] <= 0){ s.alpha[i] = 0; continue; }
    s.life[i] -= dt;
    s.vel[i * 3 + 1] -= gravity * dt;
    s.pos[i * 3] += s.vel[i * 3] * dt;
    s.pos[i * 3 + 1] += s.vel[i * 3 + 1] * dt;
    s.pos[i * 3 + 2] += s.vel[i * 3 + 2] * dt;
    if(waterKill && s.pos[i * 3 + 1] < surfaceY(s.pos[i * 3], s.pos[i * 3 + 2], elapsed) + 0.02){
      s.life[i] = 0; s.alpha[i] = 0;
      if(Math.random() < 0.06) addRipple(s.pos[i * 3], s.pos[i * 3 + 2], 0.3);
      continue;
    }
    s.alpha[i] = Math.min(1, s.life[i] / s.maxLife[i] * 1.6);
  }
  s.geo.attributes.position.needsUpdate = true;
  s.geo.attributes.aAlpha.needsUpdate = true;
  s.geo.attributes.aSize.needsUpdate = true;
}

  dropAcc += dt * 70;
  while(dropAcc >= 1){
    dropAcc -= 1;
    fallPoint(0.02, TMP1); fallPoint(0.06, TMP2);
    TAN.subVectors(TMP2, TMP1).normalize();
    SIDE.crossVectors(TAN, UP).normalize();
    const off = (Math.random() * 2 - 1) * 0.4;
    spawnParticle(drops,
      FALL_A.x + SIDE.x * off, FALL_A.y + rr(-0.02, 0.05), FALL_A.z + SIDE.z * off,
      TAN.x * rr(1.8, 2.6) + rr(-0.15, 0.15), TAN.y * rr(1.8, 2.6), TAN.z * rr(1.8, 2.6) + rr(-0.15, 0.15),
      rr(1.2, 1.7), rr(0.35, 0.6));
  }
  wfTimer -= dt;
  if(wfTimer <= 0){
    wfTimer = rr(0.3, 0.75);
    const a = Math.random() * Math.PI * 2, r = Math.random() * 0.9;
    addRipple(FALL_C.x + Math.cos(a) * r, FALL_C.z + Math.sin(a) * r, rr(0.5, 1.1));
    burst(FALL_C.x, FALL_C.z, 3 + (Math.random() * 4 | 0), 1);
    waterUniforms.uFoam.value = rr(0.7, 1.0);
  }
  for(const m of mists){
    const c = (elapsed * 0.13 + m.off) % 1;
    m.sp.position.set(FALL_C.x + m.ox * (1 + c), 0.15 + c * 1.7 + m.oy, FALL_C.z + m.oz * (1 + c));
    const s = 1.0 + c * 2.4;
    m.sp.scale.set(s, s * 0.7, 1);
    m.sp.material.opacity = Math.sin(Math.PI * c) * 0.16;
  }
}

function buildKoiGeometry(){
  const segs = 30, rad = 14;
  const P = [], I = [];
  const prof = [[0, 0.02], [0.05, 0.14], [0.14, 0.24], [0.3, 0.295], [0.48, 0.27], [0.66, 0.185], [0.82, 0.1], [0.93, 0.05], [1, 0.03]];
  const radiusAt = (s) => {
    for(let i = 1; i < prof.length; i++){
      if(s <= prof[i][0]){
        const [s0, r0] = prof[i - 1], [s1, r1] = prof[i];
        let t = (s - s0) / (s1 - s0); t = t * t * (3 - 2 * t);
        return r0 + (r1 - r0) * t;
      }
    }
    return prof[prof.length - 1][1];
  };
  for(let i = 0; i <= segs; i++){
    const s = i / segs, x = 1.0 - 2.0 * s, r = radiusAt(s);
    for(let j = 0; j < rad; j++){
      const a = j / rad * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      P.push(x, ca * r * 1.18 * (ca < 0 ? 0.86 : 1), sa * r * 0.92);
    }
  }
  for(let i = 0; i < segs; i++) for(let j = 0; j < rad; j++){
    const a = i * rad + j, b = i * rad + (j + 1) % rad, c = (i + 1) * rad + j, d = (i + 1) * rad + (j + 1) % rad;
    I.push(a, c, b, b, c, d);
  }
  const nose = P.length / 3; P.push(1.07, 0.02, 0);
  for(let j = 0; j < rad; j++) I.push(nose, j, (j + 1) % rad);
  const tail = P.length / 3; P.push(-1.06, 0, 0);
  const lb = segs * rad;
  for(let j = 0; j < rad; j++) I.push(tail, lb + j, lb + (j + 1) % rad);

  let geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  geo.setIndex(I);
  geo.computeVertexNormals();

  const tf = new THREE.Shape();  // flowing forked tail
  tf.moveTo(-0.9, 0.03);
  tf.quadraticCurveTo(-1.2, 0.2, -1.42, 0.52);
  tf.quadraticCurveTo(-1.56, 0.66, -1.68, 0.56);
  tf.quadraticCurveTo(-1.52, 0.3, -1.44, 0.06);
  tf.quadraticCurveTo(-1.52, -0.2, -1.7, -0.52);
  tf.quadraticCurveTo(-1.55, -0.64, -1.4, -0.48);
  tf.quadraticCurveTo(-1.14, -0.18, -0.9, -0.03);
  tf.closePath();
  const dor = new THREE.Shape(); // dorsal fin
  dor.moveTo(0.52, 0.22);
  dor.quadraticCurveTo(0.2, 0.5, -0.2, 0.48);
  dor.quadraticCurveTo(-0.4, 0.4, -0.52, 0.18);
  dor.closePath();
  const tfg = new THREE.ShapeGeometry(tf, 5); tfg.deleteAttribute('uv');
  const dg = new THREE.ShapeGeometry(dor, 5); dg.deleteAttribute('uv');
  return mergeGeometries([geo, tfg, dg]);
}

function makeKoiMaterial(){

function updateKoi(k, dt, t){
  k.wt += dt;
  let desired = Math.sin(k.wt * 0.22 + k.ph) * 1.4 + Math.sin(k.wt * 0.07 + k.ph * 2.0) * 1.1;
  const d = Math.hypot(k.x, k.z);
  if(d > 7.2) desired = lerpAngle(desired, Math.atan2(-k.z, -k.x), sstep(7.2, 9.0, d) * 0.95);
  let sx = 0, sz = 0;
  for(const o of kois){
    if(o === k) continue;
    const dx = k.x - o.x, dz = k.z - o.z, dd = dx * dx + dz * dz;
    if(dd < 1.69 && dd > 1e-6){
      const w = (1.3 - Math.sqrt(dd)) / 1.3;
      sx += dx * w; sz += dz * w;
    }
  }
  if(sx !== 0 || sz !== 0) desired = lerpAngle(desired, Math.atan2(sz, sx), 0.55);

  let best = null, bd = 1e9;
  for(const p of pellets){
    if(p.state !== 'float') continue;
    const dx = p.x - k.x, dz = p.z - k.z, dd = dx * dx + dz * dz;
    if(dd < bd){ bd = dd; best = p; }
  }
  let exT = 0;
  if(best){
    desired = Math.atan2(best.z - k.z, best.x - k.x);
    exT = 1;
    const eatR = 0.32 + 0.42 * k.scale;
    if(bd < eatR * eatR) eatPellet(best, k);
  }
  k.excite += (exT - k.excite) * Math.min(1, dt * (exT > 0 ? 3.5 : 0.8));

  const maxTurn = (1.7 + k.excite * 2.8) * dt;
  const turn = Math.max(-maxTurn, Math.min(maxTurn, wrapPi(desired - k.heading)));
  k.heading = wrapPi(k.heading + turn);
  k.bank += (Math.max(-1, Math.min(1, turn / Math.max(dt, 1e-4))) * 0.3 - k.bank) * Math.min(1, dt * 3.5);

  let spd = k.baseSpeed * (1 + k.excite * 1.8) * (0.82 + 0.22 * Math.sin(t * 0.63 + k.ph));
  if(k.gulp > 0){ k.gulp -= dt; spd *= 0.45; }
  k.x += Math.cos(k.heading) * spd * dt;
  k.z += Math.sin(k.heading) * spd * dt;

  let ty = k.excite > 0.35 ? -0.11 : -0.32 + Math.sin(t * 0.25 + k.ph * 2.0) * 0.13;
  if(k.breach > 0){
    k.breach -= dt; ty = -0.05;
    if(!k.breached && k.breach < 0.7){ k.breached = true; addRipple(k.x, k.z, 0.5); }
  } else if(Math.random() < dt / 16){ k.breach = 1.5; k.breached = false; }
  k.y += (ty - k.y) * Math.min(1, dt * 1.8);

  k.g.position.set(k.x, k.y + waveY(k.x, k.z, t) * 0.25, k.z);
  k.g.rotation.y = -k.heading;
  k.g.rotation.x = k.bank;

  k.mat.userData.uAmp.value = 0.09 + spd * 0.055 + (k.gulp > 0 ? 0.06 : 0);
  k.mat.userData.uFreq.value = 2.4 + spd * 3.4;
  const fs = 3.2 + k.excite * 5.5;
  k.fr.rotation.z = 0.18 + Math.sin(t * fs + k.ph) * 0.32;
  k.fl.rotation.z = -0.18 - Math.sin(t * fs + k.ph + 0.7) * 0.32;

  k.trailT -= dt;
  if(k.excite > 0.5 && k.y > -0.18 && k.trailT <= 0){
    k.trailT = 0.4;
    addRipple(k.x - Math.cos(k.heading) * 0.8 * k.scale, k.z - Math.sin(k.heading) * 0.8 * k.scale, 0.3);
  }
  k.shadow.position.set(k.x, floorYAt(k.x, k.z) + 0.04, k.z);
  const ss = 1.4 * k.scale * (1 - k.y * 0.5);
  k.shadow.scale.set(ss, 1, ss * 0.8);
  k.shadow.rotation.y = -k.heading;
  k.shadow.material.opacity = Math.max(0.06, 0.22 + k.y * 0.3);
}

function updatePellets(dt, t){
  for(let i = pellets.length - 1; i >= 0; i--){
    const p = pellets[i];
    if(p.state === 'fall'){
      p.vy -= 3.4 * dt;
      p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt;
      p.m.rotation.x += dt * 2.0; p.m.rotation.z += dt * 1.3;
      const sy = surfaceY(p.x, p.z, t);

        addRipple(p.x, p.z, 0.5);

      }
    } else if(p.state === 'float'){
      p.age += dt;
      p.drift += (vnoise(p.x * 0.3, p.z * 0.3 + t * 0.05) - 0.5) * dt * 1.2;
      p.x += Math.cos(p.drift) * 0.07 * dt;

      if(Math.hypot(p.x, p.z) > 8.3) p.drift = lerpAngle(p.drift, Math.atan2(-p.z, -p.x), Math.min(1, dt * 2));
      p.y = surfaceY(p.x, p.z, t) + 0.045;
      p.m.rotation.y += dt * 0.6;
      if(p.age > p.life) p.state = 'sink';
    } else if(p.state === 'sink'){
      p.y -= 0.3 * dt;
      p.scl -= dt * 0.9;
      if(p.scl <= 0){ removePellet(i); continue; }
    } else if(p.state === 'eaten'){
      p.scl -= dt * 7;
      if(p.scl <= 0){ removePellet(i); continue; }
    }
    p.m.position.set(p.x, p.y, p.z);
    p.m.scale.setScalar(Math.max(0.001, p.scl));
  }
}

}
function respawnPetal(p, anywhere){
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 1.7;
  let x = 9.4 + Math.cos(a) * r, z = 3.9 + Math.sin(a) * r * 0.85;
  const rr2 = Math.hypot(x, z);
  if(rr2 > 8.9){ x *= 8.9 / rr2; z *= 8.9 / rr2; }
  p.x = x; p.z = z;
  p.y = anywhere ? rr(0.4, 4.2) : rr(3.2, 4.4);
  p.state = 'fall'; p.age = 0; p.s = rr(0.8, 1.3);
  p.m.scale.setScalar(p.s);
  p.m.material.opacity = 1;
}
function updatePetals(dt, t){
  for(const p of petals){
    p.age += dt;
    if(p.state === 'fall'){
      p.vy += (-0.38 - p.vy) * Math.min(1, dt * 1.2);
      p.y += p.vy * dt;
      p.x += Math.sin(t * 1.3 + p.ph) * 0.35 * dt + p.dx * dt;
      p.z += Math.cos(t * 1.1 + p.ph) * 0.3 * dt + p.dz * dt;
      p.m.rotation.set(Math.sin(t * 2 + p.ph) * 0.7, p.m.rotation.y + dt * 1.5, Math.cos(t * 1.7 + p.ph) * 0.6);
      if(p.y <= surfaceY(p.x, p.z, t) + 0.015){
        p.state = 'float'; p.y = surfaceY(p.x, p.z, t) + 0.015;
        if(Math.random() < 0.5) addRipple(p.x, p.z, 0.25);
        p.life = rr(10, 20); p.age = 0;
      }
    } else {
      p.y = surfaceY(p.x, p.z, t) + 0.015;
      p.x += p.dx * dt * 0.5; p.z += p.dz * dt * 0.5;
      p.spin += dt * 0.15;
      p.m.rotation.set(-1.45 + Math.sin(t + p.ph) * 0.08, 0, p.spin);
      if(Math.hypot(p.x, p.z) > 9.0 || p.age > p.life){
        if(p.age > p.life){
          p.s -= dt * 0.6;
          p.m.scale.setScalar(Math.max(0.001, p.s));
          if(p.s <= 0.05){ respawnPetal(p); continue; }
        } else respawnPetal(p);
      }
    }
    p.m.position.set(p.x, p.y, p.z);
  }
}

/* ---------------- dragonfly ---------------- */
const dfly = new THREE.Group();
let dflyPrev = new THREE.Vector3();
{
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.018, 0.15, 3, 6).rotateZ(Math.PI / 2),
    new THREE.MeshLambertMaterial({ color: 0x9c3a2c }));
  dfly.add(body);
  const wingMat = new THREE.MeshBasicMaterial({ color: 0xf4f9f4, transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false });
  const wingGeo = new THREE.CircleGeometry(0.09, 8);
  wingGeo.scale(1.7, 0.42, 1);
  wingGeo.rotateX(-Math.PI / 2);
  const mkWing = (side, back) => {
    const g = wingGeo.clone();
    g.rotateY(side * Math.PI / 2);
    g.translate(back ? -0.05 : 0.02, 0, side * 0.1);
    const w = new THREE.Mesh(g, wingMat);
    dfly.add(w);
    return w;
  };
  dfly.userData.wl1 = mkWing(1, false); dfly.userData.wr1 = mkWing(-1, false);
  dfly.userData.wl2 = mkWing(1, true); dfly.userData.wr2 = mkWing(-1, true);
  scene.add(dfly);
}
function updateDragonfly(t){
  const nx = Math.sin(t * 0.41) * 4.2 + Math.sin(t * 0.85) * 0.8;
  const ny = 0.75 + Math.sin(t * 1.05) * 0.35;
  const nz = Math.cos(t * 0.32) * 4.0 + Math.cos(t * 0.65) * 0.7;
  dfly.rotation.y = -Math.atan2(nz - dflyPrev.z, nx - dflyPrev.x) || dfly.rotation.y;
  dflyPrev.set(nx, ny, nz);
  dfly.position.set(nx, ny, nz);
  dfly.rotation.x = Math.sin(t * 2) * 0.15;
  const f = Math.sin(t * 26) * 0.9;
  dfly.userData.wl1.rotation.x = f; dfly.userData.wl2.rotation.x = f * 0.8 + 0.3;
  dfly.userData.wr1.rotation.x = -f; dfly.userData.wr2.rotation.x = -f * 0.8 - 0.3;
}

/* ---------------- UI wiring ---------------- */
const feedBtn = document.getElementById('feedBtn');
const hintEl = document.getElementById('hint');
feedBtn.addEventListener('click', feed);
addEventListener('keydown', (e) => { if((e.key === 'f' || e.key === 'F') && !e.repeat) feed(); });
setTimeout(() => hintEl.classList.add('fade'), 9000);

let introDone = false, introT = 0;
const introFrom = new THREE.Vector3(8, 10, 21), introTo = new THREE.Vector3(4.5, 6.5, 14.5);
controls.addEventListener('start', () => {
  introDone = true;
  controls.autoRotate = false;
  hintEl.classList.add('fade');
});

/* ---------------- main loop ---------------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  sharedTime.value = elapsed;

  if(!introDone){
    introT += dt / 3;
    if(introT >= 1){ introT = 1; introDone = true; controls.autoRotate = true; }
    const e = sstep(0, 1, introT);
    camera.position.lerpVectors(introFrom, introTo, e);
  }
  controls.update();
  waterUniforms.uCam.value.copy(camera.position);

  for(const k of kois) updateKoi(k, dt, elapsed);
  updatePellets(dt, elapsed);
  updateWaterfall(dt);
  updatePads(dt, elapsed);
  updatePetals(dt, elapsed);
  updateDragonfly(elapsed);
  stepParticles(drops, dt, 6.0, true);
  stepParticles(splash, dt, 6.0, false);
  for(const c of cattails){
    c.g.rotation.z = Math.sin(elapsed * 0.8 + c.ph) * 0.05;
    c.g.rotation.x = Math.cos(elapsed * 0.66 + c.ph) * 0.04;
  }

  idleTimer -= dt;
  if(feedActiveUntil > 0){
    feedActiveUntil -= dt;
    if(feedActiveUntil <= 0){
      setStatus(pellets.some(p => p.state === 'float') ? 'the koi circle back for the last few' : 'the pond settles again');
      idleTimer = 10;
    }
  } else if(idleTimer <= 0){
    idleTimer = 9 + Math.random() * 5;
    const msgs = [
      'the koi drift lazily beneath the surface',
      'sunlight knifes through the water in slow ribbons',
      'a petal settles; the ripples forget it',
      'somewhere below, a tail flickers orange',
      'the waterfall keeps its one long note'
    ];
    setStatus(msgs[(Math.random() * msgs.length) | 0]);
  }

  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// a few opening ripples so the pond wakes up already moving
addRipple(2, 1, 0.6); addRipple(-3, -2, 0.5); addRipple(0, 4, 0.4);
</script>

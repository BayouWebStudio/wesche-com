<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tiny Acres — a miniature farm</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #a8d8ea; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #3d2c1e; user-select: none; -webkit-user-select: none; }
  #title { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: 18px;
    font-size: 19px; font-weight: 700; letter-spacing: 0.1em; color: #5a3d24;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6); animation: fadeaway 1.2s ease 6s forwards; }
  #counter { position: absolute; top: calc(44px + env(safe-area-inset-top)); left: 18px;
    font-size: 13px; font-weight: 600; color: #4a3a2a;
    background: rgba(255, 248, 230, 0.72); padding: 4px 10px; border-radius: 12px;
    box-shadow: 0 1px 4px rgba(90,60,30,0.2); }
  #toast { position: absolute; left: 0; right: 0; top: calc(16% + env(safe-area-inset-top));
    text-align: center; font-size: 19px; font-weight: 600; letter-spacing: 0.03em;
    color: #3d2c1e; text-shadow: 0 1px 6px rgba(255,255,255,0.8);
    opacity: 0; transition: opacity 0.4s ease; }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom));
    text-align: center; font-size: 12px; letter-spacing: 0.04em; opacity: 0.8;
    color: #4a3a2a; text-shadow: 0 1px 4px rgba(255,255,255,0.6);
    animation: fadeaway 1.5s ease 10s forwards; }
  #btns { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 12px; pointer-events: none; }
  button { pointer-events: auto; min-height: 48px; padding: 12px 20px; border-radius: 16px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.02em; cursor: pointer;
    color: #fff; border: none; box-shadow: 0 3px 0 rgba(90,50,20,0.35), 0 4px 10px rgba(60,40,20,0.25);
    transition: transform 0.08s ease, opacity 0.2s ease; touch-action: manipulation; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(90,50,20,0.35); }
  #btnAbduct { background: #8e6bc7; }
  #btnReturn { background: #5cab6e; }
  button:disabled { opacity: 0.45; cursor: default; transform: none; }
  @keyframes fadeaway { to { opacity: 0; } }
  #fail { position: fixed; inset: 0; z-index: 50; display: none; padding: 24px;
    background: #140a0a; color: #ff9c9c; font: 13px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; overflow: auto; }
</style>

<div id="hud">
  <div id="title">Tiny Acres</div>
  <div id="counter">&#128024; 13 animals</div>
  <div id="toast"><span id="toastMsg"></span></div>
  <div id="hint">drag to orbit &middot; pinch / scroll to zoom</div>
  <div id="btns">
    <button id="btnAbduct">Abduct an animal &#128125;</button>
    <button id="btnReturn">Return everyone</button>
  </div>
</div>
<pre id="fail"></pre>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- error collector ---------------- */
window.__errors = [];
const _origCE = console.error.bind(console);
console.error = (...a) => {
  try { window.__errors.push(a.map(x => (x && x.stack) ? String(x.stack) : String(x)).join(' ')); } catch (e) {}
  _origCE(...a);
};
window.addEventListener('error', e => window.__errors.push(String(e.error && e.error.stack || e.message)));
window.addEventListener('unhandledrejection', e => window.__errors.push('rejection: ' + String(e.reason && e.reason.stack || e.reason)));
function fail(e) {
  const el = document.getElementById('fail');
  el.style.display = 'block';
  el.textContent = 'BOOT ERROR\n\n' + ((e && e.stack) ? e.stack : String(e));
}

/* ---------------- shared uniforms ---------------- */
const U = {
  time:     { value: 0 },
  beam:     { value: 0 },
  proj:     { value: 800 },
  skyTop:   { value: new THREE.Color(0x7fb8e8) },
  skyHor:   { value: new THREE.Color(0xffe3b8) },
  sunCol:   { value: new THREE.Color(0xfff1d0) },
};

const GLSL_NOISE = /* glsl */`
float hash21(vec2 p){ p = fract(p * vec2(123.34, 345.45)); p += dot(p, p + 34.345); return fract(p.x * p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i); float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)); float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
`;
const GLSL_OUT = /* glsl */`
#include <tonemapping_fragment>
#include <colorspace_fragment>
`;

/* helpers */
const damp = (cur, target, tau, dt) => cur + (target - cur) * (1 - Math.exp(-dt / tau));
const prand = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const wrapPi = d => { while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const ISLAND_R = 46;

/* ============================================================ sky */
function buildSky() {
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { uTop: U.skyTop, uHor: U.skyHor, uSunCol: U.sunCol },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uTop;
      uniform vec3 uHor;
      uniform vec3 uSunCol;
      varying vec3 vDir;
      void main(){
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 col = mix(uHor, uTop, smoothstep(0.0, 0.5, h));
        col = mix(col, uHor * 0.92, smoothstep(0.0, -0.15, h));
        col += uSunCol * 0.18 * exp(-abs(h - 0.42) * 4.0);
        gl_FragColor = vec4(col, 1.0);
        ${GLSL_OUT}
      }
    `,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 20), mat);
  sky.frustumCulled = false;
  sky.name = 'sky';
  return sky;
}

/* ============================================================ clouds */
function buildClouds() {
  const isCoarse = matchMedia('(pointer: coarse)').matches;
  const n = isCoarse ? 22 : 34;
  const pos = new Float32Array(n * 3), size = new Float32Array(n), seed = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const cluster = i % 7;
    const az = (cluster / 7) * Math.PI * 2 + (prand(cluster * 3.1) - 0.5) * 0.7;
    const rad = 150 + prand(cluster * 7.7) * 160;
    pos[i * 3]     = Math.cos(az) * rad + (prand(i * 1.3) - 0.5) * 44;
    pos[i * 3 + 1] = 60 + prand(cluster * 5.3) * 40 + (prand(i * 2.1) - 0.5) * 14;
    pos[i * 3 + 2] = Math.sin(az) * rad + (prand(i * 3.7) - 0.5) * 44;
    size[i] = 22 + prand(i * 5.1) * 26;
    seed[i] = prand(i * 7.9);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uProj: U.proj },
    vertexShader: /* glsl */`
      attribute float aSize;
      attribute float aSeed;
      uniform float uProj;
      varying float vSeed;
      void main(){
        vSeed = aSeed;
        vec4 mv = viewMatrix * modelMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(aSize * uProj / max(-mv.z, 0.5), 6.0, 300.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      varying float vSeed;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c) * 2.0 + (vSeed - 0.5) * 0.4;
        float a = smoothstep(1.0, 0.25, d) * (0.5 + 0.4 * vSeed);
        gl_FragColor = vec4(vec3(1.0, 0.99, 0.97), a);
        ${GLSL_OUT}
      }
    `,
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.name = 'clouds';
  return pts;
}

/* ============================================================ island */
function buildIsland() {
  const g = new THREE.Group();
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(ISLAND_R, ISLAND_R, 0.5, 48),
    new THREE.MeshStandardMaterial({ color: 0x7ec850, roughness: 1 }));
  grass.position.y = -0.25;
  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(ISLAND_R, ISLAND_R - 5, 6.5, 48),
    new THREE.MeshStandardMaterial({ color: 0x8a5a36, roughness: 1, flatShading: true }));
  dirt.position.y = -3.75;
  const under = new THREE.Mesh(new THREE.ConeGeometry(ISLAND_R - 5, 15, 24),
    new THREE.MeshStandardMaterial({ color: 0x6e4628, roughness: 1, flatShading: true }));
  under.rotation.x = Math.PI;
  under.position.y = -14.2;
  g.add(grass, dirt, under);
  // hanging rocks
  for (let i = 0; i < 5; i++) {
    const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6 + prand(i * 3.3) * 1.8, 1),
      new THREE.MeshStandardMaterial({ color: 0x6e5a48, roughness: 1, flatShading: true }));
    const az = (i / 5) * Math.PI * 2 + 0.4;
    const rad = ISLAND_R - 8 - prand(i * 5.5) * 10;
    rock.position.set(Math.cos(az) * rad, -6 - prand(i * 7.1) * 5, Math.sin(az) * rad);
    rock.userData.baseY = rock.position.y;
    rock.userData.phase = prand(i * 9.7) * 6.28;
    rock.name = 'floatRock';
    g.add(rock);
  }
  g.name = 'island';
  return g;
}

/* ============================================================ props: house, windmill, pond, trees, fences */
let bladesG, smokePts;
function buildFarmhouse() {
  const g = new THREE.Group();
  const wall = new THREE.MeshStandardMaterial({ color: 0xf2e3c8, roughness: 0.9 });
  const woodD = new THREE.MeshStandardMaterial({ color: 0x7a4a2e, roughness: 0.8 });
  const roofM = new THREE.MeshStandardMaterial({ color: 0xc75b45, roughness: 0.85 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(6.5, 4.2, 5), wall);
  body.position.y = 2.1;
  g.add(body);
  const roof = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 4.6, 3.2, 4), roofM);
  roof.rotation.y = Math.PI / 4;
  roof.scale.set(1.06, 1, 0.85);
  roof.position.y = 5.8;
  g.add(roof);
  const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.7, 0.7), new THREE.MeshStandardMaterial({ color: 0xa0522d, roughness: 0.9 }));
  chimney.position.set(1.9, 6.1, -1.2);
  g.add(chimney);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.9, 0.12), woodD);
  door.position.set(-0.8, 0.95, 2.53);
  g.add(door);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 0.6, roughness: 0.4 }));
  knob.position.set(-0.45, 0.95, 2.62);
  g.add(knob);
  for (const wx of [1.6, 2.9]) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.1),
      new THREE.MeshStandardMaterial({ color: 0x8a5a30, emissive: 0xffd98a, emissiveIntensity: 0.7, roughness: 0.4 }));
    win.position.set(wx - 2.2 + 2.4, 2.3, 2.53);
    win.position.x = wx;
    g.add(win);
    const frame = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 0.08), woodD);
    frame.position.set(wx, 2.3, 2.5);
    g.add(frame);
  }
  // porch step
  const step = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 1), wall);
  step.position.set(-0.8, 0.15, 3);
  g.add(step);
  g.position.set(-14, 0, -14);
  g.rotation.y = 0.5;
  g.name = 'farmhouse';
  return g;
}
function buildWindmill() {
  const g = new THREE.Group();
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.9, 8.5, 10),
    new THREE.MeshStandardMaterial({ color: 0xd8cfc0, roughness: 0.9 }));
  tower.position.y = 4.25;
  g.add(tower);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(1.5, 1.4, 10),
    new THREE.MeshStandardMaterial({ color: 0xc75b45, roughness: 0.85 }));
  cap.position.y = 9.1;
  g.add(cap);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x7a4a2e, roughness: 0.8 }));
  door.position.set(0, 0.7, 1.86);
  g.add(door);
  bladesG = new THREE.Group();
  bladesG.position.set(0, 7.6, 1.7);
  const armM = new THREE.MeshStandardMaterial({ color: 0xf2e3c8, roughness: 0.85 });
  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Group();
    const spar = new THREE.Mesh(new THREE.BoxGeometry(0.18, 5.4, 0.12), armM);
    spar.position.y = 2.7;
    arm.add(spar);
    const sail = new THREE.Mesh(new THREE.BoxGeometry(0.75, 3.6, 0.06),
      new THREE.MeshStandardMaterial({ color: 0xfff6e0, roughness: 0.9 }));
    sail.position.set(0.48, 3, 0);
    arm.add(sail);
    arm.rotation.z = (i / 4) * Math.PI * 2;
    bladesG.add(arm);
  }
  g.add(bladesG);
  g.position.set(17, 0, -19);
  g.rotation.y = -0.4;
  g.name = 'windmill';
  return g;
}
function buildPond() {
  const g = new THREE.Group();
  const water = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 6.5, 0.24, 28),
    new THREE.MeshStandardMaterial({ color: 0x5aaed6, roughness: 0.25, metalness: 0.1 }));
  water.position.y = 0.02;
  g.add(water);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(6.5, 0.42, 8, 28),
    new THREE.MeshStandardMaterial({ color: 0xc9b489, roughness: 0.95 }));
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.1;
  g.add(rim);
  // lily pads
  for (let i = 0; i < 4; i++) {
    const pad = new THREE.Mesh(new THREE.CircleGeometry(0.5, 10),
      new THREE.MeshStandardMaterial({ color: 0x4d9e57, roughness: 0.9, side: THREE.DoubleSide }));
    pad.rotation.x = -Math.PI / 2;
    const a = prand(i * 3.3) * Math.PI * 2;
    pad.position.set(Math.cos(a) * 3.4, 0.16, Math.sin(a) * 3.4);
    g.add(pad);
  }
  g.position.set(21, 0, 18);
  g.name = 'pond';
  return g;
}
function buildTrees(islandG) {
  const g = new THREE.Group();
  const trunkM = new THREE.MeshStandardMaterial({ color: 0x7a4a2e, roughness: 0.9 });
  const leafA = new THREE.MeshStandardMaterial({ color: 0x4d9e57, roughness: 0.95 });
  const leafB = new THREE.MeshStandardMaterial({ color: 0x63b45c, roughness: 0.95 });
  const spots = [];
  for (let i = 0; i < 9; i++) {
    const az = (i / 9) * Math.PI * 2 + prand(i * 3.7) * 0.5;
    const rad = 34 + prand(i * 5.9) * 7;
    const p = new THREE.Vector2(Math.cos(az) * rad, Math.sin(az) * rad);
    if (Math.hypot(p.x - 17, p.y + 19) < 7) continue;   // windmill
    if (Math.hypot(p.x + 14, p.y + 14) < 7) continue;   // house
    spots.push(p);
  }
  spots.forEach((p, i) => {
    const t = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.42, 2.2, 7), trunkM);
    trunk.position.y = 1.1;
    t.add(trunk);
    const s = 0.85 + prand(i * 7.3) * 0.5;
    const b1 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), i % 2 ? leafA : leafB);
    b1.position.y = 3.1;
    const b2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 1), i % 2 ? leafB : leafA);
    b2.position.set(0.7, 2.5, 0.3);
    t.add(b1, b2);
    t.scale.setScalar(s);
    t.position.set(p.x, 0, p.y);
    t.rotation.y = prand(i * 9.1) * 6.28;
    t.userData.swayPhase = prand(i * 11.7) * 6.28;
    t.name = 'tree';
    g.add(t);
  });
  // hay bales + crates near the house
  const hayM = new THREE.MeshStandardMaterial({ color: 0xd9b45c, roughness: 1 });
  for (let i = 0; i < 3; i++) {
    const bale = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 1.3, 12), hayM);
    bale.rotation.z = Math.PI / 2;
    bale.rotation.y = prand(i * 4.1) * 6.28;
    bale.position.set(-6 + i * 1.9, 0.75, -7.5 + prand(i * 6.7) * 1.6);
    g.add(bale);
  }
  g.name = 'trees';
  return g;
}
function buildFence(cx, cz, r, islandG) {
  const g = new THREE.Group();
  const postM = new THREE.MeshStandardMaterial({ color: 0x9a6a40, roughness: 0.9 });
  const railM = new THREE.MeshStandardMaterial({ color: 0xb07e4e, roughness: 0.9 });
  const nPost = Math.max(8, Math.round(r));
  for (let i = 0; i < nPost; i++) {
    const a = (i / nPost) * Math.PI * 2;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 1.15, 6), postM);
    post.position.set(cx + Math.cos(a) * r, 0.57, cz + Math.sin(a) * r);
    post.rotation.y = prand(i * 3.1 + r) * 0.4;
    g.add(post);
  }
  for (const h of [0.5, 0.88]) {
    const rail = new THREE.Mesh(new THREE.TorusGeometry(r, 0.055, 6, 40), railM);
    rail.rotation.x = Math.PI / 2;
    rail.position.set(cx, h, cz);
    g.add(rail);
  }
  return g;
}
function buildPens() {
  const g = new THREE.Group();
  g.add(buildFence(-21, 7, 7.5, g));
  g.add(buildFence(-3, 17, 6.5, g));
  g.add(buildFence(6, 4, 5.5, g));
  g.add(buildFence(-10, -16, 7, g));
  // feed troughs
  const troughM = new THREE.MeshStandardMaterial({ color: 0x8a5a36, roughness: 0.9 });
  const spots = [[-19.5, 4.5], [-1.5, 14.8], [4.8, 2.2], [-8, -13.6]];
  for (const [x, z] of spots) {
    const tr = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 0.7), troughM);
    tr.position.set(x, 0.2, z);
    tr.rotation.y = prand(x * 3.1 + z) * 3;
    g.add(tr);
  }
  g.name = 'pens';
  return g;
}

/* ============================================================ flowers & tufts (instanced) */
function buildFlora() {
  const g = new THREE.Group();
  const avoid = [
    [-14, -14, 6], [17, -19, 5], [21, 18, 8.5],      // house, mill, pond
    [-21, 7, 8.8], [-3, 17, 7.8], [6, 4, 6.8], [-10, -16, 8.3],  // pens
  ];
  const ok = (x, z) => {
    if (Math.hypot(x, z) > ISLAND_R - 4) return false;
    for (const [ax, az, ar] of avoid) if (Math.hypot(x - ax, z - az) < ar) return false;
    return true;
  };
  // flowers
  const nF = 64;
  const stemGeo = new THREE.CylinderGeometry(0.03, 0.04, 0.5, 5);
  stemGeo.translate(0, 0.25, 0);
  const petals = ['0xff9ec4', '0xffd166', '0xffffff', '0xc4a1e8', '0xff8a5c'];
  const stemMesh = new THREE.InstancedMesh(stemGeo, new THREE.MeshStandardMaterial({ color: 0x3d7a3a, roughness: 1 }), nF);
  const headGeo = new THREE.IcosahedronGeometry(0.14, 0);
  const headMesh = new THREE.InstancedMesh(headGeo, new THREE.MeshStandardMaterial({ roughness: 0.9 }), nF);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  let placed = 0, guard = 0;
  while (placed < nF && guard++ < 500) {
    const a = prand(guard * 1.7) * Math.PI * 2;
    const r = 8 + prand(guard * 2.9) * 32;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (!ok(x, z)) continue;
    m4.makeTranslation(x, 0, z);
    stemMesh.setMatrixAt(placed, m4);
    m4.makeTranslation(x, 0.56, z);
    headMesh.setMatrixAt(placed, m4);
    col.set(petals[Math.floor(prand(guard * 4.3) * petals.length)]);
    headMesh.setColorAt(placed, col);
    placed++;
  }
  stemMesh.count = headMesh.count = placed;
  g.add(stemMesh, headMesh);
  // grass tufts: crossed planes
  const tuftGeo = new THREE.ConeGeometry(0.16, 0.55, 4);
  tuftGeo.translate(0, 0.27, 0);
  const nT = 90;
  const tuftMesh = new THREE.InstancedMesh(tuftGeo, new THREE.MeshStandardMaterial({ color: 0x58a84e, roughness: 1 }), nT);
  placed = 0; guard = 0;
  while (placed < nT && guard++ < 700) {
    const a = prand(guard * 3.1 + 50) * Math.PI * 2;
    const r = 6 + prand(guard * 4.7 + 50) * 35;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (!ok(x, z)) continue;
    m4.makeTranslation(x, 0, z);
    tuftMesh.setMatrixAt(placed, m4);
    placed++;
  }
  tuftMesh.count = placed;
  g.name = 'flora';
  return g;
}

/* ============================================================ chimney smoke (GPU points) */
function buildSmoke(house) {
  const n = 14;
  const base = new Float32Array(n * 3);
  const seed = new Float32Array(n);
  const pos = new Float32Array(n * 3);
  const origin = new THREE.Vector3(1.9, 7.1, -1.2);
  house.updateMatrixWorld(true);
  origin.applyMatrix4(house.matrixWorld);
  for (let i = 0; i < n; i++) {
    base[i * 3] = origin.x + (prand(i * 1.7) - 0.5) * 0.3;
    base[i * 3 + 1] = origin.y;
    base[i * 3 + 2] = origin.z + (prand(i * 2.9) - 0.5) * 0.3;
    seed[i] = prand(i * 4.1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aBase', new THREE.BufferAttribute(base, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uTime: U.time, uProj: U.proj },
    vertexShader: /* glsl */`
      attribute vec3 aBase;
      attribute float aSeed;
      uniform float uTime;
      uniform float uProj;
      varying float vAge;
      void main(){
        float H = 9.0;
        float age = fract(aSeed + uTime * (0.09 + aSeed * 0.05));
        vAge = age;
        vec3 p = aBase;
        p.y += age * H;
        p.x += sin(age * 9.0 + aSeed * 40.0) * age * 1.3;
        p.z += cos(age * 7.0 + aSeed * 30.0) * age * 1.1;
        vec4 mv = viewMatrix * modelMatrix * vec4(p, 1.0);
        gl_PointSize = clamp((1.4 + age * 3.6) * uProj / max(-mv.z, 0.5), 2.0, 90.0);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      varying float vAge;
      void main(){
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c) * 2.0;
        float a = smoothstep(1.0, 0.2, d) * 0.4 * (1.0 - vAge) * smoothstep(0.0, 0.15, vAge);
        gl_FragColor = vec4(vec3(0.96, 0.95, 0.93), a);
        ${GLSL_OUT}
      }
    `,
  });
  smokePts = new THREE.Points(geo, mat);
  smokePts.frustumCulled = false;
  smokePts.name = 'smoke';
  return smokePts;
}

function buildBeam() {
  beamMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    uniforms: { uBeam: U.beam, uTime: U.time, uLen: { value: 1 } },
    vertexShader: /* glsl */`
      uniform float uLen;
      varying float vT;
      varying vec3 vNv;
      varying vec3 vVv;
      void main(){
        vT = clamp(position.y / -uLen, 0.0, 1.0);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vNv = normalize(normalMatrix * normal);
        vVv = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform float uBeam;
      uniform float uTime;
      varying float vT;
      varying vec3 vNv;
      varying vec3 vVv;
      ${GLSL_NOISE}
      void main(){
        float facing = abs(dot(normalize(vNv), normalize(vVv)));
        float rings = 0.72 + 0.28 * sin(vT * 34.0 - uTime * 7.0);
        float shimmer = 0.8 + 0.2 * vnoise(vec2(vT * 18.0, uTime * 1.7));
        float a = (1.0 - vT) * pow(facing, 1.1) * uBeam * 0.34 * rings * shimmer;
        gl_FragColor = vec4(vec3(0.62, 0.85, 1.0) * (0.85 + 0.5 * (1.0 - vT)), a);
        ${GLSL_OUT}
      }
    `,
  });

  geo.translate(0, -0.5, 0); // apex at origin, extends downward
  beamMesh = new THREE.Mesh(geo, beamMat);

  beamMesh.visible = false;

          a.stateT = 2 + Math.random() * 3;
        } else {
          a.state = 'wander';
          const ang = Math.random() * Math.PI * 2;
          const rr = a.pond ? null : cfg.r * Math.sqrt(Math.random());
          if (a.pond) {
            a.pondAng = (a.pondAng === undefined ? a.heading : a.pondAng) + (Math.random() - 0.5) * 2.2;
            a.tx = a.pen[0] + Math.cos(a.pondAng) * cfg.r;
            a.tz = a.pen[1] + Math.sin(a.pondAng) * cfg.r;

    if (a.state !== 'lifted') {

      ufoG.visible = false;

/* pixel stats probe */
function pixelStats(x, y, w, h) {
  const src = renderer.domElement;
  const cols = 48, rows = 27;
  const cv = document.createElement('canvas');
  cv.width = cols; cv.height = rows;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const sx = x / innerWidth * src.width, sy = y / innerHeight * src.height;
  const sw = w / innerWidth * src.width, sh = h / innerHeight * src.height;
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, cols, rows);
  const data = ctx.getImageData(0, 0, cols, rows).data;
  const ramp = ' .:-=+*#%@';
  let sum = 0, bright = 0;
  const grid = [];
  for (let r = 0; r < rows; r++) {
    let line = '';
    for (let c = 0; c < cols; c++) {
      const i = (r * cols + c) * 4;
      const lum = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
      sum += lum;
      if (lum > 150) bright++;
      line += ramp[Math.min(ramp.length - 1, Math.floor(lum / 255 * ramp.length))];
    }
    grid.push(line);
  }
  return { mean: +(sum / (cols * rows) / 255).toFixed(4), brightFrac: +(bright / (cols * rows)).toFixed(4), grid };
}

  }
  hudAcc += dt;
  if (hudAcc < 0.2) return;
  hudAcc = 0;
  const n = onFarm().length;
  elCounter.innerHTML = '&#128024; ' + n + ' animal' + (n === 1 ? '' : 's') + ' on the farm';
  btnAbduct.textContent = phase === 'idle' ? 'Abduct an animal \uD83D\uDC7D' : 'Abducting\u2026 (' + (pendingAbduct + 1) + ')';
  btnReturn.textContent = animals.some(a => a.state === 'abducted') ? 'Return everyone' : 'Everyone is here';
  btnReturn.disabled = !animals.some(a => a.state === 'abducted') && phase === 'idle';
}

function params() {
  return {
    phase, phaseT: +phaseT.toFixed(2),
    onFarm: onFarm().length,
    abducted: animals.filter(a => a.state === 'abducted').length,
    panicking: animals.filter(a => a.state === 'panic').length,
    marks: markPool.filter(s => s.sprite.visible).length,
    pendingAbduct, pendingReturn,
    beam: +U.beam.value.toFixed(3),
    ufo: ufo.present ? { x: +ufo.x.toFixed(1), y: +ufo.y.toFixed(1), z: +ufo.z.toFixed(1) } : null,
    toast: elToast.style.opacity === '1',
    fps, frameMs: +emaMs.toFixed(1), quality,
    simT: +simT.toFixed(2),
  };
}
function parts(name, vis) {
  const map = {
    sky: scene.children.find(o => o.name === 'sky'),
    clouds: scene.children.find(o => o.name === 'clouds'),
    island: scene.children.find(o => o.name === 'island'),
    farmhouse: scene.children.find(o => o.name === 'farmhouse'),
    windmill: scene.children.find(o => o.name === 'windmill'),
    pond: scene.children.find(o => o.name === 'pond'),
    trees: scene.children.find(o => o.name === 'trees'),
    pens: scene.children.find(o => o.name === 'pens'),
    flora: scene.children.find(o => o.name === 'flora'),
    animals: animalRoot,
    ufo: scene.children.find(o => o.name === 'ufo'),
    beamGroup: scene.children.find(o => o.name === 'beamGroup'),
    smoke: scene.children.find(o => o.name === 'smoke'),
    butterflies: scene.children.find(o => o.name === 'butterflies'),
  };
  if (name === undefined) return Object.keys(map);
  const o = map[name];
  if (!o) return null;
  o.visible = !!vis;
  return { name, visible: o.visible };
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth / innerHeight < 0.75 ? 58 : 50;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  U.proj.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
}

try {
  boot();
} catch (e) {
  fail(e);
  console.error(e);
}
</script>
</body>

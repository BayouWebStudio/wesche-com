<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a1518">
<title>Cayo Viento — Tropical Weather Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,560&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f2ecdc; --dim:rgba(242,236,220,.62); --faint:rgba(242,236,220,.38);
    --panel:rgba(9,21,23,.55); --line:rgba(242,236,220,.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; overflow:hidden; background:#0a1518; color:var(--ink);
       font-family:'Space Grotesk',sans-serif; overscroll-behavior:none;}
  #c{position:fixed; inset:0; display:block; touch-action:none;}
  #flash{position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4;}
  .hud{position:fixed; inset:0; pointer-events:none; z-index:5;}
  .hud > *{pointer-events:auto;}

  .title{position:absolute; top:16px; left:20px; pointer-events:none;}
  .title h1{font-family:'Fraunces',serif; font-style:italic; font-weight:560;
    font-size:clamp(21px,3.2vw,30px); margin:0; letter-spacing:.01em; line-height:1;}
  .title p{margin:7px 0 0; font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--dim);}

  .readout{position:absolute; top:16px; right:16px; background:var(--panel);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:12px; padding:10px 13px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; min-width:186px;}
  .readout .hd{display:flex; align-items:center; gap:7px; font-family:'Space Grotesk',sans-serif;
    font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-bottom:8px;}
  .dot{width:6px; height:6px; border-radius:50%; background:#7adfa0; box-shadow:0 0 7px #7adfa0; animation:pulse 2.2s infinite;}
  @keyframes pulse{50%{opacity:.3}}
  .row{display:flex; justify-content:space-between; align-items:center; gap:14px; padding:2.5px 0; color:var(--faint);}
  .row b{color:var(--ink); font-weight:500; display:flex; gap:7px; align-items:center; font-variant-numeric:tabular-nums;}
  #arrow{width:12px; height:12px; stroke:var(--dim); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .4s;}

  .dock{position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex; gap:6px; align-items:stretch; padding:7px;
    background:var(--panel); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:16px;}
  .wbtn{appearance:none; border:1px solid transparent; background:transparent; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    padding:9px 13px; min-width:74px; min-height:58px; border-radius:11px; cursor:pointer;
    font-family:'Space Grotesk',sans-serif; font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    transition:background .25s,color .25s,transform .1s; touch-action:manipulation; position:relative;}
  .wbtn svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .wbtn:hover{background:rgba(242,236,220,.08);}
  .wbtn:active{transform:scale(.95);}
  .wbtn.on{background:var(--ink); color:#12231f;}
  .wbtn kbd{position:absolute; top:4px; right:6px; font-size:8px; color:var(--faint);
    font-family:'IBM Plex Mono',monospace; display:none;}
  @media (hover:hover){ .wbtn kbd{display:block;} .wbtn.on kbd{color:rgba(18,35,31,.5);} }
  .sep{width:1px; background:var(--line); margin:8px 3px;}
  .wbtn.icon{min-width:48px; padding:9px 10px;}

  .hint{position:absolute; left:20px; bottom:calc(22px + env(safe-area-inset-bottom));
    font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); pointer-events:none;}

  @media (max-width:640px){
    .title{top:12px; left:14px;}
    .title h1{font-size:19px;}
    .title p{font-size:8.5px; letter-spacing:.2em; margin-top:5px;}
    .readout{top:12px; right:12px; font-size:9.5px; min-width:150px; padding:8px 10px; border-radius:10px;}
    .row.hideS{display:none;}
    .dock{gap:3px; padding:6px; bottom:calc(10px + env(safe-area-inset-bottom)); max-width:calc(100vw - 14px);}
    .wbtn{min-width:0; flex:1; padding:8px 2px; min-height:56px; font-size:8.5px; letter-spacing:.08em;}
    .wbtn.icon{flex:0 0 46px;}
    .hint{display:none;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div class="hud">
  <div class="title">
    <h1>Cayo Viento</h1>
    <p>Tropical weather simulator · 12°44′ S</p>
  </div>

  <div class="readout">
    <div class="hd"><span class="dot" id="dot"></span>Station 07 · Live</div>
    <div class="row"><span>Wind</span><b><svg id="arrow" viewBox="0 0 24 24"><path d="M12 20V6M7.5 10.5 12 6l4.5 4.5"/></svg><span id="windV">—</span></b></div>
    <div class="row"><span>Dir</span><b id="dirV">—</b></div>
    <div class="row"><span>Swell</span><b id="swellV">—</b></div>
    <div class="row hideS"><span>Pressure</span><b id="pressV">—</b></div>
    <div class="row hideS"><span>Air</span><b id="airV">—</b></div>
    <div class="row"><span>Status</span><b id="statV">—</b></div>
  </div>

  <div class="dock">
    <button class="wbtn on" data-w="sunny" aria-label="Sunshine">
      <kbd>1</kbd>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.6"/><path d="M12 2v2.4M12 19.6V22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2 12h2.4M19.6 12H22M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
      Sun
    </button>
    <button class="wbtn" data-w="rain" aria-label="Rain">
      <kbd>2</kbd>
      <svg viewBox="0 0 24 24"><path d="M20 16.1A5 5 0 0 0 18 7h-1.3A8 8 0 1 0 4 15.9"/><path d="M8 17.5 7 20.5M12.5 17.5l-1 3M17 17.5l-1 3"/></svg>
      Rain
    </button>
    <button class="wbtn" data-w="storm" aria-label="Thunderstorm">
      <kbd>3</kbd>
      <svg viewBox="0 0 24 24"><path d="M6 16.3A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 .5 9"/><path d="m13 12-3 5h4l-3 5"/></svg>
      Storm
    </button>
    <button class="wbtn" data-w="hurricane" aria-label="Hurricane">
      <kbd>4</kbd>
      <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 0-8.5 8.5"/><path d="M16.5 12a4.5 4.5 0 1 0-4.5 4.5"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg>
      Hurricane
    </button>
    <div class="sep"></div>
    <button class="wbtn icon" id="sndBtn" aria-label="Toggle sound">
      <svg id="sndOn" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
      <svg id="sndOff" viewBox="0 0 24 24" style="display:none"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
    </button>
  </div>

  <div class="hint">Drag to orbit · scroll or pinch to zoom</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== basics ============================== */
const isMobile = matchMedia('(pointer: coarse)').matches || innerWidth < 720;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const sstep = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio||1, isMobile?1.6:2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc8ece9, 0.0034);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 2000);
camera.position.set(52, 30, 66);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 26; controls.maxDistance = 230;
controls.maxPolarAngle = 1.5; controls.minPolarAngle = 0.12;
controls.autoRotate = true; controls.autoRotateSpeed = -0.5;
controls.addEventListener('start', ()=>{ controls.autoRotate = false; });

const sunDir = new THREE.Vector3(0.55, 0.72, -0.38).normalize();
const dirLight = new THREE.DirectionalLight(0xfff1d6, 2.4);
dirLight.position.copy(sunDir).multiplyScalar(120);
scene.add(dirLight);
const hemi = new THREE.HemisphereLight(0xcfe8f2, 0x33403a, 0.9);
scene.add(hemi);

/* ============================ noise helpers ========================= */
function hash2(x,y){ const n = Math.sin(x*127.1 + y*311.7)*43758.5453; return n - Math.floor(n); }
function vnoise(x,y){
  const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
  const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
}
function fbm2(x,y){ let v=0,a=0.5; for(let i=0;i<4;i++){ v+=a*vnoise(x,y); x=x*2.03+11.7; y=y*2.03+7.3; a*=0.5; } return v; }

function radialTex(size, inner, stops){
  const cv=document.createElement('canvas'); cv.width=cv.height=size;
  const x=cv.getContext('2d');
  for(const [px,py,r,a] of stops){
    const g=x.createRadialGradient(px,py,1,px,py,r);
    g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g; x.fillRect(0,0,size,size);
  }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const puffTex = radialTex(128,0,[[64,64,62,0.85],[64,52,34,0.55],[46,68,30,0.5],[82,70,28,0.5],[64,78,26,0.45],[52,58,24,0.4],[76,56,22,0.4]]);
const glowTex = radialTex(128,0,[[64,64,60,1],[64,64,26,1]]);

/* ================================ sky =============================== */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{
    uZenith:{value:new THREE.Color('#1f7fc0')}, uHorizon:{value:new THREE.Color('#c8ece9')},
    uSunColor:{value:new THREE.Color('#fff2cd')}, uSunDir:{value:sunDir.clone()},
    uSunI:{value:1}, uFlash:{value:0}
  },
  vertexShader:`
    varying vec3 vDir;
    void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader:`
    uniform vec3 uZenith, uHorizon, uSunColor, uSunDir;
    uniform float uSunI, uFlash;
    varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      vec3 col = mix(uHorizon, uZenith, pow(clamp(d.y,0.0,1.0), 0.55));
      col = mix(col, uHorizon*0.55, smoothstep(0.0, 0.35, -d.y));
      float s = max(dot(d, uSunDir), 0.0);
      col += uSunColor * (pow(s,700.0)*1.5 + pow(s,28.0)*0.30 + pow(s,3.0)*0.10) * uSunI;
      col += uFlash * vec3(0.85,0.9,1.0);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(850, 32, 16), skyMat);
sky.renderOrder = -1; scene.add(sky);

/* =============================== ocean ============================== */
const oceanMat = new THREE.ShaderMaterial({
  fog:true,
  uniforms: THREE.UniformsUtils.merge([ THREE.UniformsLib.fog, {
    uTime:{value:0}, uAmp:{value:0.4}, uChop:{value:0.35}, uSpeed:{value:0.9},
    uDeep:{value:new THREE.Color('#0a5e66')}, uShallow:{value:new THREE.Color('#2fc3ae')},
    uHorizon:{value:new THREE.Color('#c8ece9')}, uSunColor:{value:new THREE.Color('#fff2cd')},
    uFoamColor:{value:new THREE.Color('#eef7f2')}, uSunDir:{value:sunDir.clone()},
    uSunI:{value:1}, uFoam:{value:0.08}, uRain:{value:0}, uFlash:{value:0}, uGray:{value:0},
    uIslandR:{value:26}
  }]),
  vertexShader:`
    uniform float uTime, uAmp, uChop, uSpeed;
    varying vec3 vWorld; varying vec3 vNormal; varying float vH;
    #include <fog_pars_vertex>
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vec2 p = wp.xz;
      float t = uTime * uSpeed;
      float h = 0.0; vec2 g = vec2(0.0);
      vec2 d; float f; float a; float ph;
      d=normalize(vec2( 0.80, 0.60)); f=0.135; a=0.62;                  ph=dot(d,p)*f*6.2831+t*1.05; h+=a*sin(ph); g+=a*f*6.2831*d*cos(ph);
      d=normalize(vec2(-0.50, 0.86)); f=0.230; a=0.34*(0.6+0.6*uChop);  ph=dot(d,p)*f*6.2831+t*1.35; h+=a*sin(ph); g+=a*f*6.2831*d*cos(ph);
      d=normalize(vec2( 0.32,-0.95)); f=0.370; a=0.20*(0.4+0.8*uChop);  ph=dot(d,p)*f*6.2831+t*1.80; h+=a*sin(ph); g+=a*f*6.2831*d*cos(ph);
      d=normalize(vec2(-0.91,-0.40)); f=0.550; a=0.11*(0.3+0.9*uChop);  ph=dot(d,p)*f*6.2831+t*2.40; h+=a*sin(ph); g+=a*f*6.2831*d*cos(ph);
      h *= uAmp; g *= uAmp;
      float damp = 0.18 + 0.82*smoothstep(16.0, 40.0, length(p));
      h *= damp; g *= damp;
      wp.y += h;
      vWorld = wp.xyz;
      vNormal = normalize(vec3(-g.x, 1.0, -g.y));
      vH = h / max(uAmp, 0.05);
      vec4 mvPosition = viewMatrix * wp;
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader:`
    uniform vec3 uDeep, uShallow, uHorizon, uSunColor, uFoamColor, uSunDir;
    uniform float uTime, uSunI, uFoam, uRain, uFlash, uGray, uIslandR;
    varying vec3 vWorld; varying vec3 vNormal; varying float vH;
    #include <fog_pars_fragment>
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
    float noise(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x), mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x), f.y); }
    float fbm(vec2 p){ float v=0.0; float a=0.5; for(int k=0;k<3;k++){ v+=a*noise(p); p=p*2.13+7.7; a*=0.5; } return v; }
    void main(){
      vec3 V = normalize(cameraPosition - vWorld);
      vec2 nxA = vec2(fbm(vWorld.xz*0.35 + uTime*0.30), fbm(vWorld.xz*0.35 - uTime*0.24)) - 0.5;
      vec3 N = normalize(vNormal + vec3(nxA.x, 0.0, nxA.y)*0.30);
      float distC = length(vWorld.xz);
      float shore = 1.0 - smoothstep(uIslandR*0.6, uIslandR*1.5, distC);
      vec3 base = mix(uDeep, uShallow, shore*0.8);
      float lum = dot(base, vec3(0.34));
      base = mix(base, vec3(lum)*0.55, uGray*0.5);
      float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
      vec3 col = mix(base, uHorizon*1.06, fres*0.62);
      vec3 R = reflect(-V, N);
      col += uSunColor * pow(max(dot(R, uSunDir), 0.0), 140.0) * uSunI * 1.7;
      col += uSunColor * step(0.986, noise(vWorld.xz*9.0 + uTime*2.2)) * uSunI * 0.5;
      float crest = smoothstep(0.45, 1.0, vH);
      float wc = crest * smoothstep(0.42, 0.85, fbm(vWorld.xz*0.22 + uTime*0.16)) * uFoam;
      col = mix(col, uFoamColor, clamp(wc, 0.0, 1.0)*0.85);
      float ring = 1.0 - smoothstep(uIslandR*0.85, uIslandR*1.24, distC);
      float lap = smoothstep(0.30, 0.80, sin(distC*0.8 - uTime*1.8 + fbm(vWorld.xz*0.13)*4.5)*0.5+0.5);
      col = mix(col, uFoamColor, ring*lap*(0.30 + 0.70*uFoam));
      col += vec3(0.55,0.6,0.66) * uRain * step(0.985, noise(vWorld.xz*30.0 + uTime*7.0)) * 0.4;
      col += vec3(0.85,0.9,1.0) * uFlash * 0.45;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`
});
const oceanGeo = new THREE.PlaneGeometry(640, 640, 150, 150);
oceanGeo.rotateX(-Math.PI/2);
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
scene.add(ocean);

/* =============================== island ============================= */
function coastRadius(a){ return 26*(1 + 0.23*fbm2(Math.cos(a)*1.4+3.7, Math.sin(a)*1.4+9.2)); }
function terrainHeight(x,z){
  const r=Math.hypot(x,z), a=Math.atan2(z,x);
  const d = r/coastRadius(a);
  const e = Math.max(0, 1-d);
  const islandH = Math.pow(e,1.4)*10.5 + (fbm2(x*0.085+5, z*0.085+5)-0.5)*6.8*e + (fbm2(x*0.42+9, z*0.42+9)-0.5)*1.2*e - 0.55;
  const seaH = -2.4 - Math.min(Math.max(d-1,0)*5.5, 4.5) + (fbm2(x*0.2+3, z*0.2+8)-0.5)*0.7*Math.min(Math.max(d-0.6,0),1);
  const bl = sstep(0.93, 1.07, d);
  return islandH*(1-bl) + seaH*bl;
}
const islGeo = new THREE.PlaneGeometry(170, 170, 120, 120);
islGeo.rotateX(-Math.PI/2);
{
  const pos = islGeo.attributes.position, n = pos.count;
  for(let i=0;i<n;i++) pos.setY(i, terrainHeight(pos.getX(i), pos.getZ(i)));
  islGeo.computeVertexNormals();
  const nrm = islGeo.attributes.normal;
  const cSand=new THREE.Color('#e7d3a0'), cSand2=new THREE.Color('#c8a86e'),
        cGrass=new THREE.Color('#3f9552'), cGrass2=new THREE.Color('#245c39'),
        cRock=new THREE.Color('#8a8266'), cSea=new THREE.Color('#7fa893');
  const col = new Float32Array(n*3), c = new THREE.Color();
  for(let i=0;i<n;i++){
    const x=pos.getX(i), z=pos.getZ(i), h=pos.getY(i);
    if(h<1.0) c.copy(cSand).lerp(cSand2, clamp((h+1.5)/2.5,0,1));
    else      c.copy(cGrass).lerp(cGrass2, clamp((h-1)/6,0,1));
    if(h<-0.2) c.lerp(cSea, clamp((-h-0.2)/2.5,0,1)*0.65);
    const ny = nrm.getY(i);
    if(ny<0.8) c.lerp(cRock, clamp((0.8-ny)/0.35,0,1)*0.85);
    c.offsetHSL(0,0,(hash2(x*3.7,z*3.7)-0.5)*0.07);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  islGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
}
const islandMat = new THREE.MeshLambertMaterial({ vertexColors:true });
scene.add(new THREE.Mesh(islGeo, islandMat));

/* --------- props: palms, rocks, hut, pier (merged, vertex colors) ---- */
function colorize(geo, hex, jitter=0){
  const base = new THREE.Color(hex), n = geo.attributes.position.count;
  const arr = new Float32Array(n*3), c = new THREE.Color();
  for(let i=0;i<n;i++){
    c.copy(base); if(jitter) c.offsetHSL((Math.random()-0.5)*jitter*0.2, (Math.random()-0.5)*jitter*0.4, (Math.random()-0.5)*jitter);
    arr[i*3]=c.r; arr[i*3+1]=c.g; arr[i*3+2]=c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(arr,3));
  return geo;
}
const palmMat = new THREE.MeshLambertMaterial({ vertexColors:true, side:THREE.DoubleSide });
const propMat = new THREE.MeshLambertMaterial({ vertexColors:true });
const palms = [];

function frondGeo(){
  const g = new THREE.PlaneGeometry(0.5, 2.9, 1, 7);
  g.translate(0, 1.45, 0);

const AudioSys = {
  ctx:null, master:null, noise:null, on:true, rain:null, wind:null, surf:null,
  init(){
    if(this.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=this.ctx=new AC();
    const master=this.master=ctx.createGain();
    master.gain.value=this.on?0.9:0; master.connect(ctx.destination);
    const len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    this.noise=buf;
    const mk=(type,freq)=>{
      const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
      const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq;
      const g=ctx.createGain(); g.gain.value=0;
      src.connect(f); f.connect(g); g.connect(master); src.start();
      return {g,f};
    };
    this.rain=mk('highpass',900);
    this.wind=mk('lowpass',420);
    this.surf=mk('lowpass',300);
  },
  update(rainI,windI,surfI,gust){
    if(!this.ctx) return;
    const t=this.ctx.currentTime;
    this.rain.g.gain.setTargetAtTime(rainI*0.16, t, 0.4);
    this.wind.g.gain.setTargetAtTime((0.04+windI*0.17)*(0.6+0.4*gust), t, 0.3);
    this.surf.g.gain.setTargetAtTime(0.03+surfI*0.09, t, 0.3);
  },
  thunder(vol){
    if(!this.ctx) return;
    const ctx=this.ctx, t=ctx.currentTime;
    const src=ctx.createBufferSource(); src.buffer=this.noise; src.loop=true;
    src.playbackRate.value=0.18+Math.random()*0.1;
    const f=ctx.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(320,t); f.frequency.exponentialRampToValueAtTime(50,t+2.2);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(vol,0.02),t+0.06);
    g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+2.8);
    const o=ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(46,t); o.frequency.exponentialRampToValueAtTime(28,t+2);
    const og=ctx.createGain();
    og.gain.setValueAtTime(0.0001,t);
    og.gain.exponentialRampToValueAtTime(vol*0.7,t+0.08);
    og.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
    o.connect(og); og.connect(this.master); o.start(t); o.stop(t+2.4);
  },
  toggle(){
    this.on=!this.on;
    if(this.ctx) this.master.gain.setTargetAtTime(this.on?0.9:0, this.ctx.currentTime, 0.1);
    document.getElementById('sndOn').style.display=this.on?'':'none';
    document.getElementById('sndOff').style.display=this.on?'none':'';
  }
};
addEventListener('pointerdown', ()=>{ AudioSys.init(); if(AudioSys.ctx&&AudioSys.ctx.state==='suspended') AudioSys.ctx.resume(); }, {once:false});
document.getElementById('sndBtn').addEventListener('click', ()=>{ AudioSys.init(); AudioSys.toggle(); });
document.addEventListener('visibilitychange', ()=>{
  if(!AudioSys.ctx) return;

});

/* =============================== loop =============================== */
const clock=new THREE.Clock();
let windAngle=0.6;
const WET=new THREE.Color(0.62,0.66,0.68), WHITE=new THREE.Color(1,1,1);
const flashEl=document.getElementById('flash');

function animate(){
  const dt=Math.min(clock.getDelta(),0.05);
  tNow+=dt;

  // smooth parameter morphing
  const k=1-Math.exp(-dt*1.4);
  numKeys.forEach(key=>cur[key]+=(active[key]-cur[key])*k);
  colKeys.forEach(key=>curCol[key].lerp(new THREE.Color(active[key]), k));

  // wind heading: meanders in fair weather, rotates around the eye in a hurricane
  windAngle += dt*(0.03 + cur.swirl*0.95*(0.4+0.6*cur.wind)) + Math.sin(tNow*0.11)*0.0008;
  const windVec=new THREE.Vector2(Math.cos(windAngle), Math.sin(windAngle)).multiplyScalar(0.2+cur.wind*1.5);
  const gust=0.5+0.5*(0.5+0.5*Math.sin(tNow*0.7))*(0.6+0.4*Math.sin(tNow*2.3+2));

  // sky / fog / lights
  skyMat.uniforms.uZenith.value.copy(curCol.skyTop);
  skyMat.uniforms.uHorizon.value.copy(curCol.skyHor);
  skyMat.uniforms.uSunColor.value.copy(curCol.sunCol);
  skyMat.uniforms.uSunI.value=cur.sun;
  skyMat.uniforms.uFlash.value=Math.min(flash,1)*0.85;
  scene.fog.color.copy(curCol.skyHor);
  scene.fog.density=cur.fog;
  dirLight.intensity=0.15+cur.sun*2.4;
  hemi.intensity=0.35+cur.sun*0.55+Math.min(flash,1)*2.5;
  hemi.color.copy(curCol.hemi);

  // ocean
  const u=oceanMat.uniforms;
  u.uTime.value=tNow; u.uAmp.value=cur.wave; u.uChop.value=cur.chop;
  u.uSpeed.value=0.8+cur.wind*0.7; u.uFoam.value=cur.foam; u.uRain.value=cur.rain;
  u.uSunI.value=cur.sun; u.uGray.value=cur.dark; u.uFlash.value=Math.min(flash,1)*0.8;
  u.uHorizon.value.copy(curCol.skyHor); u.uDeep.value.copy(curCol.deep); u.uShallow.value.copy(curCol.shal);
  u.uSunColor.value.copy(curCol.sunCol);
  ocean.position.y=cur.surge;

  // wet surfaces
  const wet=clamp(cur.rain*0.9,0,1)*0.8;
  islandMat.color.copy(WHITE).lerp(WET,wet);
  palmMat.color.copy(WHITE).lerp(WET,wet*0.8);
  propMat.color.copy(WHITE).lerp(WET,wet*0.8);

  // palms in the wind
  for(const p of palms){
    const g1=Math.sin(tNow*1.1+p.phase), g2=Math.sin(tNow*2.7+p.phase*1.6), g3=Math.sin(tNow*5.1+p.phase*0.7);
    const s=cur.wind, ax=Math.cos(windAngle), az=Math.sin(windAngle);
    p.crown.rotation.x=(az*(0.1+0.55*s) + (g1*0.5+g2*0.3+g3*0.2)*(0.04+0.22*s));
    p.crown.rotation.z=(-ax*(0.1+0.55*s) + (g2*0.5+g3*0.3)*(0.04+0.2*s));
    p.trunk.rotation.x=az*s*0.05*g1;
    p.trunk.rotation.z=-ax*s*0.05*g2;
  }

  // clouds
  for(const c of clusters){
    c.angle += dt*(0.01+0.02*c.speed)*(1+cur.swirl*16);
    c.r += (lerp(c.baseR,c.stormR,cur.swirl)-c.r)*Math.min(1,dt*0.6);
    c.y += (lerp(c.baseY, 18+(c.index%5)*3, cur.swirl)-c.y)*Math.min(1,dt*0.6);
    c.group.position.set(Math.cos(c.angle)*c.r, c.y, Math.sin(c.angle)*c.r);
    c.group.scale.setScalar(c.baseS*(1+cur.dark*0.35+cur.swirl*0.6));
    const tgt=clamp(active.cover*(15)-c.index,0,1)*(0.85-cur.dark*0.4);
    c.mat.opacity += (tgt-c.mat.opacity)*Math.min(1,dt*1.2);
    c.mat.color.lerp(curCol.cloud, Math.min(1,dt*1.2));
  }

  // rain
  rain.visible = cur.rain>0.02;
  if(rain.visible){
    rainMat.uniforms.uTime.value=tNow;
    rainMat.uniforms.uIntensity.value=cur.rain;
    rainMat.uniforms.uLen.value=0.9+cur.rain*1.6;
    rainMat.uniforms.uWind.value.copy(windVec);
  }

  // lightning
  if(cur.bolt>0.15 && tNow>nextStrike){ strike(); nextStrike=tNow+(2+Math.random()*6)/cur.bolt; }
  for(let i=pendingThunder.length-1;i>=0;i--){
    const it=pendingThunder[i];
    if(tNow>=it.at){
      if(it.restrike) flash=Math.max(flash,0.55+Math.random()*0.3);
      else AudioSys.thunder(it.vol);
      pendingThunder.splice(i,1);
    }
  }
  flash*=Math.exp(-dt*4.2);
  if(flash<0.004) flash=0;
  bolt.material.opacity=Math.min(1,flash)*0.9*(0.7+0.3*Math.sin(tNow*70));
  bolt.visible=flash>0.04;
  boltLight.intensity=flash*1100;
  glow1.material.opacity=glow2.material.opacity=Math.min(1,flash)*0.7;
  glow1.scale.setScalar(14+44*flash);
  flashEl.style.opacity=(flash*0.22).toFixed(3);

  // birds seek shelter in bad weather
  const vis=clamp((1-cur.rain*1.5)*(1-cur.dark*1.4),0,1);
  birdMat.opacity+=(vis-birdMat.opacity)*Math.min(1,dt*1.5);
  const birdsOn=birdMat.opacity>0.03;
  for(const b of birds){
    b.g.visible=birdsOn;
    if(!birdsOn) continue;
    const a=tNow*b.sp+b.ph;
    b.g.position.set(Math.cos(a)*b.r, b.h+Math.sin(tNow*0.6+b.ph)*1.5, Math.sin(a)*b.r);
    b.g.rotation.y=-a;
    const flap=Math.sin(tNow*9+b.ph)*0.75;
    b.wl.rotation.z=flap; b.wr.rotation.z=-flap;
  }

  // hurricane shake
  const shk=cur.wind*cur.swirl*0.22;
  scene.position.set((vnoise(tNow*7,0)-0.5)*shk, (vnoise(0,tNow*7)-0.5)*shk, 0);

  AudioSys.update(cur.rain, cur.wind, cur.wave*0.5, gust);

  controls.update();
  renderer.render(scene,camera);

  telT+=dt;
  if(telT>0.25){ telT=0; telemetry(); }
}
renderer.setAnimationLoop(animate);

addEventListener('resize', ()=>{
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, isMobile?1.6:2));
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});
</script>
</body>
</html>

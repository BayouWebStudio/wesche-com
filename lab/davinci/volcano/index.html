<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Volcano Island</title>
<style>
  :root{
    --glass: rgba(10,20,28,.42);
    --glassHi: rgba(255,255,255,.14);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#05080c; }
  body{ font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color:#eef6f8; user-select:none; -webkit-user-select:none; }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }
  .ui{ position:fixed; z-index:10; }

  #title{ top:calc(env(safe-area-inset-top,0px) + 16px); left:calc(env(safe-area-inset-left,0px) + 18px);
    pointer-events:none; text-shadow:0 2px 16px rgba(0,0,0,.65); }
  #title h1{ margin:0; font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-weight:500; font-size:clamp(20px,3.3vw,30px); letter-spacing:.05em; }
  #title p{ margin:3px 0 0; font-size:11px; letter-spacing:.22em; text-transform:uppercase; opacity:.62; }

  #topright{ top:calc(env(safe-area-inset-top,0px) + 16px); right:calc(env(safe-area-inset-right,0px) + 16px);
    display:flex; gap:8px; align-items:center; }
  .chip{
    appearance:none; cursor:pointer; font:inherit; font-size:12px; letter-spacing:.05em; color:#dceaf1;
    background:var(--glass); border:1px solid var(--glassHi); border-radius:999px; padding:8px 14px;
    backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3);
    box-shadow:0 8px 26px rgba(0,0,0,.34); opacity:.72; transition:opacity .25s, background .25s;
  }
  .chip:hover{ opacity:1; }
  .chip[aria-pressed="true"]{ background:rgba(255,255,255,.17); opacity:1; color:#fff; }

  #dock{ bottom:calc(env(safe-area-inset-bottom,0px) + 20px); left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:10px; }
  #status{ font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; opacity:.72;
    text-shadow:0 1px 12px rgba(0,0,0,.8); font-variant-numeric:tabular-nums; }
  #row{ display:flex; gap:10px; align-items:center; }
  button.big{
    appearance:none; cursor:pointer; border:1px solid rgba(255,255,255,.26); color:#fff;
    font:inherit; font-size:16px; font-weight:600; letter-spacing:.03em; padding:15px 30px; border-radius:999px;
    display:flex; align-items:center; gap:10px; box-shadow:0 10px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.24);
    transition:transform .13s ease, filter .25s, opacity .25s;
    backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
  }
  button.big:active{ transform:scale(.955); }
  button.big[disabled]{ opacity:.45; cursor:default; }
  #erupt{ background:linear-gradient(180deg, rgba(255,150,60,.42), rgba(220,60,20,.34)); }
  #erupt:hover:not([disabled]){ filter:brightness(1.18); }
  #reset{ background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(160,190,205,.12)); padding:15px 22px; }
  #reset:hover{ filter:brightness(1.15); }
  svg.i{ width:20px; height:20px; }
  #hint{ bottom:calc(env(safe-area-inset-bottom,0px) + 22px); right:calc(env(safe-area-inset-right,0px) + 18px);
    font-size:11px; letter-spacing:.05em; opacity:.42; text-align:right; line-height:1.6;
    text-shadow:0 1px 10px rgba(0,0,0,.7); pointer-events:none; max-width:200px; }
  @media (max-width:700px){ #hint{ display:none; } #status{ font-size:10.5px; } button.big{ font-size:15px; padding:13px 22px; } }
  #vig{ position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(130% 106% at 50% 42%, rgba(0,0,0,0) 42%, rgba(3,8,12,.30) 78%, rgba(3,8,12,.54) 100%); }
  #veil{ position:fixed; inset:0; z-index:40; display:grid; place-items:center; font-size:13px;
    letter-spacing:.24em; text-transform:uppercase; opacity:.94; transition:opacity .9s ease;
    background:radial-gradient(120% 90% at 50% 40%, #16323f, #050a0d 70%); }
  #veil.gone{ opacity:0; pointer-events:none; }
  #err{ position:fixed; inset:auto 12px 12px 12px; z-index:60; display:none; padding:14px 16px;
    background:rgba(60,10,10,.94); border:1px solid rgba(255,120,120,.5); border-radius:12px;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; max-height:42vh; overflow:auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<div class="ui" id="title">
  <h1>Volcano Island</h1>
  <p>Isla Fuego &middot; Pacifica</p>
</div>

<div class="ui" id="topright">
  <button class="chip" id="orbit" aria-pressed="true">Auto-orbit</button>
</div>

<div class="ui" id="dock">
  <div id="status">Dormant &middot; 5 boats at anchor</div>
  <div id="row">
    <button class="big" id="erupt">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5c1.6 3 4.4 4.6 4.4 8.2a4.4 4.4 0 0 1-8.8 0c0-1.6.6-2.6 1.4-3.6"/>
        <path d="M4 21l2.6-6.4M20 21l-2.6-6.4M8 21l1.2-3.2M16 21l-1.2-3.2"/>
      </svg>
      Erupt
    </button>
    <button class="big" id="reset">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.2 4.6v4.6h4.6"/>
      </svg>
      Reset
    </button>
  </div>
</div>

<div class="ui" id="hint">Drag to orbit &middot; scroll / pinch to zoom</div>
<div id="veil">Raising the island&hellip;</div>
<div id="err"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
</script>

<script type="module">
/* =========================================================================
   VOLCANO ISLAND — single-file three.js scene. Every mesh, texture and
   effect is generated in code at runtime; the only fetch is three.js itself.
   ========================================================================= */
import * as THREE from 'three';

/* ---------- error collector (before any GL work) ---------- */
window.__errors = [];
(function(){
  const ce = console.error.bind(console);
  console.error = (...a) => { try { window.__errors.push(a.map(x => (x && x.stack) ? String(x.stack) : String(x)).join(' ')); } catch(_){} ce(...a); };
  window.addEventListener('error', e => window.__errors.push('error: ' + (e.message || e) + '\n' + ((e.error && e.error.stack) || '')));
  window.addEventListener('unhandledrejection', e => window.__errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)));
})();
const fail = (msg) => { const el = document.getElementById('err'); el.style.display='block'; el.textContent = String(msg && msg.stack || msg); };

/* ============================== utilities =============================== */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const smoothstep = (e0,e1,x) => { const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const TAU = Math.PI*2, D2R = Math.PI/180;
const damp = (cur,tgt,dt,tau) => cur + (tgt-cur)*(1-Math.exp(-dt/tau));
let _seed = 20260914;
const rnd = () => { _seed = (_seed*1664525 + 1013904223) & 0x7fffffff; return _seed/0x7fffffff; };
const rr = (a,b) => a + (b-a)*rnd();
const pick = a => a[(rnd()*a.length)|0];
const shortAngle = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
function hash2i(x,y,s){
  let h = Math.imul(x|0,374761393) + Math.imul(y|0,668265263) + Math.imul(s|0,1442695041);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16))>>>0)/4294967295;
}
function vnoise2(x,y,s){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x-xi, yf = y-yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2i(xi,yi,s), b = hash2i(xi+1,yi,s), c = hash2i(xi,yi+1,s), d = hash2i(xi+1,yi+1,s);
  return (a+(b-a)*u) + ((c+(d-c)*u) - (a+(b-a)*u))*v;
}
function fbm2(x,y,oct,s){
  let amp=.5, sum=0, norm=0;
  for (let i=0;i<oct;i++){ sum += amp*vnoise2(x,y,s+i*13); norm += amp; x*=2.03; y*=1.97; amp*=.5; }
  return sum/norm;
}

/* quality tiers */
const COARSE = matchMedia('(pointer: coarse)').matches;
const Q = COARSE ? {
  dpr:1.75, oceanRings:96, oceanSeg:110, isleRings:96, isleSeg:120,
  palms:26, bushes:240, ferns:340, rocks:40, ash:150, smoke:190, embers:70, bombs:90, cloudOct:3
} : {
  dpr:2, oceanRings:150, oceanSeg:150, isleRings:140, isleSeg:190,
  palms:46, bushes:560, ferns:820, rocks:78, ash:340, smoke:420, embers:170, bombs:200, cloudOct:4
};

/* ============================== GLSL chunks ============================= */
const GLSL_NOISE = /* glsl */`
float h11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
float h13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vn3(vec3 x){
  vec3 i = floor(x), f = fract(x);
  f = f*f*(3.0-2.0*f);
  float a000=h13(i), a100=h13(i+vec3(1,0,0)), a010=h13(i+vec3(0,1,0)), a110=h13(i+vec3(1,1,0));
  float a001=h13(i+vec3(0,0,1)), a101=h13(i+vec3(1,0,1)), a011=h13(i+vec3(0,1,1)), a111=h13(i+vec3(1,1,1));
  return mix(mix(mix(a000,a100,f.x), mix(a010,a110,f.x), f.y),
             mix(mix(a001,a101,f.x), mix(a011,a111,f.x), f.y), f.z);
}
float fbm3(vec3 p, int oct){ float a=0.5,s=0.0; for(int i=0;i<7;i++){ if(i>=oct) break; s += a*vn3(p); p*=2.02; a*=0.5; } return s; }
uniform vec2 uCloudShift;
float csH(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float csN(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(csH(i), csH(i+vec2(1.0,0.0)), f.x), mix(csH(i+vec2(0.0,1.0)), csH(i+vec2(1.0,1.0)), f.x), f.y);
}
/* drifting cloud shadows: large soft patches that break up the flat sunlight */
float cloudShade(vec2 p){
  float n = csN(p*0.0170 + uCloudShift)*0.56 + csN(p*0.050 - uCloudShift*1.9)*0.30 + csN(p*0.115 + uCloudShift*0.7)*0.14;
  return mix(0.45, 1.07, smoothstep(0.24, 0.78, n));
}

`;
const GLSL_SKY = /* glsl */`
uniform vec3 uSkyTop, uSkyHorizon, uSunDir, uSunGlow, uAshTint; uniform float uAsh;
vec3 skyGradient(vec3 d){
  float h = clamp(d.y*1.30, -0.30, 1.0);
  vec3 col = mix(uSkyHorizon, uSkyTop, pow(max(h,0.0), 0.58));
  col = mix(uSkyHorizon*0.82, col, smoothstep(-0.30, 0.03, d.y));
  float sd = max(dot(d, uSunDir), 0.0);
  col += uSunGlow * pow(sd, 5.0) * 0.34;
  col += uSunGlow * pow(sd, 300.0) * 2.6;
  vec3 ash = mix(uAshTint, uAshTint*0.42, smoothstep(-0.1,0.55,d.y));
  col = mix(col, ash, clamp(uAsh,0.0,1.0)*0.90);
  return col;
}`;
const GLSL_FOG = /* glsl */`
uniform vec3 uFogColor; uniform float uFogDensity;
vec3 applyFog(vec3 col, float dist){
  float f = 1.0 - exp(-uFogDensity*uFogDensity*dist*dist);
  return mix(col, uFogColor, clamp(f,0.0,1.0));
}`;
const GLSL_LIGHT = /* glsl */`
uniform vec3 uSunDir, uSunColor, uAmbColor; uniform float uSunI, uAmbI;
vec3 lit(vec3 albedo, vec3 N, float shade){
  float diff = max(dot(N, uSunDir), 0.0);
  float sky = 0.55 + 0.45*N.y;
  return albedo * (uSunColor*diff*uSunI + uAmbColor*sky*uAmbI) * shade;
}`;
const GLSL_OUT = /* glsl */`
  #include <tonemapping_fragment>
  #include <colorspace_fragment>`;

/* =========================== shared uniforms =========================== */
const U = {
  time:      { value: 0 },
  sunDir:    { value: new THREE.Vector3(0.55, 0.68, -0.49).normalize() },
  sunColor:  { value: new THREE.Color(0xfff2dd) },
  sunGlow:   { value: new THREE.Color(0xffd9a0) },
  sunI:      { value: 1.05 },
  skyTop:    { value: new THREE.Color(0x2a6ed0) },
  skyHorizon:{ value: new THREE.Color(0xbfe2ef) },
  ashTint:   { value: new THREE.Color(0x6b5646) },
  ash:       { value: 0 },
  ambColor:  { value: new THREE.Color(0x9fc6e8) },
  ambI:      { value: 0.62 },
  fogColor:  { value: new THREE.Color(0xc6ddec) },
  fogDensity:{ value: 0.0031 },
  seaY:      { value: 0 },
  lavaGlow:  { value: 0 },
  erupt:     { value: 0 },
  rumble:    { value: 0 },
  shoreGlow: { value: new THREE.Vector4(2, 2, 0, 0) },  // xz of lava/sea contact + strength
  cloudShift:{ value: new THREE.Vector2(0.0, 0.0) }     // scrolling offset for cloud shadows
};
const bodyUniforms = {
  uTime:U.time, uSunDir:U.sunDir, uSunColor:U.sunColor, uAmbColor:U.ambColor, uSunI:U.sunI, uAmbI:U.ambI,
  uFogColor:U.fogColor, uFogDensity:U.fogDensity, uSkyTop:U.skyTop, uSkyHorizon:U.skyHorizon, uSunGlow:U.sunGlow,
  uCloudShift:U.cloudShift
};

/* =========================== canvas textures =========================== */
function cv(size){ const c = document.createElement('canvas'); c.width = c.height = size; return [c, c.getContext('2d')]; }
function toTex(canvas, rep, srgb){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (rep) t.repeat.set(rep, rep);
  t.anisotropy = 4;
  if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function px(ctx,S,fn){
  const img = ctx.createImageData(S,S), d = img.data;
  for (let y=0;y<S;y++) for (let x=0;x<S;x++){
    const o=(y*S+x)*4, c = fn(x/S, y/S, x, y);
    d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=c.length>3?c[3]:255;
  }
  ctx.putImageData(img,0,0);
}
/* tropical sand */
function makeSandTex(){
  const S=512,[c,ctx]=cv(S);
  px(ctx,S,(u,v)=>{
    const n=fbm2(u*8,v*8,5,3), n2=fbm2(u*30,v*30,3,9), sp=fbm2(u*110,v*110,2,21);
    let r=218+n*30+n2*16+sp*14, g=204+n*30+n2*16+sp*14, b=170+n*34+n2*18+sp*16;
    const coral=smoothstep(0.70,0.82,fbm2(u*44,v*44,3,44));
    r=lerp(r,236,coral*0.7); g=lerp(g,206,coral*0.7); b=lerp(b,190,coral*0.7);
    return [clamp(r,0,255),clamp(g,0,255),clamp(b,0,255)];
  });
  return toTex(c);
}
/* jungle canopy / ground cover */
function makeJungleTex(){
  const S=512,[c,ctx]=cv(S);
  px(ctx,S,(u,v)=>{
    const n=fbm2(u*10,v*10,5,51), m=fbm2(u*36,v*36,4,57), k=vnoise2(u*150,v*150,61);
    let r=34+n*46+m*26+k*18, g=74+n*70+m*40+k*26, b=30+n*34+m*20+k*14;
    const dry=smoothstep(0.62,0.9,fbm2(u*6,v*6,3,66));
    r=lerp(r,120,dry*.5); g=lerp(g,124,dry*.45); b=lerp(b,58,dry*.4);
    return [clamp(r,0,255),clamp(g,0,255),clamp(b,0,255)];
  });
  return toTex(c);
}
/* weathered basalt */
function makeBasaltTex(){
  const S=512,[c,ctx]=cv(S);
  px(ctx,S,(u,v)=>{
    const n=fbm2(u*7,v*7,5,71), grain=fbm2(u*46,v*46,3,77);
    const cr=Math.abs(fbm2(u*5.0,v*5.0,3,91)-0.5);
    const wid=0.018+0.03*fbm2(u*3.2+7,v*3.2,2,93);
    const crack=1-smoothstep(0.0,wid,cr);
    let g=76+n*46+grain*20;
    g=lerp(g,30,crack*0.62);
    const lichen=smoothstep(0.66,0.9,fbm2(u*9,v*9,4,120));
    return [clamp(g*1.02+lichen*10,0,255), clamp(g*0.99+lichen*16,0,255), clamp(g*0.94+lichen*6,0,255)];
  });
  return toTex(c);
}
/* palm frond with serrated alpha edge */
function makeFrondTex(){
  const S=256,[c,ctx]=cv(S);
  ctx.clearRect(0,0,S,S);
  const img=ctx.createImageData(S,S), d=img.data;
  for (let y=0;y<S;y++) for (let x=0;x<S;x++){
    const o=(y*S+x)*4, u=x/S, v=y/S;
    const w=0.5*(1 - 0.72*u);                       // tapers to the tip (u along the frond)
    const dx=Math.abs(v-0.5);
    const serr=0.5 + 0.5*Math.sin(u*88.0);          // leaflets
    const edge=w*(0.72+0.28*serr);
    const a=smoothstep(edge+0.035, edge-0.02, dx) * smoothstep(1.0,0.96,u) * smoothstep(0.0,0.04,u);
    const n=fbm2(u*14,v*9,4,301);
    const rib=1-smoothstep(0.0,0.05,dx);
    let r=36+n*36, g=76+n*62, b=26+n*24;
    g=lerp(g,152,rib*0.5); r=lerp(r,92,rib*0.35);
    d[o]=clamp(r,0,255); d[o+1]=clamp(g,0,255); d[o+2]=clamp(b,0,255); d[o+3]=clamp(a*255,0,255);
  }
  ctx.putImageData(img,0,0);
  return toTex(c);
}
/* broad tropical leaf (banana/taro) */
function makeLeafTex(){
  const S=256,[c,ctx]=cv(S);
  ctx.clearRect(0,0,S,S);
  const img=ctx.createImageData(S,S), d=img.data;
  for (let y=0;y<S;y++) for (let x=0;x<S;x++){
    const o=(y*S+x)*4, u=x/S, v=y/S;
    const w=Math.sin(Math.pow(1-v,0.6)*Math.PI)*0.46;
    const dx=Math.abs(u-0.5);
    const a=smoothstep(w,w-0.05,dx)*smoothstep(0.0,0.07,v)*smoothstep(1.0,0.93,v);
    const mid=1-smoothstep(0.0,0.035,dx);
    const n=fbm2(u*12,v*12,4,300);
    let r=30+n*40, g=88+n*74, b=32+n*28;
    g=lerp(g,186,mid*0.5); r=lerp(r,120,mid*0.25);
    d[o]=clamp(r,0,255); d[o+1]=clamp(g,0,255); d[o+2]=clamp(b,0,255); d[o+3]=clamp(a*255,0,255);
  }
  ctx.putImageData(img,0,0);
  return toTex(c);
}
/* thatch */
function makeThatchTex(){
  const S=256,[c,ctx]=cv(S);
  px(ctx,S,(u,v)=>{
    const n=fbm2(u*24+Math.sin(v*30)*.35, v*7, 4, 210);
    const straw=smoothstep(0.42,0.5,Math.abs(Math.sin(u*TAU*7.0+n*4.2)));
    let g=(128+n*70)*(0.62+0.38*straw);
    return [clamp(g*1.12,0,255), clamp(g*0.95,0,255), clamp(g*0.62,0,255)];
  });
  return toTex(c);
}
/* tileable detail normal (RG slope, B height) for water shimmer */
function makeDetailNormal(){
  const S=256,[c,ctx]=cv(S);
  const H=new Float32Array(S*S);
  for (let y=0;y<S;y++) for (let x=0;x<S;x++) H[y*S+x]=fbm2(x/S*6,y/S*6,4,7)*0.65 + fbm2(x/S*17,y/S*17,3,17)*0.35;
  const A=(x,y)=>H[((y+S)%S)*S+((x+S)%S)];
  px(ctx,S,(u,v,x,y)=>{
    const sx=(A(x+1,y)-A(x-1,y))*1.9, sy=(A(x,y+1)-A(x,y-1))*1.9;
    return [clamp(128+sx*128,0,255), clamp(128+sy*128,0,255), clamp(A(x,y)*255,0,255)];
  });
  return toTex(c,null,false);
}
/* soft radial sprite */
function makeSoftSprite(pow_){
  const S=128,[c,ctx]=cv(S);
  const g=ctx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  for (let i=0;i<=12;i++){ const t=i/12; g.addColorStop(t,`rgba(255,255,255,${Math.pow(1-t,pow_).toFixed(4)})`); }

/* billowing smoke puff (noisy, soft edges) */
function makeSmokeTex(){
  const S=256,[c,ctx]=cv(S);

    const n=fbm2(u*4.5,v*4.5,5,501)*0.75 + fbm2(u*11,v*11,3,511)*0.35;

}

function makeFoamTex(){

/* ---- damped orbit camera (self-contained: no addons) ---- */
class OrbitCam {
  constructor(cam, dom, target){
    this.cam = cam; this.dom = dom;
    this.target = target.clone();
    this.minDist = 18; this.maxDist = 240;
    this.minPolar = 0.16; this.maxPolar = 1.46;
    this.autoRotate = true; this.autoRotateSpeed = 0.055;
    this.dt = 1/60; this.onStart = null;
    this._ptrs = new Map(); this._pinch = 0;
    this.cur = new THREE.Spherical().setFromVector3(new THREE.Vector3().subVectors(cam.position, this.target));
    this.goal = this.cur.clone();
    this._v = new THREE.Vector3();
    this._bind();
  }
  _bind(){
    const d = this.dom;
    d.addEventListener('pointerdown', e => {
      try { d.setPointerCapture(e.pointerId); } catch(_){}
      this._ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if (this._ptrs.size === 2) this._pinch = this._pinchDist();
    });
    d.addEventListener('pointermove', e => {
      const p = this._ptrs.get(e.pointerId); if (!p) return;
      const dx = e.clientX-p.x, dy = e.clientY-p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (this._ptrs.size === 1){
        if (Math.abs(dx)+Math.abs(dy) > 1.5){
          this.goal.theta -= dx*0.0048; this.goal.phi -= dy*0.0048;
          this.goal.phi = clamp(this.goal.phi, this.minPolar, this.maxPolar);
          if (this.onStart) this.onStart();
        }
      } else if (this._ptrs.size === 2){
        const nd = this._pinchDist();
        if (this._pinch > 0){ this.goal.radius = clamp(this.goal.radius*(this._pinch/Math.max(nd,1)), this.minDist, this.maxDist); if (this.onStart) this.onStart(); }
        this._pinch = nd;
      }
    });
    const up = e => { this._ptrs.delete(e.pointerId); if (this._ptrs.size < 2) this._pinch = 0; };
    d.addEventListener('pointerup', up);
    d.addEventListener('pointercancel', up);
    d.addEventListener('pointerleave', up);
    d.addEventListener('wheel', e => {
      e.preventDefault();
      this.goal.radius = clamp(this.goal.radius*(1 + Math.sign(e.deltaY)*0.075), this.minDist, this.maxDist);
      if (this.onStart) this.onStart();
    }, { passive:false });
  }
  _pinchDist(){ const a=[...this._ptrs.values()]; return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y); }
  set(pos, tgt){
    if (tgt) this.target.copy(tgt);
    this.cur.setFromVector3(new THREE.Vector3().subVectors(pos, this.target));
    this.goal.copy(this.cur);
  }
  update(){
    const dt = Math.min(this.dt, 0.05), s = this.cur, g = this.goal;
    if (this.autoRotate) g.theta -= this.autoRotateSpeed*dt;
    s.theta = damp(s.theta, g.theta, dt, 0.14);
    s.phi = damp(s.phi, g.phi, dt, 0.14);
    s.radius = damp(s.radius, g.radius, dt, 0.16);
    s.phi = clamp(s.phi, this.minPolar, this.maxPolar);
    this._v.setFromSpherical(s).add(this.target);
    this.cam.position.copy(this._v);
    this.cam.lookAt(this.target);
  }
}

const CRATER_R = 5.4, PEAK = 23.5, ISLE_R = 30.0;
function volcanoProfile(r){
  if (r < CRATER_R) return PEAK - 5.2*(1 - (r/CRATER_R)*(r/CRATER_R));
  const t = clamp((r-CRATER_R)/(ISLE_R-CRATER_R), 0, 1);
  return PEAK * Math.pow(1-t, 1.55);
}
/* village pads: flat shelves carved into the leeward flank */
const VILLAGE_AZ = 2.55;
const PADS = [
  { a: VILLAGE_AZ-0.16, r: 19.5, rad: 4.6 },
  { a: VILLAGE_AZ+0.13, r: 20.5, rad: 4.2 },
  { a: VILLAGE_AZ+0.02, r: 24.5, rad: 4.0 },
  { a: VILLAGE_AZ-0.30, r: 22.0, rad: 3.4 }
];
function baseH(x,z){
  const r = Math.hypot(x,z), a = Math.atan2(z,x);
  let h = volcanoProfile(r);
  const ridge = fbm2(Math.cos(a)*3.1+5, Math.sin(a)*3.1-2, 4, 11) - 0.46;
  h += ridge * 3.4 * smoothstep(6.5, 14, r) * smoothstep(32, 21, r);
  h += (fbm2(x*0.32+9, z*0.32-4, 4, 21) - 0.5) * 1.8 * smoothstep(2, 9, r) * smoothstep(34, 24, r);
  h += (fbm2(x*1.25, z*1.25, 3, 31) - 0.5) * 0.5 * smoothstep(1.5, 7, r);
  /* beach + submerged shelf */
  h -= smoothstep(28.5, 40, r) * 10.5;
  h -= smoothstep(40, 90, r) * 13.0;
  h += (fbm2(x*0.09+3, z*0.09-7, 3, 41) - 0.5) * 2.4 * smoothstep(34, 60, r);
  return h;
}
for (const p of PADS){
  p.x = Math.cos(p.a)*p.r; p.z = Math.sin(p.a)*p.r;
  p.h = baseH(p.x, p.z) - 0.35;
}
function islandH(x,z){
  let h = baseH(x,z);
  if (x*x+z*z < 1400){
    for (let i=0;i<PADS.length;i++){
      const p = PADS[i];
      const d = Math.hypot(x-p.x, z-p.z);
      if (d < p.rad*2.1){ h = lerp(p.h, h, smoothstep(p.rad*0.62, p.rad*2.1, d)); }
    }
  }
  return h;
}
/* a worn path between the pads keeps the village readable */
function pathFactor(x,z){
  let best = 0;
  for (let i=0;i<PADS.length;i++) for (let j=i+1;j<PADS.length;j++){
    const A=PADS[i], B=PADS[j];
    const vx=B.x-A.x, vz=B.z-A.z, L=vx*vx+vz*vz;
    const t = clamp(((x-A.x)*vx + (z-A.z)*vz)/L, 0, 1);
    const dx = x-(A.x+vx*t), dz = z-(A.z+vz*t);
    best = Math.max(best, 1-smoothstep(1.4,2.6,Math.hypot(dx,dz)));
  }
  return best;
}

/* depth map for the ocean (R=depth, G=shore, B=floor tint) */
function buildDepthTexture(){
  const N=256, SPAN=140;
  const data = new Uint8Array(N*N*4);
  for (let j=0;j<N;j++) for (let i=0;i<N;i++){
    const x=(i/(N-1)-0.5)*SPAN, z=(j/(N-1)-0.5)*SPAN;
    const d = clamp(SEA_Y - islandH(x,z), 0, 26);
    const o=(j*N+i)*4;
    data[o]   = Math.round(clamp(d/3.0,0,1)*255);
    data[o+1] = Math.round(clamp((SEA_Y-islandH(x,z))/1.6,0,1)*255);
    data[o+2] = Math.round(fbm2(x*0.25,z*0.25,3,101)*255);
    data[o+3] = 255;
  }
  const t = new THREE.DataTexture(data, N, N, THREE.RGBAFormat);
  t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
  t.minFilter=t.magFilter=THREE.LinearFilter;
  t.needsUpdate = true;
  return { tex:t, span:SPAN };
}

/* ============================== island mesh ============================ */
function buildIsland(){
  const RMAX = 96, RN = Q.isleRings, SN = Q.isleSeg;
  const pos=[], col=[], blend=[], uv=[], lava=[], idx=[];
  const cSand=new THREE.Color(1.0,0.97,0.90), cGrass=new THREE.Color(0.55,0.72,0.42),
        cRock=new THREE.Color(0.60,0.60,0.62), cScorch=new THREE.Color(0.30,0.26,0.25);
  const tmp = new THREE.Color();
  for (let i=0;i<=RN;i++){
    const r = 40*Math.pow(i/RN, 1.35) + (RMAX-40)*Math.pow(Math.max(0,i/RN-0.42)/0.58, 1.6);
    for (let j=0;j<=SN;j++){
      const a = j/SN*TAU, x = Math.cos(a)*r, z = Math.sin(a)*r;
      const y = islandH(x,z);
      pos.push(x,y,z);
      uv.push(x*0.055, z*0.055);
      /* slope */
      const e = 0.7;
      const hx = islandH(x+e,z), hz = islandH(x,z+e);
      const slope = Math.hypot(hx-y, hz-y)/e;
      const above = y - SEA_Y;
      const dry = smoothstep(-0.5, 1.6, above);
      const rockW = smoothstep(0.55, 1.25, slope) * dry;
      const altW = smoothstep(11, 19, y);
      const jungleW = dry*(1-rockW)*smoothstep(1.2, 5.5, above);
      const sandW = Math.max(1-jungleW-rockW, 0.001);
      /* the trail through the village reads as bare earth */
      const path = pathFactor(x,z) * (1-rockW);
      const bw = [sandW + path*0.55, Math.max(jungleW - path*0.75, 0), rockW];
      blend.push(bw[0], bw[1], bw[2]);
      tmp.copy(cSand).lerp(cGrass, clamp(jungleW/(jungleW+sandW+0.001),0,1));
      tmp.lerp(cRock, rockW);
      tmp.lerp(cScorch, altW*0.55*(1-rockW*0.4));
      /* wet shoreline + underwater reef tint */
      const wet = 1-smoothstep(0.0, 1.1, above);
      if (above < 0.2) tmp.lerp(new THREE.Color(0.62,0.60,0.50), wet*0.5);
      const shade = 0.86 + 0.28*fbm2(x*0.35,z*0.35,3,92);
      col.push(tmp.r*shade, tmp.g*shade, tmp.b*shade);
      lava.push(0);
    }
  }
  const W = SN+1;
  for (let i=0;i<RN;i++) for (let j=0;j<SN;j++){
    const a=i*W+j, b=a+1, c=a+W, d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setAttribute('aBlend', new THREE.Float32BufferAttribute(blend,3));
  g.setAttribute('aLava', new THREE.Float32BufferAttribute(lava,1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

    void main(){

      albedo *= vCol;
      /* ecological patchwork + slope-driven basalt + gully shading */

      float micro = vn3(vec3(vWorld.xz*0.42, 1.1));
      float fine  = vn3(vec3(vWorld.xz*1.7, 2.6));
      albedo *= mix(0.70, 1.26, zone) * mix(0.86, 1.14, micro) * mix(0.93, 1.08, fine);
      float slope = 1.0 - clamp(N.y, 0.0, 1.0);

      albedo = mix(albedo, vec3(0.185,0.165,0.155)*mix(0.75,1.35,micro), rockW*0.88);
      albedo *= mix(0.52, 1.0, smoothstep(0.50, 0.94, vn3(vec3(vWorld.xz*0.115, 7.3))));
      float above = vWorld.y - uSeaY;

        albedo *= mix(1.0, 0.55, d);

      vec3 col = lit(albedo, N, 0.92);
      /* cooled / hot lava crust near the vents */
      float hot = clamp(vLava * uLavaGlow, 0.0, 1.4);
      col = mix(col, col*0.35 + vec3(0.06,0.03,0.02), clamp(vLava*1.2,0.0,1.0)*0.8);
      col += uLavaCol * hot * (0.55 + 0.85*vn3(vec3(vWorld.xz*3.0, uTime*0.7)));
      /* freshly fallen ash greys the island out */
      float ash = uAsh * (0.55 + 0.5*vn3(vec3(vWorld.xz*1.2, 0.0))) * smoothstep(-1.0, 3.0, above);
      col = mix(col, vec3(0.34,0.32,0.31)*max(N.y,0.35)*(uSunI*0.9+uAmbI), clamp(ash,0.0,1.0));
      col *= mix(0.62, 1.0, cloudShade(vWorld.xz));
      col = applyFog(col, distance(cameraPosition, vWorld));
      gl_FragColor = vec4(col, 1.0);
      ${GLSL_OUT}
    }`
});

const LAVA_N = 5;
const lavaFlows = [];
function flowPath(seed, fromR, toR, steps){
  const pts = [];
  let a = seed*TAU + 0.4;
  for (let i=0;i<=steps;i++){
    const t = i/steps;
    const r = lerp(fromR, toR, t);
    a += (fbm2(t*3.1+seed*7, t*1.7, 3, 55) - 0.5) * 0.34;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    pts.push({ x, z, r, a, t });
  }
  return pts;
}
function buildFlowMesh(pts, width, seed){
  const NU = pts.length, NV = 7;
  const pos=[], uv=[], idx=[], lav=[];
  for (let i=0;i<NU;i++){
    const p = pts[i];
    const px = Math.cos(p.a + Math.PI/2), pz = Math.sin(p.a + Math.PI/2);
    const w = width * (0.55 + 0.85*Math.sin(Math.pow(p.t,0.75)*Math.PI)) * (1 - 0.35*p.t);
    for (let j=0;j<NV;j++){
      const q = j/(NV-1)*2-1;
      const wob = (fbm2(p.t*9+seed, q*1.6, 2, 66)-0.5)*0.9;
      const x = p.x + px*(q*w + wob), z = p.z + pz*(q*w + wob*0.6);
      const y = islandH(x,z) + 0.22 + 0.16*(1-Math.abs(q));
      pos.push(x,y,z);
      uv.push(j/(NV-1), p.t);
      lav.push(p.t);
    }
  }
  for (let i=0;i<NU-1;i++) for (let j=0;j<NV-1;j++){
    const a=i*NV+j, b=a+1, c=a+NV, d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('aT', new THREE.Float32BufferAttribute(lav,1));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const flowUniformsBase = Object.assign({
  uLavaColA:{value:new THREE.Color(1.0,0.28,0.02)}, uLavaColB:{value:new THREE.Color(1.0,0.74,0.26)},
  uCrust:{value:new THREE.Color(0.10,0.08,0.08)}
}, bodyUniforms);
for (let k=0;k<LAVA_N;k++){
  const seed = k/LAVA_N;
  const startR = CRATER_R*0.55 + rr(0.6,2.0);
  const endR = [30.5, 22.0, 27.5, 18.0, 29.0][k] + rr(-1.5,1.5);
  const pts = flowPath(seed, startR, endR, 34);
  const geo = buildFlowMesh(pts, rr(2.1,3.2), seed*9);
  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign({
      uReveal:{value:0}, uGlow:{value:1}, uSeed:{value:seed*13.7}, uTime:U.time,
      uSeaY:U.seaY, uAsh:U.ash

    transparent:false, side:THREE.DoubleSide,
    vertexShader: /* glsl */`

    fragmentShader: /* glsl */`
      varying float vT; varying vec2 vUv; varying vec3 vWorld; varying vec3 vNrm;
      uniform float uReveal, uGlow, uSeed, uTime, uSeaY, uAsh;
      uniform vec3 uLavaColA, uLavaColB, uCrust;
      ${GLSL_NOISE}
      ${GLSL_FOG}

      void main(){
        if (vT > uReveal) discard;

        float streak = fbm3(vec3(vUv.x*3.6, vUv.y*14.0 - uTime*0.42, uSeed), 4);
        float grain  = fbm3(vec3(vUv.x*11.0, vUv.y*26.0 + uTime*0.06, uSeed*1.7), 3);
        float vein2  = fbm3(vec3(vUv.x*7.5, vUv.y*27.0 - uTime*0.78, uSeed*2.3), 3);

        float lead   = clamp(1.0 - (uReveal - vT)*2.6, 0.0, 1.0);   /* advancing molten tongue */
        float heat   = clamp(cracks*1.10 + lead*0.60, 0.0, 1.0);

        col *= mix(0.75, 1.0, edge);

        gl_FragColor = vec4(col, 1.0);
        ${GLSL_OUT}
      }`

  mesh.renderOrder = 1;
  mesh.frustumCulled = false;
  scene.add(mesh);

}

(function bakeLava(){
  const pos = islandGeo.attributes.position, lav = islandGeo.attributes.aLava;
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if (y < -1) { lav.setX(i, 0); continue; }
    let f = 0;
    for (const fl of lavaFlows){
      for (let k=0;k<fl.pts.length;k+=3){
        const p = fl.pts[k];
        const d = Math.hypot(x-p.x, z-p.z);
        if (d < 5.5){ const t = 1-d/5.5; if (t*t > f) f = t*t; }
      }
    }
    /* the crater itself always reads hot */
    const dc = Math.hypot(x, z);
    if (dc < CRATER_R*2.4){ const t = 1-dc/(CRATER_R*2.4); f = Math.max(f, t*t*1.1); }
    lav.setX(i, f);
  }
  lav.needsUpdate = true;
})();

function spritePoints(count, size, tex, blending, extra, vs, fs){

  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed,3));
  g.setAttribute('aS', new THREE.BufferAttribute(s1,1));

    uniforms: Object.assign({ uMap:{value:tex}, uSize:{value:size}, uProj:{value:800}, uTime:U.time }, extra||{}),

/* --- palms: one merged geometry, instanced --- */
function buildPalmGeometry(){
  const pos=[], nrm=[], uv=[], sway=[], tint=[], idx=[];
  const H = rr(6.0, 8.4);
  const pushV = (x,y,z,nx,ny,nz,u,v,sw,tr) => { pos.push(x,y,z); nrm.push(nx,ny,nz); uv.push(u,v); sway.push(sw); tint.push(...tr); };
  /* trunk: tapered, gently curved tube */
  const RS = 9, SEG = 7;
  const bend = rr(-0.9, 0.9), bend2 = rr(-0.8, 0.8);
  for (let i=0;i<=RS;i++){
    const t = i/RS, y = t*H;
    const r = 0.30*(1-0.42*t) * (1 + 0.14*Math.sin(t*9.0));
    const cx = bend*t*t, cz = bend2*t*t;
    for (let j=0;j<=SEG;j++){
      const a = j/SEG*TAU;
      const nx = Math.cos(a), nz = Math.sin(a);
      pushV(cx+nx*r, y, cz+nz*r, nx, 0.12, nz, j/SEG, t*6.0, Math.pow(t,1.5), [0.42+0.14*t, 0.32+0.10*t, 0.21+0.06*t]);
    }
  }
  const TW = SEG+1;
  for (let i=0;i<RS;i++) for (let j=0;j<SEG;j++){
    const a=i*TW+j, b=a+1, c=a+TW, d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  /* crown */
  const crownY = H, crownX = bend, crownZ = bend2;
  /* coconuts */
  for (let c=0;c<3;c++){
    const a = c/3.0*TAU + 0.7;
    const cx0 = crownX + Math.cos(a)*0.34, cz0 = crownZ + Math.sin(a)*0.34, cy0 = crownY - 0.24;
    const base = pos.length/3, R = 0.21, RS2 = 4, SG2 = 6;
    for (let i=0;i<=RS2;i++) for (let j=0;j<=SG2;j++){
      const th = i/RS2*Math.PI, ph = j/SG2*TAU;
      const nx = Math.sin(th)*Math.cos(ph), ny = Math.cos(th), nz = Math.sin(th)*Math.sin(ph);
      pushV(cx0+nx*R, cy0+ny*R, cz0+nz*R, nx, ny, nz, 0.1, 0.1, 1.0, [0.30,0.22,0.13]);
    }
    for (let i=0;i<RS2;i++) for (let j=0;j<SG2;j++){
      const a2=base+i*(SG2+1)+j, b2=a2+1, c2=a2+SG2+1, d2=c2+1;
      idx.push(a2,b2,c2, b2,d2,c2);
    }
  }
  /* fronds */
  const FR = 8, FS = 8, FW = 2;
  for (let f=0; f<FR; f++){
    const a = f/FR*TAU + rr(-0.16,0.16);
    const droop = rr(0.86, 1.22);
    const len = rr(3.1, 3.9);
    const base = pos.length/3;
    for (let i=0;i<=FS;i++){
      const t = i/FS;
      const y = 3.05*t*0.92 - 3.75*droop*t*t;
      const rad = len*t;
      const cx0 = crownX + Math.cos(a)*rad, cz0 = crownZ + Math.sin(a)*rad, cy0 = crownY + y;
      const wHalf = 0.46*(1-0.30*t)*Math.pow(t<0.14 ? t/0.14 : 1, 0.5)*(1-0.72*t)*1.9 + 0.02;
      for (let j=0;j<=FW;j++){
        const q = j/FW*2-1;
        const px = -Math.sin(a), pz = Math.cos(a);
        const fold = -0.10*Math.abs(q);
        pushV(cx0 + px*wHalf*q, cy0 + fold, cz0 + pz*wHalf*q,
              0.0, 1.0, 0.0, t, (q+1)/2, 1.0,
              [0.30+0.16*t, 0.62+0.20*t, 0.24+0.08*t]);
      }
    }
    for (let i=0;i<FS;i++) for (let j=0;j<FW;j++){
      const a2=base+i*(FW+1)+j, b2=a2+1, c2=a2+FW+1, d2=c2+1;
      idx.push(a2,b2,c2, b2,d2,c2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute('aSw', new THREE.Float32BufferAttribute(sway,1));
  g.setAttribute('aTint', new THREE.Float32BufferAttribute(tint,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(tint,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

      col = applyFog(col, distance(cameraPosition, vWorld));
      gl_FragColor = vec4(col, 1.0);
      ${GLSL_OUT}
    }`
});
function instancedField(geo, mat, count, place, perInstanceAttrs){
  const g2 = geo.clone();

function foliageMat(map, alphaTest, sway, colA, colB, tip){

function buildBoatGeo(){
  const pos=[], nrm=[], col=[], idx=[];
  const NU=16, NV=11;
  const prof = t => {                   // hull half-width / depth along the length
    const k = Math.sin(Math.pow(t,0.85)*Math.PI);
    return { w:0.95*Math.pow(k,0.55)+0.02, d:0.62*Math.pow(k,0.5)+0.03 };
  };
  for (let i=0;i<=NU;i++){
    const t=i/NU, z=(t-0.5)*5.4, p=prof(t);
    for (let j=0;j<=NV;j++){
      const q=j/NV, th=q*Math.PI;
      const x = Math.cos(th)*p.w*(1-0.12*q*0), y = -Math.sin(th)*p.d*(0.55+0.45*Math.sin(th));
      pos.push(x, y, z); nrm.push(0,1,0);
      const sh = 0.52 + 0.30*(1-Math.abs(q-0.5)*2);
      col.push(sh*1.05, sh*0.82, sh*0.60);
    }
  }
  const W=NV+1;
  for (let i=0;i<NU;i++) for (let j=0;j<NV;j++){
    const a=i*W+j,b=a+1,c=a+W,d=c+1; idx.push(a,b,c,b,d,c);
  }
  /* gunwale rail */
  const RB = pos.length/3;
  for (let i=0;i<=NU;i++){
    const t=i/NU, z=(t-0.5)*5.4, p=prof(t);
    pos.push(p.w, 0.03, z); col.push(0.42,0.28,0.16);
    pos.push(p.w*1.06, 0.14, z); col.push(0.36,0.23,0.13);
    pos.push(-p.w, 0.03, z); col.push(0.42,0.28,0.16);
    pos.push(-p.w*1.06, 0.14, z); col.push(0.36,0.23,0.13);
  }
  for (let i=0;i<NU;i++){
    const a0=RB+i*4, b0=a0+4;
    idx.push(a0,a0+1,b0, a0+1,b0+1,b0);       // starboard
    idx.push(a0+2,b0+2,a0+3, a0+3,b0+2,b0+3); // port
  }
  /* deck floor */
  const FB = pos.length/3;
  const FSEG=8;
  for (let i=0;i<=FSEG;i++) for (let j=0;j<=FSEG;j++){
    const t=i/FSEG, q=j/FSEG, p=prof(t);
    const x=(q-0.5)*2*p.w*1.5, z=(t-0.5)*5.4;
    pos.push(x, -0.14, z); col.push(0.50,0.37,0.22);
  }
  for (let i=0;i<FSEG;i++) for (let j=0;j<FSEG;j++){
    const a=FB+i*(FSEG+1)+j,b=a+1,c=a+FSEG+1,d=c+1; idx.push(a,b,c,b,d,c);
  }
  /* mast + boom as thin boxes */
  const addBox = (cx,cy,cz,ex,ey,ez,r,g,b)=>{
    const base=pos.length/3;
    for (let i=0;i<8;i++){
      const sx=(i&1)?1:-1, sy=(i&2)?1:-1, sz=(i&4)?1:-1;
      pos.push(cx+sx*ex, cy+sy*ey, cz+sz*ez); col.push(r,g,b);
    }
    const F=[[0,2,3],[0,3,1],[4,5,7],[4,7,6],[0,1,5],[0,5,4],[2,6,7],[2,7,3],[0,4,6],[0,6,2],[1,3,7],[1,7,5]];
    for (const f of F) idx.push(base+f[0], base+f[1], base+f[2]);
  };
  addBox(0, 1.55, 0.5, 0.075, 1.7, 0.075, 0.38, 0.26, 0.15);
  addBox(0, 0.55, -0.6, 0.06, 0.06, 1.5, 0.38, 0.26, 0.15);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function updateBoats(dt, t, er){
  for (const b of boats){
    /* flee back to calm */
    const homeA = Math.atan2(b.home.z, b.home.x);
    const rad = Math.hypot(b.pos.x, b.pos.z);
    let desiredHeading;
    if (er > 0.05){
      /* run for open water, then heave to and watch the island burn */
      const goR = Math.hypot(b.home.x, b.home.z) + 34;
      if (rad < goR){ desiredHeading = homeA; b.targetSpeed = 3.0 + 2.6*er; }
      else { desiredHeading = homeA + Math.PI*0.5; b.targetSpeed = 0.42; }
    } else {
      /* sail back toward the home radius */
      const dr = Math.hypot(b.home.x-b.pos.x, b.home.z-b.pos.z);
      desiredHeading = dr > 2.0 ? Math.atan2(b.home.x-b.pos.x, b.home.z-b.pos.z) : homeA + Math.PI/2;
      b.targetSpeed = dr > 2.0 ? 1.5 : 0.3;
    }
    const diff = shortAngle(desiredHeading - b.heading);
    b.heading += clamp(diff, -0.55*dt*(1+2*er), 0.55*dt*(1+2*er));
    b.speed = damp(b.speed, b.targetSpeed, dt, 0.9);
    b.pos.x += Math.sin(b.heading)*b.speed*dt;
    b.pos.z += Math.cos(b.heading)*b.speed*dt;
    const rad2 = Math.hypot(b.pos.x, b.pos.z);
    if (rad2 > 250){ b.pos.multiplyScalar(250/rad2); }
    /* ride the swell */
    const h = oceanH(b.pos.x, b.pos.z, t);
    const hx = oceanH(b.pos.x+0.6, b.pos.z, t), hz = oceanH(b.pos.x, b.pos.z+0.6, t);
    const nX = -(hx-h)/0.6, nZ = -(hz-h)/0.6;
    b.pos.y = h + 0.36;              /* freeboard: lift the hull so its topsides clear the water */
    b.g.position.copy(b.pos);
    b.g.rotation.order = 'YXZ';
    b.g.rotation.y = b.heading;
    b.heel = damp(b.heel, clamp(-diff*0.9, -0.35, 0.35) + Math.sin(t*0.7+b.phase)*0.06, dt, 0.7);
    b.g.rotation.z = b.heel;
    b.g.rotation.x = clamp(-Math.atan2(b.speed*0.25, 1)*0.5, -0.25, 0.25) + nX*0.35;
    /* sail unfurls when fleeing */
    b.unfurl = damp(b.unfurl, er > 0.05 ? 1 : 0.12, dt, er > 0.05 ? 1.6 : 3.0);
    const full = 1.0;
    b.sail.scale.set(1, lerp(0.16, 1.0, b.unfurl), 1);
    b.sail.position.y = 1.35 + 1.2*b.unfurl;
    b.sail.rotation.z = Math.sin(t*1.2 + b.phase)*0.05*b.unfurl;
    /* wake foam */
    const wv = clamp(b.speed/3.2, 0, 1);
    b.wakeL.material.opacity = b.wakeR.material.opacity = 0.30*wv;
    const ws = 1 + 0.5*b.unfurl;
    b.wakeL.scale.set(4.2*ws, 7.0 + 7*wv, 1);
    b.wakeR.scale.set(4.2*ws, 7.0 + 7*wv, 1);
  }
}

const PAL_CALM = {

const PAL_ERUPT = {
  sunColor:0xff7a3c, sunGlow:0xff4a12, sunI:0.42,
  skyTop:0x2a1c1c, skyHorizon:0x8a4218, ashTint:0x3a2a22, ash:1,
  ambColor:0x8a5a48, ambI:0.34, fogColor:0x6a4732, fogDensity:0.0068,
  exposure:0.98, hemiSky:0x8a4a34, hemiGround:0x2a201a, hemiI:0.42
};
const CKEYS = ['sunColor','sunGlow','skyTop','skyHorizon','ashTint','ambColor','fogColor','hemiSky','hemiGround'];
const NKEYS = ['sunI','ambI','fogDensity','exposure','ash','hemiI'];
const state = {
  erupt:0, target:0, blast:0, stage:'dormant', startedAt:-1,
  cur:{}, tgt:{}, cameraShake:0
};
(function initState(){
  for (const k of CKEYS){ state.cur[k] = new THREE.Color(PAL_CALM[k]); state.tgt[k] = new THREE.Color(PAL_CALM[k]); }
  for (const k of NKEYS){ state.cur[k] = PAL_CALM[k]; state.tgt[k] = PAL_CALM[k]; }
})();
function stepState(dt){
  const e = state.erupt;
  for (const k of CKEYS) state.cur[k].lerp(state.tgt[k], 1-Math.exp(-dt/(1.4 + e*2.6)));
  for (const k of NKEYS) state.cur[k] = damp(state.cur[k], state.tgt[k], dt, k==='ash'? 3.5 : 1.8);
  const c = state.cur;
  U.sunColor.value.copy(c.sunColor); U.sunGlow.value.copy(c.sunGlow); U.skyTop.value.copy(c.skyTop);
  U.skyHorizon.value.copy(c.skyHorizon); U.ashTint.value.copy(c.ashTint); U.ambColor.value.copy(c.ambColor);
  U.fogColor.value.copy(c.fogColor); U.sunI.value = c.sunI; U.ambI.value = c.ambI;
  U.fogDensity.value = c.fogDensity; U.ash.value = c.ash;
  scene.fog.color.copy(c.fogColor); scene.fog.density = c.fogDensity;
  renderer.toneMappingExposure = c.exposure;
  sun.color.copy(c.sunColor); sun.intensity = 2.1*c.sunI;
  sun.position.copy(U.sunDir.value).multiplyScalar(120);
  hemi.color.copy(c.hemiSky); hemi.groundColor.copy(c.hemiGround); hemi.intensity = c.hemiI*1.1;
  U.lavaGlow.value = e;
  U.erupt.value = e;
  lavaLight.intensity = e*(9.0 + 5.0*Math.sin(U.time.value*7.0)*0.4) + 0.4;
  lavaLight.position.set(0, CRATER_Y + 2.0, 0);
  oceanUniforms.uLavaGlow.value = e;
  islandMat.uniforms.uLavaGlow.value = e*0.9;
}
function setEruptState(on){
  state.target = on ? 1 : 0;
  state.stage = on ? 'erupting' : 'dormant';
  state.startedAt = U.time.value;
  if (on){
    state.blast = 1;
    /* stagger the flows so the lava creeps down the flanks */
    for (let i=0;i<lavaFlows.length;i++){
      const f = lavaFlows[i];
      f.startAt = U.time.value + 1.2 + i*1.55 + rr(0, 0.9);
      f.speed = 1/(6.5 + i*0.8);
      f.target = 1;
    }
  } else {
    for (const f of lavaFlows) f.target = 0;
  }
  for (const k of CKEYS) state.tgt[k].set(on ? PAL_ERUPT[k] : PAL_CALM[k]);
  for (const k of NKEYS) state.tgt[k] = on ? PAL_ERUPT[k] : PAL_CALM[k];
  envPending = on ? 3.4 : 2.0;
  updateHud();
}
/* lava -> sea contact point: end of the first flow that reaches the shore */
function updateShoreGlow(){
  const f = lavaFlows[0];
  const p = f.pts[f.pts.length-1];
  const reached = clamp((f.reveal - 0.985)*60, 0, 1);
  const heat = reached * state.erupt;
  U.shoreGlow.value.set(p.x, p.z, heat, 0);
  steam.material.uniforms.uOrigin.value.set(p.x, SEA_Y + 0.6, p.z);
  steam.material.uniforms.uErupt.value = heat;
}
function updateHud(){
  const el = document.getElementById('status');
  const active = state.target > 0.5;
  document.getElementById('erupt').disabled = active;
  if (!active){
    el.innerHTML = 'Dormant &middot; ' + boats.length + ' boats at anchor';
  } else {
    const n = lavaFlows.filter(f => f.reveal > 0.02).length;
    el.innerHTML = 'ERUPTING &middot; lava flow ' + n + ' of ' + lavaFlows.length + ' &middot; boats fleeing';
  }
}

/* ============================= interactions =========================== */
document.getElementById('erupt').addEventListener('click', () => { if (state.target < 0.5) setEruptState(true); });
document.getElementById('reset').addEventListener('click', () => {
  setEruptState(false);
  userMoved = false;
  controls.autoRotate = true;
  document.getElementById('orbit').setAttribute('aria-pressed','true');
  const v = innerHeight > innerWidth*1.02 ? VIEW.port : VIEW.land;
  controls.set(v.pos, v.tgt);
  envPending = 2.2;
});
document.getElementById('orbit').addEventListener('click', (ev) => {
  const on = ev.currentTarget.getAttribute('aria-pressed') !== 'true';
  ev.currentTarget.setAttribute('aria-pressed', String(on));
  controls.autoRotate = on;
  userMoved = !on;
  if (on) autoResume = 0;
});
addEventListener('keydown', e => {
  if (e.key === 'e' || e.key === 'E') document.getElementById('erupt').click();
  if (e.key === 'r' || e.key === 'R') document.getElementById('reset').click();
});

/* ================================ resize ============================== */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(devicePixelRatio, Q.dpr));
  camera.aspect = w/h;
  const portrait = h > w*1.02;
  camera.fov = portrait ? 56 : 42;
  camera.updateProjectionMatrix();
  if (!userMoved) controls.set(portrait ? VIEW.port.pos : VIEW.land.pos, (portrait ? VIEW.port : VIEW.land).tgt);
  const proj = (h * renderer.getPixelRatio()) / (2*Math.tan(camera.fov*0.5*D2R));
  [smoke, embers, bombs, ashFall, steam, fumarole].forEach(p => {
    p.material.uniforms.uProj.value = proj;
  });
  controls.update();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 240));

/* ================================ loop ================================ */
let last = performance.now(), fpsAcc = 0, fpsN = 0, measuredFps = 0, lastFrameMs = 0, paused = false, simMs = 0, hudAcc = 0;
const _sv = new THREE.Vector3();
function tick(now){
  const raw = (now-last)/1000; last = now;
  let dt = Math.min(raw, 0.05);
  if (paused) dt = 0;
  const t0 = performance.now();
  U.time.value += dt;
  const t = U.time.value;
  U.cloudShift.value.set(t*0.0027, t*0.00115);
  hudAcc += dt; if (hudAcc > 0.25){ hudAcc = 0; updateHud(); }

  /* eruption envelope */
  state.erupt = damp(state.erupt, state.target, dt, state.target > state.erupt ? 1.05 : 2.2);
  state.blast = Math.max(0, state.blast - dt*0.55);
  state.cameraShake = state.blast*0.75 + state.erupt*0.10;
  for (const f of lavaFlows){
    if (state.target > 0.5 && t > f.startAt) f.reveal = Math.min(1, f.reveal + dt*f.speed);
    else if (state.target < 0.5) f.reveal = Math.max(0, f.reveal - dt*0.42);
    f.mat.uniforms.uReveal.value = f.reveal;
    f.mat.uniforms.uGlow.value = 0.55 + 0.85*state.erupt;
  }
  stepState(dt);

  controls.autoRotate = controls.autoRotate || (!userMoved || performance.now() > autoResume);
  controls.dt = dt; controls.update();
  sky.position.copy(camera.position);

  if (envPending > 0){ envPending -= dt; if (envPending <= 0) captureEnv(); }

  updateBoats(dt, t, state.erupt);
  updateBirds(dt, t, state.erupt);
  updateShoreGlow();

  /* sprites follow the camera-facing sun */
  sunSprite.position.copy(camera.position).addScaledVector(U.sunDir.value, 600);
  sunSprite.material.opacity = (0.30 + 0.30*(1-state.cur.ash))*0.9;
  /* flames flicker */
  for (let i=0;i<flames.length;i++){
    const f = flames[i];
    const fl = 0.78 + 0.30*Math.sin(t*11.0 + f.ph) + 0.10*Math.sin(t*27.0 + f.ph*2.1);
    f.s.scale.setScalar(f.base*fl);
    f.s.material.opacity = 0.55 + 0.35*fl;
    f.s.position.y = f.y + Math.sin(t*1.5 + f.ph)*0.06;
  }
  if (window.__fireLight){
    const l = window.__fireLight;
    l.intensity = 0.9 + 0.45*Math.sin(t*9.0) + 0.2*Math.sin(t*23.0);
  }
  /* camera rumble */
  if (state.cameraShake > 0.001){
    const s = state.cameraShake;
    _sv.set(
      Math.sin(t*23.7)*0.55 + Math.sin(t*11.3)*0.45,
      Math.sin(t*19.1+1.7)*0.55 + Math.sin(t*7.9)*0.45,
      Math.sin(t*27.3+3.1)*0.55 + Math.sin(t*13.7)*0.45
    ).multiplyScalar(s);
    camera.position.add(_sv);
  }
  simMs = simMs*0.9 + (performance.now()-t0)*0.1;
  renderer.render(scene, camera);
  lastFrameMs = performance.now()-now;
  fpsAcc += raw; fpsN++;
  if (fpsAcc > 0.5){ measuredFps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; }
}

/* ================================ boot ================================ */
function boot(){
  window.__scene = scene; window.__three = THREE; window.__cam = camera; window.__ren = renderer;
  applyAshUniforms();
  stepState(0.016);
  captureEnv();
  resize();
  updateHud();
  renderer.setAnimationLoop(tick);
  setTimeout(() => document.getElementById('veil').classList.add('gone'), 400);
  window.__app.ready = true;
}
function applyAshUniforms(){ /* placeholders kept for clarity */ }
window.__app = {
  ready:false,
  erupt: () => document.getElementById('erupt').click(),
  reset: () => document.getElementById('reset').click(),
  setErupt: (b) => setEruptState(!!b),
  boats: () => boats.map(b => ({ x:+b.pos.x.toFixed(2), z:+b.pos.z.toFixed(2), r:+Math.hypot(b.pos.x,b.pos.z).toFixed(2), heading:+b.heading.toFixed(2), speed:+b.speed.toFixed(2), unfurl:+b.unfurl.toFixed(2) })),
  lava: () => lavaFlows.map(f => +f.reveal.toFixed(3)),
  params: () => ({
    fps:measuredFps, frameMs:lastFrameMs, simMs, stage:state.stage, erupt:+state.erupt.toFixed(3),
    shake:+state.cameraShake.toFixed(3), ash:+state.cur.ash.toFixed(3), lava:lavaFlows.map(f=>+f.reveal.toFixed(2)),
    shoreGlow:+U.shoreGlow.value.z.toFixed(2),
    sun:{ dir:U.sunDir.value.toArray().map(v=>+v.toFixed(3)), intensity:+state.cur.sunI.toFixed(3) },
    fog:{ color:state.cur.fogColor.getHexString(), density:+state.cur.fogDensity.toFixed(5) },
    boats:boats.map(b=>+Math.hypot(b.pos.x,b.pos.z).toFixed(1)),
    camera:{ pos:camera.position.toArray().map(v=>+v.toFixed(2)), dist:+camera.position.distanceTo(controls.target).toFixed(2), autoRotate:controls.autoRotate },
    render:{ calls:renderer.info.render.calls, triangles:renderer.info.render.triangles },
    quality: COARSE ? 'mobile':'desktop', pixelRatio:renderer.getPixelRatio()
  }),
  debug: {
    errors: () => window.__errors.slice(),
    setCam: (p, t) => { userMoved = true; controls.set(new THREE.Vector3(p[0],p[1],p[2]), new THREE.Vector3(t[0],t[1],t[2])); controls.update(); },
    pause: () => { paused = true; }, resume: () => { paused = false; },
    parts: (name, vis) => {
      const map = { island, ocean, sky, palms, leaves, bushes, rocks, huts, lava:lavaFlows.map(f=>f.mesh),
        smoke, embers, bombs, ashFall, steam, fumarole, craterPool, boats:boatGroup, birds:birds.map(b=>b.g), dock:null };
      const o = map[name];
      if (Array.isArray(o)) o.forEach(m => { if (m) m.visible = vis; });
      else if (o && o.isObject3D) o.visible = vis;
      return !!o;
    },
    setU: (which, name, v) => {
      const m = { ocean:oceanMat, island:islandMat, sky:skyMat, smoke:smoke.material }[which];
      if (!m || !m.uniforms[name]) return false;
      m.uniforms[name].value = v; return true;
    },
    terrainH: (x,z) => islandH(x,z),
    seaH: (x,z) => oceanH(x, z, U.time.value),
    bench: (n) => {
      n = n || 30;
      const gl = renderer.getContext();
      renderer.render(scene, camera); gl.finish();
      const t0 = performance.now();
      for (let i=0;i<n;i++){
        const dt = 1/60; U.time.value += dt;
        stepState(dt); updateBoats(dt, U.time.value, state.erupt); updateBirds(dt, U.time.value, state.erupt);
        for (const f of lavaFlows) f.mat.uniforms.uReveal.value = f.reveal;
        renderer.render(scene, camera);
      }
      gl.finish();
      return { msPerFrame: +((performance.now()-t0)/n).toFixed(2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
    },
    three: THREE.REVISION
  }
};
try { boot(); } catch(e){ fail(e); console.error(e); }
</script>

let eatenCount = 0, fedCount = 0;
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s = new THREE.Vector3();
const _eL = new THREE.Euler(0,0,0,'YXZ');
function dropFood(x, z, n){
  n = n || 7;
  for (let i=0;i<n;i++){
    if (pellets.length >= FOOD_MAX) break;
    const a = rnd()*TAU, r = Math.pow(rnd(),0.8)*0.85;
    const px = x + Math.cos(a)*r, pz = z + Math.sin(a)*r;
    pellets.push({
      pos: new THREE.Vector3(px, rr(1.5, 3.0), pz),
      vel: new THREE.Vector3(0,0,0),
      state: 'fall', age: 0, spin: rnd()*TAU, sink: 0, dead: false, claimed: null,
      size: rr(0.8, 1.25)
    });
    fedCount++;
  }
  updateStatus();
}
function updateFood(dt, t){
  for (const p of pellets){
    p.age += dt;
    p.spin += dt*0.9;
    if (p.state === 'fall'){
      p.vel.y -= 9.0*dt;
      p.pos.y += p.vel.y*dt;
      const wy = waterH(p.pos.x, p.pos.z, t);
      if (p.pos.y <= wy + 0.02){
        p.pos.y = wy + 0.02; p.state = 'float'; p.vel.set(0,0,0);
        addRipple(p.pos.x, p.pos.z, 0.85);
        spawnBurst(p.pos.x, wy + 0.05, p.pos.z);
      }
    } else if (p.state === 'float'){
      p.pos.y = waterH(p.pos.x, p.pos.z, t) + 0.018;
      p.pos.x += Math.sin(t*0.7 + p.spin)*0.0018;
      p.pos.z += Math.cos(t*0.6 + p.spin)*0.0018;
      if (p.age > 26){ p.state = 'sink'; }
    } else if (p.state === 'sink'){
      p.pos.y -= dt*0.055;
      p.sink += dt;
      if (p.sink > 14 || p.pos.y < terrainH(p.pos.x,p.pos.z)+0.05) p.dead = true;
    } else if (p.state === 'eaten'){
      p.sink += dt;
      if (p.sink > 0.25) p.dead = true;
    }
  }
  // claims
  for (const f of fish){
    if (f.pellet && (f.pellet.dead || f.pellet.state !== 'float')){ f.pellet = null; f.state = 'cruise'; }
  }
  for (const p of pellets){
    if (p.dead || p.state !== 'float') continue;
    if (p.claimed && p.claimed.pellet === p) continue;
    let best = null, bd = 1e9;
    for (const f of fish){
      if (f.pellet) continue;
      const d = Math.hypot(f.pos.x-p.pos.x, f.pos.z-p.pos.z);
      if (d < bd){ bd = d; best = f; }
    }
    if (best && bd < 13){
      p.claimed = best; best.pellet = p; best.state = 'seek';
    }
  }
  // eating
  for (const f of fish){
    const p = f.pellet;
    if (!p || p.dead) { if (f.state==='seek'){ f.state='cruise'; f.pellet=null; } continue; }
    const d = Math.hypot(f.pos.x-p.pos.x, f.pos.z-p.pos.z);
    if (d < 0.42){
      p.state = 'eaten'; p.claimed = null;
      eatenCount++;
      f.eat(p);
      spawnBurst(p.pos.x, p.pos.y, p.pos.z);
      updateStatus();
    }
  }
  for (let i=pellets.length-1;i>=0;i--) if (pellets[i].dead) pellets.splice(i,1);
  // draw
  for (let i=0;i<FOOD_MAX;i++){
    if (i < pellets.length){
      const p = pellets[i];
      const sc = p.state==='eaten' ? Math.max(0.001, 1 - p.sink*4.2) : 1;
      _e.set(p.spin*0.7, p.spin, p.spin*0.4);
      _q.setFromEuler(_e);
      _v.copy(p.pos); _s.setScalar(p.size*sc*(p.state==='sink'?0.9:1));
      _m4.compose(_v,_q,_s);
    } else {
      _m4.makeScale(0.0001,0.0001,0.0001);
    }
    foodMesh.setMatrixAt(i,_m4);
  }
  foodMesh.instanceMatrix.needsUpdate = true;
}
function updateStatus(){
  const el = document.getElementById('status');
  el.innerHTML = fish.length + ' koi &middot; ' + eatenCount + ' fed' + (pellets.length? ' &middot; ' + pellets.length + ' on the water' : '');
}

/* ============================ dragonflies =============================== */
const dragons = [];
(function(){
  const wingGeo = new THREE.PlaneGeometry(0.30, 0.10, 3, 1);
  const wingMat = new THREE.MeshBasicMaterial({ color:0xdff0ff, transparent:true, opacity:0.30,
    side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending });
  const bodyMat = new THREE.MeshStandardMaterial({ color:0x2b6f7a, roughness:0.4, metalness:0.4, flatShading:true });
  const n = COARSE?2:3;
  for (let i=0;i<n;i++){
    const g = new THREE.Group();
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.018,0.55,5), bodyMat);
    tail.rotation.x = Math.PI/2; tail.position.z = -0.26; g.add(tail);
    const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.055,7,5), bodyMat);
    thorax.scale.set(1,0.9,1.5); g.add(thorax);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.045,7,5), bodyMat);
    head.position.z = 0.11; g.add(head);
    const wings = [];
    for (let k=0;k<4;k++){
      const w = new THREE.Mesh(wingGeo, wingMat);
      w.rotation.z = Math.PI/2;
      w.position.set((k%2?1:-1)*0.10, 0.02+k*0.001, k<2?0.06:-0.06);
      w.rotation.y = (k<2? 0.25 : -0.25)*(k%2?1:-1);
      g.add(w); wings.push(w);
    }
    g.scale.setScalar(0.8 + rnd()*0.5);
    scene.add(g);
    dragons.push({ g, wings, pos:new THREE.Vector3(rr(-3,3), rr(0.8,2.0), rr(-4,3)),
      vel:new THREE.Vector3(), target:new THREE.Vector3(rr(-4,4), rr(0.8,2.2), rr(-5,4)),
      timer: 0, flap: rnd()*TAU, dip: rr(2,6) });
  }
})();
function updateDragons(dt, t){
  for (const d of dragons){
    d.timer -= dt; d.dip -= dt;
    const goalY = d.dip < 1.2 ? waterH(d.target.x, d.target.z, t) + 0.06 : d.target.y;
    const dx = d.target.x-d.pos.x, dy = goalY-d.pos.y, dz = d.target.z-d.pos.z;
    const dist = Math.hypot(dx,dz);
    const sp = d.dip < 1.2 ? 3.4 : 1.9;
    d.vel.x = damp(d.vel.x, dx/Math.max(dist,0.001)*sp, dt, 0.22);
    d.vel.z = damp(d.vel.z, dz/Math.max(dist,0.001)*sp, dt, 0.22);
    d.vel.y = damp(d.vel.y, clamp(dy*1.6,-2.2,2.2), dt, 0.25);
    d.pos.addScaledVector(d.vel, dt);
    if (d.pos.y < 0.25) d.pos.y = 0.25;
    if (d.dip < 0.12 && d.dip > -0.4){
      addRipple(d.pos.x, d.pos.z, 0.30);
      spawnBurst(d.pos.x, 0.03, d.pos.z);
      d.dip = rr(5, 13);
    }
    if (dist < 0.5 || d.timer <= 0){
      d.timer = rr(1.2, 3.4);
      d.target.set(rr(-5.5,5.5), rr(0.7,2.6), rr(-6,5.5));
      d.dip = rr(2.5, 9);
    }
    d.g.position.copy(d.pos);
    const yaw = Math.atan2(d.vel.x, d.vel.z);
    d.g.rotation.y = yaw;
    d.g.rotation.x = clamp(-d.vel.y*0.10, -0.4, 0.4);
    d.flap += dt*36;
    for (let k=0;k<4;k++){
      d.wings[k].rotation.x = Math.sin(d.flap + k*0.6)*0.85;
    }
  }
}

/* ============================ drifting petals =========================== */
const petals = (function(){
  const geo = new THREE.PlaneGeometry(0.16,0.22);
  const mat = new THREE.MeshBasicMaterial({ map:TEX.petal, transparent:true, alphaTest:0.25,
    side:THREE.DoubleSide, depthWrite:false, opacity:0.95, color:0xffffff });
  const im = new THREE.InstancedMesh(geo, mat, Q.petals);
  im.frustumCulled = false; im.renderOrder = 4;
  scene.add(im);
  const list = [];
  for (let i=0;i<Q.petals;i++){
    list.push({ p:new THREE.Vector3(rr(-14,14), rr(1,9), rr(-14,10)), v:0, spin:rnd()*TAU,
      rx:rr(-1,1), rz:rr(-1,1), rot:new THREE.Vector3(rnd()*TAU,rnd()*TAU,rnd()*TAU),
      state:'air', age:0, s:rr(0.7,1.4), sway:rnd()*TAU });
  }
  im.userData.list = list;
  return im;
})();
const _c = new THREE.Color();
function updatePetals(dt, t){
  const list = petals.userData.list;
  for (let i=0;i<list.length;i++){
    const p = list[i];
    p.age += dt; p.sway += dt;
    if (p.state === 'air'){
      p.p.y -= (0.22 + p.s*0.12)*dt;
      p.p.x += Math.sin(p.sway*0.8 + i)*0.22*dt;
      p.p.z += Math.cos(p.sway*0.6 + i*1.7)*0.22*dt;
      p.rot.x += p.rx*0.7*dt; p.rot.y += p.spin*0.5*dt; p.rot.z += p.rz*0.7*dt;
      const wy = waterH(p.p.x, p.p.z, t);
      if (p.p.y <= wy + 0.02){
        p.p.y = wy + 0.02;
        if (Math.hypot(p.p.x,p.p.z) < 8.4) { p.state = 'water'; p.age = 0; addRipple(p.p.x,p.p.z,0.22); }
        else p.state = 'ground';
      }
    } else if (p.state === 'water'){
      p.p.y = waterH(p.p.x,p.p.z,t) + 0.015;
      p.p.x += Math.sin(p.sway*0.5)*0.035*dt;
      p.p.z += Math.cos(p.sway*0.4)*0.035*dt;
      p.rot.x = -Math.PI/2 + Math.sin(p.sway)*0.10;
      p.rot.z += 0.10*dt;
      if (p.age > 24){
        p.state='air'; p.age=0; p.p.set(rr(-16,16), rr(7,12), rr(-14,10));
      }
    } else {
      p.rot.x = -Math.PI/2; p.rot.z = p.rot.z;
      p.p.y = terrainH(p.p.x,p.p.z)+0.015;
      if (p.age > 20){ p.state='air'; p.age=0; p.p.set(rr(-16,16), rr(7,12), rr(-14,10)); }
    }
    _e.set(p.rot.x, p.rot.y, p.rot.z);
    _q.setFromEuler(_e);
    _s.setScalar(p.s);
    _m4.compose(p.p, _q, _s);
    petals.setMatrixAt(i, _m4);
  }
  petals.instanceMatrix.needsUpdate = true;
}

/* ============================ state machine ============================= */
const PARAMS = ['sunElev','sunAz','sunI','ambI','fogDensity','exposure','wind'];
const COLKEYS = ['sunColor','sunGlow','skyTop','skyHorizon','ambColor','fogColor','deep','shallow','mote','hemiSky','hemiGround'];
const state = { preset:'day', cur:{}, tgt:{} };
const TAU_ = { fogDensity:1.2, exposure:0.9, ambI:1.0, sunI:1.0, wind:2.2, sunElev:1.4, sunAz:1.6 };
function applyPreset(name){
  const P = PRESETS[name]; if (!P) return;
  state.preset = name;
  for (const k of PARAMS) state.tgt[k] = P[k];
  for (const k of COLKEYS) (state.tgt[k] = state.tgt[k] || new THREE.Color()).set(P[k]);
  document.querySelectorAll('#tod button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.preset === name)));
  envPending = 2.6;
}
function updateStatusPreset(){}
(function initState(){
  const P = PRESETS.day;
  for (const k of PARAMS) state.cur[k] = P[k], state.tgt[k] = P[k];
  for (const k of COLKEYS) state.cur[k] = new THREE.Color(P[k]), state.tgt[k] = new THREE.Color(P[k]);
})();
const _tc = new THREE.Color();
function stepState(dt){
  for (const k of PARAMS) state.cur[k] = damp(state.cur[k], state.tgt[k], dt, TAU_[k]||1.5);
  for (const k of COLKEYS) state.cur[k].lerp(state.tgt[k], 1-Math.exp(-dt/1.5));
  const c = state.cur;
  const el = c.sunElev*D2R, az = c.sunAz*D2R;
  U.sunDir.value.set(Math.cos(el)*Math.sin(az), Math.sin(el), Math.cos(el)*Math.cos(az)).normalize();
  U.sunColor.value.copy(c.sunColor);
  U.sunGlow.value.copy(c.sunGlow);
  U.skyTop.value.copy(c.skyTop);
  U.skyHorizon.value.copy(c.skyHorizon);
  U.ambColor.value.copy(c.ambColor);
  U.fogColor.value.copy(c.fogColor);
  U.sunI.value = c.sunI; U.ambI.value = c.ambI;
  U.fogDensity.value = c.fogDensity;
  scene.fog.color.copy(c.fogColor); scene.fog.density = c.fogDensity;
  renderer.toneMappingExposure = c.exposure;
  sun.color.copy(c.sunColor); sun.intensity = 2.6*c.sunI;
  sun.position.copy(U.sunDir.value).multiplyScalar(60);
  hemi.color.copy(c.hemiSky); hemi.groundColor.copy(c.hemiGround); hemi.intensity = 1.15*c.ambI;
  waterUniforms.uWaveAmp.value = damp(waterUniforms.uWaveAmp.value, c.wind, dt, 2.0);
  waterUniforms.uDeep.value.copy(c.deep); waterUniforms.uShallow.value.copy(c.shallow);
  waterUniforms.uFoam.value.copy(c.foam || U.sunColor.value);
  terrainMat.uniforms.uDeep.value.copy(c.deep); terrainMat.uniforms.uShallow.value.copy(c.shallow);
  motes.material.uniforms.uColor.value.copy(c.mote);
}

/* ============================== interaction ============================= */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function waterPointAt(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((clientX-rect.left)/rect.width)*2-1;
  ndc.y = -((clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(water, false);
  for (const h of hits){ const r = Math.hypot(h.point.x, h.point.z); if (r < 8.8) return h.point.clone(); }
  return null;
}
let ptrDown = null;
canvas.addEventListener('pointerdown', e => { ptrDown = { x:e.clientX, y:e.clientY, t:performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!ptrDown) return;
  const moved = Math.hypot(e.clientX-ptrDown.x, e.clientY-ptrDown.y);
  const dur = performance.now() - ptrDown.t;
  ptrDown = null;
  if (moved < 7 && dur < 420){
    const p = waterPointAt(e.clientX, e.clientY);
    if (p) dropFood(p.x, p.z, 6);
  }
});
document.getElementById('feed').addEventListener('click', () => {
  const a = rnd()*TAU, r = Math.pow(rnd(),0.7)*4.2;
  dropFood(Math.cos(a)*r, Math.sin(a)*r, 7);
});
document.querySelectorAll('#tod button').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') document.getElementById('feed').click(); });
document.getElementById('feed').addEventListener('pointerdown', e => e.stopPropagation());

/* ================================ resize ================================ */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  const portrait = h > w*1.02;
  camera.fov = portrait ? 62 : 46;
  camera.updateProjectionMatrix();
  const want = portrait ? PORT : LAND;
  if (!userMoved) controls.set(want.pos, want.tgt);
  controls.update();
  renderer.setPixelRatio(Math.min(devicePixelRatio, Q.dpr));
  const proj = (h * renderer.getPixelRatio()) / (2*Math.tan(camera.fov*0.5*D2R));
  [motes, mist, drops, bursts, bubbles].forEach(p => {
    if (!p) return;
    p.material.uniforms.uH.value = h;
    p.material.uniforms.uPR.value = renderer.getPixelRatio();
    p.material.uniforms.uProj.value = proj;
  });
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ================================ loop ================================== */
let last = performance.now(), fpsAcc = 0, fpsN = 0, measuredFps = 0, lastFrameMs = 0;
let paused = false;
let simMs = 0;
const lotusList = window.__lotus;
function tick(now){
  const raw = (now - last)/1000; last = now;
  let dt = Math.min(raw, 0.05);
  if (paused) dt = 0;
  const t0 = performance.now();
  U.time.value += dt;
  const t = U.time.value;

  stepState(dt);
  controls.autoRotate = !userMoved || performance.now() > autoResume;
  controls.dt = dt; controls.update();
  sky.position.copy(camera.position);

  if (envPending > 0){ envPending -= dt; if (envPending <= 0) captureEnv(); }
  updateWaterfallRipples(dt, t);
  for (const r of ripples) if (r.w > 0 && t - r.z > 4.6) r.w = 0;

  for (const f of fish) f.update(dt, t);
  updateFood(dt, t);
  updateDragons(dt, t);
  updatePetals(dt, t);

  /* lily pads */
  const lm = lilies.mesh, L = lilies;
  for (let i=0;i<L.length;i++){
    const l = L[i];
    l.rot += l.spin*dt;
    const wy = waterH(l.x, l.z, t);
    l.x += Math.cos(t*0.12 + l.ph)*l.drift*dt;
    l.z += Math.sin(t*0.11 + l.ph*1.7)*l.drift*dt;
    _e.set(-Math.PI/2 + Math.sin(t*1.1 + l.ph)*0.06, 0, l.rot);
    _q.setFromEuler(_e);
    _v.set(l.x, wy + 0.012, l.z);
    _s.setScalar(l.s);
    _m4.compose(_v,_q,_s);
    lm.setMatrixAt(i,_m4);
  }
  if (lm) lm.instanceMatrix.needsUpdate = true;

  /* lotus */
  if (lotusList){
    const list = lotusList.userData.list, cs = lotusList.userData.centers;
    for (let i=0;i<list.length;i++){
      const p = list[i], c = cs[p.ci];
      const wy = waterH(c.x, c.z, t);
      const open = 1 + 0.055*Math.sin(t*0.55 + p.ci*2.1);
      _eL.set(-Math.PI/2 + p.tilt*open, p.a + Math.sin(t*0.22 + p.ph)*0.05, 0);
      _q.setFromEuler(_eL);
      _v.set(c.x, wy + p.y, c.z);
      _s.setScalar(p.s*open);
      _m4.compose(_v,_q,_s);
      lotusList.setMatrixAt(i,_m4);
    }
    lotusList.instanceMatrix.needsUpdate = true;
  }

  /* waterfall ripple churn + continuous splash */
  if (rnd() < dt*4.5) spawnBurst(PLUNGE.x + rr(-0.9,0.9), 0.05, PLUNGE.z + rr(-1.4,0.5));

  /* trees sway */
  const sway = waterUniforms.uWaveAmp.value;
  trees.children.forEach((tr,i) => { tr.rotation.z = Math.sin(t*0.35 + i)*0.012*sway; });

  mist.material.uniforms.uOrigin.value.set(PLUNGE.x, 0.10, PLUNGE.z);
  drops.material.uniforms.uOrigin.value.set(PLUNGE.x, 0.28, PLUNGE.z);

  const simMsNow = performance.now() - t0;
  simMs = simMs * 0.9 + simMsNow * 0.1;

  renderer.render(scene, camera);

  lastFrameMs = performance.now() - now;
  fpsAcc += raw; fpsN++;
  if (fpsAcc > 0.5){ measuredFps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; }
}

/* ================================ boot ================================== */
function boot(){
  U.time.value = 0;
  applyPreset('day');
  stepState(0.016);
  captureEnv();
  updateStatus();
  resize();
  renderer.setAnimationLoop(tick);
  setTimeout(() => document.getElementById('veil').classList.add('gone'), 420);
  window.__app.ready = true;
}
window.__app = {
  ready: false,
  feed: (n, x, z) => dropFood(x === undefined ? 0 : x, z === undefined ? 0 : z, n || 7),
  feedAt: (x, z, n) => dropFood(x, z, n || 6),
  setPreset: (n) => applyPreset(n),
  setAutoOrbit: (b) => { userMoved = !b; },
  fish: () => fish.map(f => ({ skin:f.skin.name, x:f.pos.x, y:f.pos.y, z:f.pos.z, state:f.state, speed:f.speed })),
  pellets: () => pellets.map(p => ({ x:p.pos.x, y:p.pos.y, z:p.pos.z, state:p.state })),
  params: () => ({
    fps: measuredFps, frameMs: lastFrameMs, simMs, preset: state.preset,
    sun: { elev: state.cur.sunElev, az: state.cur.sunAz, dir: U.sunDir.value.toArray(), intensity: state.cur.sunI },
    fog: { color: state.cur.fogColor.getHexString(), density: state.cur.fogDensity },
    pellets: pellets.length, eaten: eatenCount, fed: fedCount, fish: fish.length,
    ripples: ripples.filter(r => r.w > 0 && U.time.value - r.z < 4.5).length,
    camera: { pos: camera.position.toArray(), target: controls.target.toArray(), autoRotate: controls.autoRotate },
    render: { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles },
    quality: COARSE ? 'mobile' : 'desktop', pixelRatio: renderer.getPixelRatio()
  }),
  debug: {
    errors: () => window.__errors.slice(),
    setCam: (p, t) => { userMoved = true; controls.set(new THREE.Vector3(p[0],p[1],p[2]), new THREE.Vector3(t[0],t[1],t[2])); controls.update(); },
    pause: () => { paused = true; },
    resume: () => { paused = false; },
    stepN: (n) => { for (let i=0;i<n;i++) tick(performance.now()); },
    feedAt: (x,z,n) => dropFood(x,z,n||6),
    hold: () => {},
    parts: (name, vis) => {
      const map = { water, terrain, sky, hills, rocks, trees, grass, reeds, leaves, weeds,
        mist, drops, bursts, motes, bubbles, petals, curtain, curtain2, upperPool, food:foodMesh, lilies:lilies.mesh, lotus:lotusList };
      const o = map[name];
      if (Array.isArray(o)) o.forEach(m => { if (m) m.visible = vis; });
      else if (o && o.isObject3D) o.visible = vis;
      else if (name === 'fish') fish.forEach(f => { f.group.visible = vis; f.shadow.visible = vis; });
      return !!o;
    },
    setU: (which, name, v) => {
      const m = { water:waterMat, terrain:terrainMat, curtain:curtainMat, koi:fish[0].mat, rock:rockMat, upper:upperPool.material }[which];
      if (!m || !m.uniforms[name]) return false;
      if (v && typeof v === 'object') m.uniforms[name].value = v; else m.uniforms[name].value = v;
      return true;
    },
    fishAt: (i) => { const f = fish[i]; return f ? { group:f.group, mat:f.mat, pos:f.pos, koi:f } : null; },
    camFish: (i, dist, up) => {
      const f = fish[i]; if (!f) return;
      const d = dist||2.2, u = up||0.8;
      userMoved = true;
      controls.set(new THREE.Vector3(f.pos.x + d*0.6, f.pos.y + u, f.pos.z + d*0.75), f.pos);
      controls.update();
    },
    bench: (n) => {
      n = n || 40;
      const gl = renderer.getContext();
      renderer.render(scene, camera); gl.finish();
      const t0 = performance.now();
      for (let i=0;i<n;i++){ const dt = 1/60; U.time.value += dt; stepState(dt); for (const f of fish) f.update(dt, U.time.value);
        updateFood(dt, U.time.value); updateDragons(dt, U.time.value); updatePetals(dt, U.time.value);
        renderer.render(scene, camera); }
      gl.finish();
      return { msPerFrame: +((performance.now()-t0)/n).toFixed(2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
    },
    terrainH: (x,z) => terrainH(x,z),
    waterH: (x,z) => waterH(x,z, U.time.value),
    addRipple: (x,z,a) => addRipple(x,z,a||0.6),
    three: THREE.REVISION
  }
};
try { boot(); } catch (e){ fail(e); console.error(e); }
</script>

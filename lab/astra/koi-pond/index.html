(()=>{'use strict';

function init(){

for(let i=0;i<64;i++){const a=i/64*TAU,r=8+Math.sin(a*7)*.18;rock(Math.cos(a)*r,-.04,Math.sin(a)*r*.76,rand(.48,.85),rand(.38,.68),rand(.45,.78));if(i%2===0)mesh(rockGeo,greens[i%5],Math.cos(a)*r,.22,Math.sin(a)*r*.76,.51,.17,.48);}

const plants=[];function leafGeo(length,width,bend){const v=[],idx=[];for(let i=0;i<=8;i++){const f=i/8,w=Math.sin(Math.PI*f)*width;v.push(-w,f*length,bend*f*f,w,f*length,bend*f*f);}for(let i=0;i<8;i++){let j=i*2;idx.push(j,j+1,j+2,j+1,j+3,j+2);}let g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();return g;}

for(let i=0;i<64;i++){let a=rand(0,TAU),r=rand(8.0,9.0),g=new T.Group();g.position.set(Math.cos(a)*r,.08,Math.sin(a)*r*.76);scene.add(g);for(let j=0;j<rand(5,10);j++){const l=mesh(leafGeo(rand(.6,1.7),rand(.07,.18),rand(.3,.9)),leafMats[i%5],0,0,0,1,1,1,g);l.rotation.y=j*2.4;l.rotation.z=rand(-.4,.4);}plants.push(g);}

const stalkMat=mat('#6b7844'),tipMat=mat('#573d24');for(let i=0;i<27;i++){let a=rand(3.2,5.6),r=rand(7.9,8.7),x=Math.cos(a)*r,z=Math.sin(a)*r*.76,h=rand(1.3,2.6);mesh(new T.CylinderGeometry(.025,.045,h,5),stalkMat,x,h/2,z);mesh(new T.CapsuleGeometry(.07,.35,3,6),tipMat,x,h,z);}
// Lily pads and layered lotus blossoms.

const bg=bodyGeo(),palettes=[['#fff6d6','#ec592b','#303430'],['#f4e9d4','#d83823','#182927'],['#e6b640','#f3d170','#aa7430'],['#ebe7d2','#273d3b','#e56832'],['#f08f35','#f5cd83','#a64c22'],['#f4f2e6','#d9ddd1','#93a9a0']];const eyeMat=mat('#101d1c',.12);

const foods=[],foodGeo=new T.SphereGeometry(.065,6,4),foodMat=mat('#dcad69');let eaten=0,time=0,lastSplash=0;const feedButton=document.getElementById('feed'),status=document.getElementById('status');feedButton.disabled=false;
function feed(){if(foods.length>70){status.textContent='Let them finish this little feast first.';return;}const a=rand(0,TAU),r=rand(.8,2.8),cx=Math.cos(a)*r,cz=Math.sin(a)*r*.7;for(let i=0;i<22;i++){let a=rand(0,TAU),r=rand(.1,1.05),o=mesh(foodGeo,foodMat,cx+Math.cos(a)*r,rand(1.3,2.5),cz+Math.sin(a)*r);foods.push({mesh:o,vy:0,phase:rand(0,TAU),settled:false});}ripple(cx,cz,1.8);status.textContent='Dinner is served. Watch them gather!';}feedButton.addEventListener('click',feed);
// Small warm motes and dragonflies drift through the garden.

let azimuth=.16,elevation=.94,distance=innerWidth<600?26.5:23,targetDistance=distance;const target=new T.Vector3(0,.0,-.2),pointers=new Map();let lastPinch=0;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);lastPinch=0;});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){azimuth-=dx*.005;elevation=T.MathUtils.clamp(elevation+dy*.004,.45,1.40);}else{const [a,b]=[...pointers.values()];let d=Math.hypot(a.x-b.x,a.y-b.y);if(lastPinch)targetDistance=T.MathUtils.clamp(targetDistance*lastPinch/d,14,34);lastPinch=d;}});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>{pointers.delete(e.pointerId);lastPinch=0;});canvas.addEventListener('wheel',e=>{e.preventDefault();targetDistance=T.MathUtils.clamp(targetDistance+e.deltaY*.012,14,34);},{passive:false});

let previous=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-previous)/1000,.04);previous=now;time+=dt;bedMat.uniforms.time.value=waterMat.uniforms.time.value=time;distance+=(targetDistance-distance)*.09;camera.position.set(Math.sin(azimuth)*Math.cos(elevation)*distance,Math.sin(elevation)*distance,Math.cos(azimuth)*Math.cos(elevation)*distance);camera.lookAt(target);

if(nearest){const mouthX=pos.x+Math.cos(f.angle)*.56*f.scale,mouthZ=pos.z-Math.sin(f.angle)*.56*f.scale;if(Math.hypot(mouthX-nearest.mesh.position.x,mouthZ-nearest.mesh.position.z)<.27){ripple(nearest.mesh.position.x,nearest.mesh.position.z,.7);scene.remove(nearest.mesh);foods.splice(foods.indexOf(nearest),1);eaten++;status.textContent=foods.length?`${foods.length} morsels floating · ${eaten} happily eaten`:'Every last bite. The pond settles into its rhythm.';}}}
if(time-lastSplash>.33){ripple(rand(-1.3,1.3),rand(-5.0,-4.5),rand(.5,1.0));lastSplash=time;}for(const r of rings){if(r.life<=0)continue;r.life-=dt;let u=1-r.life/r.max;r.mesh.scale.setScalar((.12+u*.9)*r.size);r.mesh.material.opacity=(1-u)*.24;r.mesh.visible=r.life>0;}

<script type="module">

/* ============ ECHOES OF THE HOLLOW GROVE ============ */
import * as THREE from 'three';

// ---------- tiny helpers ----------
let perfLevel=2;                 // 2 high, 1 medium, 0 low (set in init)
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,l,dt)=>lerp(a,b,1-Math.exp(-l*dt));
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
function anorm(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;}
function angleTo(from,to){return Math.atan2(to.x-from.x,to.z-from.z);}
function angDiff(a,b){return Math.abs(anorm(a-b));}
let _seed=12345;
function srnd(){_seed=(_seed*16807)%2147483647;return (_seed-1)/2147483646;}
function mkRng(s){let x=s;return()=>{x=(x*16807)%2147483647;return (x-1)/2147483646;};}
const $=id=>document.getElementById(id);

window.__err=[];window.addEventListener('error',e=>window.__err.push(String(e.message||e.error)));

// ---------- AUDIO (original synthesized score + SFX) ----------
const Melody=[0,1,0,2];                      // Leaf,Stone,Leaf,Moon — bell indices (matches mural ❋▣❋☾)
const FLUTE=[587.33,440.0,784.0];            // one tone per bell/glyph
const BELLF=[587.33,440.0,784.0];            // organ stops per bell
const BellGlyph=['❋','▣','☾'];
const GlyphName=['Leaf','Stone','Moon','Sun'];

const SND={
 ctx:null,master:null,music:null,sfxG:null,ambG:null,muted:false,started:false,
 mode:'none',timer:null,tick:0,
 init(){ if(this.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  this.ctx=new AC();
  const comp=this.ctx.createDynamicsCompressor();
  comp.threshold.value=-14;comp.ratio.value=6;
  this.master=this.ctx.createGain();this.master.gain.value=.9;
  this.master.connect(comp);comp.connect(this.ctx.destination);
  this.music=this.ctx.createGain();this.music.gain.value=.5;this.music.connect(this.master);
  this.sfxG=this.ctx.createGain();this.sfxG.gain.value=.85;this.sfxG.connect(this.master);
  this.ambG=this.ctx.createGain();this.ambG.gain.value=.5;this.ambG.connect(this.master);
  const nb=this.ctx.createBuffer(1,this.ctx.sampleRate*1.2,this.ctx.sampleRate);
  const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  this.noise=nb;
  this.startPad();
 },
 resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 now(){return this.ctx.currentTime;},
 tone(o){ if(!this.ctx||this.muted&&!o.force)return;
  const t0=this.ctx.currentTime+(o.d||0), g=this.ctx.createGain(), osc=this.ctx.createOscillator();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t0);
  if(o.f2)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+(o.slide||o.t));
  const vol=o.v||.2, a=o.a||.005;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+a);
  g.gain.exponentialRampToValueAtTime(.0001,t0+o.t);
  osc.connect(g);g.connect(o.dest||this.sfxG);osc.start(t0);osc.stop(t0+o.t+.05);
 },
 noiseHit(o){ if(!this.ctx||this.muted&&!o.force)return;
  const t0=this.ctx.currentTime+(o.d||0),s=this.ctx.createBufferSource();
  s.buffer=this.noise;s.loop=true;
  const f=this.ctx.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f,t0);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t0+o.t);
  f.Q.value=o.q||1;
  const g=this.ctx.createGain();const vol=o.v||.2;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+(o.a||.004));
  g.gain.exponentialRampToValueAtTime(.0001,t0+o.t);
  s.connect(f);f.connect(g);g.connect(o.dest||this.sfxG);s.start(t0);s.stop(t0+o.t+.05);
 },
 startPad(){ // dusk wind + distant bird ambience
  const t=this.ctx.currentTime;
  const src=this.ctx.createBufferSource();src.buffer=this.noise;src.loop=true;
  const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=340;f.Q.value=.4;
  const g=this.ctx.createGain();g.gain.value=.10;
  const lfo=this.ctx.createOscillator();lfo.frequency.value=.07;
  const lg=this.ctx.createGain();lg.gain.value=.05;lfo.connect(lg);lg.connect(g.gain);
  src.connect(f);f.connect(g);g.connect(this.ambG);src.start(t);lfo.start(t);
 },
 bird(){ if(!this.ctx||this.muted)return;
  const f0=rand(1900,2600),d=rand(.06,.12),n=2+(Math.random()*3|0);
  for(let i=0;i<n;i++)this.tone({f:f0*rand(.9,1.15),t:d,v:.028,type:'sine',d:i*(d+.05)+rand(0,4),dest:this.ambG,force:true});
 },
 fly(){this.bird();const s=this;this._birdT=setTimeout(()=>s.fly(),rand(4000,9000));},
 // ---- SFX ----
 ui(){this.tone({f:660,f2:880,t:.09,v:.12,type:'triangle'});},
 uiBack(){this.tone({f:660,f2:420,t:.1,v:.1,type:'triangle'});},
 step(wet){wet?this.noiseHit({f:900,f2:300,t:.09,v:.09,q:.7}):this.noiseHit({f:420,t:.05,v:.05,q:2});},
 swing(){this.noiseHit({f:2400,f2:700,t:.13,v:.16,q:.8});},
 hitFlesh(){this.noiseHit({f:300,f2:120,t:.12,v:.3,q:1.2});this.tone({f:140,f2:60,t:.14,v:.22,type:'square'});},
 hitMetal(){this.tone({f:2100,f2:1600,t:.16,v:.16,type:'triangle'});this.noiseHit({f:3400,t:.05,v:.14,q:2});},
 block(){this.noiseHit({f:800,f2:400,t:.12,v:.28,q:1});this.tone({f:190,f2:90,t:.12,v:.18,type:'square'});},
 dodge(){this.noiseHit({f:1400,f2:500,t:.1,v:.09,q:.6});},
 hurt(){this.tone({f:330,f2:110,t:.28,v:.3,type:'sawtooth'});this.noiseHit({f:500,f2:150,t:.2,v:.2});},
 fall(){this.tone({f:180,f2:70,t:.4,v:.3,type:'sawtooth'});},
 heal(){[523,659,784].forEach((f,i)=>this.tone({f,t:.5,v:.1,type:'sine',d:i*.12}));},
 collect(){[784,1046].forEach((f,i)=>this.tone({f,t:.3,v:.14,type:'triangle',d:i*.05}));},
 keyGet(){[523,659,784,1046].forEach((f,i)=>this.tone({f,t:.6,v:.14,type:'triangle',d:i*.09}));},
 itemGet(){ // triumphant flourish for the Seed Sling
  const seq=[[392,0],[523,.12],[659,.24],[784,.36],[1046,.5]];
  seq.forEach(([f,d])=>{this.tone({f,t:.7,v:.16,type:'triangle',d});this.tone({f:f*2,t:.5,v:.05,type:'sine',d});});
  this.tone({f:196,t:.9,v:.14,type:'sine',d:.36});
 },
 fluteNote(i){const f=FLUTE[clamp(i,0,3)];
  this.tone({f,t:.55,v:.22,type:'sine',a:.04});this.tone({f:f*2,t:.4,v:.06,type:'sine',a:.06});
  this.noiseHit({f:f*3,t:.12,v:.03,q:4});},
 bell(i,gain){const f=BELLF[clamp(i,0,2)];if(gain===undefined)gain=1;
  [[1,.5,.6],[2.0,.22,.6],[2.98,.12,.5],[4.2,.06,.35],[5.4,.04,.28]].forEach(([m,v,tt])=>
   this.tone({f:f*m,t:tt*gain+.1,v:v*.22*gain,type:'sine',a:.004}));},

let QC=2;                       // texture quality multiplier (1 on low-power)
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w*QC;c.height=h*QC;
 const g=c.getContext('2d');g.scale(QC,QC);fn(g,w,h);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
function spatter(g,w,h,n,col,sMin,sMax,rMin,rMax){for(let i=0;i<n;i++){g.fillStyle=col();g.beginPath();
 g.arc(srnd()*w,srnd()*h,srnd()*(sMax-sMin)+sMin,srnd()*TAU,srnd()*TAU);if(rMax){g.arc(srnd()*w,srnd()*h,srnd()*(rMax-rMin)+rMin,0,TAU);}g.fill();}}

function cell(style,x0,x1,y,z0,z1,thick){
 const t=thick===undefined?Math.min(3,Math.max(.6,y)):thick;
 const m=new THREE.Mesh(boxG(x1-x0,t,z1-z0),floorMat[style]());
 m.position.set((x0+x1)/2,y-t/2,(z0+z1)/2);m.receiveShadow=true;m.castShadow=true;sceneRoot.add(m);

 if(style!=='water')blockers.push({x0,x1,z0,z1,y0:y-t-5,y1:y});
 return m;}
// solid wall block (not walkable): registers tall blocker
function vault(style,x0,x1,y0,y1,z0,z1){
 const m=new THREE.Mesh(boxG(x1-x0,y1-y0,z1-z0),floorMat[style]());
 m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);m.receiveShadow=true;m.castShadow=true;sceneRoot.add(m);
 blockers.push({x0,x1,z0,z1,y0,y1:Math.min(y1,20)});
 return blockers.length-1;}

function doorObj(name,x,z,thick,w,h,axis,blockIdx,mat){

 glyph.visible=false;
 return {name,mesh,glyph,x,z,locked:true,open:false,blockIdx,
  setOpen(v){ if(this.open===v)return;this.open=v;
   UPD_ANIM.push({t:0,d:1.1,fn:p=>{this.mesh.position.y=h/2+.05+p*(h+.4);},done:()=>{this.mesh.visible=false;if(glyph)glyph.visible=false;blockers[this.blockIdx]=null;}});
   if(blockers[this.blockIdx]){const b=blockers[this.blockIdx];b.y0=99;b.y1=0;} } };}
const UPD_ANIM=[]; // tweens: {t,d,fn(p),done}
function runAnims(dt){for(let i=UPD_ANIM.length-1;i>=0;i--){const a=UPD_ANIM[i];a.t+=dt;
 const p=clamp(a.t/a.d,0,1);a.fn(a.ease?a.ease(p):p);if(p>=1){UPD_ANIM.splice(i,1);if(a.done)a.done();}}}

// particles ---------------------------------------------------------------
function particleField(n,area,col,size,mode){ // area [x0,x1,z0,z1,ytop]
 if(perfLevel<1)return;
 const pos=new Float32Array(n*3),ph=new Float32Array(n);
 for(let i=0;i<n;i++){pos[i*3]=rand(area[0],area[1]);pos[i*3+1]=rand(.4,area[4]);pos[i*3+2]=rand(area[2],area[3]);ph[i]=rand(0,TAU);}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
 const texp=tex(32,32,(g)=>{const gr=g.createRadialGradient(16,16,0,16,16,14);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,32,32);});
 const mat=new THREE.PointsMaterial({size,map:texp,color:col,transparent:true,opacity:.8,depthWrite:false,blending:THREE.AdditiveBlending});
 const pts=new THREE.Points(geo,mat);dynRoot.add(pts);
 if(perfLevel<2)n=Math.ceil(n/2);
 let tt=0;
 UPD.push((dt)=>{tt+=dt;const p=geo.attributes.position.array;
  const nn=perfLevel<2?n*2|0:n;
  for(let i=0;i<nn;i++){const iy=i*3;
   if(mode==='firefly'){p[iy]+=Math.sin(tt*.7+ph[i])*dt*.6;p[iy+1]+=Math.sin(tt*.9+ph[i]*2)*dt*.35;p[iy+2]+=Math.cos(tt*.6+ph[i])*dt*.6;}
   else{p[iy]+=Math.sin(tt*.3+ph[i])*dt*.25;p[iy+1]-=dt*.14;p[iy+2]+=Math.cos(tt*.25+ph[i]*1.7)*dt*.22;
    if(p[iy+1]<.35)p[iy+1]=area[4];}
   p[iy+1]=clamp(p[iy+1],.35,area[4]+1);}
  geo.attributes.position.needsUpdate=true;
  if(mode==='firefly')mat.opacity=.45+Math.sin(tt*2.2)*.3;});}

function nearInteract(){
 const p=P.pos;
 // door prompts
 for(const d of WORLD.doorOps){const dest=WORLD[d.name];if(!dest)continue;
  let x=14.4,z=d.name==='keeperDoor'?-6:d.name==='bellDoor'?7.5:d.name==='bellGate'?-5.3:48;
  if(Math.hypot(p.x-x,p.z-z)<2.6){
   if(WORLD.state[d.need]||WORLD.state.shell&&d.name==='sanctDoor')return{label:'PUSH',act:()=>{openSesame(d.name);}};
   return{label:'',act:null,blocked:true,msg:d.msg};}}
 // chests
 if(!WORLD.state.keyGot&&Math.hypot(p.x-WORLD.chestKey.x,p.z-WORLD.chestKey.z)<1.8)
  return{label:'OPEN',act:()=>{if(DYN.chestKey.open()){SND.keyGet();WORLD.state.keyGot=true;P.hasKey=true;toast('Found the <b>Archive Key</b> ⚿');saveGame();}}};
 if(!WORLD.state.chestSling&&Math.hypot(p.x-WORLD.chestSling.x,p.z-WORLD.chestSling.z)<1.9)
  return{label:'OPEN',act:()=>{if(DYN.chestSling.open()){SND.itemGet();WORLD.state.chestSling=true;P.hasSling=true;toast('The <b>Seed Sling</b> ◍ — Q swaps weapons');saveGame();}}};
 // petal secret
 if(!P.Secrets.petal&&Math.hypot(p.x-WORLD.petal.x,p.z-WORLD.petal.z)<1.6)
  return{label:'TOUCH',act:()=>{P.Secrets.petal=true;WORLD.state.petal=true;
   toast('A moonpetal ⚘ — you tuck it somewhere safe. (+1♥)');healPlayer(1);saveGame();}};
 // seal pedestal (crypt upper shelf, needs the seal from the warden chest chain)
 if(!WORLD.state.seal&&P.hasSeal===false&&Math.hypot(p.x-WORLD.sealPed.x,p.z-WORLD.sealPed.z)<1.8)
  return{label:'RAISE',act:()=>{ toast2('The pedestal hums. It wants something ✧ shaped.'); }};
 if(!WORLD.state.seal&&P.hasSeal&&Math.hypot(p.x-WORLD.sealPed.x,p.z-WORLD.sealPed.z)<2.2)
  return{label:'SET SEAL ✧',act:sealPlace};
 // root shrine (sanctum ante): open the flute
 if(Math.hypot(p.x-2,p.z-32.5)<2.4)
  return{label:'PLAY FLUTE ♪',act:openFlute};
 // sanctum entry trigger handled by room music; pine arch whisper
 return null;}

 if(name==='bellDoor'){WORLD.bellDoor.blockIdx!==undefined&&(blockers[WORLD.bellDoor.blockIdx]=null);if(DYN.dBells)DYN.dBells.setOpen(true);}

 if(b.rung){SND.bell(WORLD.notes.indexOf(b.g)<0?1:WORLD.notes.indexOf(b.g),.4);return;}
 const want=WORLD.state.bellsRungCount||0;
 const idx=WORLD.notes.indexOf(b.g);
 if(idx===want){ b.rung=true;SND.bell(b.g,1);b.ringMesh&&(b.ringMesh.visible=true);
  WORLD.state.bellsRungCount=want+1;
  if(WORLD.state.bellsRungCount>=3){WORLD.state.bellRung=true;
   toast('The bells ring true — the bronze gate unlatches');
   blockers[WORLD.bellGate.blockIdx]=null;if(DYN.dBellGate)DYN.dBellGate.setOpen(true);}
  saveGame();
 } else { SND.bellBad(); toast2('A sour note… the springs echo the right order.');
  WORLD.bells.forEach(x=>{x.rung=false;x.ringMesh&&(x.ringMesh.visible=false);});WORLD.state.bellsRungCount=0;} }

function makeBoss(){
 const g=new THREE.Group();sceneRoot.add(g);
 const M=n=>makeMat(n);
 const body=new THREE.Mesh(cylG(1.5,2.1,4.2,10),M('boss'));body.position.y=2.4;body.castShadow=true;g.add(body);
 const helm=new THREE.Mesh(coneG(1.35,2.2,8),M('iron'));helm.position.y=5.2;helm.castShadow=true;g.add(helm);
 [-1,1].forEach(s=>{const eye=new THREE.Mesh(sphG(.22),new THREE.MeshBasicMaterial({color:0xff6a4a}));
  eye.position.set(s*.5,4.4,1.15);g.add(eye);});
 [-1,1].forEach(s=>{const arm=new THREE.Mesh(boxG(.7,3.2,.7),M('dark'));
  arm.position.set(s*2.1,2.6,0);arm.castShadow=true;g.add(arm);arm.name='arm'+s;});
 const core=new THREE.Mesh(sphG(.55),new THREE.MeshStandardMaterial({color:0xffe9a8,emissive:0xffb43a,emissiveIntensity:1.4}));
 core.position.set(0,2.6,1.7);core.visible=false;g.add(core);
 const shellM=new THREE.Mesh(sphG(2.9,16,12),new THREE.MeshStandardMaterial({color:0x4c3b6b,roughness:.4,metalness:.3,transparent:true,opacity:.5}));
 shellM.position.y=2.8;g.add(shellM);
 return {mesh:g,core,shellM,pips(v){[0,1,2].forEach(i=>{const el=$('c'+i);if(el)el.className=i<v?'on':'';});},x:2,z:54,yaw:Math.PI,hp:24,maxhp:24,phase:'sleep',t:0,stun:0,bellExposed:false,
  cd:0,alive:true,deaths:0,
  chestPos(){return{x:this.x,z:this.z-1.6};},
  wake(){ if(this.phase!=='sleep')return;this.phase='intro';this.t=0;SND.bossRoar();
   toast('THE <b>HOLLOW WARDEN</b> wakes. Ring its core with the Seed Sling.');bossBar(true); },
  }; }
function bossBar(on){ $('bossbar').style.display=on?'':'none'; }
function bossBellHit(){ const b=B.boss;if(!b||!b.alive||!b.bellExposed)return;
 b.bellExposed=false;b.core.visible=false;b.stun=2.6;SND.coreHit();sparkBurst(b.x,2.6,b.z,0xffe9a8);
 b.hp-=4;b.pips(Math.ceil(Math.max(0,b.hp-4)/8));setBossBar();
 if(b.hp<=0)bossDefeat(); }
function setBossBar(){const b=B.boss;if(!b)return;$('bossFill').style.width=Math.max(0,b.hp/b.maxhp*100)+'%';}
function bossDefeat(){const b=B.boss;b.alive=false;b.phase='dead';SND.dead();SND.bossRoar();
 b.mesh.rotation.x=-.35;b.mesh.position.y=-.6;bossBar(false);G.bossDown=true;
 toast('The Warden kneels. Light returns to Hollow Grove.');
 setTimeout(()=>endGame(),2600);}
function stepBoss(dt){const b=B.boss;if(!b||!b.alive||b.phase==='sleep')return;
 b.t+=dt;clock.t+=dt;
 const dx=P.pos.x-b.x,dz=P.pos.z-b.z,d=Math.hypot(dx,dz);
 if(b.phase==='intro'){b.mesh.rotation.y+=dt*1.4;
  if(b.t>2.2){b.phase='chase';b.pips(3);}return;}
 if(b.stun>0){b.stun-=dt;b.mesh.rotation.y=Math.sin(clock.t*30)*.08;return;}
 b.yaw=Math.atan2(dx,dz);b.mesh.rotation.y=b.yaw;
 if(b.phase==='chase'){
  if(d>2.0){const sp=3.1+ (1-b.hp/b.maxhp)*2.2;b.x+=dx/d*sp*dt;b.z+=dz/d*sp*dt;}
  b.cd-=dt;
  if(d<2.3){ // sweeping arm
   b.cd=.1;b.cd2=b.cd2||0;b.cd2-=dt;
   if(b.cd2<=0){b.cd2=1.6;SND.bossSweep();
    const a=b.mesh.getObjectByName('arm1');if(a)UPD_ANIM.push({t:0,d:.5,ease:p=>Math.sin(p*Math.PI),fn:p=>{a.rotation.x=-p*1.7;}});
    if(d<2.1&&P.invuln<=0&&P.state!=='dead'){
     const front=Math.abs(anorm(angleTo(P.pos,{x:b.x,y:0,z:b.z})-P.yaw))<1.9;
     hurtPlayer(1,'boss'+(front&&P.blocking?'block':''));if(P.blocking)SND.block();shakeCam(.5);} } }
  else if(b.cd<=0&&d<9){ // charge
   b.phase='charge';b.t=0;SND.bossCharge();b.chg={x:dx/d,z:dz/d}; }
  else if(Math.hypot(b.x-P.pos.x,b.z-P.pos.z)<10&&Math.random()<.008){ // stomp
   b.phase='stomp';b.t=0;SND.bossStomp(); }
 } else if(b.phase==='charge'){
  b.x+=b.chg.x*8.5*dt;b.z+=b.chg.z*8.5*dt;
  if(!enemyTryMove(b,b.x,b.z,.9)){b.x-=b.chg.x*8.5*dt;b.z-=b.chg.z*8.5*dt;b.phase='chase';b.cd=1.1;}
  if(d<1.6&&P.invuln<=0&&P.state!=='dead'){hurtPlayer(2,'boss');shakeCam(.7);b.phase='chase';b.cd=1.2;}
  if(b.t>1.5)b.phase='chase';
 } else if(b.phase==='stomp'){
  if(b.t<.3)b.mesh.scale.y=1+Math.sin(b.t*10)*.03;
  if(b.t>.3&&!b.didStomp){b.didStomp=true;
   if(Math.hypot(b.x-P.pos.x,b.z-P.pos.z)<4.6&&P.grounded&&P.state!=='dead'){hurtPlayer(2,'stomp');shakeCam(.8);P.vel.y=5;}
   sparkBurst(b.x,.2,b.z,0x9f8f6f);}
  if(b.t>1.1){b.didStomp=false;b.phase='chase';b.cd=.8;}
 }
 // bell-expose cycle: every 7s of chase the core opens for 2.6s
 if(b.phase==='chase'){const cyc=(clock.t%7);
  const want=cyc<2.6&&b.hp>0;
  if(want!==b.bellExposed){b.bellExposed=want;b.core.visible=want;
   if(want){SND.bossStun();b.pips(Math.ceil(b.hp/8));}} }
 b.mesh.position.set(b.x,0,b.z);
 // keep in arena
 b.x=clamp(b.x,-11,16);b.z=clamp(b.z,32,58); }
// ================= THE LOOP =================
let last=performance.now(),tGlobal=0,hudFlag=true,saveT=0,VTICK=0;
function frame(){ requestAnimationFrame(frame);
 let dt; if(VTICK>0){dt=VTICK;}else{const now=performance.now();dt=Math.min(.05,(now-last)/1000);} last=performance.now();tGlobal+=dt;
 try{
  clock.t=tGlobal;
  // ambient updaters always run (menus stay alive)
  for(const u of UPD)u(dt,tGlobal);
  runAnims(dt);
  if(G.phase==='play'&&!IN.paused){
   // input → player
   const ka=keyAxis();let ix=(IN.mx||0)+ka.x,iz=(IN.mz||0)+ka.z;
   // attack / sling / interact intents
   if(IN.attackQ>0){IN.attackQ--;tryAttack();}
   if(IN.interactQ){IN.interactQ=false;const it=nearInteract();if(it&&it.act)it.act();}
   P.blocking=!!IN.shield&&P.grounded&&P.state!=='dodge';
   stepPlayer(dt,clamp(ix,-1,1),clamp(iz,-1,1),IN.dash);IN.dash=false;
   Rig.root.position.copy(P.pos);Rig.root.rotation.y=P.faceYaw;
   animPlayer(dt,ix,iz,Math.hypot(P.vel.x,P.vel.z));
   stepSeeds(dt);stepSparks(dt);
   for(const e of ENEMIES)stepEnemy(e,dt);
   stepBoss(dt);
   updateTarget(dt);
   // sokoban mesh follow + completion
   if(WORLD.sokBlock){const sb=WORLD.sokoban;WORLD.sokBlock.position.set(sb.x,.96,sb.z);
    if(!WORLD.state.sokDone&&Math.abs(sb.x-sb.TX)<.6&&Math.abs(sb.z-sb.TZ)<.6){
     WORLD.state.sokDone=true;WORLD.state.medallion=true;SND.keyGet();
     toast('The rock settles — a <b>Warden Medallion</b> rolls out ◎. The bell doors will hear it.');
      ockers[WORLD.bellDoor.blockIdx]=null;if(DYN.dBells)DYN.dBells.setOpen(true);saveGame();}}
 // prompt
 const it=nearInteract();
 if(it&&it.label)setPrompt(it.label+'  [E]');else setPrompt('');
 // room tracking + boss wake
 const rm=roomNameAt(P.pos.x,P.pos.z);
 enterRoom(rm);
 if(rm==='sanctum'&&!G.bossSpawned&&WORLD.state.shell&&P.pos.z>44){G.bossSpawned=true;
  B.boss=makeBoss();B.boss.wake();}
 // timers
 if(toastT>0){toastT-=dt;if(toastT<=0)$('hintToast').classList.add('hidden');}
 if(toast2T>0){toast2T-=dt;if(toast2T<=0)toast2El.classList.add('hidden');}
 saveT-=dt;if(saveT<=0){saveT=8;saveGame();}
 hudFlag=hudFlag||P.invuln>0||WORLD.state.keyGot;
 if(hudFlag){updateHUD();hudFlag=false;}
 // camera shake
 if(shake>0){shake=Math.max(0,shake-dt*2.2);
  camPos.x+=(Math.random()-.5)*shake*.5;camPos.y+=(Math.random()-.5)*shake*.5;}
 stepCamera(dt,false);stepCamFollow(dt);
 // moth orbit
 if(WORLD.moth){const m=WORLD.moth.group;
  const tx=P.pos.x+Math.sin(tGlobal*.7)*1.4,ty=P.pos.y+1.9+Math.sin(tGlobal*2.3)*.25,tz=P.pos.z+Math.cos(tGlobal*.7)*1.4;
  m.position.x+=(tx-m.position.x)*Math.min(1,dt*2.4);m.position.y+=(ty-m.position.y)*Math.min(1,dt*2.4);m.position.z+=(tz-m.position.z)*Math.min(1,dt*2.4);
  WORLD.moth.w1.rotation.y=Math.sin(tGlobal*22)*.9;WORLD.moth.w2.rotation.y=-Math.sin(tGlobal*22)*.9;}
 // fall recovery
 if(P.pos.y<-14&&!P.dead){const rp=respawnPoint();P.pos.set(rp[0],rp[1],rp[2]);P.vel.set(0,0,0);hurtPlayer(1,'fall');}
 } else if(G.phase==='title'){ camYaw+=dt*.06; stepCamera(dt,false); }
 renderer.render(scene,camera);
 }catch(err){ if(!frame.e){frame.e=err;console.error(err);const el=$('err');
  if(el&&!el.textContent)el.textContent=String(err.message);} }
}
// attack intent (sword vs sling)
function tryAttack(){
 if(P.dead||IN.paused)return;
 if(P.equip==='sling'&&P.hasSling){ if(P.slingCd<=0){P.slingCd=.55;P.state='shoot';P.t=0;fireSeed();} return; }
 if(P.attackCd>0||P.state==='dodge')return;
 const chain=P.canChain&&(P.state==='attack1');
 P.state=chain?'attack2':'attack1';P.t=0;P.attackCd=.42;P.combo=chain?P.combo+1:0;
 swingHitSet.clear();swingConsumed=false;SND.swing();
 UPD_ANIM.push({t:0,d:.34,fn:p=>{const a=Rig.armR;if(a)a.rotation.x=-2.4+Math.sin(p*Math.PI)*2.6;
  if(p>.35&&!swingConsumed){swingConsumed=true;swordHit();}},
  done:()=>{if(P.state==='attack1'||P.state==='attack2')P.state='idle';P.canChain=true;
   clearTimeout(tryAttack._cc);tryAttack._cc=setTimeout(()=>P.canChain=false,.45);}}); }

$('fluteClose').onclick=()=>closeFlute();
$('btnInteract').addEventListener('pointerdown',()=>{if(G.phase==='play')IN.interactQ=true;});

['0','1','2'].forEach(i=>$('fl'+i).addEventListener('pointerdown',()=>playNote(+i)));

function startGame(cont){ SND.init();SND.resume();SND.fly();
 sceneRoot.visible=true;$('hud').style.display='';
 let started=false;
 if(cont&&(started=loadGame())){}
 if(!started){const sp=WORLD.spawn;P.pos.set(sp.x,sp.y,sp.z);P.yaw=sp.yaw;P.hearts=5;}
 camPos.set(P.pos.x,6,P.pos.z-7);
 G.phase='play';showScreen(null);
 const intro=['You woke at the edge of Hollow Grove.','The old songs have gone quiet here.',
  'Find what the wardens left behind — and wake what sleeps in the roots.'];
 $('introText').textContent='';$('intro').classList.remove('hidden');let li=0;
 const iv=setInterval(()=>{li>=intro.length?(clearInterval(iv),setTimeout(()=>$('intro').classList.add('hidden'),1400)):($('introText').textContent=intro[li++]);},1600);
 hudFlag=true;openDoors();
 if(WORLD.state.seal)worldHooks.sealOrb&&(worldHooks.sealOrb.visible=true);
 SND.setMode('grove');G.t0=performance.now(); }
function endGame(){ if(G.ended)return;G.ended=true;G.phase='end';SND.setMode('silence');SND.victoryTheme&&SND.victoryTheme();
 const mins=((performance.now()-G.t0)/60000).toFixed(1);
 $('vicStats').innerHTML='hearts left '+P.hearts+' · falls '+G.deaths+' · time '+mins+' min<br>the seals are set. the grove remembers you.';
 showScreen('victory');localStorage.removeItem(saveKey); }
// moon petal mount + root shrine visual
worldHooks.sealOrb=WORLD.sealOrb;worldHooks.rootShrine=WORLD.spring;
function mothHint(){ const tips=[
  'Three bells — the mural in the gallery shows their order.',
  'The archivist keeps a key. Chests need a steady eye and E.',
  'Stones slide when you walk into them._PUSH rock onto the glyph.',
  'Strike the bronze latch with a seed; the wheel drops what floats.',
  'The Warden\'s core opens in rhythm — time your sling.',
  'Q swaps sword and sling. Space dodges. K raises the shield.'];
 return tips[(Math.random()*tips.length)|0];}
// boot
buildMaterials&&buildMaterials();buildWorld();finishDynamic(scene);buildPlayer();
scene.add(sceneRoot);
G.phase='title';showScreen('title');
if(localStorage.getItem(saveKey))$('contBtn').style.display='';
$('loadMsg').textContent='';
tagBtns&&tagBtns();
renderer.render(scene,camera);requestAnimationFrame(frame);

window.__game={G,P,B,WORLD,ENEMIES,SEEDS,IN,scene,renderer,camera,THREE,startGame,
 give(k){({sling:()=>{P.hasSling=true;WORLD.state.chestSling=true;P.equip='sling';},
  key:()=>{WORLD.state.keyGot=true;P.hasKey=true;},seal:()=>{P.hasSeal=true;WORLD.state.seal=true;WORLD.state.shell=true;openSesame('sanctDoor');},
  medallion:()=>{WORLD.state.medallion=true;WORLD.state.bellRung=true;openDoors();}})[k]&&
 (({sling:()=>{P.hasSling=true;WORLD.state.chestSling=true;P.equip='sling';},
    key:()=>{WORLD.state.keyGot=true;P.hasKey=true;P.keyCount=1;},
    seal:()=>{P.hasSeal=true;WORLD.state.seal=true;WORLD.state.shell=true;worldHooks.sealOrb&&(worldHooks.sealOrb.visible=true);openSesame('sanctDoor');},
    medallion:()=>{WORLD.state.medallion=true;WORLD.state.bellRung=true;DYN.dBells&&DYN.dBells.setOpen(true);blockers[WORLD.bellDoor.blockIdx]=null;},
  })[k])();updateHUD();},
 goto(x,z,y){P.pos.set(x,y||0,z);P.vel.set(0,0,0);},
 teleportTo(room){const r=WORLD.rooms[room];P.pos.set((r.x0+r.x1)/2,0,(r.z0+r.z1)/2);},
 state(){return{phase:G.phase,room:G.room,hearts:P.hearts,dead:P.dead,x:+P.pos.x.toFixed(1),y:+P.pos.y.toFixed(1),z:+P.pos.z.toFixed(1),
  grounded:P.grounded,seeds:SEEDS.length,enemies:ENEMIES.filter(e=>e.alive).length,
  boss:B.boss?{hp:B.boss.hp,phase:B.boss.phase,exposed:B.boss.bellExposed}:null,
  st:Object.keys(WORLD.state).filter(k=>WORLD.state[k]===true),err:window.__err.length};},
 step(n,dt){const v=dt||1/60;const sv=VTICK;VTICK=v;for(let i=0;i<n;i++)frame();VTICK=sv;}};
window.__err=[];addEventListener('error',e=>window.__err.push(String(e.message)));
